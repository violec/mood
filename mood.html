      if (st.kind === 'shared'){
        const ms = st.members.filter(m => m.name.trim()).map(m => ({ ...m, name: m.name.trim() }));
        if (ms.length < 2){ toast('⚠ ' + tl('a shared account needs at least two people')); return; }
        if (!ms.some(m => m.me)) ms[0].me = true;
        acc.members = ms;
      } else if (!a?.members?.length) delete acc.members;
      if (st.kind === 'goal'){ const g = +$('#ae-goal').value; if (!(g > 0)){ toast('⚠ ' + tl('set a target')); return; } acc.goal = { amt: g, date: $('#ae-gdate').value || null }; } else delete acc.goal;
      if (acc.asset === 'fund'){ acc.fund = $('#ae-fund').value.trim().toUpperCase(); const p = +$('#ae-px').value; if (p > 0){ acc.price = p; acc.priceAt = todayStr(); } }
      if (acc.asset === 'deposit'){
        acc.dep = { rate: +$('#ae-rate').value || 0, days: +$('#ae-days').value || 32, start: $('#ae-start').value || todayStr(), tax: +$('#ae-tax').value || 0 };
        const prin = +($('#ae-prin')?.value || 0);
        if (!a){ if (!(prin > 0)){ toast('⚠ ' + tl('enter the principal')); return; } acc.events.push({ id: uid(), d: acc.dep.start, type: 'deposit', amt: prin, who: meOf(acc)?.id, at: Date.now() }); }
      }
      if (!a) money().accounts.push(acc);
      save(); closeModal(); ui.moneyAcc = acc.id; renderSpend(); refreshPrices(true);
    });
  };
  draw();
}

/* ---- share codes: an account travels as one block of text (whatsapp, notes…) ---- */
const SHARE_PREFIX = 'MOOD-ACCOUNT:';
function shareAccount(a){
  const data = JSON.parse(JSON.stringify(a));
  (data.members || []).forEach(m => delete m.me);           // "you" is different on each phone
  packCode({ v: 1, acc: data }).then(code => {
    const txt = tl('{name} — mood account. In mood: Money → savings → import a share code, then paste this:', { name: a.name }) + '\n\n' + code;
    const qr = qrSVG(code);
    openModal(`
      <h2>${tl('Share {name}', { name: esc(a.name) })}</h2>
      <div class="modal-sub">${tl('the other person imports it in mood: money → savings → import a share code')}</div>
      ${qr ? `<div class="qr-box">${qr}</div><div class="mn-fine" style="text-align:center">${tl('scan with the other phone\'s camera, copy the text, paste it in mood')}</div>`
        : `<div class="mn-fine">${tl('this account is too big for a qr code — send the text instead')}</div>`}
      <div class="row" style="justify-content:flex-end; gap:8px; margin-top:12px">
        <button class="btn" id="sc-copy">${ICONS.copy} ${tl('copy')}</button>
        <button class="btn primary" id="sc-send">${ICONS.share} ${tl('send')}</button>
      </div>`);
    $('#sc-copy').addEventListener('click', () => copyText(txt));
    $('#sc-send').addEventListener('click', () => {
      if (NATIVE && MoodNative.shareText){ try { MoodNative.shareText(txt); return; } catch(_){} }
      if (navigator.share){ navigator.share({ text: txt }).catch(() => copyText(txt)); return; }
      copyText(txt);
    });
  });
}
async function importShareCode(){
  const raw = await askText(tl('Paste the share code'), { placeholder: SHARE_PREFIX + '…', ok: tl('import'), detail: tl('the other person sends it from the account\'s ⋯ menu → share code. importing again later adds what\'s new.') });
  if (!raw) return;
  try {
    const { acc } = await unpackCode(raw);
    if (!acc?.id || !Array.isArray(acc.events)) throw new Error(tl('that code is damaged'));
    const list = money().accounts, ex = list.find(x => x.id === acc.id);
    if (ex){
      const have = new Set(ex.events.map(e => e.id));
      const add = acc.events.filter(e => !have.has(e.id));
      ex.events.push(...add);
      // same people, keep who "you" is here
      const me = meOf(ex)?.id;
      (acc.members || []).forEach(m => { const o = (ex.members || []).find(x => x.id === m.id); if (o) o.name = m.name; else (ex.members = ex.members || []).push({ ...m }); });
      if (me) ex.members.forEach(x => x.me = x.id === me);
      save(); ui.spendTab = 'savings'; ui.moneyAcc = ex.id; renderSpend();

    } else {
      list.push(acc); save(); ui.spendTab = 'savings'; ui.moneyAcc = acc.id; renderSpend();
      toast(tl('{name} added — tap people to mark which one is you', { name: acc.name }));
    }
  } catch(e){ toast('⚠ ' + e.message); }
}

/* ============ spending ============ */
const DEFAULT_CATS = ['Groceries', 'Dining Out', 'Transport', 'Rent & Bills', 'Subscriptions', 'Shopping', 'Health', 'Entertainment', 'Other'];
const NEEDS_CATS = ['Groceries', 'Transport', 'Rent & Bills', 'Health', 'Bills', 'Rent', 'Utilities', 'Education', 'Insurance'];
const SPEND_PROMPT = `You are a personal finance analyst. Read the bank / credit card statement in the attached file(s) — screenshots or pdf pages.
Rules:
- List EVERY outgoing expense as its own transaction with a short merchant description (strip card numbers and dates from the description) and its date.
- Assign each transaction one category. Prefer these: ${DEFAULT_CATS.join(', ')}. Add a new one only when nothing fits.
- Ignore income, refunds, card payments and transfers between my own accounts.
- Use the statement's currency symbol for "currency" (₺ for turkish lira).
RULES_EXTRA
Reply with ONLY this JSON:
{"month":"YYYY-MM","currency":"₺","transactions":[{"date":"YYYY-MM-DD","desc":"MIGROS","amount":123.45,"category":"Groceries"}]}
"month" is the month most transactions fall in; if unsure use MONTH_KEY.`;
function spendKey(){ const { y, m } = ui.spend; return `${y}-${pad2(m + 1)}`; }
const monthKeyOf = d => d.slice(0, 7);
const prevKey = (k, n = 1) => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 1 - n, 1); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`; };
const ruleKey = d => String(d).toLowerCase().replace(/[\d*#.,:\-\/]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 26);
function applySpendRules(tx){ tx.forEach(t => { const r = db.spendRules[ruleKey(t.desc)]; if (r) t.cat = r; }); }
function groupTx(tx){
  const map = {};
  tx.forEach((t, i) => { (map[t.cat] = map[t.cat] || { name: t.cat, amount: 0, txs: [] }); map[t.cat].amount += t.amt; map[t.cat].txs.push({ ...t, i }); });
  return Object.values(map).sort((a, b) => b.amount - a.amount);
}
function monthTx(data){
  if (!data) return [];
  if (Array.isArray(data.tx)) return data.tx;
  return (data.categories || []).map(c => ({ desc: '— ' + tl('imported as a category total') + ' —', amt: c.amount, cat: c.name }));
}
const txOf = k => monthTx(db.spend[k]);
const allCats = () => [...new Set([...DEFAULT_CATS, ...Object.values(db.spend).flatMap(d => monthTx(d).map(t => t.cat))])];

// a statement replaces the earlier statement rows of that month; hand-typed rows it matches are folded in
function mergeStatement(month, currency, rows){
  const cur = db.spend[month] = db.spend[month] || { currency: currency || '₺', tx: [] };
  if (!Array.isArray(cur.tx)) cur.tx = monthTx(cur);
  const manual = cur.tx.filter(t => t.src === 'manual');
  let merged = 0;
  rows.forEach(r => {
    const i = manual.findIndex(mt => Math.abs(mt.amt - r.amt) <= Math.max(1, r.amt * 0.01) && (!mt.d || !r.d || Math.abs(parseDate(mt.d) - parseDate(r.d)) <= 3 * 864e5));
    if (i >= 0){ const mt = manual.splice(i, 1)[0]; if (mt.cat) r.cat = mt.cat; merged++; }
  });
  cur.tx = [...rows.map(r => ({ ...r, src: 'statement' })), ...manual];
  cur.currency = currency || cur.currency || '₺';
  cur.importedAt = todayStr();
  return merged;
}
async function geminiSpend(files){
  if (!aiOn()){ toast('⚠ ' + tl('add a gemini api key in settings first')); return; }
  if (!files.length) return;
  if (files.reduce((t, f) => t + f.size, 0) > 15 * 1024 * 1024){ toast(tl('⚠ files too big (15mb max) — export fewer pages')); return; }
  toast(tl('⌁ gemini is reading the statement…'));
  const rules = Object.entries(db.spendRules).slice(-30);
  const parts = [{ text: SPEND_PROMPT.replace('MONTH_KEY', spendKey()).replace('RULES_EXTRA', rules.length ? `- I corrected these merchants before — ALWAYS use these categories: ${rules.map(([k, v]) => `"${k}" → ${v}`).join('; ')}.` : '') }];
  for (const f of files){
    const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('could not read file')); r.readAsDataURL(f); });
    parts.push({ inline_data: { mime_type: f.type || (f.name?.toLowerCase().endsWith('.pdf') ? 'application/pdf' : 'image/png'), data: b64 } });
  }
  const j = await geminiJSON(parts);
  const rows = (j?.transactions || []).map(t => ({
    id: uid(), d: /^\d{4}-\d{2}-\d{2}$/.test(t.date || '') ? t.date : undefined,
    desc: String(t.desc ?? t.description ?? '?').trim().slice(0, 60) || '?', amt: Math.abs(+t.amount || 0), cat: String(t.category || 'Other').trim() || 'Other',
  })).filter(t => t.amt > 0);
  if (!rows.length){ toast('⚠ ' + tl('nothing read — try clearer screenshots or the pdf')); return; }
  applySpendRules(rows);
  const month = /^\d{4}-\d{2}$/.test(j.month || '') ? j.month : (rows.find(r => r.d)?.d.slice(0, 7) || spendKey());
  const merged = mergeStatement(month, j.currency, rows);
  const [yy, mm] = month.split('-').map(Number); ui.spend = { y: yy, m: mm - 1 };
  ui.spendTab = 'spending'; save(); renderSpend();
  toast(tl('statement added — {n} purchases', { n: rows.length }) + (merged ? ' · ' + tl('{n} matched what you typed', { n: merged }) : '') + ' ✓');
}

/* ---- insights: plain comparisons with your own past months, no ai needed ---- */
function bigOneOffs(k){
  const hist = {};
  [1, 2, 3, 4, 5, 6].forEach(n => txOf(prevKey(k, n)).forEach(t => (hist[t.cat] = hist[t.cat] || []).push(t.amt)));
  const med = a => { const s = a.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
  return new Set(txOf(k).filter(t => t.amt >= 2000 && hist[t.cat]?.length >= 3 && t.amt >= 4 * med(hist[t.cat])));
}
function catTotals(k, skip){
  const out = {};
  txOf(k).forEach(t => { if (!skip?.has(t)) out[t.cat] = (out[t.cat] || 0) + t.amt; });
  return out;
}
function recurring(k){
  const months = [k, prevKey(k), prevKey(k, 2), prevKey(k, 3)];
  const by = {};
  months.forEach((mk, mi) => txOf(mk).forEach(t => { const key = ruleKey(t.desc); if (!key || t.desc.startsWith('—')) return; ((by[key] = by[key] || { desc: t.desc, cat: t.cat, m: {} }).m[mi] = (by[key].m[mi] || 0) + t.amt); }));
  return Object.values(by).filter(r => {
    const vals = Object.values(r.m); if (vals.length < 2) return false;
    return Math.min(...vals) / Math.max(...vals) >= 0.8 || (r.m[0] && r.m[1] && r.m[0] > r.m[1] && r.m[1] / r.m[0] >= 0.6);
  }).map(r => ({ ...r, amt: r.m[0] ?? r.m[1], isNew: r.m[0] && r.m[1] && !r.m[2] && !r.m[3] && txOf(months[3]).length > 0, rise: r.m[0] && r.m[1] && r.m[0] > r.m[1] * 1.05 ? r.m[0] - r.m[1] : 0, live: r.m[0] != null || r.m[1] != null }))
    .filter(r => r.live).sort((a, b) => b.amt - a.amt);
}
function spendInsights(k){
  const out = [];
  const big = bigOneOffs(k);
  const prev = [1, 2, 3].map(n => prevKey(k, n)).filter(p => txOf(p).length);
  const cur = catTotals(k, big);
  const isNow = k === todayStr().slice(0, 7);
  if (prev.length){
    const avg = {};
    prev.forEach(p => { const big2 = bigOneOffs(p); Object.entries(catTotals(p, big2)).forEach(([c, v]) => avg[c] = (avg[c] || 0) + v / prev.length); });
    Object.keys({ ...avg, ...cur }).forEach(c => {
      const a = avg[c] || 0, v = cur[c] || 0;
      if (a > 0 && v > a * 1.25 && v - a >= 250) out.push({ kind: 'up', w: v - a, text: tl('{cat} is {p} above your {n}-month average (+{x})', { cat: tl(c), p: Math.round((v / a - 1) * 100) + '%', n: prev.length, x: fmtTL(v - a) }) });
      else if (!isNow && a >= 500 && v < a * 0.75) out.push({ kind: 'down', w: a - v, text: tl('{cat} came in {x} under your usual — nice', { cat: tl(c), x: fmtTL(a - v) }) });
    });
  }
  const rec = recurring(k);
  rec.filter(r => r.isNew).forEach(r => out.push({ kind: 'new', w: r.amt * 3, text: tl('new monthly charge: {desc} ({x})', { desc: r.desc, x: fmtTL(r.amt) }) }));
  rec.filter(r => r.rise).forEach(r => out.push({ kind: 'up', w: r.rise * 5, text: tl('{desc} went up by {x} this month', { desc: r.desc, x: fmtTL(r.rise) }) }));
  [...big].forEach(t => out.push({ kind: 'info', w: 1, text: tl('one-off: {desc} {x} — left out of the averages', { desc: t.desc, x: fmtTL(t.amt) }) }));
  return out.sort((a, b) => b.w - a.w);
}

function donutSVG(cats, currency, total){
  const R = 70, C = 2 * Math.PI * R;
  let off = 0;
  const segs = cats.map((c, i) => {
    const frac = c.amount / total;
    const seg = `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${PALETTE[i % PALETTE.length]}" stroke-width="30"
      stroke-dasharray="${Math.max(frac * C - 1.5, .8).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off * C).toFixed(2)}" transform="rotate(-90 100 100)"></circle>`;
    off += frac; return seg;
  }).join('');
  return `<svg viewBox="0 0 200 200" class="mn-donut">
    <circle r="${R}" cx="100" cy="100" fill="none" stroke="var(--bg-lo)" stroke-width="30"/>${segs}
    <text x="100" y="98" text-anchor="middle" style="font-family:'Space Mono',monospace; font-weight:700; font-size:19px" fill="var(--ink)">${esc(currency)}${fmtNum(Math.round(total))}</text>

/* ============ plan: income → three buckets by percent, limits only where you want them ============ */
const BUCKETS = { needs: { label: 'needs', hint: 'rent, bills, groceries, transport' }, wants: { label: 'wants', hint: 'eating out, shopping, fun' }, save: { label: 'saving', hint: 'into your accounts' } };
const bucketOf = c => money().plan.catBucket[c] || (NEEDS_CATS.includes(c) ? 'needs' : 'wants');
const incomeTotal = () => money().plan.income.reduce((t, i) => t + (+i.amt || 0), 0);
// money you moved into savings this month (your part of shared accounts), in ₺
function savedIn(k){
  let t = 0;
  money().accounts.forEach(a => {
    const me = meOf(a);
    (a.events || []).forEach(e => {
      if (e.d.slice(0, 7) !== k || (e.type !== 'deposit' && e.type !== 'withdraw')) return;
      if (a.kind === 'shared' && me && e.who && e.who !== me.id) return;
      if (e.xfer) return;                                   // moving between your own accounts isn't new saving
      const v = e.amt * (e.px || priceOf(a) || 1);
      t += e.type === 'deposit' ? v : -v;
    });
  });
  return t;
}
function planMonth(k){
  const P = money().plan, inc = incomeTotal();
  const spent = { needs: 0, wants: 0 }, byCat = {};

/* instagram reel → recipe, tier 1: fetch the reel page ON THE DEVICE (the
   webview may cross origins, and a phone on home wifi looks like a normal
   visitor where server scrapers get login-walled), mine the caption out of
   the html, feed it to the recipe pipeline. fails → screenshot fallback. */
function igUrlOf(text){
  const m = String(text).match(/https?:\/\/(www\.)?instagram\.com\/(reel|reels|p|tv)\/[A-Za-z0-9_\-]+/);
  return m ? m[0].replace(/\/?$/, '/') : null;
}
function igCaption(pageHtml){
  const cands = [];
  const unesc = s => { const ta = document.createElement('textarea'); ta.innerHTML = s; return ta.value; };
  // 1) json-ld blocks (often carry the full caption as articleBody/description)
  for (const m of pageHtml.matchAll(/<script[^>]+application\/ld\+json[^>]*>([\s\S]*?)<\/script>/g)){
    try {
      const j = JSON.parse(m[1]);
      const objs = Array.isArray(j) ? j : [j];
      objs.forEach(o => { if (o && typeof o === 'object')
        ['articleBody', 'description', 'caption'].forEach(k => { if (typeof o[k] === 'string') cands.push(o[k]); }); });
    } catch(_){}
  }
  // 2) og:title / og:description / description meta tags
  for (const prop of ['og:title', 'og:description', 'description']){
    const re1 = new RegExp(`<meta[^>]+(?:property|name)=["']${prop}["'][^>]+content=["']([^"']+)["']`);
    const re2 = new RegExp(`<meta[^>]+content=["']([^"']+)["'][^>]+(?:property|name)=["']${prop}["']`);
    const m = pageHtml.match(re1) || pageHtml.match(re2);
    if (m) cands.push(unesc(m[1]));
  }
  // 3) embedded caption json ("caption":{"text":"…"})
  const cm = pageHtml.match(/"caption"\s*:\s*\{[^{}]*?"text"\s*:\s*"((?:[^"\\]|\\.)*)"/);
  if (cm){ try { cands.push(JSON.parse('"' + cm[1] + '"')); } catch(_){} }
  // clean instagram wrappers: `user on Instagram: "…"` and `X likes, Y comments - …: "…"`
  const cleaned = cands.map(raw => {
    let s = String(raw).trim();
    const q = s.match(/:\s*["“„]([\s\S]+)["”]\s*$/);
    if (q) s = q[1];
    s = s.replace(/^[\d.,KM]+\s+likes?,\s*[\d.,KM]+\s+comments?\s*[-–]\s*/i, '');
    return s.trim();
  }).filter(Boolean);
  return cleaned.sort((a, b) => b.length - a.length)[0] || '';
}
/* the /embed/captioned/ page is built for iframes — it usually dodges the
   login wall and carries the caption as plain html */
function igEmbedCaption(pageHtml){
  const m = pageHtml.match(/<div[^>]*class="[^"]*Caption[^"]*"[^>]*>([\s\S]*?)<\/div>/i);
  if (!m) return '';
  let s = m[1]
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<a[^>]*>([\s\S]*?)<\/a>/gi, '$1')
    .replace(/<[^>]+>/g, ' ');
  const ta = document.createElement('textarea'); ta.innerHTML = s;
  return ta.value.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
}
async function igImport(url){
  switchView('kitchen'); ui.kitchenTab = 'recipes';
  toast(tl('⌁ reading the reel’s caption…'));
  let reason = '', best = '';
  // tier 1a: the reel page itself
  try {
    const r = await fetch(url, { headers: { 'Accept': 'text/html' } });
    if (!r.ok) reason = 'sayfa ' + r.status;
    else {
      const html2 = await r.text();
      if (/loginForm|Log in to Instagram|Giriş yap/i.test(html2) && !/og:title/i.test(html2)) reason = 'giriş duvarı';
      const c = igCaption(html2);
      if (c.length > best.length) best = c;
    }
  } catch(e){ reason = 'ağ hatası'; }
  // tier 1b: the embeddable captioned page
  if (best.length < 60){
    try {
      const r2 = await fetch(url.replace(/\/?$/, '/') + 'embed/captioned/', { headers: { 'Accept': 'text/html' } });
      if (r2.ok){
        const h2 = await r2.text();
        const c2 = igEmbedCaption(h2) || igCaption(h2);
        if (c2.length > best.length) best = c2;
      }
    } catch(_){}
  }
  if (best.length >= 60){
    await geminiRecipe([{ text: 'Instagram reel caption (may contain hashtags and chatter — extract only the recipe):\n' + best }], 'instagram');
    return;
  }
  // give whatever scraps we found to the manual sheet instead of discarding them
  openRecipeImport(best || '');
  toast('⚠ ' + tl("couldn't read the reel") + (reason ? ' (' + reason + ')' : best ? ' (' + tl('caption too short') + ')' : '') + ' — ' + tl('share a screenshot of the caption'));
}

/* gemini: recipe import — structure, translate to turkish, localize ingredients */
const RECIPE_PROMPT = `You are a recipe assistant for a user living in Turkey. Read the recipe in the provided text and/or images.
Reply with ONLY this JSON (no markdown fences, no commentary):
{"title":"english title","titleTr":"türkçe başlık","servings":2,"timeMin":30,
 "perServing":{"kcal":450,"protein":30,"carbs":40,"fat":15},
 "ingredients":[{"name":"english name","nameTr":"türkçe adı (markette satıldığı adla)","amount":"200 g","sub":""}],
 "steps":["step 1 in english","step 2 in english"],"stepsTr":["adım 1 türkçe","adım 2 türkçe"]}
Rules:
- Give every text field in BOTH English (title, name, steps) and Turkish (titleTr, nameTr, stepsTr); steps must be complete and clear in both.
- nameTr: the ingredient as sold in Turkish markets (Migros, A101, BİM).
- If an ingredient is hard to find in Turkey, put the closest local substitute into "sub" (in Turkish); otherwise leave "sub" empty.
- timeMin: total prep + cook time in minutes. perServing: your best estimate of one serving's calories and macros in grams.
- Keep amounts metric.`;

async function geminiRecipe(extraParts, sourceNote, photo){
  const key = aiOn();
  if (!key){ toast(tl('⚠ add a gemini api key in settings first')); return; }
  toast(tl('⌁ gemini is reading the recipe…'));
  try {
    const j = looseJSON(await geminiCall([{ text: RECIPE_PROMPT }, ...extraParts]));
    if (!Array.isArray(j.ingredients) || !j.ingredients.length) throw new Error('no ingredients recognized');
    db.kitchen.recipes.push({
      id: uid(),
      title: String(j.title || '').slice(0, 90),
      titleTr: String(j.titleTr || j.title || 'Tarif').slice(0, 90),
      servings: +j.servings || 0,
      ingredients: j.ingredients.map(i => ({
        name: String(i.name || '').slice(0, 60), nameTr: String(i.nameTr || i.name || '').slice(0, 60),
        amount: String(i.amount || '').slice(0, 30), sub: String(i.sub || '').slice(0, 80),
      })),
      stepsTr: (Array.isArray(j.stepsTr) ? j.stepsTr : []).map(s => String(s).slice(0, 400)),
      steps: (Array.isArray(j.steps) ? j.steps : []).map(s => String(s).slice(0, 400)),
      timeMin: +j.timeMin > 0 ? Math.round(+j.timeMin) : 0,
      perServing: j.perServing && +j.perServing.kcal > 0 ? { kcal: +j.perServing.kcal, protein: +j.perServing.protein || 0, carbs: +j.perServing.carbs || 0, fat: +j.perServing.fat || 0 } : null,
      photo: photo || '',
      source: sourceNote || '', addedAt: todayStr(),
    });
    ui.kitchenTab = 'recipes';
    save(); closeModal();
    if (ui.view === 'kitchen') renderKitchen(); else switchView('kitchen');
    toast(tl('recipe saved') + ' ✕ ' + (j.titleTr || ''));
  } catch(e){ toast(tl('⚠ recipe import failed: ') + e.message); }
}

/* gemini: general audience score on a 0-5 scale, cached per entry */
async function geminiAudScore(e){
  const key = aiOn();
  if (!key) return null;
  const kind = { movie:'movie', tv:'tv series', book:tl('book'), game:'video game', album:'music album' }[e.type] || 'work';
  const q = `What is the general public rating for the ${kind} "${e.title}"${e.year ? ` (${e.year})` : ''}? Average the well-known sources that apply (IMDb, Letterboxd, Rotten Tomatoes audience, Goodreads, Metacritic, Steam reviews), convert to a 0-5 scale, and reply with ONLY the number rounded to one decimal.`;
  try {
    const text = await geminiCall([{ text: q }], { json: false, temperature: 0 });
    const v = parseFloat(String(text).replace(',', '.').match(/[\d.]+/)?.[0]);
    if (v > 0 && v <= 5) return Math.round(v * 10) / 10;
    if (v > 5 && v <= 10) return Math.round(v * 5) / 10; // model answered on /10 anyway
  } catch(_){}
  return null;
}

/* gemini: estimate how long a game takes to finish (rawg-free) */
async function geminiGameHours(title, year){
  const key = aiOn();
  if (!key || !title) return null;
  const q = `How many hours does it take a typical player to finish the video game "${title}"${year ? ` (${year})` : ''} — main story plus a reasonable amount of side content? Answer with ONLY a number of hours, nothing else.`;
  try {
    const text = await geminiCall([{ text: q }], { json: false, temperature: 0 });
    const h = parseFloat(String(text).replace(',', '.').match(/[\d.]+/)?.[0]);
    if (h > 0 && h < 1000) return Math.round(h * 2) / 2;
  } catch(_){}
  return null;
}

function fallbackCopy(t, done){

  ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;left:-9999px';
  document.body.appendChild(ta); ta.select();

/* ============ gemini — suggestions, list import, key guides ============ */
const aiState = () => (db.ai = db.ai && typeof db.ai === 'object' ? db.ai : { suggest: null, like: {}, nope: [] });
const aiKey = (type, title) => type + ':' + normTitle(title);

/* ---- what you like, in a few lines the model can read ---- */
function tasteProfile(){
  const line = e => `${TYPES[e.type].label}: ${e.title}${e.year ? ` (${e.year})` : ''}${e.rating ? ` — ${e.rating}/5` : ''}${(e.genres || []).length ? ` [${e.genres.slice(0, 2).join(', ')}]` : ''}`;
  const rated = db.media.filter(e => e.rating >= 4).sort((a, b) => b.rating - a.rating);
  const loved = (rated.length >= 3 ? rated : db.media.filter(e => e.status === 'done' || e.status === 'active')).slice(0, 30);
  const meh = db.media.filter(e => (e.rating && e.rating <= 2) || e.status === 'dropped').slice(0, 15);
  const now = db.media.filter(e => e.status === 'active').slice(0, 8);
  return { loved: loved.map(line), meh: meh.map(line), now: now.map(line) };
}
function ownedAndNope(){
  return [...db.media.map(e => e.title), ...aiState().nope.map(k => k.split(':').slice(1).join(':'))].slice(0, 220);
}
const AI_LANG = () => LANG === 'tr' ? 'Turkish' : 'English';
async function askSuggestions({ n = 8, like = null, type = null } = {}){
  const P = tasteProfile();
  const focus = like ? `They want more like "${like.title}" (${TYPES[like.type].label}${like.year ? ', ' + like.year : ''}${(like.genres || []).length ? ', ' + like.genres.join(', ') : ''}). Mix media types — a book or a game can be "like" a film.` : '';
  const j = await geminiJSON([{ text: `You recommend films, TV series, books and video games to one person.
${P.loved.length ? `They loved:\n${P.loved.join('\n')}` : 'They have not rated much yet — suggest widely loved modern classics.'}
${P.now.length ? `Into right now:\n${P.now.join('\n')}` : ''}
${P.meh.length ? `Not for them:\n${P.meh.join('\n')}` : ''}
${focus}
Never suggest these (they already have them or said no): ${ownedAndNope().join('; ')}
Give ${n} recommendations${type ? ` — only ${TYPES[type].label.toLowerCase()}s` : ', mixing media types'}. Prefer well-known titles that are easy to find.
Reply with ONLY this JSON: {"items":[{"type":"movie|tv|book|game|album","title":"original title","year":"YYYY","creator":"director / author / studio / artist","why":"one short sentence in ${AI_LANG()} that names something they loved"}]}` }], { fast: false });
  const owned = new Set(db.media.map(e => aiKey(e.type, e.title))), nope = new Set(aiState().nope);
  return (j?.items || []).filter(x => TYPES[x.type] && x.title && !owned.has(aiKey(x.type, x.title)) && !nope.has(aiKey(x.type, x.title)))
    .map(x => ({ type: x.type, title: String(x.title).slice(0, 90), year: yearOf(x.year), creator: String(x.creator || '').slice(0, 60), why: String(x.why || '').slice(0, 200) }));
}
// a cover + the fields needed to add it, looked up quietly for each suggestion
async function dressSuggestions(list, after){
  for (const s of list){
    if (s.looked) continue;
    s.looked = 1;
    try {
      const m = bestMatch(s, await searchMedia(s.type, s.title, s.year));
      if (m) Object.assign(s, { cover: m.cover || '', tvmazeId: m.tvmazeId || null, pagesTotal: m.pagesTotal || 0, runtimeMin: m.runtimeMin || 0, epMin: m.epMin || 0,
        playHours: m.playHours || 0, synopsis: m.synopsis || '', genres: m.genres || [], platforms: m.platforms || [], ids: m.ids || {}, src: m.sources || [] });
    } catch(_){}
    save(); after && after();
  }
}
let fyBusy = false;
async function refreshForYou(force){
  const A = aiState();
  if (!aiOn()) return;
  if (!force && A.suggest?.at && Date.now() - A.suggest.at < 7 * 864e5) return;
  if (fyBusy) return;
  // an automatic refresh that failed waits a few hours before trying again
  if (!force && A.triedAt && Date.now() - A.triedAt < 6 * 3600e3) return;
  fyBusy = true; delete A.busy; A.triedAt = Date.now();
  if (force) toast('⌁ ' + tl('gemini is picking things for you…'));
  try {
    const items = await askSuggestions({ n: 8 });
    if (items.length){ A.suggest = { at: Date.now(), items }; save(); if (ui.view === 'home') render(); dressSuggestions(items, () => { if (ui.view === 'home') render(); }); }
    else if (force) toast('⚠ ' + (geminiLastErr || tl('no suggestions came back — try again later')));
  } finally { fyBusy = false; if (ui.view === 'home') render(); }
}
// add a suggestion to the library — planned (queue) or already done
function addSuggestion(s, status){
  const e = {
    id: uid(), type: s.type, title: s.title, creator: s.creator || '', year: s.year || '', cover: s.cover || '', color: pickColor(),
    status, startDate: '', endDate: '', rating: 0, notes: '', pagesTotal: s.pagesTotal || 0, pagesRead: 0, seasons: [], tvmazeId: s.tvmazeId || null,
    runtimeMin: s.runtimeMin || 0, epMin: s.epMin || 0, playHours: s.playHours || 0, synopsis: s.synopsis || '', genres: s.genres || [], platforms: s.platforms || [],
    ids: s.ids || {}, src: s.src || [], addedAt: todayStr(), fromAI: 1,
  };
  db.media.push(e);
  if (status === 'planned') db.queue.push(e.id);
  dropSuggestion(s);
  save(); render();
  enrich(e).then(() => render());
  if (e.tvmazeId) fetchSeasons(e.tvmazeId).then(se => { e.seasons = se; save(); }).catch(() => {});
  toast(status === 'planned' ? tl('{title} added to your queue', { title: e.title }) : tl('{title} marked as done — rate it from the library', { title: e.title }));
  return e;
}
function dropSuggestion(s){
  const A = aiState();
  if (A.suggest) A.suggest.items = A.suggest.items.filter(x => x !== s && aiKey(x.type, x.title) !== aiKey(s.type, s.title));
  Object.values(A.like || {}).forEach(l => { l.items = (l.items || []).filter(x => aiKey(x.type, x.title) !== aiKey(s.type, s.title)); });
}
function noThanks(s){
  const A = aiState();
  A.nope = [...new Set([...(A.nope || []), aiKey(s.type, s.title)])].slice(-300);   // remembered, never suggested again
  dropSuggestion(s); save(); render();
  toast(tl('got it — won\'t suggest {title} again', { title: s.title }), { undo: () => { A.nope = A.nope.filter(k => k !== aiKey(s.type, s.title)); save(); } });
}

async function readMediaList(text, shots){
  const j = await geminiJSON([{ text: `Extract every film, TV series, book, video game and music album in the text and/or screenshots (lists, shelves, notes, exports from Letterboxd, Goodreads, Steam, Trakt…).
For each item:
- "type": movie | tv | book | game | album
- "title": the real title as it is commonly known (fix typos, keep the original language)
- "year": if shown or certain, else ""
- "creator": author / director / studio if shown, else ""
- "status": "done" if it looks watched / read / finished / rated, "active" if in progress or "currently", otherwise "planned"
- "rating": 0–5 if a rating is shown (convert from /10 or stars), else 0
- "date": YYYY-MM-DD when it was finished / watched if shown, else ""
Ignore anything that isn't one of these four kinds. Reply with ONLY this JSON: {"items":[…]}` }, ...(text ? [{ text: 'TEXT:\n' + text.slice(0, 20000) }] : []), ...shots.map(s => ({ inline_data: { mime_type: s.mime, data: s.data } }))]);
  if (!j) return null;
  return (j.items || []).filter(x => TYPES[x.type] && x.title).map(x => ({
    type: x.type, title: String(x.title).trim().slice(0, 90), year: yearOf(x.year), creator: String(x.creator || '').slice(0, 60),
    status: STATUS[x.status] ? x.status : 'planned', rating: Math.max(0, Math.min(5, Math.round((+x.rating || 0) * 2) / 2)),
    date: /^\d{4}-\d{2}-\d{2}$/.test(x.date || '') ? x.date : '',
  }));
}

async function doImport(list){
  const made = list.map(x => {
    const e = { id: uid(), type: x.type, title: x.title, creator: x.creator, year: x.year, cover: '', color: pickColor(), status: x.status,
      startDate: x.status === 'active' ? todayStr() : '', endDate: x.status === 'done' || x.status === 'dropped' ? x.date : '', rating: x.rating, notes: '',
      pagesTotal: 0, pagesRead: 0, seasons: [], tvmazeId: null, runtimeMin: 0, epMin: 0, playHours: 0, synopsis: '', genres: [], platforms: [], ids: {}, src: [], addedAt: todayStr() };
    db.media.push(e);
    if (e.status === 'planned') db.queue.push(e.id);
    return e;
  });
  save(); closeModal(); switchView('library');
  toast(tl('{n} added — covers and details are on their way', { n: made.length }));
  // covers + details one by one in the background
  let i = 0;
  for (const e of made){
    i++;
    try {
      const m = bestMatch(e, await searchMedia(e.type, e.title, e.year));
      if (m){
        if (m.cover) e.cover = m.cover;
        ['year', 'creator', 'synopsis', 'runtimeMin', 'epMin', 'pagesTotal', 'playHours', 'tvmazeId'].forEach(k => { if (emptyVal(e[k]) && m[k]) e[k] = m[k]; });
        ['genres', 'platforms'].forEach(k => { if (emptyVal(e[k]) && (m[k] || []).length) e[k] = m[k]; });
        e.ids = m.ids || {}; e.src = m.sources || [];
      }
      await enrich(e, { gemini: false });
      if (e.tvmazeId && !e.seasons.length) e.seasons = await fetchSeasons(e.tvmazeId).catch(() => []);
      save(); if (ui.view === 'library') render();
    } catch(_){}
    if (i % 5 === 0 || i === made.length) toast(tl('details {i}/{n}', { i, n: made.length }));
  }
}

/* ============ imports — letterboxd, goodreads, trakt, steam, e-reader (epub) ============
   every importer turns its files into GROUPS (watched, watchlist, a list, a shelf…).
   one review screen lets you pick groups and single items, decide how each group lands
   (library only, queue, or a mood list), and marks what's already in your library. */

/* ---- tiny zip reader (letterboxd exports, epub files) — the browser inflates ---- */
async function unzip(file){
  const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error(tl('that file isn\'t a zip'));
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = new Map(), dec = new TextDecoder();
  for (let n = 0; n < count && dv.getUint32(p, true) === 0x02014b50; n++){
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = dec.decode(buf.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    files.set(name, { method, data: buf.subarray(start, start + size) });
  }
  const find = name => files.get(name) || [...files.entries()].find(([k]) => k.toLowerCase() === String(name).toLowerCase())?.[1];
  const bytes = async name => {
    const f = find(name); if (!f) return null;
    if (f.method === 0) return f.data;
    if (f.method !== 8) throw new Error('zip method ' + f.method);
    const s = new Blob([f.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(s).arrayBuffer());
  };
  return { names: [...files.keys()], bytes, text: async name => { const b = await bytes(name); return b ? new TextDecoder().decode(b) : null; } };
}
/* ---- csv (quotes, commas and line breaks inside quotes) → array of objects by header ---- */
function parseCSV(text, headerAt = 0){
  const rows = []; let row = [], cur = '', q = false;
  const t = String(text).replace(/^﻿/, '');
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){ if (c === '"'){ if (t[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && t[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  const head = (rows[headerAt] || []).map(h => h.trim());
  return rows.slice(headerAt + 1).filter(r => r.some(x => x.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}
const isoDate = s => { const m = String(s || '').match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/); return m ? `${m[1]}-${pad2(+m[2])}-${pad2(+m[3])}` : ''; };
const impItem = o => ({ type: o.type, title: String(o.title || '').replace(/[™®©]/g, '').replace(/\s{2,}/g, ' ').trim(), year: yearOf(o.year), creator: o.creator || '', status: o.status || 'planned',
  rating: o.rating ? Math.max(0, Math.min(5, Math.round(+o.rating * 2) / 2)) : 0, date: o.date || '', pages: +o.pages || 0, cover: o.cover || '', coverBlob: o.coverBlob || null,
  playedMin: +o.playedMin || 0, steam: o.steam || null, on: true });

/* ---- letterboxd: the export zip (or single csv files) ---- */
async function parseLetterboxd(files){
  const csvs = [];
  for (const f of files){
    if (/\.zip$/i.test(f.name)){ const z = await unzip(f); for (const n of z.names.filter(n => /\.csv$/i.test(n))) csvs.push({ name: n, text: await z.text(n) }); }
    else if (/\.csv$/i.test(f.name)) csvs.push({ name: f.name, text: await f.text() });
  }
  const base = n => n.split('/').pop().toLowerCase();
  const get = n => csvs.find(c => base(c.name) === n && !/\/lists?\//i.test(c.name) && !/deleted|orphaned/i.test(c.name));
  const key = r => (r['Letterboxd URI'] || '') || (r.Name + '|' + r.Year);
  const watched = new Map();
  parseCSV(get('watched.csv')?.text || '').forEach(r => watched.set(key(r), { title: r.Name, year: r.Year, date: isoDate(r.Date) }));
  parseCSV(get('diary.csv')?.text || '').forEach(r => { const w = watched.get(key(r)) || { title: r.Name, year: r.Year }; w.date = isoDate(r['Watched Date']) || w.date; if (+r.Rating) w.rating = +r.Rating; watched.set(key(r), w); });
  parseCSV(get('ratings.csv')?.text || '').forEach(r => { const w = watched.get(key(r)) || { title: r.Name, year: r.Year, date: isoDate(r.Date) }; if (+r.Rating) w.rating = +r.Rating; watched.set(key(r), w); });
  const groups = [];
  if (watched.size) groups.push({ id: 'lb-watched', label: tl('Letterboxd · watched films'), mode: 'library', items: [...watched.values()].map(w => impItem({ type: 'movie', ...w, status: 'done' })) });
  const wl = parseCSV(get('watchlist.csv')?.text || '');
  if (wl.length) groups.push({ id: 'lb-watchlist', label: tl('Letterboxd · watchlist'), mode: 'queue', items: wl.map(r => impItem({ type: 'movie', title: r.Name, year: r.Year, status: 'planned' })) });
  // lists use a different link column, so "already watched" is matched by name + year
  const seenNY = new Set([...watched.values()].map(w => w.title + '|' + w.year));
  // lists: "Letterboxd list export" — the list name sits in the second block, films start after the blank line
  csvs.filter(c => /\/lists?\//i.test(c.name) || (/^letterboxd list export/i.test(c.text) && !['watched.csv', 'watchlist.csv', 'diary.csv', 'ratings.csv'].includes(base(c.name)))).forEach(c => {
    const lines = c.text.split(/\r?\n/);
    const meta = parseCSV(lines.slice(1, 3).join('\n'))[0] || {};
    const at = lines.findIndex((l, i) => i > 2 && /^Position,|^Name,/i.test(l));
    const films = at > 0 ? parseCSV(lines.slice(at).join('\n')) : [];
    if (films.length) groups.push({ id: 'lb-list-' + c.name, label: tl('Letterboxd list · {name}', { name: meta.Name || base(c.name).replace(/\.csv$/, '') }), listName: meta.Name || base(c.name).replace(/\.csv$/, ''), mode: 'list',
      items: films.map(r => impItem({ type: 'movie', title: r.Name, year: r.Year, status: seenNY.has(r.Name + '|' + r.Year) ? 'done' : 'planned' })) });
  });
  return groups;
}
/* ---- goodreads: library export csv ---- */
async function parseGoodreads(files){
  const groups = [];
  for (const f of files.filter(f => /\.csv$/i.test(f.name))){
    const rows = parseCSV(await f.text());
    if (!rows.length || !('Exclusive Shelf' in rows[0])) continue;
    const book = r => impItem({ type: 'book', title: r.Title.replace(/\s*\([^)]*#\d+[^)]*\)\s*$/, ''), creator: r.Author, year: r['Original Publication Year'] || r['Year Published'],
      status: { read: 'done', 'currently-reading': 'active', 'to-read': 'planned' }[r['Exclusive Shelf']] || 'planned', rating: +r['My Rating'] || 0,
      date: isoDate(r['Date Read']), pages: +r['Number of Pages'] || 0 });
    const shelf = (id, label, mode, pick) => { const it = rows.filter(pick).map(book); if (it.length) groups.push({ id, label, mode, items: it }); };
    shelf('gr-read', tl('Goodreads · read'), 'library', r => r['Exclusive Shelf'] === 'read');
    shelf('gr-reading', tl('Goodreads · currently reading'), 'library', r => r['Exclusive Shelf'] === 'currently-reading');
    shelf('gr-toread', tl('Goodreads · want to read'), 'queue', r => r['Exclusive Shelf'] === 'to-read');
    const custom = new Set(rows.flatMap(r => (r.Bookshelves || '').split(',').map(s => s.trim())).filter(s => s && !['read', 'currently-reading', 'to-read'].includes(s)));
    custom.forEach(s => shelf('gr-shelf-' + s, tl('Goodreads shelf · {name}', { name: s }), 'list', r => (r.Bookshelves || '').split(',').map(x => x.trim()).includes(s)));
    groups.filter(g => g.mode === 'list').forEach(g => g.listName = g.label.split('· ').pop());
  }
  return groups;
}
/* ---- trakt: json files from the data export (watched, watchlist, ratings, lists) ---- */
async function parseTrakt(files){
  const groups = [];
  for (const f of files.filter(f => /\.json$/i.test(f.name))){
    let arr; try { arr = JSON.parse(await f.text()); } catch(_){ continue; }
    if (!Array.isArray(arr)) arr = arr.items || [];
    const n = f.name.toLowerCase();
    const status = /watchlist/.test(n) ? 'planned' : /watched|history|ratings/.test(n) ? 'done' : 'planned';
    const seen = new Map();
    arr.forEach(x => {
      const m = x.movie || x.show; if (!m?.title) return;
      const k = (x.movie ? 'movie' : 'tv') + m.title + m.year;
      if (seen.has(k)) return;
      seen.set(k, impItem({ type: x.movie ? 'movie' : 'tv', title: m.title, year: m.year, status, rating: x.rating ? x.rating / 2 : 0, date: isoDate(x.last_watched_at || x.watched_at || x.rated_at) }));
    });
    if (seen.size) groups.push({ id: 'tr-' + n, label: 'Trakt · ' + f.name.replace(/\.json$/i, '').replace(/[-_]+/g, ' '), mode: status === 'planned' ? 'queue' : 'library', items: [...seen.values()] });
  }
  return groups;
}
/* ---- steam: owned games + wishlist (web api key; the apk fetches it — steam blocks web pages) ---- */
async function steamGet(url){ const t = await nativeGet(url, 15000); if (!t) throw new Error(tl('steam did not answer — this works in the android app')); return JSON.parse(t); }
async function parseSteam(profile, key){
  let id = String(profile || '').trim();
  const m = id.match(/steamcommunity\.com\/(id|profiles)\/([^/?#]+)/i);
  if (m) id = m[2];
  if (!/^\d{17}$/.test(id)){
    const r = await steamGet(`https://api.steampowered.com/ISteamUser/ResolveVanityURL/v1/?key=${encodeURIComponent(key)}&vanityurl=${encodeURIComponent(id)}`);
    id = r?.response?.steamid; if (!id) throw new Error(tl('steam profile not found'));
  }
  const own = await steamGet(`https://api.steampowered.com/IPlayerService/GetOwnedGames/v1/?key=${encodeURIComponent(key)}&steamid=${id}&include_appinfo=1&include_played_free_games=1`);
  const games = own?.response?.games || [];
  if (!games.length && !own?.response?.game_count) throw new Error(tl('no games visible — set "game details" to public in your steam privacy settings'));
  const art = a => `https://cdn.cloudflare.steamstatic.com/steam/apps/${a}/library_600x900_2x.jpg`;
  const recent = Date.now() / 1000 - 21 * 86400;
  const g = x => impItem({ type: 'game', title: x.name, status: x.rtime_last_played > recent ? 'active' : 'done', playedMin: x.playtime_forever, steam: x.appid, cover: art(x.appid), date: x.rtime_last_played ? dateStr(new Date(x.rtime_last_played * 1000)) : '' });
  const groups = [];
  const played = games.filter(x => x.playtime_forever >= 30).sort((a, b) => b.playtime_forever - a.playtime_forever);
  const untouched = games.filter(x => x.playtime_forever < 30);
  if (played.length) groups.push({ id: 'st-played', label: tl('Steam · played ({n})', { n: played.length }), mode: 'library', items: played.map(g) });
  if (untouched.length) groups.push({ id: 'st-backlog', label: tl('Steam · never really played ({n})', { n: untouched.length }), mode: 'queue', status: 'planned', items: untouched.map(x => ({ ...g(x), status: 'planned' })), on: false });
  try {
    const wl = await steamGet(`https://api.steampowered.com/IWishlistService/GetWishlist/v1/?steamid=${id}`);
    const ids = (wl?.response?.items || []).slice(0, 60).map(x => x.appid);
    const items = [];
    for (const a of ids){
      const d = await steamGet(`https://store.steampowered.com/api/appdetails?appids=${a}&filters=basic`).catch(() => null);
      const name = d?.[a]?.data?.name; if (name) items.push(impItem({ type: 'game', title: name, status: 'planned', steam: a, cover: art(a) }));
    }
    if (items.length) groups.push({ id: 'st-wish', label: tl('Steam · wishlist'), mode: 'list', listName: tl('Steam wishlist'), items });
  } catch(_){}
  groups.forEach(gr => gr.items.forEach(x => { x.platforms = ['PC']; }));
  return groups;
}
/* ---- e-reader: epub files are zips — title, author and the cover come straight out of them ---- */
async function readEpub(file){
  const z = await unzip(file);
  const container = await z.text('META-INF/container.xml');
  const opfPath = container?.match(/full-path="([^"]+)"/)?.[1];
  if (!opfPath) throw new Error('no opf');
  const doc = new DOMParser().parseFromString(await z.text(opfPath), 'application/xml');
  const tag = t => doc.getElementsByTagNameNS('*', t)[0]?.textContent?.trim() || '';
  const items = [...doc.getElementsByTagNameNS('*', 'item')];
  const coverId = [...doc.getElementsByTagNameNS('*', 'meta')].find(m => m.getAttribute('name') === 'cover')?.getAttribute('content');
  const img = i => /image\//.test(i.getAttribute('media-type') || '');
  const ci = items.find(i => /cover-image/.test(i.getAttribute('properties') || '')) || items.find(i => i.getAttribute('id') === coverId && img(i))
    || items.find(i => img(i) && /cover/i.test((i.getAttribute('id') || '') + (i.getAttribute('href') || '')));
  let coverBlob = null;
  if (ci){
    const dir = opfPath.includes('/') ? opfPath.replace(/[^/]+$/, '') : '';
    const path = (dir + decodeURIComponent(ci.getAttribute('href'))).split('/').reduce((a, s) => (s === '..' ? a.pop() : s && s !== '.' && a.push(s), a), []).join('/');
    const b = await z.bytes(path);
    if (b) coverBlob = await shrinkImage(new Blob([b], { type: ci.getAttribute('media-type') }), 420);
  }
  const creator = tag('creator').replace(/^(.+),\s*(.+)$/, '$2 $1');   // "Weir, Andy" → "Andy Weir"
  return impItem({ type: 'book', title: tag('title') || file.name.replace(/\.epub$/i, ''), creator, year: yearOf(tag('date')), status: 'planned', coverBlob });
}
async function shrinkImage(blob, maxW){
  try {
    const bmp = await createImageBitmap(blob);
    const w = Math.min(maxW, bmp.width), h = Math.round(bmp.height * w / bmp.width);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    return await new Promise(res => c.toBlob(res, 'image/jpeg', .82));
  } catch(_){ return blob; }
}
// covers that only exist inside the app (from an epub) are kept in indexeddb under "idb:<id>"
async function storeCover(id, blob){
  const d = await coverStore(); if (!d || !blob) return '';
  const k = 'idb:' + id;
  await new Promise(res => { const tx = d.transaction('c', 'readwrite'); tx.objectStore('c').put(blob, k); tx.oncomplete = res; tx.onerror = res; });
  coverURLs.set(k, URL.createObjectURL(blob));
  return k;
}

async function importGroups(groups){
  const made = [], byKey = new Map();
  for (const g of groups.filter(g => g.on)){
    const ids = [];
    for (const x of g.items){
      const k = x.type + ':' + normTitle(x.title);
      // a list wants every film it names — ones already in the library are linked, not copied
      let e = byKey.get(k) || (x.dup && (g.mode === 'list' || !x.on) ? x.dup : null);
      if (!x.on && !(g.mode === 'list' && e)) continue;
      if (!e){
        e = { id: uid(), type: x.type, title: x.title, creator: x.creator, year: x.year, cover: x.cover || '', color: pickColor(), status: x.status,
          startDate: x.status === 'active' ? (x.date || todayStr()) : '', endDate: (x.status === 'done' || x.status === 'dropped') ? x.date : '', rating: x.rating, notes: '',
          pagesTotal: x.pages || 0, pagesRead: x.status === 'done' ? (x.pages || 0) : 0, seasons: [], tvmazeId: null, runtimeMin: 0, epMin: 0,
          playHours: x.playedMin && x.status === 'done' ? Math.round(x.playedMin / 30) / 2 : 0, playedMin: x.playedMin || 0,
          synopsis: '', genres: [], platforms: x.platforms || [], ids: x.steam ? { steam: x.steam } : {}, src: [], addedAt: todayStr(), importedFrom: g.id.split('-')[0] };
        if (x.coverBlob) e.cover = await storeCover(e.id, x.coverBlob);
        db.media.push(e); made.push(e);
        if (g.mode === 'queue' && e.status === 'planned') db.queue.push(e.id);
      }
      byKey.set(k, e);
      ids.push(e.id);
    }
    if (g.mode === 'list' && ids.length){
      const name = g.listName || g.label;
      const l = db.lists.find(x => x.name === name) || (db.lists.push({ id: uid(), name, items: [] }), db.lists[db.lists.length - 1]);
      ids.forEach(id => { if (!l.items.includes(id)) l.items.push(id); });
    }
  }
  save(); closeModal(); switchView('library');
  toast(tl('{n} added — covers and details are on their way', { n: made.length }));
  fillImported(made);
}
// covers (unless the file had one) + details, one at a time
async function fillImported(list){
  let i = 0;
  for (const e of list){
    i++;
    try {
      // older steam games have no portrait art — look elsewhere for those
      if (e.ids?.steam && e.cover && !/^idb:/.test(e.cover) && !(await probeImg(e.cover))) e.cover = '';
      if (!e.cover || (!e.ids?.wp && !e.ids?.steam)){
        const m = bestMatch(e, await searchMedia(e.type, e.title, e.year));
        if (m){
          if (!e.cover && m.cover) e.cover = m.cover;
          ['year', 'creator', 'synopsis', 'runtimeMin', 'epMin', 'pagesTotal', 'playHours', 'tvmazeId'].forEach(k => { if (emptyVal(e[k]) && m[k]) e[k] = m[k]; });
          ['genres', 'platforms'].forEach(k => { if (emptyVal(e[k]) && (m[k] || []).length) e[k] = m[k]; });
          e.ids = { ...(m.ids || {}), ...(e.ids || {}) }; e.src = m.sources || [];
        }
      }
      await enrich(e, { gemini: false });
      if (e.type === 'tv' && e.tvmazeId && !e.seasons.length){
        e.seasons = await fetchSeasons(e.tvmazeId).catch(() => []);
        if (e.status === 'done') e.seasons.forEach(s => s.episodes.forEach(ep => ep.watched = true));
      }
      if (e.type === 'book' && e.status === 'done' && e.pagesTotal && !e.pagesRead) e.pagesRead = e.pagesTotal;
      save(); if (ui.view === 'library') render();
    } catch(_){}
    if (i % 10 === 0 || i === list.length) toast(tl('details {i}/{n}', { i, n: list.length }));
  }
}

/* ============ stats + year in review ============ */
const TYPE_COL = { movie: '#B3542E', tv: '#4F6E72', book: '#67754A', game: '#7D5875', album: '#96852F' };
function statYears(){
  const ys = new Set();
  db.media.forEach(e => { [e.endDate, e.startDate, ...Object.keys(activityOf(e))].forEach(d => { if (d) ys.add(+d.slice(0, 4)); }); });
  ys.add(new Date().getFullYear());
  return [...ys].filter(y => y > 1900).sort((a, b) => b - a);
}
function statsData(year){
  const all = year === 'all';
  const inY = d => !!d && (all || d.startsWith(String(year)));
  const fin = db.media.filter(e => e.status === 'done' && (inY(e.endDate) || (all && !e.endDate)));
  const byType = Object.fromEntries(Object.keys(TYPES).map(t => [t, fin.filter(e => e.type === t).length]));
  // time: what the logs say (pages, episodes) + whole films / games finished
  let pages = 0, eps = 0, epMin = 0;
  const days = new Set();
  db.media.forEach(e => Object.entries(activityOf(e)).forEach(([d, list]) => {
    if (!inY(d)) return;
    list.forEach(x => {
      if (x.kind === 'pages') pages += x.n || 0;
      if (x.kind === 'eps'){ eps += x.n || 0; epMin += (x.n || 0) * (e.epMin || 40); }
      if (!['start', 'finish', 'drop'].includes(x.kind)) days.add(d);
    });
  }));
  const filmMin = fin.filter(e => e.type === 'movie').reduce((t, e) => t + (e.runtimeMin || 115), 0);
  const gameMin = fin.filter(e => e.type === 'game').reduce((t, e) => t + (e.playedMin || (e.playHours || 0) * 60), 0);
  const albumMin = fin.filter(e => e.type === 'album').reduce((t, e) => t + (e.runtimeMin || 45), 0);
  const time = { film: filmMin, tv: epMin, book: pages * 1.5, game: gameMin, album: albumMin };
  const months = Array.from({ length: 12 }, () => ({ movie: 0, tv: 0, book: 0, game: 0, album: 0 }));
  if (!all) fin.forEach(e => { if (e.endDate) months[+e.endDate.slice(5, 7) - 1][e.type]++; });
  const rated = fin.filter(e => e.rating);
  const genres = {};
  fin.forEach(e => (e.genres || []).forEach(g => { const k = String(g).toLowerCase(); genres[k] = (genres[k] || 0) + 1; }));
  // longest run of days with any media progress
  const sorted = [...days].sort();
  let best = 0, run = 0, prev = null;
  sorted.forEach(d => { run = prev && dateStr(addDays(parseDate(prev), 1)) === d ? run + 1 : 1; best = Math.max(best, run); prev = d; });
  const wd = Array(7).fill(0); sorted.forEach(d => wd[parseDate(d).getDay()]++);
  const busiest = months.map((m, i) => ({ i, n: Object.values(m).reduce((a, b) => a + b, 0) })).sort((a, b) => b.n - a.n)[0];
  return {
    fin, byType, time, total: Object.values(time).reduce((a, b) => a + b, 0), pages, eps, months, days: days.size, streak: best,
    weekday: sorted.length ? wd.indexOf(Math.max(...wd)) : -1, busiest: busiest?.n ? busiest.i : -1,
    avg: rated.length ? rated.reduce((t, e) => t + e.rating, 0) / rated.length : 0,
    top: rated.slice().sort((a, b) => b.rating - a.rating || (b.endDate || '').localeCompare(a.endDate || '')).slice(0, 8),
    genres: Object.entries(genres).sort((a, b) => b[1] - a[1]).slice(0, 6),
    started: db.media.filter(e => inY(e.startDate)).length, dropped: db.media.filter(e => e.status === 'dropped' && inY(e.endDate)).length,
  };
}
function monthsChartSVG(months){
  const W = 330, H = 120, B = 16, max = Math.max(1, ...months.map(m => Object.values(m).reduce((a, b) => a + b, 0)));
  const bw = W / 12;
  return `<svg class="st-chart" viewBox="0 0 ${W} ${H}">${months.map((m, i) => {
    let y = H - B;
    const bars = Object.keys(TYPES).map(t => { const h = m[t] / max * (H - B - 8); y -= h; return h ? `<rect x="${i * bw + 4}" y="${y}" width="${bw - 8}" height="${h}" rx="2" fill="${TYPE_COL[t]}"/>` : ''; }).join('');
    const n = Object.values(m).reduce((a, b) => a + b, 0);
    return `${bars}${n ? `<text x="${i * bw + bw / 2}" y="${y - 3}" text-anchor="middle" font-size="8" font-family="Space Mono,monospace" fill="var(--ink-3)">${n}</text>` : ''}
      <text x="${i * bw + bw / 2}" y="${H - 4}" text-anchor="middle" font-size="8" font-family="Space Mono,monospace" fill="var(--ink-3)">${MONTHS[i].slice(0, 1)}</text>`;
  }).join('')}</svg>`;
}

      ${S.top.length ? `<section class="dt-sec"><div class="dt-h"><span>${tl('highest rated')}</span>${S.avg ? `<em>${tl('average {n}★', { n: S.avg.toFixed(1) })}</em>` : ''}</div>
        <div class="sg-row">${S.top.map(e => `<div class="sg-card" data-st-open="${e.id}"><span class="sg-cover">${e.cover ? `<img src="${esc(e.cover)}" loading="lazy" alt="" data-ph="${esc(TYPES[e.type].icon)}" onerror="imgFb(this)">` : `<span class="ph">${TYPES[e.type].icon}</span>`}</span><b>${esc(e.title)}</b><em>${e.rating}★</em></div>`).join('')}</div></section>` : ''}

      ${S.genres.length ? `<section class="dt-sec"><div class="dt-h"><span>${tl('genres')}</span></div>
        ${S.genres.map(([g, n]) => `<div class="mn-lim" style="padding-left:0"><span>${esc(g)}</span><div class="mn-bar thin"><i style="width:${n / gmax * 100}%"></i></div><em>${n}</em></div>`).join('')}</section>` : ''}

      <section class="dt-sec"><div class="dt-h"><span>${tl('little facts')}</span></div>
        <div class="st-facts">
          ${S.days ? `<div><b>${S.days}</b><span>${tl('days with progress')}</span></div>` : ''}
          ${S.streak > 1 ? `<div><b>${S.streak}</b><span>${tl('days in a row, best run')}</span></div>` : ''}
          ${S.pages ? `<div><b>${fmtNum(S.pages)}</b><span>${tl('pages read')}</span></div>` : ''}
          ${S.eps ? `<div><b>${fmtNum(S.eps)}</b><span>${tl('episodes watched')}</span></div>` : ''}
          ${S.busiest >= 0 && year !== 'all' ? `<div><b>${MONTHS[S.busiest]}</b><span>${tl('busiest month')}</span></div>` : ''}
          ${S.weekday >= 0 ? `<div><b>${DOW_LONG[S.weekday]}</b><span>${tl('favourite day')}</span></div>` : ''}

    </div>`);
  $$('[data-sy]').forEach(b => b.addEventListener('click', () => openStats(b.dataset.sy === 'all' ? 'all' : +b.dataset.sy)));

/* ---- upcoming episodes: air dates from tvmaze, refreshed once a day ---- */
async function refreshAirdates(force){
  const today = todayStr();
  if (!force && db.settings.airAt === today) return;
  const shows = db.media.filter(e => e.type === 'tv' && (e.status === 'active' || e.status === 'planned'));
  if (!shows.length) return;
  db.settings.airAt = today;
  let changed = false;
  for (const e of shows){
    try {
      // shows added by hand have no tvmaze link yet — find it by title (only a clear match)
      if (!e.tvmazeId){
        const s = await fetchJSON(`https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(e.title)}`).catch(() => null);
        if (!s?.id || titleScore(s.name, e.title) < 10 || (e.year && s.premiered && Math.abs(+yearOf(s.premiered) - +e.year) > 1)) continue;
        e.tvmazeId = s.id;
      }
      const fresh = await fetchSeasons(e.tvmazeId);
      // keep what was watched; new episodes / seasons simply appear
      fresh.forEach(s => { const old = e.seasons.find(x => x.n === s.n); if (old) s.episodes.forEach(ep => { const o = old.episodes.find(x => x.n === ep.n); if (o) ep.watched = o.watched; }); });
      e.seasons = fresh; changed = true;
    } catch(_){}
  }
  save();
  if (changed && (ui.view === 'calendar' || ui.view === 'home')) render();
}
function upcomingEpisodes(fromDs, days = 60){
  const end = dateStr(addDays(parseDate(fromDs), days)), out = [];
  db.media.filter(e => e.type === 'tv' && e.status !== 'dropped').forEach(e => (e.seasons || []).forEach(s => s.episodes.forEach(ep => {
    if (ep.air && ep.air >= fromDs && ep.air <= end && !ep.watched) out.push({ e, s: s.n, ep, d: ep.air });
  })));
  return out.sort((a, b) => a.d.localeCompare(b.d) || a.e.title.localeCompare(b.e.title));
}

/* ---- review card: a png made from the entry (cover, score, your words) ---- */
async function coverBitmap(url){
  try {
    const kept = coverURLs.get(url);
    const blob = kept ? await (await fetch(kept)).blob() : await fetchImageBlob(url);
    return blob ? await createImageBitmap(blob) : null;
  } catch(_){ return null; }
}
function wrapLines(g, text, maxW, maxLines){
  const words = String(text).split(/\s+/), lines = []; let cur = '';
  words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur);
  if (lines.length > maxLines){ lines.length = maxLines; lines[maxLines - 1] = lines[maxLines - 1].replace(/\s*\S*$/, '') + '…'; }
  return lines;
}
function drawStar(g, cx, cy, r, fill){
  g.beginPath();
  for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
  g.closePath();
  if (fill === 1){ g.fill(); } else if (fill === .5){ g.save(); g.clip(); g.fillRect(cx - r, cy - r, r, r * 2); g.restore(); g.stroke(); } else g.stroke();
}
async function makeReviewCard(e){
  await document.fonts?.ready;
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const css = getComputedStyle(document.documentElement), v = k => css.getPropertyValue(k).trim();
  const bg = v('--bg') || '#EDE4CF', ink = v('--ink') || '#1C1610', ink3 = v('--ink-3') || '#7A6F60', acc = v('--accent') || '#DE5426';
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // paper dots
  g.fillStyle = v('--dot') || 'rgba(0,0,0,.08)';
  for (let y = 30; y < H; y += 44) for (let x = 30; x < W; x += 44){ g.beginPath(); g.arc(x, y, 2, 0, 7); g.fill(); }
  g.fillStyle = ink; g.font = "700 46px Fraunces, Georgia, serif"; g.textBaseline = 'alphabetic';
  g.fillText('mood', 70, 110); g.fillStyle = acc; g.beginPath(); g.arc(70 + g.measureText('mood').width + 12, 102, 8, 0, 7); g.fill();
  g.fillStyle = ink3; g.font = "400 26px 'Space Mono', monospace"; g.textAlign = 'right';
  g.fillText(`${TYPES[e.type].label.toUpperCase()}${e.year ? ' · ' + e.year : ''}`, W - 70, 106); g.textAlign = 'left';
  // cover with a soft shadow
  const cw = 440, ch = 660, cx = (W - cw) / 2, cy = 170;
  const bmp = e.cover ? await coverBitmap(e.cover) : null;
  g.save(); g.shadowColor = 'rgba(0,0,0,.28)'; g.shadowBlur = 40; g.shadowOffsetY = 18;
  g.fillStyle = e.color || acc; g.fillRect(cx, cy, cw, ch); g.restore();
  if (bmp){
    const s = Math.max(cw / bmp.width, ch / bmp.height), dw = bmp.width * s, dh = bmp.height * s;
    g.save(); g.beginPath(); g.rect(cx, cy, cw, ch); g.clip(); g.drawImage(bmp, cx + (cw - dw) / 2, cy + (ch - dh) / 2, dw, dh); g.restore();
  } else { g.fillStyle = 'rgba(255,255,255,.85)'; g.font = "700 44px Fraunces, Georgia, serif"; g.textAlign = 'center'; wrapLines(g, e.title, cw - 60, 4).forEach((l, i) => g.fillText(l, W / 2, cy + 280 + i * 54)); g.textAlign = 'left'; }
  // title, creator, stars, date, words
  let y = cy + ch + 90;
  g.fillStyle = ink; g.textAlign = 'center'; g.font = "700 60px Fraunces, Georgia, serif";
  wrapLines(g, e.title, W - 140, 2).forEach(l => { g.fillText(l, W / 2, y); y += 68; });
  if (e.creator){ g.fillStyle = ink3; g.font = "400 28px 'Space Mono', monospace"; g.fillText(e.creator, W / 2, y - 10); y += 36; }
  if (e.rating){
    g.fillStyle = acc; g.strokeStyle = acc; g.lineWidth = 3;
    for (let i = 0; i < 5; i++) drawStar(g, W / 2 - 128 + i * 64, y + 18, 26, e.rating >= i + 1 ? 1 : e.rating >= i + .5 ? .5 : 0);
    y += 76;
  }
  const when = e.endDate ? tl('finished {date}', { date: fmtNice(e.endDate) }) : e.status === 'active' ? tl('in progress') : '';
  if (when){ g.fillStyle = ink3; g.font = "400 24px 'Space Mono', monospace"; g.fillText(when.toUpperCase(), W / 2, y); y += 50; }
  const words = (e.notes || '').trim();
  if (words){
    g.fillStyle = ink; g.font = "italic 400 34px Fraunces, Georgia, serif";
    wrapLines(g, '“' + words + '”', W - 180, Math.max(1, Math.floor((H - 60 - y) / 46))).forEach(l => { g.fillText(l, W / 2, y); y += 46; });
  }
  g.textAlign = 'left';
  return c;
}

/* ---- share codes: compressed, and shown as a qr the other phone's camera can read ---- */
async function packCode(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  try {
    const z = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
    let s = ''; z.forEach(b => s += String.fromCharCode(b));
    return 'MOOD-ACCOUNT-Z:' + btoa(s);
  } catch(_){ return 'MOOD-ACCOUNT:' + btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
}
async function unpackCode(text){
  const z = String(text).match(/MOOD-ACCOUNT-Z:([A-Za-z0-9+/=]+)/);
  if (z){
    const bin = atob(z[1]), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()));
  }
  const m = String(text).match(/MOOD-ACCOUNT:([A-Za-z0-9+/=]+)/);
  if (m) return JSON.parse(decodeURIComponent(escape(atob(m[1]))));
  throw new Error(tl('no share code in that text'));
}
function qrSVG(text){
  if (typeof qrcode !== 'function') return null;
  try { const q = qrcode(0, 'L'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); }
  catch(_){ return null; }   // too long for one qr
}

/* ============ sync — your own github account, encrypted with your own passphrase ============
   the journal goes to a secret gist in YOUR github account, sealed with AES-GCM using a key
   made from your passphrase (PBKDF2) — github only ever stores scrambled bytes. every device
   merges three ways: what it last synced (the base), what it has now, and what github has now —
   so a film added on the phone and a book added on the pc both survive, and something deleted
   on one side stays deleted. token, passphrase and gist id never leave this device. */
const SYNC_LS = 'mood.sync.v1';
const SYNC_FILE = 'mood-journal.enc';
const syncCfg = () => { try { return JSON.parse(localStorage.getItem(SYNC_LS) || 'null'); } catch(_){ return null; } };
const setSyncCfg = c => { try { if (c) localStorage.setItem(SYNC_LS, JSON.stringify(c)); else localStorage.removeItem(SYNC_LS); } catch(_){} };
const syncOn = () => { const c = syncCfg(); return !!(c && c.token && c.pass); };

/* ---- sealing: gzip → AES-GCM (key from passphrase via PBKDF2) → base64 ---- */
const b64e = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const keyCache = new Map();
async function passKey(pass, salt){
  const id = pass + '|' + b64e(salt);
  if (keyCache.has(id)) return keyCache.get(id);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 210000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  keyCache.set(id, k); return k;
}
async function seal(obj, pass, salt){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  const zipped = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
  salt = salt || crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await passKey(pass, salt), zipped));
  return JSON.stringify({ app: 'mood', v: 1, salt: b64e(salt), iv: b64e(iv), data: b64e(ct) });
}
async function unseal(text, pass){
  const o = JSON.parse(text);
  if (o.app !== 'mood') throw new Error(tl('that gist isn\'t a mood journal'));
  let plain;
  try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(o.iv) }, await passKey(pass, b64d(o.salt)), b64d(o.data)); }
  catch(_){ throw new Error(tl('wrong passphrase — use the same one as on your other device')); }
  const txt = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return { db: JSON.parse(txt), salt: b64d(o.salt) };
}

/* ---- github gist ---- */
// github's reply → a readable error. rate limits (403/429) carry when to try again
async function ghFail(r){
  let msg = '';
  try { msg = (await r.clone().json()).message || ''; } catch(_){}
  const ra = +(r.headers.get('retry-after') || 0), reset = +(r.headers.get('x-ratelimit-reset') || 0);
  if (r.status === 429 || (r.status === 403 && (/rate limit|abuse/i.test(msg) || r.headers.get('x-ratelimit-remaining') === '0'))){
    const wait = Math.max(60e3, ra ? ra * 1000 : reset ? reset * 1000 - Date.now() : 10 * 60e3);
    const e = new Error(tl('github asks to slow down — sync tries again in {m} min', { m: Math.ceil(wait / 60000) }));
    e.retryAt = Date.now() + wait; return e;
  }
  if (r.status === 403 && /not accessible|permission|forbidden/i.test(msg)) return new Error(tl('this token can\'t save gists — make a new one with the button (a classic token with "gist" ticked)'));
  if (r.status === 422 && /too large|size/i.test(msg)) return new Error(tl('the journal is too big for one gist — tell can'));
  return new Error('github ' + r.status + (msg ? ' — ' + msg : ''));
}
async function gh(cfg, path, opt = {}){
  const r = await fetch('https://api.github.com' + path, { ...opt, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json', ...(opt.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (r.status === 401) throw new Error(tl('github didn\'t accept the token — make a new one'));
  return r;
}
async function findGist(cfg){
  for (let page = 1; page <= 5; page++){
    const r = await gh(cfg, `/gists?per_page=100&page=${page}`);
    if (!r.ok) throw await ghFail(r);
    const list = await r.json();
    const hit = list.find(g => g.files && g.files[SYNC_FILE]);
    if (hit) return hit.id;
    if (list.length < 100) break;
  }
  return null;
}
async function readGist(cfg){
  const r = await gh(cfg, `/gists/${cfg.gistId}`);
  if (r.status === 404) return null;
  if (!r.ok) throw await ghFail(r);
  const f = (await r.json()).files?.[SYNC_FILE];
  if (!f) return null;
  return f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content;
}
async function writeGist(cfg, content){
  const body = JSON.stringify({ description: 'mood sync — encrypted, only your mood app can read it', files: { [SYNC_FILE]: { content } } });
  const r = cfg.gistId ? await gh(cfg, `/gists/${cfg.gistId}`, { method: 'PATCH', body }) : await gh(cfg, '/gists', { method: 'POST', body: JSON.stringify({ ...JSON.parse(body), public: false }) });
  if (!r.ok) throw await ghFail(r);
  if (!cfg.gistId){ cfg.gistId = (await r.json()).id; setSyncCfg(cfg); }
  cfg.lastPush = Date.now(); setSyncCfg(cfg);
}

/* ---- three-way merge ---- */
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function merge3(base, local, remote, localNewer){
  if (same(local, remote)) return local;
  if (base !== undefined && same(base, local)) return remote;
  if (base !== undefined && same(base, remote)) return local;
  if (isObj(local) && isObj(remote)){
    const out = {};
    new Set([...Object.keys(local), ...Object.keys(remote)]).forEach(k => {
      const b = isObj(base) ? base[k] : undefined, l = local[k], r = remote[k];
      if (!(k in local)){ if (b !== undefined && same(b, r)) return; out[k] = r; return; }     // deleted here, untouched there → gone
      if (!(k in remote)){ if (b !== undefined && same(b, l)) return; out[k] = l; return; }
      out[k] = merge3(b, l, r, localNewer);
    });
    return out;
  }
  const withIds = a => Array.isArray(a) && a.every(x => isObj(x) && x.id != null);
  if (withIds(local) && withIds(remote)){
    // records (entries, habits, accounts, meals…) merge one by one, matched by id
    const bm = new Map((withIds(base) ? base : []).map(x => [x.id, x]));
    const lm = new Map(local.map(x => [x.id, x])), rm = new Map(remote.map(x => [x.id, x]));
    const out = [];
    [...local.map(x => x.id), ...remote.map(x => x.id).filter(id => !lm.has(id))].forEach(id => {
      const b = bm.get(id), l = lm.get(id), r = rm.get(id);
      if (!l){ if (b && same(b, r)) return; out.push(r); return; }
      if (!r){ if (b && same(b, l)) return; out.push(l); return; }
      out.push(merge3(b, l, r, localNewer));
    });
    return out;
  }
  const flat = a => Array.isArray(a) && a.every(x => x === null || typeof x !== 'object');
  if (flat(local) && flat(remote)){
    // plain lists (the queue's ids, a list's items): keep both sides' additions, drop what either side removed
    const b = new Set(flat(base) ? base : []);
    return [...new Set([...local, ...remote])].filter(x => !(b.has(x) && (!local.includes(x) || !remote.includes(x))));
  }
  return localNewer ? local : remote;      // a value changed on both sides: the newer journal wins
}

/* ---- the sync itself ---- */
let syncing = false, syncAgain = false, syncTimer = 0, syncWriting = false;
async function syncBaseGet(){ const d = await journalStore(); if (!d) return null; return new Promise(res => { try { const q = d.transaction('kv').objectStore('kv').get('syncBase'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch(_){ res(null); } }); }
async function syncBaseSet(json){ const d = await journalStore(); if (!d) return; await new Promise(res => { try { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(json, 'syncBase'); tx.oncomplete = res; tx.onerror = res; } catch(_){ res(); } }); }
async function syncNow(reason){
  const cfg = syncCfg(); if (!cfg?.token || !cfg?.pass) return false;
  if (syncing){ syncAgain = true; return false; }
  if (!navigator.onLine && reason !== 'manual') return false;
  if (cfg.retryAt && cfg.retryAt > Date.now()){ if (reason === 'manual') toast(cfg.err || tl('syncing…')); syncSoon(cfg.retryAt - Date.now() + 2000); return false; }
  syncing = true; refreshSyncUI();
  try {
    await storeReady;
    if (!cfg.gistId){ cfg.gistId = await findGist(cfg); setSyncCfg(cfg); }
    const remoteText = cfg.gistId ? await readGist(cfg) : null;
    const remote = remoteText ? await unseal(remoteText, cfg.pass) : null;
    const baseJson = await syncBaseGet();
    const base = baseJson ? JSON.parse(baseJson) : undefined;
    const local = JSON.parse(JSON.stringify(db));
    const merged = remote ? merge3(base, local, remote.db, (local.savedAt || 0) >= (remote.db.savedAt || 0)) : local;
    let changedHere = false;
    if (!same(merged, local)){
      db = hydrate(merged); changedHere = true;
      syncWriting = true; await writeJournal(false); syncWriting = false;
      try { applyTheme(); applyTabs(); render(); } catch(_){}
    }
    if (!remote || !same(merged, remote.db)){
      if (!cfg.gistId) toast(tl('first sync — making your private copy on github…'));
      await writeGist(cfg, await seal(JSON.parse(JSON.stringify(db)), cfg.pass, remote?.salt));
    }
    await syncBaseSet(JSON.stringify(db));
    cfg.lastSync = Date.now(); cfg.err = ''; delete cfg.retryAt; setSyncCfg(cfg);
    if (changedHere && reason !== 'start') toast(tl('synced — changes from your other device are in') + ' ✓');
    publishProfile(); loadFriends();
    return true;
  } catch(e){
    syncWriting = false;
    const c2 = { ...(syncCfg() || cfg), err: e.message || String(e) };
    if (e.retryAt){ c2.retryAt = e.retryAt; syncSoon(e.retryAt - Date.now() + 2000); }      // github said wait — try again by itself
    setSyncCfg(c2);
    if (reason === 'manual' || reason === 'connect') toast('⚠ ' + c2.err);
    return false;
  } finally {
    syncing = false; refreshSyncUI();
    if (syncAgain){ syncAgain = false; syncSoon(1500); }
  }
}
// changes are gathered for 20 s and sent at most once a minute — github limits how often content can be written
function syncSoon(ms = 20000){
  if (!syncOn() || syncWriting) return;
  const c = syncCfg();
  const gap = c?.lastPush ? c.lastPush + 60e3 - Date.now() : 0;
  clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow('change'), Math.max(ms, gap));
}

const PROFILE_FILE = 'mood-profile.json';

/* ---- my profile ---- */
function buildProfile(){
  const S = shareCfg();
  const items = db.media
    .map(e => ({ t: e.type, title: e.title, y: e.year || '', r: e.rating || 0, s: e.status, d: e.endDate || e.startDate || e.addedAt || '',
      ...(S.notes && e.notes?.trim() ? { n: e.notes.trim().slice(0, 160) } : {}), ...(e.cover && /^https:/.test(e.cover) ? { c: e.cover } : {}) }))
    .sort((a, b) => (b.d || '').localeCompare(a.d || ''));

let publishing = false;
async function publishProfile(force){
  const S = shareCfg(), cfg = syncCfg();
  if (!S.on || !cfg?.token || publishing) return;
  const prof = buildProfile(), json = JSON.stringify({ ...prof, updated: '' });
  const h = hashStr(json);
  if (!force && S.lastHash === h && S.gistId) return;
  if (!force && S.pubAt && Date.now() - S.pubAt < 10 * 60e3) return;      // ratings change a lot; friends don't need every one live
  publishing = true;
  try {
    const body = { description: 'mood profile — titles and ratings shared with friends', files: { [PROFILE_FILE]: { content: JSON.stringify(prof) } } };
    if (!S.gistId){

      : await gh(cfg, '/gists', { method: 'POST', body: JSON.stringify({ ...body, public: false }) });
    if (r.status === 404 && S.gistId){ delete S.gistId; publishing = false; return publishProfile(true); }
    if (!r.ok) throw await ghFail(r);
    if (!S.gistId) S.gistId = (await r.json()).id;
