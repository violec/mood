        <button class="lf-view" id="lib-stats" aria-label="${tl('stats')}">${ICONS.chart}</button>
        <button class="lf-view" id="lib-view" aria-label="${db.settings.libView === 'list' ? 'show as grid' : 'show as list'}">${db.settings.libView === 'list' ? ICONS.grid : ICONS.list}</button>
      </div>
    </div>
    <div id="lib-grid" data-sec="shelf" data-sec-label="your shelf"></div>
    </div>`;
  $$('.lf-seg [data-ft]').forEach(c => c.addEventListener('click', () => { ui.filterType = c.dataset.ft; renderLibrary(); }));
  $('#lib-status').addEventListener('change', ev => { ui.filterStatus = ev.target.value; renderLibrary(); });
  $('#lib-sort').addEventListener('change', ev => { ui.sort = ev.target.value; renderLibGrid(); });
  $('#lib-stats').addEventListener('click', () => openStats());
  $('#lib-view').addEventListener('click', () => { db.settings.libView = db.settings.libView === 'list' ? 'grid' : 'list'; save(); renderLibrary(); });
  $('#lib-search').addEventListener('input', debounce(ev => { ui.search = ev.target.value; renderLibGrid(); }, 160));
  renderLibGrid();
}

function renderLibGrid(){
  const box = $('#lib-grid'); if (!box) return;
  let list = db.media.slice();
  if (ui.filterType !== 'all') list = list.filter(e => e.type === ui.filterType);
  if (ui.filterStatus !== 'all') list = list.filter(e => e.status === ui.filterStatus);
  if (ui.search.trim()){
    const q = ui.search.trim().toLowerCase();
    list = list.filter(e => (e.title + ' ' + e.creator + ' ' + e.notes).toLowerCase().includes(q));
  }
  const sorters = {
    added: (a,b) => (b.addedAt||'').localeCompare(a.addedAt||''),
    title: (a,b) => a.title.localeCompare(b.title),
    start: (a,b) => (b.startDate||'0').localeCompare(a.startDate||'0'),
    rating: (a,b) => (b.rating||0) - (a.rating||0),
  };
  list.sort(sorters[ui.sort] || sorters.added);
  const noCover = db.media.filter(e => !e.cover).length;

  if (!list.length){
    box.innerHTML = `<div class="empty-state">
      <span class="hand">${tl('nothing on this page yet…')}</span>
      <span class="mono">${tl('press [ + log ] to start the collection')}</span>
    </div>`;
    return;
  }
  const sel = ui.libSel;
  const bar = sel ? `<div class="lib-bar sel"><b>${tl('{n} selected', { n: sel.size })}</b>
      <button class="dt-link" id="ls-all">${tl(list.every(e => sel.has(e.id)) ? 'none' : 'all {n} shown', { n: list.length })}</button>
      <button class="dt-link" id="ls-done">${tl('done')}</button></div>`
    : `<div class="lib-bar"><span>${tl(list.length === 1 ? '{n} entry' : '{n} entries', { n: list.length })}</span><button class="dt-link" id="ls-start">${ICONS.check} ${tl('select')}</button></div>`;
  box.innerHTML = bar + (noCover && !sel ? `<button class="cover-hunt" id="lib-covers">${ICONS.search}<span>${tl(noCover === 1 ? '{n} entry has no cover —' : '{n} entries have no cover —', { n: noCover })} <b>${tl('find covers')}</b></span></button>` : '')
    + (db.settings.libView === 'list'
      ? `<div class="lib-list">${list.map(e => {
          const t = TYPES[e.type], p = progressOf(e);
          return `
          <button class="ll-row" data-id="${e.id}">
            <span class="ll-cover">${e.cover ? `<img src="${esc(e.cover)}" loading="lazy" alt="" data-ph="${esc(t.icon)}" onerror="imgFb(this)">` : `<span class="ph">${t.icon}</span>`}</span>
            <span class="ll-main">
              <span class="ll-t">${esc(e.title)}</span>
              <span class="ll-s">${t.icon}<span>${[t.label, e.year, e.creator].filter(Boolean).map(esc).join(' · ')}</span></span>
              ${p !== null && e.status !== 'done' ? `<span class="ll-prog"><i style="width:${Math.round(p*100)}%"></i></span>` : ''}
            </span>
            <span class="ll-side">
              <span class="st-pill ${e.status}">${STATUS[e.status].icon}</span>
              ${e.rating ? `<span class="ll-rate">${ICONS.star}${e.rating.toFixed(1)}</span>` : ''}
            </span>
          </button>`;
        }).join('')}</div>`
      : `<div class="lib-grid">${list.map(e => {
    const t = TYPES[e.type], p = progressOf(e);
    return `
    <div class="media-card" data-id="${e.id}">
      <div class="tape"></div>
      <span class="sig-badge ${e.status}" title="${STATUS[e.status].label}" aria-label="${STATUS[e.status].label}">${STATUS[e.status].icon}</span>
      <div class="cover">
        ${(() => {
          const ph = `<span class="init">${esc((e.title[0]||'?').toUpperCase())}</span>${t.icon}`;
          return e.cover
            ? `<img src="${esc(e.cover)}" loading="lazy" alt="" data-ph="${esc(ph)}" onerror="imgFb(this)">`
            : `<div class="ph">${ph}</div>`;
        })()}
      </div>
      <div class="meta">
        ${p !== null ? `<div class="prog" title="${Math.round(p*100)}%"><i style="width:${Math.round(p*100)}%"></i></div>` : `<div class="prog empty"></div>`}
        <div class="t">${esc(e.title)}</div>
        <div class="mini-stars ${e.rating ? '' : 'empty'}">${e.rating ? starsHTML(e.rating, 11) : ''}</div>
        <div class="y">${t.icon} ${esc(e.year || '')}</div>
      </div>
    </div>`;
  }).join('')}</div>`);
  // in select mode a tap ticks; a long press anywhere starts select mode
  $$('#lib-grid .media-card, #lib-grid .ll-row').forEach(c => {
    if (sel && sel.has(c.dataset.id)) c.classList.add('picked');
    let hold = 0, held = false;
    c.addEventListener('pointerdown', () => { held = false; hold = setTimeout(() => { held = true; haptic('tap'); ui.libSel = ui.libSel || new Set(); ui.libSel.add(c.dataset.id); renderLibGrid(); }, 480); });
    ['pointerup', 'pointerleave', 'pointercancel', 'pointermove'].forEach(ev => c.addEventListener(ev, e => { if (ev === 'pointermove' && Math.abs(e.movementY) + Math.abs(e.movementX) < 4) return; clearTimeout(hold); }));
    c.addEventListener('contextmenu', ev => ev.preventDefault());
    c.addEventListener('click', () => {
      if (held){ held = false; return; }
      if (!ui.libSel){ openDetail(c.dataset.id); return; }
      const id = c.dataset.id; ui.libSel.has(id) ? ui.libSel.delete(id) : ui.libSel.add(id);
      c.classList.toggle('picked', ui.libSel.has(id)); updateSelBar();
      const b = $('#lib-grid .lib-bar b'); if (b) b.textContent = tl('{n} selected', { n: ui.libSel.size });
    });
  });
  $('#lib-covers')?.addEventListener('click', repairLibrary);
  $('#ls-start')?.addEventListener('click', () => { ui.libSel = new Set(); renderLibGrid(); });
  $('#ls-done')?.addEventListener('click', () => { ui.libSel = null; renderLibGrid(); });
  $('#ls-all')?.addEventListener('click', () => { const all = list.every(e => sel.has(e.id)); list.forEach(e => all ? sel.delete(e.id) : sel.add(e.id)); renderLibGrid(); });
  updateSelBar();
}

// the action bar under a selection: delete, or set a status, for all of them at once
function updateSelBar(){
  let b = $('#sel-actions');
  const sel = ui.view === 'library' ? ui.libSel : null;
  if (!sel){ b?.remove(); return; }
  if (!b){ b = document.createElement('div'); b.id = 'sel-actions'; b.className = 'sel-actions'; document.body.appendChild(b); }
  const n = sel.size;
  b.innerHTML = `<button class="btn danger" id="sa-del" ${n ? '' : 'disabled'}>${ICONS.trash} ${tl('delete {n}', { n })}</button>
    <button class="btn" id="sa-st" ${n ? '' : 'disabled'}>${ICONS.edit} ${tl('status')}</button>`;
  $('#sa-del').onclick = async () => {
    if (!await askConfirm(tl(n === 1 ? 'Delete 1 entry?' : 'Delete {n} entries?', { n }), { detail: tl('their progress, ratings and notes go too. you can undo right after.'), ok: tl('delete'), danger: true })) return;
    const before = { media: db.media.slice(), queue: db.queue.slice(), lists: db.lists.map(l => ({ ...l, items: l.items.slice() })) };
    db.media = db.media.filter(e => !sel.has(e.id));
    db.queue = db.queue.filter(id => !sel.has(id));
    db.lists.forEach(l => l.items = l.items.filter(id => !sel.has(id)));
    ui.libSel = null; save(); render();
    toast(tl('{n} deleted', { n }), { undo: () => { db.media = before.media; db.queue = before.queue; db.lists = before.lists; save(); render(); } });
  };
  $('#sa-st').onclick = () => openSheet(tl('Set status for {n}', { n }), Object.entries(STATUS).map(([k, st]) => ({ label: st.label, icon: st.icon, fn: () => {
    db.media.forEach(e => { if (!sel.has(e.id)) return;
      e.status = k;
      if (k === 'done' && !e.endDate) e.endDate = todayStr();
      if (k === 'active' && !e.startDate) e.startDate = todayStr();
      syncQueueWithStatus(e); });
    ui.libSel = null; save(); render(); toast(tl('{n} updated', { n }) + ' ✓');
  } })));
}

/* ============ entry detail ============ */
const openSeasonsMem = new Set();
function openDetail(id){
  const e = db.media.find(x => x.id === id);
  if (!e) return;
  const t = TYPES[e.type];
  const p = progressOf(e);
  const st = e.status;
  const act = activityOf(e);
  const days = Object.keys(act).sort().reverse();
  const activeDays = days.filter(d => act[d].some(x => !['start', 'finish', 'drop'].includes(x.kind))).length;
  const eta = st === 'done' ? null : fmtDur(estimateMin(e));
  const shortDate = s => { if (!s) return '—'; const d = parseDate(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}${d.getFullYear() !== new Date().getFullYear() ? ' ’' + String(d.getFullYear()).slice(2) : ''}`; };
  const sec = (title, extra = '') => `<div class="dt-h"><span>${title}</span>${extra}</div>`;

  // status-aware actions: one primary, one secondary, then the always-there trio
  const primary =
    st === 'planned' ? `<button class="btn primary" id="d-start-today">${ICONS.stActive} ${tl('start today')}</button>` :
    st === 'active'  ? `<button class="btn primary" id="d-progress">${ICONS.edit} ${tl('update progress')}</button>` :
                       `<button class="btn" id="d-reopen">${ICONS.undo} ${tl('back in progress')}</button>`;
  const secondary =
    st === 'planned' ? (inQueue(e.id) ? `<button class="btn" disabled>${ICONS.queue} ${tl('in queue')}</button>` : `<button class="btn" id="d-queue">${ICONS.queue} ${tl('add to queue')}</button>`) :
    st === 'active'  ? `<button class="btn" id="d-finish-today">${ICONS.stDone} ${tl('finish today')}</button>` : '';

  openModal(`
  <div class="dt">
    <div class="dt-hero">
      <div class="dt-cover" id="d-cover" role="button" title="${tl('choose another cover')}">${e.cover ? `<img src="${esc(e.cover)}" data-ph="${esc(t.icon)}" onerror="imgFb(this)">` : `<div class="ph">${t.icon}</div>`}</div>
      <div class="dt-id">
        <div class="dt-kicker">${t.icon}<span>${t.label}${e.year ? ' · ' + esc(e.year) : ''}</span></div>
        <div class="dt-name"><h2 class="${e.title.length > 24 ? 'long' : ''}">${esc(e.title)}</h2>
        ${e.creator ? `<div class="dt-by">${tl('by {name}', { name: esc(e.creator) })}</div>` : ''}</div>
        <span class="st-pill ${st}">${STATUS[st].icon}${STATUS[st].label}</span>
      </div>
    </div>

    <div class="dt-facts">
      <div><span class="k">${tl('started')}</span><b>${shortDate(e.startDate)}</b></div>
      <div><span class="k">${tl(st === 'dropped' ? 'dropped' : 'finished')}</span><b>${shortDate(e.endDate)}</b></div>
      <div><span class="k">${tl('active days')}</span><b>${activeDays || '—'}</b></div>
    </div>

    <div class="dt-actions ${secondary ? '' : 'one'}">${primary}${secondary}</div>
    <div class="dt-actions three">
      <button class="btn ghost" id="d-list">${ICONS.queue} ${tl('lists')}</button>
      <button class="btn ghost" id="d-edit">${ICONS.edit} ${tl('edit')}</button>
      <button class="btn ghost" id="d-more">${ICONS.more} ${tl('more')}</button>
    </div>

    ${st !== 'planned' || p !== null ? `
    <section class="dt-sec">
      ${sec(tl('progress'), eta ? `<em>${tl('≈{t} left', { t: eta })}</em>` : '')}
      <button class="dt-prog" id="d-prog-bar" ${st === 'done' ? 'disabled' : ''}>
        <div class="bar"><i style="width:${Math.round((p || 0) * 100)}%"></i></div>
        <div class="dt-prog-row">
          <b>${p !== null ? progressLabel(e, p) : tl('not tracked yet')}</b>
          <span>${p !== null ? Math.round(p * 100) + '%' : st === 'done' ? '' : tl('tap to set')}</span>
        </div>
      </button>
      ${e.type === 'tv' ? `
        <div id="d-seasons">${seasonsHTML(e)}</div>
        ${e.tvmazeId ? `<button class="btn ghost dt-wide" id="d-refresh-eps">${ICONS.refresh} ${tl('refresh episode list')}</button>` : ''}` : ''}
    </section>` : ''}

    ${aboutHTML(e)}

    <section class="dt-sec">
      ${sec(tl('ratings'))}
      <div class="dt-rate"><span class="k">${tl('my score')}</span><span id="d-stars">${starsHTML(e.rating, 22, true)}</span><b>${e.rating ? e.rating.toFixed(1) : '—'}</b></div>
      <div class="dt-rate"><span class="k">${tl('audience')}</span>
        ${e.audScore
          ? `${starsHTML(e.audScore, 16)}<b>${e.audScore.toFixed(1)}</b>`
          : `<button class="dt-link" id="d-aud">${ICONS.search} ${tl('look up with gemini')}</button>`}
      </div>
      ${friendChipsHTML(e)}
    </section>

    <section class="dt-sec">
      ${sec(tl('activity'), days.length ? `<em>${tl(days.length === 1 ? '{n} day' : '{n} days', { n: days.length })}</em>` : '')}
      ${days.length ? `<div class="dt-log">${days.slice(0, 12).map(d => `
        <div class="dt-log-row"><span class="d">${shortDate(d)}</span><span class="dot" style="background:${e.color}"></span><span class="w">${activityLabel(act[d])}</span></div>`).join('')}
        ${days.length > 12 ? `<div class="dt-log-more">${tl('+ {n} earlier days', { n: days.length - 12 })}</div>` : ''}</div>`
      : `<div class="dt-empty">${tl('each progress update is saved here with its date')}</div>`}
    </section>

    <section class="dt-sec">
      ${sec(tl('notes'))}
      <div class="notes-view ${e.notes.trim() ? '' : 'empty'}" id="d-notes" role="button" tabindex="0">${e.notes.trim() ? esc(e.notes.trim()) : tl('tap to write your thoughts…')}</div>
    </section>
  </div>`);

  const reopen = () => openDetail(id);
  wireStars($('#d-stars .stars'), v => { e.rating = v; save(); reopen(); render(); });
  $('#d-aud')?.addEventListener('click', async () => {
    toast(tl('⌁ asking gemini for the general score…'));
    const v = await geminiAudScore(e);
    if (v){ e.audScore = v; save(); reopen(); toast(tl('audience ≈ {v}', { v: v.toFixed(1) })); }
    else toast(tl('⚠ no score found — is the gemini key set?'));
  });
  const edit = () => { openModal(entryFormHTML(e, false)); wireEntryForm(e, false); };
  $('#d-fix')?.addEventListener('click', () => openFixDetails(e));
  $('#d-like')?.addEventListener('click', () => openMoreLike(e));
  $$('[data-friend]').forEach(b => b.addEventListener('click', () => openFriendProfile(b.dataset.friend)));
  $('#d-syn')?.addEventListener('click', ev => ev.currentTarget.classList.toggle('open'));
  $('#d-edit').addEventListener('click', edit);
  $('#d-notes')?.addEventListener('click', edit);
  $('#d-queue')?.addEventListener('click', () => { db.queue.push(e.id); save(); reopen(); render(); toast(tl('added to queue · position ') + db.queue.length); });
  $('#d-list').addEventListener('click', () => openListPicker(e));
  $('#d-start-today')?.addEventListener('click', () => { e.startDate = e.startDate || todayStr(); e.status = 'active'; logActivity(e, 'start'); syncQueueWithStatus(e); save(); reopen(); render(); });
  $('#d-finish-today')?.addEventListener('click', () => { e.endDate = todayStr(); e.status = 'done'; logActivity(e, 'finish'); syncQueueWithStatus(e); save(); reopen(); render(); toast(tl('finished {title}', { title: e.title }) + ' ✓'); });
  $('#d-reopen')?.addEventListener('click', () => { e.status = 'active'; e.endDate = ''; save(); reopen(); render(); });
  const prog = () => openProgress(e, reopen);
  $('#d-progress')?.addEventListener('click', prog);
  $('#d-prog-bar')?.addEventListener('click', () => { if (st === 'done') return; if (st === 'planned'){ e.status = 'active'; e.startDate = e.startDate || todayStr(); logActivity(e, 'start'); syncQueueWithStatus(e); } prog(); });
  $('#d-cover')?.addEventListener('click', () => openCoverPicker(e));
  $('#d-more').addEventListener('click', () => openSheet(e.title, [
    ...(st === 'active' ? [{ label:tl('pause — back to up next'), icon:ICONS.stPlanned, fn:() => { e.status = 'planned'; db.queue = [e.id, ...db.queue.filter(x => x !== e.id)]; save(); render(); reopen(); } }] : []),
    ...(st !== 'dropped' ? [{ label:tl('drop it'), icon:ICONS.stDropped, fn:() => { e.status = 'dropped'; e.endDate = e.endDate || todayStr(); logActivity(e, 'drop'); syncQueueWithStatus(e); save(); render(); reopen(); } }] : []),
    { label:tl('edit details'), icon:ICONS.edit, fn: edit },
    { label:tl('choose another cover'), icon:ICONS.image || ICONS.search, fn: () => openCoverPicker(e) },
    { label:tl('fix details & cover'), icon:ICONS.refresh, fn: () => openFixDetails(e) },
    { label:tl('more like this'), icon:ICONS.spark, fn: () => openMoreLike(e) },
    { label:tl('share a review card'), icon:ICONS.share, fn: () => openReviewCard(e) },
    { label:tl('delete entry'), icon:ICONS.trash, danger:true, fn:() => openSheet(tl('Delete "{title}"? This can\'t be undone.', { title: e.title }), [
      { label:tl('yes, delete'), icon:ICONS.trash, danger:true, fn:() => {
        db.media = db.media.filter(x => x.id !== e.id);
        db.queue = db.queue.filter(x => x !== e.id);
        db.lists.forEach(l => l.items = l.items.filter(x => x !== e.id));
        save(); render(); toast(tl('entry deleted'));
      } },
    ]) },
  ]));
  $('#d-refresh-eps')?.addEventListener('click', async () => {
    toast(tl('refreshing episodes…'));
    try {
      const fresh = await fetchSeasons(e.tvmazeId);
      // preserve watched flags
      fresh.forEach(s => {
        const old = e.seasons.find(x => x.n === s.n);
        if (old) s.episodes.forEach(ep => { const o = old.episodes.find(x => x.n === ep.n); if (o) ep.watched = o.watched; });
      });
      e.seasons = fresh; save(); reopen();
      toast(tl('episode list updated'));
    } catch(_) { toast(tl('⚠ could not reach TVmaze')); }
  });
  wireSeasons(e, id);
}

const AI_TAG = () => `<i class="ai-tag" title="${tl('filled in by gemini — may be wrong')}">${ICONS.spark}${tl('AI estimate')}</i>`;
function aboutHTML(e){
  const g = e.genres || [], pl = e.platforms || [];
  const facts = [
    e.type === 'movie' && e.runtimeMin ? fmtDur(e.runtimeMin) : '',
    e.type === 'tv' && e.epMin ? tl('{n} min an episode', { n: e.epMin }) : '',
    e.type === 'book' && e.pagesTotal ? tl('{n} pages', { n: fmtNum(e.pagesTotal) }) : '',
    e.type === 'game' && e.playHours ? tl('≈{h}h to finish', { h: e.playHours }) : '',
    e.type === 'album' && e.tracks ? tl('{n} tracks', { n: e.tracks }) : '',
    e.type === 'album' && e.runtimeMin ? fmtDur(e.runtimeMin) : '',
  ].filter(Boolean);
  const aoty = e.type === 'album' ? `<a class="dt-link" href="${aotyUrl(e)}" target="_blank" rel="noopener" style="margin-top:8px">${ICONS.open || ICONS.search} ${tl('scores on albumoftheyear.org')}</a>` : '';
  if (!e.synopsis && !g.length && !pl.length) return `
    <section class="dt-sec"><div class="dt-h"><span>${tl('about')}</span></div>
      <button class="dt-link" id="d-fix">${ICONS.search} ${tl('find the description, genres and cover')}</button>${aoty}</section>`;
  return `
    <section class="dt-sec dt-about">
      <div class="dt-h"><span>${tl('about')}</span><button class="dt-link" id="d-fix">${ICONS.refresh} ${tl('fix')}</button></div>
      ${g.length ? `<div class="dt-tags">${g.map(x => `<span>${esc(x)}</span>`).join('')}${e.ai?.genres ? AI_TAG() : ''}</div>` : ''}
      ${e.synopsis ? `<p class="dt-syn" id="d-syn">${esc(e.synopsis)}</p>${e.ai?.synopsis ? AI_TAG() : ''}` : ''}
      ${pl.length || facts.length ? `<div class="dt-plat">${[...facts, ...pl].map(esc).join(' · ')}</div>` : ''}
      ${(e.src || []).length ? `<div class="dt-src">${tl('from {x}', { x: [...new Set(e.src)].map(x => SRC[x] || x).join(', ') })}</div>` : ''}
      <button class="dt-link" id="d-like" style="margin-top:8px">${ICONS.spark} ${tl('more like this')}</button>${aoty}
    </section>`;
}

function seasonsHTML(e){
  if (!e.seasons.length) return `<div class="mono muted small" style="padding:6px 0 12px">${tl('no episode data — use refresh below')}${e.tvmazeId ? '' : ' ' + tl('(entry has no TVmaze link; re-add via search to track episodes)')}</div>`;
  return e.seasons.map((s, si) => {
    const w = s.episodes.filter(x => x.watched).length, n = s.episodes.length;
    const open = openSeasonsMem.has(e.id + ':' + s.n);
    return `
    <div class="season ${open ? 'open' : ''}" data-si="${si}">
      <div class="season-head">
        <span class="caret">${ICONS.right}</span> <span>S${pad2(s.n)}</span>
        <div class="mini-gauge"><i style="width:${n ? Math.round(w/n*100) : 0}%"></i></div>
        <span class="cnt">${w}/${n}</span>
      </div>
      <div class="season-eps">
        <div class="season-actions">
          <button class="btn ghost small" data-act="all" data-si="${si}">${ICONS.check} ${tl('mark season')}</button>
          <button class="btn ghost small" data-act="none" data-si="${si}">${ICONS.undo} ${tl('clear season')}</button>
        </div>
        ${s.episodes.map((ep, ei) => `
          <div class="ep ${ep.watched ? 'watched' : ''}" data-si="${si}" data-ei="${ei}">
            <span class="box"></span><span class="num">E${pad2(ep.n)}</span><span class="name">${esc(ep.name)}</span>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function wireSeasons(e, id){
  const box = $('#d-seasons'); if (!box) return;
  $$('.season-head', box).forEach(h => h.addEventListener('click', () => {
    const s = e.seasons[+h.parentElement.dataset.si];
    const k = e.id + ':' + s.n;
    openSeasonsMem.has(k) ? openSeasonsMem.delete(k) : openSeasonsMem.add(k);
    h.parentElement.classList.toggle('open');
  }));
  $$('.ep', box).forEach(el => el.addEventListener('click', () => {
    const ep = e.seasons[+el.dataset.si].episodes[+el.dataset.ei];
    ep.watched = !ep.watched;
    logActivity(e, 'eps', ep.watched ? 1 : -1);
    save(); openDetail(id);
  }));
  $$('[data-act]', box).forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation();
    const s = e.seasons[+b.dataset.si];
    const before = s.episodes.filter(ep => ep.watched).length;
    s.episodes.forEach(ep => ep.watched = b.dataset.act === 'all');
    logActivity(e, 'eps', s.episodes.filter(ep => ep.watched).length - before);
    save(); openDetail(id);
  }));
}
/* ============ media calendar ============ */
function monthHeadHTML(y, m, prefix){
  return `
  <div class="month-head">
    <div class="month-title"><span class="m">${MONTHS[m]}</span><span class="y">’${String(y).slice(2)}</span></div>
    <div class="nav-keys">
      <button class="key icon-only" id="${prefix}-prev">${ICONS.left}</button>
      <button class="key" id="${prefix}-today">${tl('today')}</button>
      <button class="key icon-only" id="${prefix}-next">${ICONS.right}</button>
    </div>
  </div>`;
}
function wireMonthNav(prefix, st, rerender){
  $(`#${prefix}-prev`).addEventListener('click', () => { st.m--; if (st.m < 0){ st.m = 11; st.y--; } rerender(); });
  $(`#${prefix}-next`).addEventListener('click', () => { st.m++; if (st.m > 11){ st.m = 0; st.y++; } rerender(); });
  $(`#${prefix}-today`).addEventListener('click', () => { const n = new Date(); st.y = n.getFullYear(); st.m = n.getMonth(); rerender(); });
}

// entries visible on calendar: have a startDate; range = start → (end | today if active | start)
function calRange(e){
  if (!e.startDate) return null;
  let end = e.endDate;
  if (!end) end = (e.status === 'active') ? todayStr() : e.startDate;
  if (end < e.startDate) end = e.startDate;
  return [e.startDate, end];
}

// month grid with a dot per title on each day something happened, plus an agenda for the tapped day
function renderCalendar(){
  const v = $('#view-calendar');
  const { y, m } = ui.cal;
  const daysIn = new Date(y, m+1, 0).getDate();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;          // monday-first
  const prefix = `${y}-${pad2(m+1)}-`;
  const tStr = todayStr();

  // day → [{e, list}] for this month, from each entry's activity log
  const byDay = {};
  db.media.forEach(e => {
    const act = activityOf(e);
    Object.keys(act).forEach(d => { if (d.startsWith(prefix)) (byDay[d] = byDay[d] || []).push({ e, list: act[d] }); });
  });
  const activeDays = Object.keys(byDay).sort();
  // ui.calSel: a date in this month, or 'month' for the overview; anything else resets to today / overview
  if (ui.calSel !== 'month' && (!ui.calSel || !ui.calSel.startsWith(prefix))) ui.calSel = tStr.startsWith(prefix) ? tStr : 'month';
  const sel = ui.calSel === 'month' ? null : ui.calSel;

  // new episodes of shows you watch or plan to, by air date
  const upcoming = upcomingEpisodes(tStr, 90);
  const upByDay = {};
  upcoming.forEach(u => (upByDay[u.d] = upByDay[u.d] || []).push(u));
  let cells = DOW_LETTER.map(d => `<div class="mc-dow">${d}</div>`).join('');
  for (let i = 0; i < lead; i++) cells += `<div class="mc-day out"></div>`;
  for (let d = 1; d <= daysIn; d++){
    const ds = prefix + pad2(d);
    const items = byDay[ds] || [];
    const dots = items.slice(0, 3).map(x => `<i style="background:${x.e.color}"></i>`).join('');
    const airs = ds >= tStr ? (upByDay[ds] || []) : [];
    cells += `<button class="mc-day ${items.length ? 'has' : ''} ${airs.length ? 'airs' : ''} ${ds === tStr ? 'today' : ''} ${ds === sel ? 'sel' : ''}" data-ds="${ds}">
      <span class="n">${d}</span><span class="dots">${dots}${items.length > 3 ? `<b>+${items.length - 3}</b>` : ''}${airs.length ? `<i class="air" title="${tl('new episode')}"></i>` : ''}</span></button>`;
  }

  // agenda: the selected day, or a month overview when nothing is picked
  const row = (e, what) => `
    <button class="ag-row" data-id="${e.id}">
      <span class="ag-cover">${e.cover ? `<img src="${esc(e.cover)}" loading="lazy" data-ph="${esc(TYPES[e.type].icon)}" onerror="imgFb(this)">` : `<span class="ph">${TYPES[e.type].icon}</span>`}</span>
      <span class="ag-main"><span class="ag-t">${esc(e.title)}</span><span class="ag-w"><i style="background:${e.color}"></i>${what}</span></span>
      <span class="st-pill ${e.status}">${STATUS[e.status].icon}</span>
    </button>`;
  let agenda;
  if (sel){
    const d = parseDate(sel);
    const items = byDay[sel] || [];
    agenda = `
      <div class="ag-head"><b>${DOW_LONG[d.getDay()]}</b><span>${d.getDate()} ${MONTHS[d.getMonth()]}</span>
        <button class="dt-link" id="cal-all">${tl('whole month →')}</button></div>
      ${items.length ? items.map(x => row(x.e, activityLabel(x.list))).join('')
        : (upByDay[sel] || []).length && sel >= tStr ? '' : `<div class="ag-empty">${tl('nothing logged this day')}</div>`}
      ${sel >= tStr ? (upByDay[sel] || []).map(u => row(u.e, `${tl('new episode')} · ${epCode(u.s, u.ep.n)} ${esc(u.ep.name)}`)).join('') : ''}`;
  } else {
    // month overview: every title touched this month, with what it added up to
    const touched = new Map();
    activeDays.forEach(ds => byDay[ds].forEach(x => {
      const t = touched.get(x.e.id) || { e: x.e, days: 0, sum: {} };
      t.days++;
      x.list.forEach(a => { t.sum[a.kind] = (t.sum[a.kind] || 0) + (a.n || 1); });
      touched.set(x.e.id, t);
    }));
    const sumLabel = t => {
      const parts = Object.entries(t.sum).filter(([k]) => ['pages','eps','pct'].includes(k)).map(([k, n]) => LOG_KINDS[k].label(n));
      ['start','finish','drop'].forEach(k => { if (t.sum[k]) parts.push(LOG_KINDS[k].label()); });
      return `${parts.join(' · ')}${parts.length ? ' · ' : ''}${t.days} day${t.days === 1 ? '' : 's'}`;
    };
    agenda = `
      <div class="ag-head"><b>${MONTHS[m]}</b><span>${tl(touched.size === 1 ? '{n} title' : '{n} titles', { n: touched.size })}</span></div>
      ${touched.size ? [...touched.values()].sort((a, b) => b.days - a.days).map(t => row(t.e, sumLabel(t))).join('')
        : `<div class="ag-empty">${tl('nothing logged this month — progress you update shows up here')}</div>`}`;
  }

  const finished = activeDays.reduce((n, ds) => n + byDay[ds].filter(x => x.list.some(a => a.kind === 'finish')).length, 0);
  v.innerHTML = `
    ${monthHeadHTML(y, m, 'cal')}

    </div>
    <div class="panel ag-panel" data-sec="agenda" data-sec-label="day agenda">${agenda}</div>
    ${upcoming.length ? `<div class="panel ag-panel" data-sec="upcoming" data-sec-label="${tl('coming up')}">
      <div class="ag-head"><b>${tl('coming up')}</b><span>${tl('new episodes')}</span></div>
      ${upcoming.slice(0, 8).map(u => { const d = parseDate(u.d), days = daysUntil(u.d); return `
        <button class="ag-row up-row" data-id="${u.e.id}">
          <span class="up-date"><b>${d.getDate()}</b><em>${MONTHS[d.getMonth()].slice(0, 3)}</em></span>
          <span class="ag-main"><span class="ag-t">${esc(u.e.title)}</span><span class="ag-w">${epCode(u.s, u.ep.n)} · ${esc(u.ep.name)}</span></span>
          <span class="up-when">${days === 0 ? tl('today') : days === 1 ? tl('tomorrow') : tl('in {n} days', { n: days })}</span>
        </button>`; }).join('')}
    </div>` : ''}
    </div>`;

  wireMonthNav('cal', ui.cal, () => { ui.calSel = null; renderCalendar(); });
  $$('.mc-day[data-ds]', v).forEach(b => b.addEventListener('click', () => { ui.calSel = ui.calSel === b.dataset.ds ? 'month' : b.dataset.ds; renderCalendar(); }));
  $('#cal-all')?.addEventListener('click', () => { ui.calSel = 'month'; renderCalendar(); });
  $$('.ag-row', v).forEach(b => b.addEventListener('click', () => openDetail(b.dataset.id)));
  refreshAirdates();
}

function renderHealth(){

  const dayData = d => db.health[dateStr(new Date(y, m, d))] || null;
  let total = 0, best = 0, bestD = 0, daysWith = 0, goalDays = 0, walkMin = 0, maxSteps = 1;
  for (let d = 1; d <= daysIn; d++){
    const h = dayData(d); if (!h || !h.steps) { walkMin += h?.walkMin||0; continue; }
    total += h.steps; daysWith++;
    if (h.steps > best){ best = h.steps; bestD = d; }
    if (h.steps >= goal) goalDays++;
    walkMin += h.walkMin || 0;
    maxSteps = Math.max(maxSteps, h.steps);
  }
  // current streak (from today backwards)
  let streak = 0; let cur = new Date();
  if (!db.health[todayStr()]?.steps || db.health[todayStr()].steps < goal) cur = addDays(cur, -1);
  while (true){
    const h = db.health[dateStr(cur)];
    if (h && h.steps >= goal){ streak++; cur = addDays(cur, -1); } else break;
  }
  const todayH = db.health[tStr];

  // dot grid

  // bar chart

    chart += `<div class="col ${s >= goal ? 'goalhit' : ''}" data-ds="${dateStr(new Date(y, m, d))}" title="${d} ${MONTHS[m].slice(0,3)} — ${tl('{n} steps', { n: fmtNum(s) })}">

      ${d % 5 === 0 || d === 1 ? `<span class="d">${d}</span>` : `<span class="d"></span>`}
    </div>`;
  }

  // walks list
  const walks = [];

  v.innerHTML = `

      <div class="panel screws pedometer">
        <div class="section-label"><span class="tag">${tl('pedometer')}</span> ${tl('today')}</div>
        <div class="lcd">
          <div style="padding:0"><span class="label dim">${tl('steps')} · ${tStr}</span>
          <div class="val">${todayH?.steps ? fmtNum(todayH.steps) : '——'}</div>
          <div class="goal dim">${tl('goal {n}', { n: fmtNum(goal) })} ${todayH?.steps >= goal ? '· ' + tl('goal hit') : ''}</div>
          <div class="bar"><i style="width:${todayH?.steps ? Math.round(clamp(todayH.steps/goal,0,1)*100) : 0}%"></i></div></div>
        </div>
        <div class="row" style="justify-content:center">
          <button class="btn primary" id="hl-sync-main" style="font-size:12px; padding:11px 26px">${ICONS.refresh} ${tl('sync')}</button>
          ${db.settings.simpleHealth ? '' : `
          <button class="btn" id="hl-log">${ICONS.edit} ${tl('log a day')}</button>
          <label class="btn filelabel">${ICONS.ul} ${tl('import')}<input type="file" id="hl-csv" accept=".csv,.json,text/csv,application/json"></label>
`}
        </div>
      </div>
      <div class="panel screws">
        <div class="section-label"><span class="tag">${MONTHS[m].slice(0,3)} ’${String(y).slice(2)}</span> ${tl('month stats')}</div>
        <div class="stat-row">
          <div class="stat inset"><div class="v">${fmtNum(total)}</div><div class="k">${tl('total steps')}</div></div>
          <div class="stat inset"><div class="v">${daysWith ? fmtNum(Math.round(total/daysWith)) : '—'}</div><div class="k">${tl('daily avg')}</div></div>
          <div class="stat inset"><div class="v">${best ? fmtNum(best) : '—'}</div><div class="k">${tl('best')} · ${bestD ? bestD + ' ' + MONTHS[m].slice(0,3) : ''}</div></div>

/* ============ body — food, training, body goals (the health tab, grown up) ============
   one record per day, spread over a few stores that every tab shares:
     db.mealLog   [{id, d, t, slot, kind:'food'|'recipe', name, qty, kcal, protein, carbs, fat}]
     db.workouts  [{id, d, type, min, kcal, source:'manual'|'hc', hcId, sets:[{ex, reps, kg}]}]
     db.weights   {'YYYY-MM-DD': kg}      db.measures {'YYYY-MM-DD': {waist, neck, hip}}
     db.health / db.water / db.sleep (steps, water, sleep — unchanged)
   targets come from db.profile; everything here is an estimate, not medical advice. */
const MEAL_SLOTS = ['breakfast', 'lunch', 'dinner', 'snack'];
const ACTIVITY = [[1.2, 'mostly sitting'], [1.375, 'lightly active'], [1.55, 'moderately active'], [1.725, 'very active'], [1.9, 'athlete / physical job']];
const WORKOUT_TYPES = { walk: 3.5, run: 9.8, cycle: 7.5, swim: 8, strength: 5, hiit: 8, yoga: 2.5, sport: 7, dance: 5, other: 4 };   // MET values
ICONS.dumbbell = I('<path d="M6.5 7.5v9M17.5 7.5v9M3.5 10v4M20.5 10v4M6.5 12h11"/>');
ICONS.scale = I('<rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M8 8.5a5 5 0 0 1 8 0l-2.5 2.5"/>');
ICONS.camera = I('<path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>');
ICONS.ruler = I('<rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6.5 8v3M10 8v4M13.5 8v3M17 8v4"/>');

const dbArr = k => (db[k] = Array.isArray(db[k]) ? db[k] : []);
const dbObj = k => (db[k] = db[k] && typeof db[k] === 'object' && !Array.isArray(db[k]) ? db[k] : {});
const prof = () => (db.profile = db.profile || {});
function latestWeight(){
  const w = dbObj('weights'); const ds = Object.keys(w).sort();
  return ds.length ? w[ds[ds.length - 1]] : (prof().weight || 0);
}
// smoothed weight trend (exponential moving average over calendar days, gaps carried forward)
function weightTrend(days = 90){
  const w = dbObj('weights'); const ds = Object.keys(w).sort(); if (!ds.length) return [];
  const out = []; let ema = null;
  let d = parseDate(ds[0]); const end = new Date();
  const start = addDays(end, -days);
  if (d < start) d = start;
  // seed the average from everything before the window
  ds.filter(x => x < dateStr(d)).forEach(x => { ema = ema === null ? w[x] : ema + 0.25 * (w[x] - ema); });
  for (; d <= end; d = addDays(d, 1)){
    const k = dateStr(d);
    if (w[k] != null) ema = ema === null ? w[k] : ema + 0.25 * (w[k] - ema);
    if (ema !== null) out.push({ d: k, kg: w[k] ?? null, trend: ema });
  }
  return out;
}
function calcTargets(){
  const p = prof(); const w = latestWeight();
  if (!p.heightCm || !w || !p.birthYear || !p.sex) return null;
  const age = new Date().getFullYear() - p.birthYear;
  const bmr = 10 * w + 6.25 * p.heightCm - 5 * age + (p.sex === 'm' ? 5 : -161);
  const tdee = bmr * (p.activity || 1.375);
  const pace = p.goal === 'maintain' ? 0 : (p.pace || 0.5);
  const delta = (p.goal === 'lose' ? -1 : p.goal === 'gain' ? 1 : 0) * pace * 7700 / 7;
  const floor = p.sex === 'm' ? 1500 : 1200;
  const kcal = Math.round(Math.max(floor, tdee + delta) / 10) * 10;
  const protein = Math.round(w * (p.goal === 'lose' ? 2.0 : p.goal === 'gain' ? 1.8 : 1.6));
  const fat = Math.round(kcal * 0.27 / 9);
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, protein, carbs, fat, floored: tdee + delta < floor, weight: w, age };
}
// what happened on one day: food in, activity out, budget
function dayTotals(ds){
  const meals = dbArr('mealLog').filter(m => m.d === ds);
  const sum = k => meals.reduce((a, m) => a + (+m[k] || 0), 0);
  const w = latestWeight() || 70;
  const steps = db.health[ds]?.steps || 0;
  const stepKcal = Math.round(Math.max(0, steps - 4000) * w * 0.0005);         // steps beyond a sitting-day baseline
  const workouts = dbArr('workouts').filter(x => x.d === ds);
  const workKcal = workouts.reduce((a, x) => a + (+x.kcal || 0), 0);
  const burned = stepKcal + workKcal;
  const t = calcTargets();
  const budget = t ? Math.round(t.kcal + (prof().eatBack ?? 0.5) * burned) : null;
  return { meals, kcal: Math.round(sum('kcal')), protein: Math.round(sum('protein')), carbs: Math.round(sum('carbs')), fat: Math.round(sum('fat')),
           steps, stepKcal, workouts, workKcal, burned, budget, t, water: db.water?.[ds] || 0 };
}
const bodyDay = () => ui.bodyDay || todayStr();

/* ---- today: rings + bars ---- */
function ringSVG(frac, size = 132, stroke = 12, over = false){
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, f = clamp(frac, 0, 1);
  return `<svg viewBox="0 0 ${size} ${size}" class="ring"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bg-lo)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${over ? 'var(--bad)' : 'var(--accent)'}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
function bodyTodayHTML(){
  const ds = bodyDay(), T = dayTotals(ds), t = T.t;
  const isToday = ds === todayStr();
  const dayLabel = isToday ? tl('today') : ds === dateStr(addDays(new Date(), -1)) ? tl('yesterday') : fmtNice(ds);

// fridge-aware nudge: protein still missing → a recipe you can cook, preferring things that expire soon
function bodySuggestion(T){
  const protLeft = T.t.protein - T.protein, kcalLeft = T.budget - T.kcal;
  if (protLeft < 20 || kcalLeft < 200) return '';
  const recipes = (db.kitchen?.recipes || []).filter(r => r.perServing?.protein && r.perServing.kcal <= kcalLeft + 50 && !recipeMissing(r).length);
  const soon = (db.kitchen?.fridge || []).map(f => ({ f, ex: fridgeExpiry(f) })).filter(x => x.ex && daysUntil(x.ex.d) <= 2);
  const usesSoon = r => soon.some(x => r.ingredients.some(i => normName(ingName(i)).includes(normName(x.f.name).split(' ')[0])));
  recipes.sort((a, b) => (usesSoon(b) - usesSoon(a)) || (b.perServing.protein - a.perServing.protein));
  const r = recipes[0];
  return `<div class="b-tip">${ICONS.spark}<span>${r
    ? tl('{n} g protein left — {recipe} fits ({p} g, {k} kcal){soon}', { n: protLeft, recipe: `<b>${esc(recipeTitle(r))}</b>`, p: Math.round(r.perServing.protein), k: Math.round(r.perServing.kcal), soon: usesSoon(r) ? ' · ' + tl('uses something that expires soon') : '' })
    : tl('{n} g protein left today', { n: protLeft })}</span>${r ? `<button class="dt-link" data-open-recipe="${r.id}">${tl('open')}</button>` : ''}</div>`;
}

function strengthPRs(){
  const best = {};
  dbArr('workouts').forEach(w => (w.sets || []).forEach(s => {
    if (!s.ex || !s.kg) return;
    const e1rm = s.kg * (1 + (s.reps || 1) / 30);           // epley estimate
    const k = normName(s.ex);
    if (!best[k] || e1rm > best[k].e1rm) best[k] = { ex: s.ex, kg: s.kg, reps: s.reps || 1, e1rm, d: w.d };
  }));
  return Object.values(best).sort((a, b) => b.d.localeCompare(a.d));
}

/* ---- body stats ---- */
function navyBodyFat(){
  const p = prof(), m = dbObj('measures'); const ds = Object.keys(m).sort(); if (!ds.length || !p.heightCm) return null;
  const x = m[ds[ds.length - 1]]; const h = p.heightCm;
  if (!x.waist || !x.neck) return null;
  let bf;
  if (p.sex === 'm') bf = 495 / (1.0324 - 0.19077 * Math.log10(x.waist - x.neck) + 0.15456 * Math.log10(h)) - 450;
  else { if (!x.hip) return null; bf = 495 / (1.29579 - 0.35004 * Math.log10(x.waist + x.hip - x.neck) + 0.22100 * Math.log10(h)) - 450; }
  return isFinite(bf) && bf > 2 && bf < 70 ? Math.round(bf * 10) / 10 : null;
}
function weightChartSVG(rows){
  if (rows.length < 2) return `<div class="dt-empty">${tl('log your weight a few times to see the trend')}</div>`;
  const W = 320, H = 110, P = 6;
  const vals = rows.flatMap(r => [r.trend, r.kg].filter(v => v != null));
  const goal = prof().goalWeight; if (goal) vals.push(goal);
  const lo = Math.min(...vals) - 0.5, hi = Math.max(...vals) + 0.5;
  const X = i => P + i * (W - 2 * P) / (rows.length - 1), Y = v => H - P - (v - lo) / (hi - lo) * (H - 2 * P);
  const line = rows.map((r, i) => `${X(i).toFixed(1)},${Y(r.trend).toFixed(1)}`).join(' ');
  const dots = rows.map((r, i) => r.kg != null ? `<circle cx="${X(i).toFixed(1)}" cy="${Y(r.kg).toFixed(1)}" r="2.2" fill="var(--sepia-2)"/>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="b-wchart">${goal ? `<line x1="${P}" x2="${W - P}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--ok)" stroke-dasharray="4 4"/>` : ''}
    ${dots}<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
// a horizontal scale with coloured ranges and a marker — easier to read than a bare number
function gaugeHTML(value, min, max, bands, fmt){
  const pos = v => clamp((v - min) / (max - min) * 100, 0, 100);
  let prev = min;
  const segs = bands.map(([to, cls]) => { const w = pos(to) - pos(prev); prev = to; return `<i class="${cls}" style="width:${w}%"></i>`; }).join('');
  return `<div class="b-gauge"><div class="b-gbar">${segs}</div>${value != null ? `<b class="b-gmark" style="left:${pos(value)}%"><span>${fmt(value)}</span></b>` : ''}</div>`;
}
function bodyStatsHTML(){
  const p = prof(), t = calcTargets(), rows = weightTrend(60);
  const w = dbObj('weights'), wds = Object.keys(w).sort();
  const lastD = wds[wds.length - 1], last = lastD ? w[lastD] : (p.weight || null);
  const trend = rows.length ? rows[rows.length - 1].trend : last;
  const showTrend = trend && last && Math.abs(trend - last) >= 0.2 && wds.length >= 3;
  const bmi = last && p.heightCm ? Math.round(last / Math.pow(p.heightCm / 100, 2) * 10) / 10 : null;
  const bf = navyBodyFat();
  const kg = v => (Math.round(v * 10) / 10).toLocaleString(LOCALE());
  // eta: recent trend slope, else the planned pace
  let eta = null;
  if (p.goalWeight && trend && Math.abs(trend - p.goalWeight) > 0.2){
    const back = rows.length > 14 ? rows[rows.length - 15].trend : null;
    let perDay = back != null ? (trend - back) / 14 : 0;
    const want = p.goalWeight < trend ? -1 : 1;
    if (Math.sign(perDay) !== want || Math.abs(perDay) < 0.005) perDay = want * (p.pace || 0.5) / 7 * (p.goal === 'maintain' ? 0 : 1);
    if (perDay) eta = dateStr(addDays(new Date(), Math.round((p.goalWeight - trend) / perDay)));
  }
  const bmiLabel = bmi ? tl(bmi < 18.5 ? 'underweight' : bmi < 25 ? 'healthy range' : bmi < 30 ? 'overweight' : 'obese range') : '';
  // body-fat bands differ by sex (ACE ranges)
  const bfBands = p.sex === 'm' ? [[6, 'g-low'], [14, 'g-ok'], [18, 'g-ok2'], [25, 'g-mid'], [40, 'g-high']] : [[14, 'g-low'], [21, 'g-ok'], [25, 'g-ok2'], [32, 'g-mid'], [50, 'g-high']];
  const bfLabel = bf ? tl(bf < bfBands[0][0] ? 'very low' : bf < bfBands[1][0] ? 'athletic' : bf < bfBands[2][0] ? 'fit' : bf < bfBands[3][0] ? 'average' : 'high') : '';
  return `
  <section class="panel b-stats" data-sec="body" data-sec-label="${tl('body stats')}">
    <div class="dt-h"><span>${tl('body')}</span><button class="dt-link" id="bb-profile">${ICONS.edit} ${tl('goals & profile')}</button></div>
    <div class="b-weight">
      <div><b>${last ? kg(last) : '—'}<em> kg</em></b><span>${lastD ? tl('last weigh-in · {date}', { date: fmtNice(lastD) }) : tl('no weigh-in yet')}</span></div>
      ${showTrend ? `<div class="b-trend"><span>${tl('trend')}</span><b>${kg(trend)} kg</b></div>` : ''}
    </div>
    ${weightChartSVG(rows)}
    ${p.goalWeight ? `<div class="b-goalline">${tl('goal {kg} kg', { kg: p.goalWeight })}${last ? ' · ' + tl('{n} kg to go', { n: kg(Math.abs(last - p.goalWeight)) }) : ''}${eta ? ' · ' + tl('≈ {date} at this pace', { date: fmtNice(eta) }) : ''}</div>` : ''}
    <div class="b-gauges">
      <div class="b-gwrap"><div class="b-gh"><span>BMI</span><b>${bmi ? bmi.toLocaleString(LOCALE()) : '—'}</b><em>${bmiLabel}</em></div>
        ${gaugeHTML(bmi, 15, 40, [[18.5, 'g-low'], [25, 'g-ok'], [30, 'g-mid'], [40, 'g-high']], v => '')}</div>
      <div class="b-gwrap"><div class="b-gh"><span>${tl('body fat')}</span><b>${bf ? bf.toLocaleString(LOCALE()) + '%' : '—'}</b><em>${bf ? bfLabel : `<button class="dt-link" id="bb-measure2">${tl('add measurements')}</button>`}</em></div>
        ${gaugeHTML(bf, p.sex === 'm' ? 2 : 10, p.sex === 'm' ? 40 : 50, bfBands, v => '')}</div>
    </div>
    <div class="b-btns">
      <button class="btn primary" id="bb-weight">${ICONS.scale} ${tl('log weight')}</button>
      <button class="btn" id="bb-measure">${ICONS.ruler} ${tl('measurements')}</button>
    </div>
    ${t ? `<div class="b-fine">${tl('burn ≈ {tdee} kcal/day (BMR {bmr}) · goal {kcal} kcal{floor}', { tdee: fmtNum(t.tdee), bmr: fmtNum(t.bmr), kcal: fmtNum(t.kcal), floor: t.floored ? ' · ' + tl('kept at a safe minimum') : '' })}</div>` : ''}
  </section>`;
}

/* ---- gemini: one helper for every call ----
   the free tier counts requests per model per day, and newer models get small daily limits —
   so mood walks down a chain of flash models (newest first, then the lite ones), skips any
   that ran out today, and refreshes the chain from google's model list once a week. */
const GEMINI_DEFAULT = ['gemini-3.8-flash', 'gemini-3.7-flash', 'gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-flash-latest',
  'gemini-3.5-flash-lite', 'gemini-3.1-flash-lite', 'gemini-flash-lite-latest', 'gemini-2.5-flash'];
let geminiLastErr = '';
const gemState = () => (db.settings.gem = db.settings.gem && typeof db.settings.gem === 'object' ? db.settings.gem : { models: null, at: 0, out: {}, gone: {} });
// fast: the lite models first — they answer in ~2 s, the newest "thinking" flash models can take 30 s
function geminiModels(fast = true){
  const G = gemState(), today = todayStr();
  const base = (G.models && G.models.length ? G.models : GEMINI_DEFAULT);
  const list = fast ? [...base.filter(m => /lite/.test(m)), ...base.filter(m => !/lite/.test(m))] : base;
  return list.filter(m => G.out[m] !== today && !(G.gone[m] && G.gone[m] > dateStr(addDays(new Date(), -30))));
}
async function refreshGeminiModels(){
  const G = gemState();
  if (!db.settings.geminiKey || Date.now() - (G.at || 0) < 7 * 864e5) return;
  try {
    const j = await (await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(db.settings.geminiKey)}&pageSize=300`)).json();
    const names = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => m.name.replace('models/', ''))
      .filter(n => /^gemini-(\d+(\.\d+)?)-flash(-lite)?$/.test(n));
    if (!names.length) return;
    const ver = n => parseFloat(n.match(/gemini-(\d+(?:\.\d+)?)/)[1]);
    // full flash models newest first, then the lite ones newest first — each has its own daily quota
    names.sort((a, b) => (/-lite$/.test(a) - /-lite$/.test(b)) || ver(b) - ver(a));
    G.models = [...names.filter(n => !/-lite$/.test(n)), 'gemini-flash-latest', ...names.filter(n => /-lite$/.test(n)), 'gemini-flash-lite-latest'];
    G.at = Date.now(); save();
  } catch(_){}
}
const geminiFetch = (model, body) => fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(db.settings.geminiKey || '')}`,
  { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
// any ai key at all? (gemini, or one of the free backups)
const aiOn = () => !!(db.settings.geminiKey || db.settings.groqKey || db.settings.openrouterKey);
const hoursToQuotaReset = () => { const la = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Los_Angeles' })); return 24 - la.getHours() - la.getMinutes() / 60; };
class QuotaError extends Error { constructor(msg, retryS){ super(msg); this.quota = true; this.retryS = retryS || 0; } }
async function geminiTry(parts, { json, temperature, fast }){
  refreshGeminiModels();
  const body = JSON.stringify({ contents: [{ parts }], generationConfig: { ...(json ? { response_mime_type: 'application/json' } : {}), temperature } });
  const G = gemState();
  const chain = geminiModels(fast);
  if (!chain.length) throw new QuotaError('gemini', hoursToQuotaReset() * 3600);   // every model already ran out today
  let lastErr = null, quotaHit = false, retryS = 0;
  for (const model of chain){
    try {
      const r = await geminiFetch(model, body);
      if (r.status === 404){ G.gone[model] = todayStr(); save(); lastErr = new Error('model not found'); continue; }
      if (!r.ok){
        const err = await r.json().catch(() => null);
        lastErr = new Error(err?.error?.message || 'HTTP ' + r.status);
        if (/api key/i.test(lastErr.message)) break;          // a bad key won't work on any model
        if (r.status === 429){
          quotaHit = true;
          const rd = (err?.error?.details || []).find(d => d.retryDelay)?.retryDelay;
          retryS = Math.max(retryS, parseInt(rd) || 0);
          if (JSON.stringify(err?.error?.details || '').includes('PerDay')){ G.out[model] = todayStr(); save(); }   // done for today
        }
        continue;
      }
      const txt = ((await r.json()).candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
      if (txt) return txt;
      lastErr = new Error('empty answer');
    } catch(e){ lastErr = e; }
  }
  if (quotaHit) throw new QuotaError('gemini', Math.max(retryS, hoursToQuotaReset() * 3600));
  throw lastErr || new Error('no response');
}
/* free backups — openai-style chat apis. models are listed live (free ones change over time) */
const OAI = {
  groq: { key: () => db.settings.groqKey, chat: 'https://api.groq.com/openai/v1/chat/completions',
    list: async () => (await (await fetch('https://api.groq.com/openai/v1/models', { headers: { Authorization: 'Bearer ' + db.settings.groqKey } })).json()).data
      .filter(m => m.active !== false && !/whisper|tts|guard|safety|playai|distil|compound|orpheus/i.test(m.id))

const oaiCache = {};
async function oaiModels(prov, needImg){
  const c = oaiCache[prov];
  if (!c || Date.now() - c.at > 6 * 3600e3) oaiCache[prov] = { at: Date.now(), list: await OAI[prov].list().catch(() => []) };
  const G = gemState(), today = todayStr();
  return oaiCache[prov].list.filter(m => (!needImg || m.img) && G.out[prov + ':' + m.id] !== today).sort((a, b) => a.rank - b.rank).slice(0, 4);
}
async function oaiTry(prov, parts, { temperature }){
  const P = OAI[prov];
  const needImg = parts.some(x => x.inline_data && /^image\//.test(x.inline_data.mime_type));
  const content = parts.map(x => x.text != null ? { type: 'text', text: x.text } : { type: 'image_url', image_url: { url: `data:${x.inline_data.mime_type};base64,${x.inline_data.data}` } });
  const models = await oaiModels(prov, needImg);
  if (!models.length){
    const any = (oaiCache[prov]?.list || []).some(m => !needImg || m.img);
    if (any) throw new QuotaError(prov, hoursToQuotaReset() * 3600);           // they're there, just used up today
    throw new Error(prov + ': ' + (needImg ? 'no free model reads images' : 'no free model available'));
  }
  let lastErr = null, quotaHit = false;
  for (const m of models){
    try {
      const r = await fetch(P.chat, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + P.key(), 'X-Title': 'mood' },
        body: JSON.stringify({ model: m.id, temperature, messages: [{ role: 'user', content: needImg ? content : content.map(c => c.text).join('\n\n') }] }) });
      if (r.status === 401 || r.status === 403){ lastErr = new Error(prov + ': key not accepted'); break; }
      if (r.status === 429 || r.status === 402){ quotaHit = true; const G = gemState(); G.out[prov + ':' + m.id] = todayStr(); save(); continue; }
      if (!r.ok){ const e = await r.json().catch(() => null); lastErr = new Error(prov + ': ' + (e?.error?.message || 'HTTP ' + r.status)); continue; }
      const txt = (await r.json()).choices?.[0]?.message?.content || '';
      if (txt) return txt;
    } catch(e){ lastErr = e; }
  }
  if (quotaHit) throw new QuotaError(prov, hoursToQuotaReset() * 3600);
  throw lastErr || new Error(prov + ': no answer');
}
/* one call for every ai feature: gemini first, then the free backups; pdfs only gemini can read */
async function geminiCall(parts, { json = true, temperature = 0.2, fast = true } = {}){
  if (!aiOn()) throw new Error(tl('add a gemini api key in settings first'));
  const hasPdf = parts.some(x => x.inline_data && /pdf/.test(x.inline_data.mime_type));
  const tries = [];
  if (db.settings.geminiKey) tries.push(() => geminiTry(parts, { json, temperature, fast }));
  if (!hasPdf) ['groq', 'openrouter'].forEach(p => { if (OAI[p].key()) tries.push(() => oaiTry(p, parts, { temperature })); });
  let quota = 0, retryS = 0, lastErr = null;
  for (const t of tries){
    try { return await t(); }
    catch(e){ lastErr = e; if (e.quota){ quota++; retryS = Math.max(retryS, e.retryS || 0); } }
  }
  if (quota && quota === tries.length) throw new Error(tl('today\'s free ai limit is used up — it resets in about {h} h', { h: Math.max(1, Math.round((retryS || 6 * 3600) / 3600)) }));
  if (hasPdf && !db.settings.geminiKey) throw new Error(tl('only gemini can read pdfs — use screenshots, or add a gemini key'));
  throw lastErr || new Error(tl('no gemini model answered — check the connection'));
}
// models sometimes wrap json in prose or fences — take the outermost object / array
function looseJSON(t){
  t = String(t).trim().replace(/^```[a-z]*\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(t); } catch(_){}
  const i = t.search(/[\[{]/), j = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if (i >= 0 && j > i) return JSON.parse(t.slice(i, j + 1));
  throw new Error('not json');
}
async function geminiJSON(parts, opts){
  if (!aiOn()){ toast(tl('⚠ add a gemini api key in settings first')); return null; }
  try {
    const t = await geminiCall(parts, opts);
    geminiLastErr = '';
    return looseJSON(t);
  } catch(e){ geminiLastErr = 'gemini: ' + e.message; return null; }
}

Name each food in ${LANG === 'tr' ? 'Turkish' : 'English'}. Reply with ONLY this JSON: {"items":[{"name":"food","qty":"portion as text","kcal":0,"protein":0,"carbs":0,"fat":0}]} — macros in grams.` }, ...parts]);

/* count-based poses: lying, leaning, piled — offsets from the compartment
   centroid + resting height (dz) + lean angles. real objects don't line up. */
function slotPoses(n){
  // [dx, dy, dz(stack height ABOVE resting contact), lean, roll] — pre-simulated,
  // spread wide so each pill reads on its own; only the pile-topper overlaps
  switch (Math.min(n, 6)){
    case 1: return [[0, 2, 0, .06, 0]];
    case 2: return [[-23, 8, 0, .07, -.4], [21, -6, 0, .1, .5]];
    case 3: return [[-28, 10, 0, .07, -.55], [26, 7, 0, .07, .45], [0, -17, 0, .12, .05]];
    case 4: return [[-29, 12, 0, .07, -.55], [27, 9, 0, .07, .5], [-5, -19, 0, .1, .1], [3, 4, 8, .5, .8]];
    case 5: return [[-31, 11, 0, .07, -.6], [29, 10, 0, .07, .55], [-24, -17, 0, .1, -.15], [22, -18, 0, .07, .2], [0, -2, 9, .52, .9]];
    default: return [[-31, 12, 0, .07, -.6], [29, 11, 0, .07, .55], [-25, -17, 0, .1, -.2], [23, -18, 0, .07, .25], [-4, -2, 8.5, .5, .85], [7, 0, 15, .58, -.7]];
  }
}
function dosePositions(s, doses){
  const rad = a => a * Math.PI / 180;
  const cx = 190 + 96 * Math.cos(rad(s.mid)), cy = 193 + 96 * Math.sin(rad(s.mid));
  const poses = slotPoses(doses.length);
  return doses.slice(0, 6).map((d, i) => {
    const [dx, dy, dz, lean, roll] = poses[i];
    const h = (() => { let h2 = 0; for (const ch of d.p.id + d.tm) h2 = (h2 * 31 + ch.charCodeAt(0)) % 997; return h2; })();
    return { d, x: cx + dx, y: cy + dy, z: dz, lean, roll, yaw: ((h % 63) / 10) - 3.1 };
  });
}

/* studio environment: tiny procedural cubemap (warm room + softbox) — pbr
   materials are dead without something to reflect */
function makeEnvTexture(T){
  const faces = [];
  for (let i = 0; i < 6; i++){
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, 64);
    gr.addColorStop(0, '#FAF4E4'); gr.addColorStop(.55, '#CFC3A8'); gr.addColorStop(1, '#6E5F48');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    if (i === 2){ g.fillStyle = 'rgba(255,255,255,.95)'; g.fillRect(10, 14, 44, 28); }        // ceiling softbox
    if (i === 0){ g.fillStyle = 'rgba(255,251,238,.55)'; g.fillRect(22, 6, 16, 48); }          // side window
    faces.push(c);
  }
  const tex = new T.CubeTexture(faces);
  tex.needsUpdate = true;
  return tex;
}
/* powder-compact micro texture for matte tablets */
function makeBumpTexture(T){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const img = g.createImageData(64, 64);
  let s = 7;
  for (let i = 0; i < img.data.length; i += 4){
    s = (s * 16807) % 2147483647;
    const v = 116 + (s % 24);
    img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(2, 2);
  return t;
}
/* rounded-rim tablet profile — real tablets have chamfered edges, not tubes */
function tabletGeo(T, r, h){
  const pts = [];
  const rim = h * .42;
  pts.push(new T.Vector2(0, -h / 2));
  pts.push(new T.Vector2(r - rim, -h / 2));
  for (let i = 0; i <= 6; i++){
    const a = -Math.PI / 2 + (i / 6) * Math.PI;
    pts.push(new T.Vector2(r - rim + Math.cos(a) * rim, Math.sin(a) * (h / 2)));
  }
  pts.push(new T.Vector2(0, h / 2));
  return new T.LatheGeometry(pts, 48);
}
function pillMesh(T, p, env, bump){
  let seed = 0; for (const ch of String(p.id || p.name || 'x')) seed = (seed * 31 + ch.charCodeAt(0)) % 9973;
  const col = new T.Color(p.color || '#B3542E');
  col.offsetHSL(0, 0, ((seed % 9) - 4) / 120);          // no two pills identical
  const matte = extra => new T.MeshPhysicalMaterial(Object.assign({
    color: col, roughness: .68, metalness: 0,
    envMap: env, envMapIntensity: .45,
    bumpMap: bump, bumpScale: .16,
  }, extra));
  const gel = extra => new T.MeshPhysicalMaterial(Object.assign({
    color: col, roughness: .22, metalness: 0,
    envMap: env, envMapIntensity: .85,
    clearcoat: 1, clearcoatRoughness: .12,
  }, extra));
  const shell = c2 => new T.MeshPhysicalMaterial({
    color: c2, roughness: .3, metalness: 0,
    envMap: env, envMapIntensity: .7,
    clearcoat: .8, clearcoatRoughness: .2,
  });
  const g = new T.Group();
  const add = (geo, m, x = 0, rz = 0) => {
    const mesh = new T.Mesh(geo, m);
    mesh.position.x = x;
    if (rz) mesh.rotation.z = rz;
    mesh.castShadow = true;
    g.add(mesh);
    return mesh;
  };
  if (p.shape === 'capsule'){
    const a = shell(col), b = shell(new T.Color(0xEFE6D0));
    add(new T.CylinderGeometry(6, 6, 8.6, 48), a, 4.2, Math.PI / 2);
    add(new T.SphereGeometry(6, 48, 24), a, 8.5);
    add(new T.CylinderGeometry(6, 6, 8.6, 48), b, -4.2, Math.PI / 2);
    add(new T.SphereGeometry(6, 48, 24), b, -8.5);
  } else if (p.shape === 'tablet'){
    const tb = add(tabletGeo(T, 8.6, 5.4), matte());
    tb.rotation.x = Math.PI / 2;
    const score = add(new T.BoxGeometry(14.4, 1, .8), matte({ color: col.clone().multiplyScalar(.62), bumpScale: .05 }));
    score.position.z = 2.85; score.castShadow = false;
  } else if (p.shape === 'oval'){
    const sp = add(new T.SphereGeometry(8, 48, 28), gel());
    sp.scale.set(1.5, .85, .62);
  } else if (p.shape === 'drop'){
    add(new T.SphereGeometry(6.6, 48, 24), gel());
    const cone = add(new T.ConeGeometry(6.38, 10.5, 48), gel());
    cone.position.y = 6.7;
    g.scale.set(1, 1, .64);
  } else {
    const sp = add(new T.SphereGeometry(8.4, 48, 28), matte());
    sp.scale.set(1, 1, .55);
  }
  g.scale.multiplyScalar(2.2 * (1 + ((seed % 7) - 3) / 55));   // presence + natural size variance
  return g;
}
/* resting contact height per shape (half-thickness × the 2.2 scale) */
const PILL_REST = { round: 10.3, tablet: 6, oval: 11, capsule: 13.2, drop: 9.3 };
function renderPills3D(){
  try {
    const canvas = $('#pill3dc');
    if (!canvas || !window.THREE || p3mode() !== 'webgl') return;
    const T = window.THREE;
    const W = 380, H = 386, dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (!_three){
      const off = document.createElement('canvas');
      const renderer = new T.WebGLRenderer({ canvas: off, alpha: true, antialias: true });
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = T.VSMShadowMap;                 // properly soft contact shadows
      renderer.toneMapping = T.ACESFilmicToneMapping;           // filmic response, not raw cg
      renderer.toneMappingExposure = 1.02;
      renderer.outputEncoding = T.sRGBEncoding;
      _three = { renderer, env: makeEnvTexture(T), bump: makeBumpTexture(T) };
    }
    _three.renderer.setSize(W * dpr, H * dpr, false);
    _three.renderer.setClearColor(0x000000, 0);
    const scene = new T.Scene();
    const cam = new T.OrthographicCamera(0, W, 0, -H, 1, 700);
    cam.position.set(0, 0, 320);
    // three-point-ish rig: warm hemisphere bounce, warm key with soft shadow, cool fill
    scene.add(new T.HemisphereLight(0xfff3dd, 0x574836, .52));
    const dl = new T.DirectionalLight(0xfff0da, .75);
    dl.position.set(120, -80, 520);
    dl.castShadow = true;
    dl.shadow.mapSize.set(1024, 1024);
    dl.shadow.radius = 5.5;
    dl.shadow.bias = -0.0004;
    Object.assign(dl.shadow.camera, { left: -240, right: 240, top: 240, bottom: -240, near: 1, far: 1000 });
    dl.target.position.set(190, -193, 0);
    scene.add(dl); scene.add(dl.target);
    const fill = new T.DirectionalLight(0xcdd8e6, .22);
    fill.position.set(-260, -320, 260);
    scene.add(fill);
    const floor = new T.Mesh(new T.PlaneGeometry(W, H), new T.ShadowMaterial({ opacity: .26 }));
    floor.position.set(W / 2, -H / 2, 0);
    floor.receiveShadow = true;
    scene.add(floor);
    _p3layout.forEach(L => {
      const m = pillMesh(T, L.p, _three.env, _three.bump);
      m.position.set(L.x, -L.y, (PILL_REST[L.p.shape] || 9) + L.z);
      m.rotation.set(L.lean, L.roll, L.yaw);
      if (L.taken) m.traverse(o => {
        if (o.isMesh){ o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = .3; o.castShadow = false; }
      });
      scene.add(m);
    });
    _three.renderer.render(scene, cam);
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(_three.renderer.domElement, 0, 0);
    scene.traverse(o => {
      if (o.isMesh){
        o.geometry.dispose();
        (Array.isArray(o.material) ? o.material : [o.material]).forEach(mm => mm.dispose());
      }
    });
  } catch(e){
    // any webview/gl hiccup → fall back to the shaded svg pills, never a blank tray
    P3MODE = 'svg';
    try { _three?.renderer?.dispose(); } catch(_){}
    _three = null;
    if (ui.view === 'health') renderHealth();
  }
}

function pillWeekStats(){
  const wk = weekDates(ui.pillWeek), t = todayStr();
  let due = 0, done = 0;
  db.pills.forEach(p => wk.forEach((d, wi) => {
    if (!p.weekdays.includes(wi) || d > t) return;
    due += p.times.length; done += Math.min(pillTaken(p, d), p.times.length);
  }));
  return { due, done, pct: due ? Math.round(done / due * 100) : null };
}
function pillWeekHTML(){
  const wk = weekDates(ui.pillWeek), t = todayStr();

  return `
    ${W.pct != null ? `<div class="pw-sum"><span>${tl('this week')}</span><div class="b-mbar"><i style="width:${W.pct}%"></i></div><b>${W.pct}%</b><em>${tl('{a}/{b} doses', { a: W.done, b: W.due })}</em></div>` : ''}

        const tk = Math.min(pillTaken(p, d), p.times.length), tot = p.times.length;

        return `<button class="pw-c ${st} ${d === t ? 'tdy' : ''}" data-pid="${p.id}" data-pd="${d}" style="--pc:${p.color || 'var(--accent)'}"

    }).join('')}`;
}

/* ---- Samsung Health / generic CSV import ---- */
function importHealthCSV(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const dates = applySteps(parseStepsText(String(r.result)));
      if (!dates.length){ toast(tl('⚠ no step rows recognized in that file')); return; }
      save(); renderHealth();
      toast(tl('imported {n} days ({from} → {to})', { n: dates.length, from: dates[0], to: dates[dates.length-1] }) + ' ✕');
    } catch(e){ toast(tl('⚠ import failed: ') + e.message); }
  };
  r.readAsText(file);
}
function parseHealthCSV(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  // find header row: has a date-ish and a step-ish column
  let hi = -1, cols = [];
  for (let i = 0; i < Math.min(lines.length, 5); i++){
    const c = lines[i].split(',').map(s => s.trim().toLowerCase());
    const hasDate = c.some(x => /day_time|start_time|update_time|date|^day$/.test(x));
    const hasSteps = c.some(x => /^count$|step_count|^steps?$/.test(x));
    if (hasDate && hasSteps){ hi = i; cols = c; break; }
  }
  if (hi === -1) throw new Error('no date/steps header found');
  const di = cols.findIndex(x => /day_time|^date$|^day$/.test(x)) !== -1
    ? cols.findIndex(x => /day_time|^date$|^day$/.test(x))
    : cols.findIndex(x => /start_time|date|day/.test(x));
  const si = cols.findIndex(x => /^count$|step_count|^steps?$/.test(x));
  const map = {};
  for (let i = hi + 1; i < lines.length; i++){
    const parts = lines[i].split(',');
    if (parts.length <= Math.max(di, si)) continue;
    const dRaw = (parts[di]||'').trim(), sRaw = (parts[si]||'').trim();
    const steps = parseInt(sRaw, 10);
    if (!steps || steps < 0) continue;
    let ds = null;
    if (/^\d{13,}$/.test(dRaw)) ds = dateStrUTC(new Date(+dRaw));
    else if (/^\d{10}$/.test(dRaw)) ds = dateStrUTC(new Date(+dRaw * 1000));
    else if (/^\d{4}-\d{2}-\d{2}/.test(dRaw)) ds = dRaw.slice(0,10);
    else { const p = new Date(dRaw); if (!isNaN(p)) ds = dateStr(p); }
    if (!ds) continue;
    map[ds] = Math.max(map[ds]||0, steps);
  }
  return map;
}
// samsung day_time is midnight UTC of the tracked day
const dateStrUTC = d => `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;

/* ---- steps text parser: csv or json ---- */
function parseStepsText(text){
  const s = String(text).trim();
  if (s[0] === '{' || s[0] === '['){
    const j = JSON.parse(s);
    const map = {}, extras = {};
    const put = (d, steps, wm, wk) => {
      if (d == null) return;
      const ds = String(d).slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
      if (+steps > 0) map[ds] = Math.max(map[ds]||0, Math.round(+steps));
      if (+wm > 0 || +wk > 0) extras[ds] = { walkMin:+wm||0, walkKm:+wk||0 };
    };
    if (Array.isArray(j)) j.forEach(r => r && put(r.date ?? r.day ?? r.startTime, r.steps ?? r.count ?? r.step_count, r.walkMin ?? r.walk_min, r.walkKm ?? r.walk_km));
    else Object.entries(j).forEach(([k, v]) => (v && typeof v === 'object') ? put(k, v.steps ?? v.count, v.walkMin, v.walkKm) : put(k, v));
    return { map, extras };
  }
  return { map: parseHealthCSV(s), extras: {} };
}
function applySteps({ map, extras }){
  const dates = Object.keys(map);
  dates.forEach(d => { const prev = db.health[d] || {}; db.health[d] = { ...prev, steps: Math.max(prev.steps||0, map[d]) }; });
  Object.keys(extras).forEach(d => { db.health[d] = { ...(db.health[d]||{}), ...extras[d] }; });
  return dates.sort();
}

/* ---- what happened on a day (shared by habits, xp and quests) ---- */
function mediaDay(ds){
  const out = { pages: 0, eps: 0, pct: 0, finish: 0, any: 0, game: 0, read: 0, watch: 0 };
  db.media.forEach(e => (activityOf(e)[ds] || []).forEach(x => {
    if (x.kind === 'start' || x.kind === 'drop') return;
    out.any++;
    if (x.kind === 'pages'){ out.pages += x.n || 0; out.read++; }
    if (x.kind === 'eps'){ out.eps += x.n || 0; out.watch++; }
    if (x.kind === 'pct'){ out.pct += x.n || 0; if (e.type === 'game') out.game++; else out.watch++; }
    if (x.kind === 'finish') out.finish++;
  }));

}
function pillsAllTaken(ds){
  const wd = (parseDate(ds).getDay() + 6) % 7;
  const due = db.pills.filter(p => p.weekdays.includes(wd));
  return due.length > 0 && due.every(p => pillTaken(p, ds) >= p.times.length);

const workMin = ds => dbArr('workouts').filter(w => w.d === ds).reduce((a, w) => a + (+w.min || 0), 0) + (db.health[ds]?.walkMin || 0);
const AUTO_RULES = {

  steps:    { label: 'step goal',                test: ds => (db.health[ds]?.steps || 0) >= (db.settings.stepGoal || 8000) },
  protein:  { label: 'protein target',           test: ds => { const T = dayTotals(ds); return !!T.t && T.protein >= T.t.protein; } },
  calories: { label: 'within calorie budget',    test: ds => { const T = dayTotals(ds); return !!T.budget && T.meals.length >= 2 && T.kcal >= T.budget * .8 && T.kcal <= T.budget * 1.05; } },
  meals:    { label: 'logged 3 meals',           test: ds => new Set(dbArr('mealLog').filter(m => m.d === ds).map(m => m.slot)).size >= 3 },
  workout:  { label: 'worked out',               test: ds => dbArr('workouts').some(w => w.d === ds) || workMin(ds) >= 20 },
  weight:   { label: 'weighed in',               test: ds => dbObj('weights')[ds] != null },
  pills:    { label: 'took all pills',           test: ds => pillsAllTaken(ds) },
  sleep:    { label: 'slept 7h+',                test: ds => (db.sleep?.[ds] || 0) >= 420 },
  read:     { label: 'read',                     test: ds => mediaDay(ds).read > 0 },
  watch:    { label: 'watched an episode or film', test: ds => mediaDay(ds).watch > 0 },
  play:     { label: 'played a game',            test: ds => mediaDay(ds).game > 0 },
  cook:     { label: 'cooked at home',           test: ds => dbArr('mealLog').some(m => m.d === ds && m.kind === 'recipe') },
  usedfood: { label: 'used food before it expired', test: ds => (db.kitchen?.wasteLog || []).some(w => w.d === ds && w.used) },
};
function anyActivity(ds){
  return dbArr('mealLog').some(m => m.d === ds) || (db.water?.[ds] || 0) > 0 || dbArr('workouts').some(w => w.d === ds)
    || dbObj('weights')[ds] != null || mediaDay(ds).any > 0 || db.habits.some(h => h.days[ds])
    || Object.keys(db.pillLog?.[ds] || {}).length > 0;
}
// a habit's state on a day: 'done' (ticked or its rule held), 'min' (minimum day saved it), '' (not done)
function habitState(h, ds){
  if (h.days[ds]) return 'done';
  if (h.auto && AUTO_RULES[h.auto] && AUTO_RULES[h.auto].test(ds)) return 'done';
  if (game().minDay[ds] && anyActivity(ds)) return 'min';
  return '';
}
/* streaks forgive: one missed day is "frozen" when the days around it are done and no
   other day was frozen in the 6 days before — so a single slip never wipes a chain */
function chainDays(isDone, back = 400){
  const t = new Date(); const out = [];
  for (let i = back; i >= 0; i--){ const ds = dateStr(addDays(t, -i)); out.push({ ds, on: !!isDone(ds) }); }
  let lastFreeze = -99;
  out.forEach((x, i) => {
    if (x.on || i === 0 || i === out.length - 1) return;
    if (out[i - 1].on && (out[i + 1].on || i + 1 === out.length - 1) && i - lastFreeze > 6){ x.frozen = true; lastFreeze = i; }
  });
  return out;
}
function streakOf(isDone){
  const days = chainDays(isDone);
  let i = days.length - 1;
  if (!days[i].on) i--;                                     // today still open doesn't break it
  let cur = 0;
  for (; i >= 0 && (days[i].on || days[i].frozen); i--) if (days[i].on) cur++;
  let best = 0, run = 0;
  days.forEach(x => { if (x.on) run++; else if (!x.frozen) run = 0; best = Math.max(best, run); });
  return { cur, best, total: days.filter(x => x.on).length, days };
}
function habitStreak(h){ return streakOf(ds => habitState(h, ds)); }

/* ---- xp: everything you log is worth something; the table is shown in the app ---- */
const XP_RULES = [
  ['meal logged', 5, 'max 4 a day'], ['water goal', 15], ['step goal', 20], ['workout', 25], ['weigh-in', 5], ['all pills taken', 15],
  ['7h sleep', 10], ['media progress', 10, 'max 3 a day'], ['finished something', 30], ['habit done', 10], ['cooked at home', 15],
  ['quest done', 20], ['day cleared', 30],
];
function dayXP(ds){
  const meals = Math.min(4, dbArr('mealLog').filter(m => m.d === ds).length);
  const md = mediaDay(ds);
  const quests = questsFor(ds, false).filter(q => questProgress(q, ds).done).length;
  let xp = meals * 5 + (AUTO_RULES.water.test(ds) ? 15 : 0) + (AUTO_RULES.steps.test(ds) ? 20 : 0)
    + (dbArr('workouts').some(w => w.d === ds) ? 25 : 0) + (AUTO_RULES.weight.test(ds) ? 5 : 0) + (pillsAllTaken(ds) ? 15 : 0)
    + (AUTO_RULES.sleep.test(ds) ? 10 : 0) + Math.min(3, md.any - md.finish) * 10 + md.finish * 30
    + db.habits.filter(h => habitState(h, ds) === 'done').length * 10 + (AUTO_RULES.cook.test(ds) ? 15 : 0)
    + quests * 20 + (quests >= 3 ? 30 : 0);
  return xp;
}
let xpCache = null;
function totalXP(){
  if (xpCache && xpCache.at > Date.now() - 1500) return xpCache.v;
  const days = new Set([...dbArr('mealLog').map(m => m.d), ...Object.keys(db.water || {}), ...Object.keys(db.health || {}), ...dbArr('workouts').map(w => w.d),
    ...Object.keys(dbObj('weights')), ...Object.keys(db.pillLog || {}), ...Object.keys(db.sleep || {}), ...db.habits.flatMap(h => Object.keys(h.days)),
    ...db.media.flatMap(e => Object.keys(activityOf(e))), ...Object.keys(game().quests)]);
  let v = 0; days.forEach(ds => { if (ds <= todayStr()) v += dayXP(ds); });
  v += Object.keys(game().badges).length * 50;
  xpCache = { v, at: Date.now() };
  return v;
}
const levelOf = xp => Math.max(1, Math.floor((1 + Math.sqrt(1 + 0.08 * xp)) / 2));   // level L starts at 50·L·(L−1) xp

const soonItem = () => (db.kitchen?.fridge || []).map(f => ({ f, ex: fridgeExpiry(f) })).filter(x => x.ex && daysUntil(x.ex.d) <= 2 && daysUntil(x.ex.d) >= 0).sort((a, b) => a.ex.d.localeCompare(b.ex.d))[0]?.f;
const hashStr = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
// picks are made once per day and then stay put; past days without picks get none
function questsFor(ds, create = true){
  const g = game();
  if (g.quests[ds]) return g.quests[ds];
  if (!create || ds !== todayStr()) return [];
  const cands = Object.keys(QUESTS).filter(k => { try { return QUESTS[k].rel(ds); } catch(_){ return false; } });
  cands.sort((a, b) => hashStr(ds + a) - hashStr(ds + b));
  // one body thing, one media / kitchen thing, one more — so the three feel different
  const body = ['water', 'steps', 'move', 'meals', 'protein', 'pills', 'weigh'], rest = ['read', 'episode', 'media', 'cook', 'usesoon', 'habit', 'statement'];
  const pick = [cands.find(k => body.includes(k)), cands.find(k => rest.includes(k))].filter(Boolean);
  cands.forEach(k => { if (pick.length < 3 && !pick.includes(k)) pick.push(k); });
  g.quests[ds] = pick.slice(0, 3).map(k => ({ k, a: QUESTS[k].arg ? QUESTS[k].arg() : null }));

  return g.quests[ds];
}
function questProgress(q, ds){
  const Q = QUESTS[q.k]; if (!Q) return { cur: 0, target: 1, done: false };
  try { const [cur, target, unit] = Q.prog(ds, q); return { cur, target, unit, done: cur >= target }; } catch(_){ return { cur: 0, target: 1, done: false }; }
}

function swapQuest(i){
  const g = game(), ds = todayStr(), list = questsFor(ds);
  if (g.swaps[ds]){ toast(tl('one swap a day — this one stays')); return; }
  const used = list.map(q => q.k);
  const next = Object.keys(QUESTS).filter(k => !used.includes(k) && (() => { try { return QUESTS[k].rel(ds); } catch(_){ return false; } })())
    .sort((a, b) => hashStr(ds + 'swap' + a) - hashStr(ds + 'swap' + b))[0];
  if (!next){ toast(tl('no other quest fits today')); return; }
  list[i] = { k: next, a: QUESTS[next].arg ? QUESTS[next].arg() : null };
  g.swaps[ds] = 1; save(); render();
}

  const step = () => {
    g.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.vy += .25; p.x += p.vx; p.y += p.vy; p.r += .2; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-4, -2, 8, 4); g.restore(); });
    if (++f < 90) requestAnimationFrame(step); else cv.remove();
  };
  step();
}
function chime(big){
  try {
    const A = new (window.AudioContext || window.webkitAudioContext)();
    (big ? [523, 659, 784, 1047] : [659, 988]).forEach((hz, i) => {
      const o = A.createOscillator(), v = A.createGain(); o.type = 'triangle'; o.frequency.value = hz;
      v.gain.setValueAtTime(0, A.currentTime + i * .09); v.gain.linearRampToValueAtTime(.12, A.currentTime + i * .09 + .02); v.gain.exponentialRampToValueAtTime(.001, A.currentTime + i * .09 + .35);
      o.connect(v).connect(A.destination); o.start(A.currentTime + i * .09); o.stop(A.currentTime + i * .09 + .4);
    });
  } catch(_){}
}
/* after every change: spot new quests done, a cleared day, level-ups and badges — celebrate each once */
let gameChecking = false;
function checkGame(){
  if (gameChecking || !db.media) return; gameChecking = true;
  try {
    xpCache = null;
    const g = game(), ds = todayStr();
    if (!g.init){
      g.level = levelOf(totalXP());
      BADGES.forEach(b => { let ok = false; try { ok = b.test(); } catch(_){} if (ok) g.badges[b.id] = ds; });
      xpCache = null; g.level = levelOf(totalXP()); g.init = 1; flushSave(); return;
    }
    const qs = questsFor(ds);
    g.qdone = g.qdone || {};
    const doneNow = qs.map((q, i) => questProgress(q, ds).done ? i : -1).filter(i => i >= 0);
    const seen = g.qdone[ds] || [];
    doneNow.filter(i => !seen.includes(i)).forEach(i => celebrate(tl('quest done'), questLabel(qs[i]) + ' · +20 XP'));
    g.qdone = { [ds]: doneNow };
    if (qs.length && doneNow.length === qs.length && !g.cleared[ds]){ g.cleared[ds] = 1; celebrate(tl('day cleared'), '+30 XP', true); }
    BADGES.forEach(b => { if (!g.badges[b.id]){ let ok = false; try { ok = b.test(); } catch(_){} if (ok){ g.badges[b.id] = ds; celebrate(tl('badge unlocked'), tl(b.label), true); } } });
    const lvl = levelOf(totalXP());
    if (lvl > (g.level || 1)){
      const un = [...ACCENTS.filter(a => a.lvl > (g.level || 1) && a.lvl <= lvl).map(a => tl('{x} accent', { x: tl(a.id) })), ...Object.entries(PATTERN_UNLOCKS).filter(([, l]) => l > (g.level || 1) && l <= lvl).map(([k]) => tl('{x} pattern', { x: tl(k) }))];
      celebrate(tl('level {n}', { n: lvl }), un.length ? tl('unlocked: {x}', { x: un.join(', ') }) : tl('keep going'), true);
    }
    g.level = Math.max(g.level || 1, lvl);
    flushSave();
    // home shows live numbers — refresh it unless a popup is open over it
    if (ui.view === 'home' && !$('#modal-overlay').classList.contains('open')) renderHome();
  } finally { gameChecking = false; }
}
