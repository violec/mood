.ri-t{min-width:0; display:flex; flex-direction:column}
.ri-t b{font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ri-t em{font-style:normal; font-family:'Space Mono',monospace; font-size:9.5px; color:var(--ink-3)}
.ri-st{font-size:9px !important; padding:4px 8px !important; cursor:pointer; border:none}
.kg-unlocks{display:flex; gap:10px; padding:10px 12px; border-radius:10px; background:var(--accent-soft); font-size:13px; line-height:1.4}
.kg-unlocks svg{width:18px; height:18px; color:var(--accent); flex:none}
.mn-preview svg{width:14px; height:14px; vertical-align:-2px}
.kg-steps{margin:4px 0 4px 18px; padding:0; font-size:13.5px; line-height:1.5}
.kg-steps li{margin-bottom:4px}
a.btn{text-decoration:none; justify-content:center}

/* imports */
.ih-list{display:flex; flex-direction:column; gap:8px}
.ih-src{display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--line); border-radius:12px; background:none; color:inherit; text-align:left; cursor:pointer; position:relative}
.ih-src > svg:first-child{width:42px; height:42px; flex:none; border-radius:11px; box-shadow:0 1px 3px var(--shadow-soft)}
.ih-src > svg:last-child{width:14px; height:14px; color:var(--ink-3); flex:none}
.ih-src span{display:flex; flex-direction:column; min-width:0; flex:1}
.src-logos{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-top:8px}
.src-logo{display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 4px; border:1px solid var(--line); border-radius:12px; background:var(--bg-hi); color:inherit}
[data-theme="ink"] .src-logo{background:var(--surface)}
.src-logo svg{width:38px; height:38px; border-radius:10px; box-shadow:0 1px 3px var(--shadow-soft)}
.src-logo span{font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.3px; text-transform:uppercase; color:var(--ink-2); text-align:center}
.su-card{border:1.5px dashed var(--accent); border-radius:12px; padding:0 10px 10px; margin-bottom:12px}
.su-card .wn-btn{border:none; margin:0; padding:12px 4px}
.gd-logos{margin:4px 12px 10px}
.gd-keys{margin:4px 12px 12px}
.ig-head{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.ig-head > svg{width:48px; height:48px; flex:none; border-radius:12px}
.ig-pick{justify-content:center}
.ih-src b{font-size:15px} .ih-src em{font-style:normal; font-family:'Space Mono',monospace; font-size:9.5px; color:var(--ink-3); line-height:1.4}
.ih-src input{position:absolute; inset:0; opacity:0; cursor:pointer}
.rg-list{display:flex; flex-direction:column; gap:10px; max-height:62vh; overflow:auto}
.rg{border:1px solid var(--line); border-radius:12px; padding:10px}
.rg.off{opacity:.5}
.rg-head{display:grid; grid-template-columns:30px 1fr 20px; gap:8px; align-items:center}
.rg-t{display:flex; flex-direction:column; border:none; background:none; color:inherit; text-align:left; padding:0}
.rg-t b{font-size:14px} .rg-t em{font-style:normal; font-family:'Space Mono',monospace; font-size:9.5px; color:var(--ink-3)}
.rg-head .ql-caret{transition:transform .15s; color:var(--ink-3)} .rg-head .ql-caret.open{transform:rotate(90deg)} .rg-head .ql-caret svg{width:14px; height:14px}
.rg:not(.off) > .rg-head .ri-check{background:var(--ok); border-color:var(--ok)}
.rg-mode{margin-top:8px} .rg-mode button{flex:1; padding:6px 2px; font-size:9px}
.rg-items{margin-top:6px}
.rg .ri-row{grid-template-columns:30px 30px 1fr auto}
.ri-cov{width:30px; height:42px; border-radius:3px; overflow:hidden; background:var(--bg-lo); display:flex; align-items:center; justify-content:center; color:var(--sepia)}
.ri-cov img{width:100%; height:100%; object-fit:cover} .ri-cov svg{width:14px; height:14px}
/* stats */
.st-years{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px}
.st-hero{padding:14px; border-radius:14px; background:var(--bg-lo); margin-bottom:14px}
.st-hero > b{display:block; font-family:'Space Mono',monospace; font-size:40px; line-height:1}
.st-hero > span{font-family:'Space Mono',monospace; font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:1px}
.st-types{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; margin-top:12px}
.st-types div{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; border-radius:10px; background:var(--bg-hi); border-top:3px solid var(--tc)}
[data-theme="ink"] .st-types div{background:var(--surface)}
.st-types svg{width:18px; height:18px; color:var(--tc)} .st-types b{font-family:'Space Mono',monospace; font-size:18px}
.st-types em{font-style:normal; font-family:'Space Mono',monospace; font-size:8.5px; text-transform:uppercase; color:var(--ink-3)}
.st-legend{display:flex; flex-wrap:wrap; gap:4px 12px; font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-2)}
.st-legend i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px}
.st-chart{width:100%; height:auto}
.st-facts{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px}
.st-facts div{padding:10px; border-radius:10px; border:1px solid var(--line); display:flex; flex-direction:column}
.st-facts b{font-family:'Space Mono',monospace; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.st-facts span{font-family:'Space Mono',monospace; font-size:9px; color:var(--ink-3)}
/* guide */
.gd{display:flex; flex-direction:column; gap:6px}
.gd-sec{border:1px solid var(--line); border-radius:12px; overflow:hidden}
.gd-sec.open{border-color:var(--accent)}
.gd-h{display:flex; align-items:center; gap:10px; width:100%; padding:12px; border:none; background:none; color:inherit; text-align:left}
.gd-h > svg{width:20px; height:20px; color:var(--accent); flex:none}
.gd-h b{flex:1; font-size:15px}
.gd-h .ql-caret svg{width:14px; height:14px; color:var(--ink-3); transition:transform .15s}
.gd-sec.open .gd-h .ql-caret svg{transform:rotate(90deg)}
.gd-sec ul{margin:0 12px 8px 30px; padding:0; font-size:13.5px; line-height:1.45}
.gd-sec li{margin-bottom:6px}
.gd-sec .dt-link{margin:0 12px 12px}
.gd-welcome{display:flex; flex-direction:column; gap:6px; border:1.5px dashed var(--accent)}
.gd-welcome b{font-family:'Fraunces',serif; font-size:19px}
.gd-welcome span{font-size:13.5px; color:var(--ink-2)}
.gd-welcome .row{gap:8px; margin-top:4px}

/* search, upcoming, review card, qr, setup */
.sr-box{margin:0 46px 12px 0}
.sr-g{margin-bottom:12px}
.sr-g .dt-h span{display:inline-flex; align-items:center; gap:6px}
.sr-g .dt-h svg{width:14px; height:14px}
.sr-row{display:grid; grid-template-columns:auto 1fr 16px; gap:10px; align-items:center; width:100%; padding:8px 0; border:none; border-top:1px solid var(--line); background:none; color:inherit; text-align:left}
.sr-row > svg{width:14px; height:14px; color:var(--ink-3)}
.sr-row .ri-t{grid-column:auto}
.sr-row:not(:has(.ri-cov)){grid-template-columns:1fr 16px}
.mc-day .dots .air{width:7px; height:7px; border-radius:50%; background:none; border:2px solid var(--accent); box-sizing:border-box}
.up-row{grid-template-columns:44px 1fr auto}
.up-date{display:flex; flex-direction:column; align-items:center; font-family:'Space Mono',monospace; line-height:1}
.up-date b{font-size:18px} .up-date em{font-style:normal; font-size:9px; text-transform:uppercase; color:var(--ink-3)}
.up-when{font-family:'Space Mono',monospace; font-size:10px; color:var(--accent); white-space:nowrap}
.rc-img{width:100%; border-radius:10px; box-shadow:0 6px 24px rgba(0,0,0,.18)}
.qr-box{background:#fff; padding:14px; border-radius:12px; width:min(280px, 80%); margin:6px auto 8px}
.qr-box svg{width:100%; height:auto; display:block}
.su-hero{text-align:center; padding:6px 0 16px}
.su-hero b{font-family:'Fraunces',serif; font-size:52px; position:relative}
.su-hero b i{display:inline-block; width:12px; height:12px; border-radius:50%; background:var(--accent); margin-left:3px}
.su-hero span{display:block; font-size:14px; color:var(--ink-2); margin-top:4px}
.su-dots{display:flex; justify-content:center; gap:6px; margin-bottom:14px}
.su-dots i{width:8px; height:8px; border-radius:50%; background:var(--line)}
.su-dots i.on{background:var(--accent); width:22px; border-radius:4px} .su-dots i.done{background:var(--ink-3)}
.su-tabs{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.su-tab{display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:10px; border:1.5px solid var(--line); border-radius:12px; background:none; color:inherit; text-align:left; opacity:.5}
.su-tab.on{opacity:1; border-color:var(--accent); background:var(--accent-soft)}
.su-tab span svg{width:20px; height:20px; color:var(--accent)}
.su-tab b{font-size:14px} .su-tab em{font-style:normal; font-family:'Space Mono',monospace; font-size:9px; color:var(--ink-3); line-height:1.35}

/* connections (api keys) */
.cn-group{margin-bottom:14px}
.cn-h{display:flex; flex-direction:column; margin-bottom:6px}
.cn-h b{font-size:14px} .cn-h em{font-style:normal; font-family:'Space Mono',monospace; font-size:9.5px; color:var(--ink-3); line-height:1.4}
.cn-card{display:flex; align-items:center; gap:12px; width:100%; padding:10px 12px; margin-bottom:6px; border:1px solid var(--line); border-radius:12px; background:var(--bg-hi); color:inherit; text-align:left}
[data-theme="ink"] .cn-card{background:var(--surface)}
.cn-card > svg{width:38px; height:38px; flex:none; border-radius:10px}
.cn-t{flex:1; min-width:0; display:flex; flex-direction:column}
.cn-t b{font-size:14.5px} .cn-t em{font-style:normal; font-family:'Space Mono',monospace; font-size:9.5px; color:var(--ink-3); line-height:1.35}
.cn-st{display:inline-flex; align-items:center; gap:4px; flex:none; font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:.4px; text-transform:uppercase; color:var(--accent)}
.cn-st svg{width:13px; height:13px}
.cn-card.on .cn-st{color:var(--ok)}
.cn-card.on{border-color:color-mix(in srgb, var(--ok) 45%, var(--line))}

/* friends */
.fr-av{width:34px; height:34px; flex:none; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:inline-flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-weight:700; font-size:14px}
.fr-av.big{width:42px; height:42px; font-size:17px}
.fr-av svg{width:20px; height:20px}
.cn-card > .fr-av{width:38px; height:38px; border-radius:10px}
.fr-feed, .fr-row{display:flex; align-items:center; gap:10px; width:100%; padding:8px 0; border:none; border-top:1px solid var(--line); background:none; color:inherit; text-align:left}
.panel .dt-h + .fr-feed, .fr-box .dt-h + .fr-feed{border-top:none}
.fr-feed > svg{width:14px; height:14px; color:var(--ink-3); flex:none}
.fr-row .ri-t{flex:1}
.fr-n{font-style:italic !important; font-family:'Libre Caslon Text', Georgia, serif !important; font-size:12px !important; color:var(--ink-2) !important}
.fr-rate{align-items:flex-start}
.fr-chips{display:flex; flex-wrap:wrap; gap:6px}
.fr-chip{display:inline-flex; align-items:baseline; gap:5px; padding:4px 10px; border-radius:14px; border:1px solid var(--line); background:var(--bg-hi); color:inherit; font-size:12.5px}
[data-theme="ink"] .fr-chip{background:var(--surface)}
.fr-chip em{font-style:normal; font-family:'Space Mono',monospace; font-size:10.5px; color:var(--accent)}
.fr-note{font-family:'Libre Caslon Text', Georgia, serif; font-style:italic; font-size:13px; color:var(--ink-2); margin:4px 0 0}
.fr-note b{font-style:normal; font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-3)}
.fr-box{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px}
.fr-box .tabrow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
.fr-box .tn{display:flex; flex-direction:column; font-size:14px}
.fr-box .tn em{font-style:normal; font-family:'Space Mono',monospace; font-size:9.5px; color:var(--ink-3)}
.fr-code{display:flex; flex-direction:column; gap:8px; padding:10px; border-radius:10px; background:var(--bg-lo); margin:6px 0}
.fr-code .mono{font-size:11px; word-break:break-all}

/* library select mode */
.row.f-acts{display:grid; grid-template-columns:1fr 1fr}
.row.f-acts #f-save{grid-column:1 / -1; order:-1; justify-content:center}
.row.f-acts .btn{justify-content:center}
body:has(#sel-actions) #lib-grid{padding-bottom:90px}
.lib-bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 2px 10px; font-family:'Space Mono',monospace; font-size:10.5px; color:var(--ink-3)}
.lib-bar.sel{position:sticky; top:0; z-index:5; padding:10px 12px; border-radius:10px; background:var(--accent-soft); color:var(--ink)}
.lib-bar.sel b{font-size:12.5px}
.lib-bar .dt-link svg{width:13px; height:13px}
.media-card.picked, .ll-row.picked{outline:3px solid var(--accent); outline-offset:2px; border-radius:8px}
.media-card.picked::after, .ll-row.picked::after{content:'✓'; position:absolute; top:6px; left:6px; width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; z-index:3}
.ll-row{position:relative}
.media-card, .ll-row{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.sel-actions{position:fixed; left:12px; right:12px; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:60; display:grid; grid-template-columns:1.4fr 1fr; gap:8px; padding:10px; border-radius:14px; background:var(--bg-hi); border:1.5px solid var(--ink); box-shadow:4px 5px 0 var(--shadow-soft)}
[data-theme="ink"] .sel-actions{background:var(--surface-2); border-color:var(--edge)}
.sel-actions .btn{justify-content:center}

/* albums are square: shown whole on a dark sleeve wherever a portrait cover box shows them */
:is(.media-card .cover, .ll-cover, .ag-cover, .sg-cover, .q-cover, .dt-cover, .detail-head .cover):has(img[data-ph*='r="9.01"'], circle[r="9.01"]){aspect-ratio:1}
.ri-cov:has(img[data-ph*='r="9.01"']){height:30px}
.result-item img[data-ph*='r="9.01"']{height:44px; margin-bottom:18px}

/* a friend's whole library */
.fr-tabs{display:grid; grid-template-columns:1fr 1fr; margin:12px 0 10px}
.fr-tabs button{justify-content:center}
.fr-q{margin-bottom:8px}
.fr-types{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:8px; scrollbar-width:none}
.fr-types button{flex:none; display:inline-flex; align-items:center; gap:5px; padding:6px 11px; border-radius:16px; border:1px solid var(--line); background:var(--bg-hi); color:var(--ink-2); font-family:'Space Mono',monospace; font-size:10.5px; text-transform:uppercase}
.fr-types button svg{width:14px; height:14px}
.fr-types button.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
[data-theme="ink"] .fr-types button{background:var(--surface)}
[data-theme="ink"] .fr-types button.on{background:var(--accent); border-color:var(--accent); color:#fff}
.fr-sels{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.fr-sels select{min-width:0}

/* cover picker */
.cp-grid{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; margin-bottom:6px}
.cp-item{display:flex; flex-direction:column; gap:4px; padding:0; border:none; background:none; color:inherit; text-align:left}
.cp-item img{width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:4px; border:1px solid var(--ink-2); background:var(--bg-lo)}
.cp-grid.sq .cp-item img{aspect-ratio:1}
.cp-item span{font-family:'Space Mono',monospace; font-size:9px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cp-item.on img{outline:3px solid var(--accent); outline-offset:2px}
#d-cover{cursor:pointer}

/* ===== what next? ===== */
.wn-home .wn-types{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin:4px 0 10px; scrollbar-width:none}
.wn-home .wn-types::-webkit-scrollbar{display:none}
.wn-types button{flex:none; display:inline-flex; align-items:center; gap:5px; padding:7px 12px; border-radius:16px; border:1px solid var(--line); background:var(--bg-hi); color:var(--ink-2); font-family:'Space Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px}
.wn-types button svg{width:14px; height:14px}
.wn-types button.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
[data-theme="ink"] .wn-types button{background:var(--surface)}
[data-theme="ink"] .wn-types button.on{background:var(--accent); border-color:var(--accent); color:#fff}
.wn-sels{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; margin-bottom:10px}
.wn-sels select.input{min-width:0; padding-left:8px; padding-right:4px; font-size:13px}
.wn-go{width:100%; justify-content:center}
.wn-go svg{width:17px; height:17px}

.wn-deck{position:fixed; inset:0; z-index:1100; display:none; flex-direction:column; background:var(--bg);
  background-image:radial-gradient(circle, var(--line) 1px, transparent 1.4px); background-size:14px 14px;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); touch-action:none; -webkit-user-select:none; user-select:none}
.wn-deck.open{display:flex}
.wn-top{display:flex; align-items:center; gap:10px; padding:10px 14px}
.wn-x{width:40px; height:40px; flex:none; border-radius:50%; border:1.5px solid var(--ink-2); background:var(--bg-hi); color:var(--ink); display:flex; align-items:center; justify-content:center}
.wn-x svg{width:18px; height:18px}
.wn-tt{flex:1; min-width:0; display:flex; flex-direction:column}
.wn-tt b{font-family:'Libre Caslon Text', Georgia, serif; font-size:19px}
.wn-tt em{font-style:normal; font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wn-done{flex:none}
.wn-done span{display:inline-flex; min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:rgba(255,255,255,.25); align-items:center; justify-content:center; font-size:11px; margin-left:4px}
.wn-stage{flex:1; min-height:0; position:relative; display:grid; grid-template:minmax(0, 1fr) / minmax(0, 1fr); place-items:center; padding:6px 16px 10px; overflow:hidden}
.wn-stage > *{grid-area:1 / 1}
.wn-card, .wn-under{width:min(100%, 430px, calc((100vh - 215px) * .6667)); width:min(100%, 430px, calc((100dvh - 215px) * .6667)); aspect-ratio:2 / 3; border-radius:18px}
.wn-under{background:var(--bg-hi); border:1.5px solid var(--line); transform:translateY(10px) scale(.95); opacity:.8}
.wn-under.two{transform:translateY(20px) scale(.9); opacity:.5}
.wn-card{position:relative; overflow:hidden; background:#1d1915; border:1.5px solid var(--ink); box-shadow:0 0 0 4px var(--glow, transparent), 0 14px 34px var(--shadow-soft); touch-action:none; cursor:grab; will-change:transform}
.wn-card:active{cursor:grabbing}
.wn-card::after{content:''; position:absolute; inset:0; background:var(--glow, transparent); opacity:.45; pointer-events:none; z-index:3}
.wn-cov{position:absolute; inset:0}
.wn-cov img{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none}
.wn-cov .ph{width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:#d9cdb8; background:repeating-linear-gradient(45deg, #2a241e 0 10px, #241f1a 10px 20px)}
.wn-cov .ph .init{font-family:'Libre Caslon Text', serif; font-size:80px; font-weight:700}
.wn-cov .ph svg{width:34px; height:34px}
.wn-card.sq .wn-cov{bottom:auto; aspect-ratio:1}
.wn-tag{position:absolute; top:12px; right:12px; z-index:2; padding:4px 10px; border-radius:12px; background:rgba(20,16,12,.72); color:#fff; font-family:'Space Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.6px}
.wn-tag.queue{background:var(--accent)}
.wn-tag.friend{background:#4F6E72}
.wn-tag.ai{background:#7D5875}
.wn-tag.wild{top:42px; background:#96852F}
.wn-info{position:absolute; left:0; right:0; bottom:0; z-index:2; padding:70px 16px 16px; color:#fff; background:linear-gradient(transparent, rgba(12,10,8,.72) 34%, rgba(12,10,8,.94))}
.wn-info b{display:block; font-family:'Libre Caslon Text', Georgia, serif; font-size:24px; line-height:1.15; margin-bottom:4px}
.wn-info > em{display:flex; align-items:center; gap:6px; font-style:normal; font-family:'Space Mono',monospace; font-size:10.5px; color:rgba(255,255,255,.8)}
.wn-info > em svg{width:13px; height:13px; flex:none}
.wn-genres{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}
.wn-genres span{padding:2px 9px; border-radius:10px; border:1px solid rgba(255,255,255,.4); font-size:11.5px}
.wn-why{display:flex; gap:6px; margin:9px 0 0; font-family:'Libre Caslon Text', Georgia, serif; font-style:italic; font-size:13.5px; color:#f3e7d3}
.wn-why svg{width:14px; height:14px; flex:none; margin-top:2px}
.wn-syn{margin:6px 0 0; font-size:12.5px; line-height:1.45; color:rgba(255,255,255,.78); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.wn-stamp{position:absolute; top:62px; z-index:4; padding:4px 12px; border:4px solid; border-radius:8px; font-family:'Space Mono',monospace; font-weight:700; font-size:26px; letter-spacing:2px; background:rgba(255,255,255,.9); opacity:0; pointer-events:none}
.wn-stamp.yes{left:18px; color:#2f8a4c; transform:rotate(-14deg)}
.wn-stamp.no{right:18px; color:#c0392b; transform:rotate(14deg)}
.wn-bottom{padding:0 16px 14px}
.wn-picked{display:flex; align-items:center; min-height:46px; padding-left:8px}
.wn-picked span{width:30px; height:44px; margin-left:-8px; border-radius:4px; overflow:hidden; border:1.5px solid var(--bg-hi); background:var(--bg-lo); display:flex; align-items:center; justify-content:center; box-shadow:1px 2px 0 var(--shadow-soft); animation:wn-pop .3s}
.wn-picked span.sq{height:30px}
.wn-picked span svg{width:14px; height:14px}
.wn-picked img{width:100%; height:100%; object-fit:cover}
.wn-picked em{margin-left:10px; font-style:normal; font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-3); line-height:1.4}
@keyframes wn-pop{from{transform:scale(.4) translateY(10px); opacity:0}}
.wn-btns{display:flex; align-items:center; justify-content:center; gap:22px; margin-top:6px}
.wn-b{width:62px; height:62px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--bg-hi); border:2px solid; box-shadow:2px 4px 0 var(--shadow-soft); transition:transform .15s, background .15s, color .15s}
.wn-b svg{width:28px; height:28px; stroke-width:2.4}
.wn-b.no{color:#c0392b; border-color:#c0392b}
.wn-b.yes{color:#2f8a4c; border-color:#2f8a4c}
.wn-b.no.hot{background:#c0392b; color:#fff; transform:scale(1.12)}
.wn-b.yes.hot{background:#2f8a4c; color:#fff; transform:scale(1.12)}
.wn-b.undo{width:44px; height:44px; color:var(--ink-2); border-color:var(--ink-3)}
.wn-b.undo svg{width:19px; height:19px}
.wn-b:disabled{opacity:.35}
.wn-b:active{transform:scale(.92)}
.wn-msg, .wn-empty{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; max-width:300px}
.wn-msg{font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-3)}
.wn-empty b{font-family:'Libre Caslon Text', Georgia, serif; font-size:20px}
.wn-empty span{font-size:13.5px; color:var(--ink-2)}
.wn-empty .btn{width:100%; justify-content:center}
.wn-end{align-self:start; width:min(480px, 100%); max-height:100%; overflow-y:auto; touch-action:pan-y; padding-bottom:20px}
.wn-tot{width:100%; justify-content:center; margin-bottom:10px}
.wn-row{display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line)}
.wn-rc{width:54px; flex:none; aspect-ratio:2 / 3; border-radius:4px; overflow:hidden; border:1px solid var(--ink-2); background:var(--bg-lo); display:flex; align-items:center; justify-content:center}
.wn-rc.sq{aspect-ratio:1}
.wn-rc img{width:100%; height:100%; object-fit:cover}
.wn-row .ri-t{flex:1; min-width:0}
.wn-acts{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.wn-acts .btn{padding:6px 10px; font-size:12px}
.wn-acts .btn svg{width:13px; height:13px}
.wn-ok{display:inline-flex; align-items:center; gap:5px; font-style:normal; font-family:'Space Mono',monospace; font-size:10.5px; color:#2f8a4c}
.wn-ok svg{width:13px; height:13px}
.wn-close2{width:100%; justify-content:center; margin-top:14px}
.wn-duel{width:min(520px, 100%); display:flex; flex-direction:column; gap:14px; align-self:center}
.wn-dh{text-align:center; font-family:'Libre Caslon Text', Georgia, serif; font-size:22px}
.wn-dh em{display:block; font-style:normal; font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-3)}
.wn-dpair{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center}
.wn-or{font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-3); text-transform:uppercase}
.wn-duel-c{display:flex; flex-direction:column; gap:6px; padding:8px; border-radius:12px; border:1.5px solid var(--ink-2); background:var(--bg-hi); color:inherit; text-align:left; box-shadow:3px 4px 0 var(--shadow-soft); transition:transform .12s}
.wn-duel-c:active{transform:scale(.96)}
.wn-duel-c b{font-size:14px; line-height:1.2}
.wn-duel-c em{font-style:normal; font-family:'Space Mono',monospace; font-size:9.5px; color:var(--ink-3)}
.wn-dcov{display:block; width:100%; aspect-ratio:2 / 3; border-radius:6px; overflow:hidden; background:var(--bg-lo)}
.wn-dcov.sq{aspect-ratio:1}
.wn-dcov img{width:100%; height:100%; object-fit:cover; display:block}
.wn-dcov .ph{width:100%; height:100%; display:flex; align-items:center; justify-content:center}
.wn-wcard{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center}
.wn-wcard .wn-dcov{width:min(220px, 60%)}
.wn-wcard b{font-family:'Libre Caslon Text', Georgia, serif; font-size:21px}
.wn-wcard em{font-style:normal; font-family:'Space Mono',monospace; font-size:10.5px; color:var(--ink-3)}
.wn-wcard .wn-acts{justify-content:center}
.wn-rest{display:flex; padding-left:8px; margin:6px 0 10px}
.wn-rest span{width:36px; height:52px; margin-left:-8px; border-radius:4px; overflow:hidden; border:1.5px solid var(--bg-hi); background:var(--bg-lo); display:flex; align-items:center; justify-content:center}
.wn-rest span.sq{height:36px}
.wn-rest img{width:100%; height:100%; object-fit:cover}
.wn-restacts{display:flex; flex-direction:column; gap:6px}
.wn-restacts .btn{justify-content:center}
[data-theme="ink"] .wn-x, [data-theme="ink"] .wn-b, [data-theme="ink"] .wn-duel-c{background:var(--surface)}
/* ================= kitchen ================= */
/* redesigned kitchen: overview tiles, shelf cards, aligned rows, recipe cards, cook mode */
.k-over{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:12px}
.k-tile{display:flex; flex-direction:column; align-items:flex-start; gap:3px; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg-hi); text-align:left; color:inherit; min-width:0; box-shadow:0 2px 6px var(--shadow-soft)}
[data-theme="ink"] .k-tile{background:var(--surface); border-color:var(--edge)}
.k-tile .k-n{font-family:'Space Mono',monospace; font-size:22px; font-weight:700; line-height:1}
.k-tile .k-l{font-family:'Space Mono',monospace; font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--ink-2)}
.k-tile .k-s{font-size:11.5px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.k-tile.alert{border-color:var(--accent)} .k-tile.alert .k-n{color:var(--accent)}
.k-tile.good{border-color:var(--ok)} .k-tile.good .k-n{color:var(--ok)}
.k-tabs{margin-bottom:12px}
.k-tabs button{flex-direction:row; gap:6px; padding:9px 4px}
.k-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.k-shelf{padding:10px 12px 4px; margin-bottom:12px}
.k-shelf-h{display:flex; align-items:center; gap:8px; padding-bottom:6px; border-bottom:1px solid var(--line); font-family:'Space Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase}
.k-shelf-h .k-ico{display:inline-flex}
.k-shelf-h .k-ico svg{width:16px; height:16px; color:var(--accent)}
.k-shelf-h em{font-style:normal; color:var(--ink-3); margin-right:auto}
.k-rows{position:relative}
.k-row{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:10px 2px; border-bottom:1px dashed var(--line); background:var(--bg-hi); touch-action:pan-y; cursor:pointer}
[data-theme="ink"] .k-row{background:var(--surface)}
.k-row:last-child{border-bottom:none}
.k-row.armed{background:var(--bad); color:#fff}
.k-name{font-weight:700; font-size:14.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.k-tip{display:block; font-family:'Caveat',cursive; font-weight:400; font-size:14px; color:var(--sepia); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.k-qty{font-family:'Space Mono',monospace; font-size:10.5px; color:var(--ink-3); white-space:nowrap}
.fe{font-family:'Space Mono',monospace; font-size:10px; padding:3px 8px; border-radius:10px; border:1px solid var(--sepia-2); color:var(--ink-2); white-space:nowrap}
.fe.none{border-color:transparent; color:var(--ink-3)}
.fe.warn{border-color:var(--hl-2)}
.fe.soon{border-color:var(--accent); color:var(--accent)}
.fe.over{background:var(--bad); border-color:var(--bad); color:#fff}
.k-hint{font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-3); text-align:center; padding:4px 0 10px}
.k-form{display:flex; flex-direction:column; gap:12px; padding:4px 6px}
.k-two{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:8px}
.k-shelves{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px}
.k-shelf-pick{display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 2px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink-2); font-size:10.5px; min-width:0}
.k-shelf-pick span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.k-shelf-pick svg{width:18px; height:18px}
.k-shelf-pick.on{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.k-exp{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.k-exp .input{flex:1; min-width:130px}
.k-guess{margin-top:6px}
.k-recipes{display:flex; flex-direction:column; gap:10px}
.k-rcard{display:grid; grid-template-columns:72px minmax(0,1fr); gap:12px; align-items:center; padding:8px; border-radius:12px; border:1px solid var(--line); background:var(--bg-hi); text-align:left; color:inherit; box-shadow:0 2px 6px var(--shadow-soft)}
[data-theme="ink"] .k-rcard{background:var(--surface); border-color:var(--edge)}
.k-thumb, .k-rphoto{aspect-ratio:1; border-radius:8px; overflow:hidden; display:block; background:repeating-linear-gradient(45deg, var(--bg-lo) 0 8px, var(--bg) 8px 16px)}
.k-thumb img, .k-rphoto img{width:100%; height:100%; object-fit:cover; display:block}
.k-thumb .ph, .k-rphoto .ph{display:flex; width:100%; height:100%; align-items:center; justify-content:center; gap:4px; color:var(--sepia)}
.k-thumb .ph svg, .k-rphoto .ph svg{width:18px; height:18px}
.k-thumb .ph b, .k-rphoto .ph b{font-size:22px}
.k-rinfo{display:flex; flex-direction:column; gap:4px; min-width:0}
.k-rt{font-weight:700; font-size:16px; line-height:1.2}
.k-rm{font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-3)}
.k-badge{align-self:flex-start; display:inline-flex; align-items:center; gap:4px; font-family:'Space Mono',monospace; font-size:9.5px; font-weight:700; padding:3px 8px; border-radius:10px; border:1px solid var(--sepia-2); color:var(--ink-2)}
.k-badge svg{width:10px; height:10px}
.k-badge.ok{border-color:var(--ok); color:var(--ok)}
.k-rhero{display:grid; grid-template-columns:96px minmax(0,1fr); gap:14px; align-items:start; margin-bottom:12px}
.k-rhead{padding-right:34px; display:flex; flex-direction:column; gap:6px}
.modal .k-rhead h2{font-size:22px; padding:0; margin:0}
.k-scaler{display:flex; align-items:center; gap:10px}
.k-scaler .ly-btn{width:34px; font-size:18px}
.k-scaler b{font-family:'Space Mono',monospace; font-size:12px}
.k-macros{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px; text-align:center}
.k-macros div{padding:8px 2px; border-radius:8px; background:var(--bg-lo)}
.k-macros b{display:block; font-family:'Space Mono',monospace; font-size:14px}
.k-macros span{font-family:'Space Mono',monospace; font-size:9px; color:var(--ink-3); text-transform:uppercase}
.k-macros em{grid-column:1/-1; font-style:normal; font-family:'Space Mono',monospace; font-size:9.5px; color:var(--ink-3)}
.k-ing{display:grid; grid-template-columns:10px 72px minmax(0,1fr); gap:8px; align-items:baseline; padding:6px 0; border-bottom:1px dashed var(--line); font-size:14px}
.k-dot{width:8px; height:8px; border-radius:50%; background:var(--ok)}
.k-ing.miss .k-dot{background:transparent; border:1.5px solid var(--bad)}
.k-amt{font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-2)}
.k-iname .sub{display:block; font-family:'Caveat',cursive; color:var(--sepia)}
.k-check{display:flex; gap:8px; align-items:center; padding:5px 0}
.k-check em{font-style:normal; color:var(--ink-3); font-size:12px}
.modal.cooking{min-height:100dvh}
.cook{display:flex; flex-direction:column; gap:16px; min-height:calc(100dvh - 60px)}
.cook-top{display:flex; justify-content:space-between; gap:10px; font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-3); padding-right:40px}
.cook-bar{height:6px; border-radius:3px; background:var(--bg-lo); overflow:hidden}
.cook-bar i{display:block; height:100%; background:var(--accent)}
.cook-step{flex:1; font-size:24px; line-height:1.45; padding:10px 2px}
.cook-ings{flex:1; display:flex; flex-direction:column; gap:8px; font-size:17px}
.cook-nav{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
.cook-nav .btn{justify-content:center; padding:14px 6px}
.k-addbar{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 44px; gap:8px; margin-bottom:12px}
.k-addbar .btn{justify-content:center; padding:0}
.k-srow{display:grid; grid-template-columns:28px minmax(0,1fr) auto auto; gap:8px; align-items:center; padding:9px 2px; border-bottom:1px dashed var(--line)}
.k-srow:last-child{border-bottom:none}
.k-box{width:24px; height:24px; border-radius:6px; border:1.6px solid var(--sepia-2); background:transparent; display:flex; align-items:center; justify-content:center; color:#fff; padding:0}
.k-box.on{background:var(--ok); border-color:var(--ok)}
.k-box svg{width:14px; height:14px}
.k-sname{min-width:0; cursor:pointer}
.k-sname b{font-size:14.5px}
.k-sname .k-qty{margin-left:7px}
.k-from{font-family:'Caveat',cursive; color:var(--sepia); margin-left:7px}
.k-srow.done .k-sname b{text-decoration:line-through; color:var(--ink-3)}
.k-tofridge{display:inline-flex; align-items:center; gap:4px; padding:4px 8px; border-radius:12px; border:1px solid var(--ok); background:transparent; color:var(--ok); font-family:'Space Mono',monospace; font-size:9.5px; font-weight:700}
.k-tofridge svg{width:12px; height:12px}
.k-srow .sdot{width:21px; height:21px; border-radius:50%; border:1.5px solid var(--sepia-2); background:transparent; padding:0; display:flex; align-items:center; justify-content:center; color:#fff}
.k-srow .sdot.on{background:var(--accent); border-color:var(--accent-2)}
.k-srow .sdot svg{width:11px; height:11px}
.k-bought .k-shelf-h .dt-link{margin-left:auto}
@media (max-width:400px){ .k-shelves{grid-template-columns:repeat(4,minmax(0,1fr))} .k-tile{padding:8px} .k-tile .k-n{font-size:19px} }

.fridge-cat{font-family:'Space Mono',monospace; font-size:9px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:var(--sepia); margin:14px 0 2px; display:flex; align-items:center; gap:8px}
.fridge-cat::after{content:''; flex:1; border-top:1px dashed var(--line)}
.fridge-row{display:grid; grid-template-columns:minmax(0,1.4fr) auto auto auto auto; gap:6px 8px; align-items:center; padding:7px 2px; border-bottom:1px dashed var(--line)}
.fridge-row .fn{font-weight:700; font-size:14px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fridge-row .fq{font-family:'Space Mono',monospace; font-size:10.5px; color:var(--ink-2); white-space:nowrap}
.fridge-row .fe{font-family:'Space Mono',monospace; font-size:9px; padding:2px 7px; border-radius:9px; border:1px solid var(--sepia-2); color:var(--ink-3); white-space:nowrap}
.fridge-row .fe.soon{border-color:var(--accent); color:var(--accent)}
.fridge-row .fe.over{border-color:var(--bad); color:var(--bad)}
.fridge-row .ftip{grid-column:1 / -1; font-family:'Caveat',cursive; font-size:15px; color:var(--sepia); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:-3px}
.fridge-add{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr); gap:8px; margin-top:12px}
.fridge-add .rowb{display:flex; gap:8px; grid-column:1 / -1}
.fridge-add .rowb .input{flex:1}
@media (max-width:560px){
  .fridge-row{grid-template-columns:minmax(0,1fr) auto auto auto}
  .fridge-row .fq{display:none}
  .fridge-add{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
}
/* shopping list */
.shop-row{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:6px 10px; align-items:center; padding:8px 2px; border-bottom:1px dashed var(--line)}
.shop-row .sdot{
  width:21px; height:21px; border-radius:50%; border:1.7px solid var(--sepia-2); cursor:pointer; flex:none;
  display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; color:#F6EFDD;
}
.shop-row .sdot.on{background:var(--accent); border-color:var(--accent-2)}
.shop-row .sn{min-width:0; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.shop-row .sn .nm{font-weight:700; font-size:14.5px}
.shop-row.done .sn .nm{text-decoration:line-through; text-decoration-color:var(--sepia); color:var(--ink-3)}
.shop-row .sn .sq{font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-2); margin-left:7px}
.shop-row .sn .sf{font-family:'Caveat',cursive; font-size:14px; color:var(--sepia); margin-left:8px}
.merge-chip{
  grid-column:2 / -1; justify-self:start; margin-top:-2px;
  font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.5px; padding:3px 9px;
  border:1px dashed var(--accent); color:var(--accent); border-radius:10px; background:none; cursor:pointer;
}
.merge-bar{
  position:sticky; bottom:calc(100px + env(safe-area-inset-bottom)); z-index:5;
  display:flex; gap:8px; align-items:center; padding:10px 12px; margin-top:12px; border-radius:8px;
  background:var(--ink); color:var(--bg-hi); box-shadow:0 6px 16px var(--shadow);
}
.merge-bar .mono{font-size:10px; letter-spacing:1px}
.merge-bar .btn{box-shadow:none}
.merge-bar .btn:not(.primary){color:var(--ink)}  /* dark bar inherits light text — the plain key needs its ink back */
.recipe-card{cursor:pointer; margin-bottom:12px}
.recipe-card .rt{font-size:17px; font-weight:700}
.recipe-card .ro{font-family:'Space Mono',monospace; font-size:9.5px; color:var(--ink-3); letter-spacing:1px; text-transform:uppercase; margin-top:2px}
.cookable{font-family:'Space Mono',monospace; font-size:9px; letter-spacing:1px; padding:3px 8px; border-radius:10px; border:1.5px solid var(--ok); color:var(--ok); font-weight:700}
.cookable.no{border-color:var(--sepia-2); color:var(--ink-3); font-weight:400}
.ing-row{display:flex; gap:8px; padding:5px 0; border-bottom:1px dashed var(--line); font-size:13.5px; align-items:baseline}
.ing-row .ia{font-family:'Space Mono',monospace; font-size:10.5px; color:var(--ink-2); width:76px; flex:none}
.ing-row .have{color:var(--ok); font-family:'Space Mono',monospace; font-size:10px; margin-left:auto; flex:none}
.ing-row .miss{color:var(--bad); font-family:'Space Mono',monospace; font-size:10px; margin-left:auto; flex:none}
.ing-row .sub{font-family:'Caveat',cursive; font-size:15px; color:var(--sepia)}
.step-row{display:flex; gap:10px; padding:7px 0; font-size:14.5px; line-height:1.5}
.step-row .sn{font-family:'Space Mono',monospace; font-weight:700; font-size:11px; color:var(--accent); flex:none; padding-top:2px}

/* ================= habits (chains) ================= */
.habit-card{margin-bottom:14px}
.habit-card .hname{font-size:17px; font-weight:700; border-bottom:3px solid var(--hc, var(--accent)); padding-bottom:2px}
.chain-strip{display:flex; align-items:center; margin-top:14px; padding:2px}
.chd{
  width:18px; height:18px; border-radius:50%; flex:none; cursor:pointer; position:relative;
  border:1.8px solid var(--sepia-2); background:transparent; transition:transform .1s;
}
.chd:hover{transform:scale(1.2)}
.chd.on{background:var(--ok); border-color:var(--ok)}
.chd.on::after{content:''; position:absolute; inset:2px; background:#F6EFDD; -webkit-mask:var(--check-mask) center/80% no-repeat; mask:var(--check-mask) center/80% no-repeat}
.chd.today{box-shadow:0 0 0 2px var(--accent-soft); border-color:var(--accent)}
.chd .dl{position:absolute; top:-14px; left:50%; transform:translateX(-50%); font-family:'Space Mono',monospace; font-size:7px; color:var(--ink-3)}
.chc{flex:1; height:2px; background:var(--line); min-width:4px}
.chc.on{background:var(--ok); height:3px}
.hstreak{font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:1px; color:var(--ink-2)}
.hstreak b{color:var(--accent); font-size:13px}

/* ================= queue ================= */
/* each section is a solid card — no text ever sits on the dotted page */
.qpanel{max-width:680px; margin-bottom:18px; padding:14px 14px 6px}
.qp-head{display:flex; align-items:baseline; gap:10px; padding:0 2px 10px; border-bottom:1px solid var(--line)}
.qp-head h3{font-size:19px; font-weight:700; letter-spacing:-.3px}
.qp-meta{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.5px; color:var(--ink-3)}
.qp-meta b{color:var(--accent)}
.qp-head .qp-more{margin-left:auto; align-self:center}
.qp-hint{font-family:'Space Mono',monospace; font-size:9.5px; color:var(--ink-3); padding:8px 2px 0}
.qp-empty{padding:22px 4px 18px; text-align:center}
.qp-empty .hand{font-size:22px; color:var(--sepia); display:block}
.qp-empty .mono{font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-3); display:block; margin-top:4px}

.q-item{position:relative; display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px dashed var(--line); background:transparent}
.q-item:last-child{border-bottom:none}
.q-item.dragging{z-index:5; background:var(--bg-hi); box-shadow:0 8px 20px var(--shadow); border-radius:8px; transform:scale(1.02)}
.q-handle{
  width:16px; flex:none; align-self:stretch; display:flex; align-items:center; justify-content:center;
  color:var(--sepia-2); cursor:grab; touch-action:none; user-select:none; font-size:14px; line-height:1;
}
.q-handle:active{cursor:grabbing; color:var(--accent)}
/* the thread: dashed line from node to node, so the queue reads as a path, not a list */
.q-rail .q-item:not(:last-child)::after{
  content:''; position:absolute; left:13px; top:50%; height:100%; border-left:2px dashed var(--sepia-2); z-index:0;
}
.q-node{
  position:relative; z-index:1; width:28px; height:28px; flex:none; align-self:center; border-radius:50%;
  background:var(--bg-hi); border:2px solid var(--ink); color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  font-family:'Space Mono',monospace; font-size:10px; font-weight:700;
}
.q-node.q-handle{width:28px; padding:0; font-size:10px; color:var(--ink); cursor:grab; touch-action:none; user-select:none}
.q-node svg{width:13px; height:13px}
.q-node.next{background:var(--accent); border-color:var(--accent-2); color:#FDF3E3; box-shadow:0 0 0 4px var(--accent-soft)}
.q-node.done{background:var(--ok); border-color:var(--ok); color:#FDF3E3}
/* in-progress node = progress ring */
.q-node.ring{border:none; padding:3px; background:conic-gradient(var(--accent) calc(var(--pct) * 1%), var(--line) 0)}
.q-node.ring span{width:100%; height:100%; border-radius:50%; background:var(--bg-hi); display:flex; align-items:center; justify-content:center; color:var(--accent)}
.q-node.ring svg{width:9px; height:9px; margin-left:1px}
.q-item.dragging .q-node{box-shadow:0 0 0 4px var(--accent-soft)}
/* thread continues from "in progress" into "up next" — out the bottom of one card, into the top of the next */
.q-rail.to-next .q-item:last-child::after{content:''; position:absolute; left:13px; top:50%; bottom:-8px; border-left:2px dashed var(--sepia-2); z-index:0}
.q-rail.from-prev .q-item:first-child::before{content:''; position:absolute; left:13px; top:0; height:50%; border-left:2px dashed var(--sepia-2); z-index:0}
.q-link{max-width:680px; height:18px; margin:-18px 0 0 27px; border-left:2px dashed var(--sepia-2)}
.q-cover{position:relative; width:52px; flex:none; aspect-ratio:2/3; border-radius:4px; overflow:hidden; border:1px solid var(--ink-2); box-shadow:2px 3px 0 var(--shadow-soft); cursor:pointer;
  background:repeating-linear-gradient(45deg, var(--bg-lo) 0 8px, var(--bg) 8px 16px)}
.q-cover img{width:100%; height:100%; object-fit:cover; display:block; filter:sepia(.14) contrast(1.03) saturate(.92)}
.q-cover .ph{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--sepia)}
.q-cover .ph svg{width:18px;height:18px}
.q-no{
  position:absolute; left:0; bottom:0; z-index:2; min-width:20px; padding:2px 4px; border-top-right-radius:4px;
  background:var(--ink); color:var(--bg-hi); font-family:'Space Mono',monospace; font-size:9px; font-weight:700; text-align:center;
}
.q-info{flex:1; min-width:0}
.q-info .t{font-weight:700; font-size:15px; line-height:1.25; cursor:pointer; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.q-info .s{display:flex; align-items:center; gap:5px; margin-top:4px; font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.q-info .s svg{width:11px; height:11px; flex:none}
.q-info .s span{overflow:hidden; text-overflow:ellipsis}
.q-eta{display:inline-block; margin-top:6px; padding:2px 7px; border-radius:9px; background:var(--accent-soft); color:var(--accent-2); font-family:'Space Mono',monospace; font-size:9.5px; font-weight:700}
.q-prog{display:flex; align-items:center; gap:8px; margin-top:7px}
.q-prog .bar{flex:1; max-width:170px; height:5px; border-radius:3px; background:var(--bg-lo); box-shadow:inset 0 1px 2px var(--shadow-soft); overflow:hidden}
.q-prog .bar i{display:block; height:100%; background:var(--accent)}
.q-prog .lbl{font-family:'Space Mono',monospace; font-size:9.5px; color:var(--ink-2); white-space:nowrap}
.q-act{display:flex; flex-direction:column; align-items:center; gap:6px; flex:none}
.q-main{
  width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--ink); background:linear-gradient(180deg, var(--bg-hi), var(--bg)); color:var(--ink);
  box-shadow:0 2px 0 var(--ink-2), inset 0 1px 0 var(--bev-hi);
}
.q-main svg{width:16px; height:16px}
.q-main:active{transform:translateY(2px); box-shadow:none}
.q-main.go{background:linear-gradient(180deg, var(--accent), var(--accent-2)); border-color:var(--accent-2); color:#FDF3E3; box-shadow:0 2px 0 #7E2A10, inset 0 1px 0 rgba(255,240,220,.4)}
.q-main.ok{background:var(--ok); border-color:var(--ok); color:#FDF3E3; box-shadow:0 2px 0 rgba(0,0,0,.25)}
.q-more{width:32px; height:24px; border:none; background:transparent; border-radius:6px; color:var(--ink-3); display:flex; align-items:center; justify-content:center}
.q-more svg{width:18px; height:18px}
.q-more:active{background:var(--bg-lo)}
.q-item.done .q-cover{opacity:.55; filter:saturate(.5)}
.q-item.done .q-info .t{text-decoration:line-through; text-decoration-color:var(--sepia); color:var(--ink-3)}
.q-newlist{
  width:100%; max-width:680px; padding:14px; border-radius:10px; border:1.5px dashed var(--sepia-2); background:var(--bg-hi);
  font-family:'Space Mono',monospace; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-2);
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.q-newlist svg{width:14px; height:14px; color:var(--accent)}

/* labelled main action on queue rows */
.q-pill{
  display:inline-flex; align-items:center; gap:5px; padding:8px 11px; border-radius:18px; white-space:nowrap;
  border:1px solid var(--ink); background:linear-gradient(180deg, var(--bg-hi), var(--bg)); color:var(--ink);
  box-shadow:0 2px 0 var(--ink-2), inset 0 1px 0 var(--bev-hi);
  font-family:'Space Mono',monospace; font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
}
.q-pill svg{width:12px; height:12px}
.q-pill:active{transform:translateY(2px); box-shadow:none}
.q-pill.go{background:linear-gradient(180deg, var(--accent), var(--accent-2)); border-color:var(--accent-2); color:#FDF3E3; box-shadow:0 2px 0 #7E2A10, inset 0 1px 0 rgba(255,240,220,.4)}
.q-pill.ok{background:var(--ok); border-color:var(--ok); color:#FDF3E3; box-shadow:0 2px 0 rgba(0,0,0,.25)}
.q-act{align-items:flex-end}
button.q-prog{border:none; background:none; padding:4px 0; width:100%; text-align:left; cursor:pointer; color:inherit; flex-wrap:wrap; row-gap:3px}
button.q-prog .bar{flex:1 1 90px}
.q-prog .lbl.muted{color:var(--ink-3); font-style:italic}

/* update-progress sheet */
.pg-head{display:flex; gap:12px; align-items:center; padding:6px 8px 12px; border-bottom:1px solid var(--line)}
.pg-head .q-cover{width:40px; box-shadow:none}
.pg-t{font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pg-s{font-family:'Space Mono',monospace; font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-3); margin-top:2px}
.pg-big{display:flex; align-items:baseline; justify-content:center; gap:8px; padding:16px 8px 6px}
.pg-big b, .pg-big input{font-family:'Space Mono',monospace; font-size:38px; font-weight:700; color:var(--ink); line-height:1}
.pg-big input{width:130px; text-align:right; border:none; border-bottom:2px dashed var(--sepia-2); background:transparent; outline:none; padding:0 2px}
.pg-big input:focus{border-bottom-color:var(--accent)}
.pg-big span{font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-3)}
.pg-range{width:calc(100% - 16px); margin:10px 8px 4px; accent-color:var(--accent)}
.pg-steps{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; padding:8px}
.pg-steps{flex-wrap:nowrap; gap:5px}
.pg-steps .btn{flex:1; min-width:0; padding:8px 0; justify-content:center; letter-spacing:.5px}
/* while a bottom sheet is up, toasts drop in from the top instead of hiding behind it */
body:has(.modal-overlay.sheet-open) #toast{bottom:auto; top:calc(14px + env(safe-area-inset-top))}
.pg-wide{width:calc(100% - 16px); margin:6px 8px 4px; justify-content:center; padding:12px}
.pg-next{display:flex; align-items:baseline; gap:8px; justify-content:center; padding:4px 8px 8px; font-family:'Space Mono',monospace; font-size:12px; min-width:0}
.pg-next .k{font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-3)}
.pg-next .nm{color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pg-row{justify-content:center; padding:4px 8px}
.pg-field{padding:8px}
.pg-foot{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-top:10px; border-top:1px solid var(--line); padding-top:6px}
.pg-foot .sheet-btn{flex-direction:column; gap:5px; justify-content:center; text-align:center; font-size:10px; padding:10px 4px}

/* queue tabs + collapsible list cards */
.q-tabs{max-width:680px; margin-bottom:8px}
.q-filter{max-width:680px; margin-bottom:14px}
.q-tabs button{flex-direction:row; gap:7px; padding:10px 4px; font-size:10.5px}
.q-tabs button svg{width:15px; height:15px}
.ql-card{padding-bottom:12px}
.ql-card.open{padding-bottom:6px}
.qp-titles{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0}
.qp-titles h3{line-height:1.15}
.ql-card .qp-head{cursor:pointer; align-items:center}
.ql-card:not(.open) .qp-head{border-bottom:none; padding-bottom:6px}
.ql-caret{display:inline-flex; color:var(--ink-3); transition:transform .15s}
.ql-caret svg{width:14px; height:14px}
.ql-card.open .ql-caret{transform:rotate(90deg); color:var(--accent)}
.ql-sum{cursor:pointer; padding:2px 2px 0}
.ql-covers{display:flex; align-items:center; padding-left:8px}
.ql-covers span{width:38px; aspect-ratio:2/3; margin-left:-8px; border-radius:3px; overflow:hidden; border:1.5px solid var(--bg-hi);
  box-shadow:1px 2px 3px var(--shadow-soft); background:var(--bg-lo); display:flex; align-items:center; justify-content:center; color:var(--sepia)}
.ql-covers span img{width:100%; height:100%; object-fit:cover; display:block}
.ql-covers span i svg, .ql-covers span .ph svg{width:14px; height:14px}
.ql-covers span .ph{display:flex; align-items:center; justify-content:center; width:100%; height:100%}
.ql-covers span.done{opacity:.5; filter:saturate(.4)}
.ql-covers b{margin-left:8px; font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-3)}
.ql-bar{height:5px; margin-top:10px; border-radius:3px; background:var(--bg-lo); box-shadow:inset 0 1px 2px var(--shadow-soft); overflow:hidden}
.ql-bar i{display:block; height:100%; background:var(--ok)}
.q-newlist{margin-bottom:14px}

/* swipe actions on queue rows */
.q-item{touch-action:pan-y; background:var(--bg-hi)}
[data-theme="ink"] .q-item{background:var(--surface)}
.q-rail{position:relative}
.sw-bg{position:absolute; left:-14px; right:-14px; z-index:0; display:flex; align-items:center; padding:0 22px;
  font-family:'Space Mono',monospace; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#FDF3E3; opacity:.55; transition:opacity .12s}
.sw-bg.armed{opacity:1}
.sw-bg.l{justify-content:flex-end}
.sw-bg span{display:inline-flex; align-items:center; gap:7px}
.sw-bg svg{width:15px; height:15px}
.sw-bg.go{background:var(--accent)}
.sw-bg.ok{background:var(--ok)}
.sw-bg.bad{background:var(--bad)}
.sw-bg.mute{background:var(--sepia)}
.q-item{z-index:1}
#toast .t-undo{margin-left:6px; padding:5px 10px; border-radius:5px; border:1px solid currentColor; background:transparent; color:var(--hl);
  font-family:'Space Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase}

/* layouts */
.ly-stack{display:flex; flex-direction:column; gap:16px}
.ly-stack > .panel, .ly-stack > div > .panel{margin:0}
.health-stack .health-top{margin-bottom:0}
.ag-panel{margin-top:0}
[data-sec="progress"]:last-child .q-link, [data-sec="progress"]:has(+ .sec-hidden) .q-link{display:none}
.sec-hidden{display:none !important}
.ly-hint{font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-3); padding:0 10px 8px}
.ly-group{padding:4px 6px 10px}
.ly-title{font-family:'Space Mono',monospace; font-size:9.5px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--ink-3); padding:8px 4px 6px}
.ly-row{display:grid; grid-template-columns:minmax(0,1fr) 36px 36px 40px; gap:4px; align-items:center; padding:5px 4px; border-bottom:1px dashed var(--line)}
.ly-row:last-child{border-bottom:none}
.ly-name{font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ly-row.off .ly-name{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--sepia-2)}
.ly-btn{height:34px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink-2); display:flex; align-items:center; justify-content:center}
.ly-btn svg{width:16px; height:16px}
.ly-btn:disabled{opacity:.3}
.ly-row.off .ly-eye{color:var(--ink-3)}
.ly-row:not(.off) .ly-eye{color:var(--accent)}
.ly-foot{border-top:1px solid var(--line); margin-top:4px}
.ly-foot .sheet-btn{justify-content:center}

/* action sheet — small menu that rises from the bottom (also used by other views) */
.modal.sheet{align-self:flex-end; margin-top:auto; min-height:0; padding:10px 10px calc(12px + env(safe-area-inset-bottom)); border-radius:16px 16px 0 0; width:min(520px, 100%)}
.modal-overlay.sheet-open{align-items:flex-end; padding:0}
.modal.sheet .modal-close{display:none}
.sheet-title{font-weight:700; font-size:15px; padding:8px 10px 10px; border-bottom:1px solid var(--line); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sheet-btn{
  display:flex; align-items:center; gap:12px; width:100%; padding:13px 10px; border:none; background:transparent; border-radius:8px;
  font-family:'Space Mono',monospace; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--ink); text-align:left;
}
.sheet-btn svg{width:17px; height:17px; flex:none; color:var(--ink-3)}
.sheet-btn:active{background:var(--bg-lo)}
.sheet-btn.danger, .sheet-btn.danger svg{color:var(--bad)}
.sheet-cancel{margin-top:6px; border-top:1px solid var(--line); border-radius:0; justify-content:center; color:var(--ink-3)}

/* ================= spend ================= */
.spend-grid{display:grid; grid-template-columns:minmax(240px,330px) 1fr; gap:24px; align-items:start}
.donut-wrap{display:flex; flex-direction:column; align-items:center; gap:10px; padding:8px}
.sp-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px dashed var(--line)}
.sp-row .sw{width:12px; height:12px; border-radius:3px; flex:none; box-shadow:0 1px 1px var(--shadow-soft), inset 0 1px 0 rgba(255,250,235,.3)}
.sp-row .nm{font-weight:700; font-size:14px; flex:none}
.sp-row .nt{font-family:'Caveat',cursive; font-size:16px; color:var(--sepia); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 4px}
.sp-row .amt{font-family:'Space Mono',monospace; font-weight:700; font-size:13px; flex:none}
.sp-row .pct{font-family:'Space Mono',monospace; font-size:9px; color:var(--ink-3); width:36px; text-align:right; flex:none}
.sp-import textarea.input{min-height:130px; font-family:'Space Mono',monospace; font-size:11.5px; line-height:1.55; background-image:none}
/* category accordions with transaction lists */
.cat{border:1px solid var(--line); border-radius:8px; margin-bottom:8px; overflow:hidden; background:var(--card)}
.cat-head{display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; user-select:none}
.cat-head .caret{transition:transform .15s; font-size:10px; color:var(--ink-3)}
.cat.open .cat-head .caret{transform:rotate(90deg)}
.cat-head .sw{width:12px; height:12px; border-radius:3px; flex:none; box-shadow:0 1px 1px var(--shadow-soft)}
.cat-head .nm{font-weight:700; font-size:14px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cat-head .amt{font-family:'Space Mono',monospace; font-weight:700; font-size:13px; flex:none}
.cat-head .pct{font-family:'Space Mono',monospace; font-size:9px; color:var(--ink-3); width:34px; text-align:right; flex:none}
.cat-txs{display:none; padding:2px 12px 10px; border-top:1px dashed var(--line)}
.cat.open .cat-txs{display:block}
.tx-row{
  display:grid; grid-template-columns:minmax(0,1fr) auto auto auto; gap:4px 8px; align-items:center;
  padding:6px 0; border-bottom:1px dashed var(--line);
}
.tx-row:last-child{border-bottom:none}
.tx-row .d{min-width:0; font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tx-row .amt{font-family:'Space Mono',monospace; font-size:11.5px; font-weight:700; white-space:nowrap; text-align:right}
.tx-row select.mini{padding:4px 24px 4px 8px; font-size:10px; max-width:min(160px, 34vw); border-radius:5px}
.tx-del{background:none; border:none; color:var(--bad); font-family:'Space Mono',monospace; font-size:12px; padding:2px 5px; cursor:pointer; opacity:.55; flex:none; display:inline-flex; align-items:center}
/* drawn icons that replaced typed symbols — sized per spot */
.tx-del svg, .tdel svg{width:13px; height:13px}
.caret{display:inline-flex; align-items:center}
.caret svg{width:12px; height:12px}
.chip svg{width:12px; height:12px; vertical-align:-2px; margin-right:3px}
.tabrow .fav svg{width:17px; height:17px; fill:currentColor}
.modal-close{display:inline-flex; align-items:center; justify-content:center}
.modal-close svg{width:15px; height:15px}
.pill-latch{display:inline-flex; align-items:center; justify-content:center}
.pill-latch svg{width:15px; height:15px}
.wnext svg, .hstreak svg{width:12px; height:12px; vertical-align:-2px}
.hstreak svg{color:var(--accent)}
.shop-row .sdot svg{width:12px; height:12px; stroke-width:3}
.btn[aria-label] svg{width:13px; height:13px}
.lgk{display:inline-flex; align-items:center; gap:5px; margin-right:10px}

@media (max-width:560px){
