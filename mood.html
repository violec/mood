async function friendCacheSave(){
  const d = await journalStore(); if (!d) return;
  await new Promise(res => { try { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(JSON.stringify(friendCache), 'friendCache'); tx.oncomplete = res; tx.onerror = res; } catch(_){ res(); } });
}
async function fetchProfile(id){
  const cfg = syncCfg();
  const r = await fetch(`https://api.github.com/gists/${id}`, { cache: 'no-store', headers: { Accept: 'application/vnd.github+json', ...(cfg?.token ? { Authorization: 'Bearer ' + cfg.token } : {}) } });
  if (r.status === 404) throw new Error(tl('that friend code doesn\'t work anymore — they may have stopped sharing'));
  if (!r.ok) throw await ghFail(r);
  const f = (await r.json()).files?.[PROFILE_FILE];
  if (!f) throw new Error(tl('that isn\'t a mood friend code'));
  const p = JSON.parse(f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content);
  if (p.app !== 'mood-profile' || !Array.isArray(p.items)) throw new Error(tl('that isn\'t a mood friend code'));
  return p;
}
let friendsBusy = false;
async function loadFriends(force){
  const F = friendsList(); if (!F.length || friendsBusy) return;
  if (!navigator.onLine) return;
  friendsBusy = true;
  let changed = false;
  try {
    for (const f of F){
      if (!force && friendCache[f.id]?.at > Date.now() - 30 * 60e3) continue;
      try { friendCache[f.id] = { at: Date.now(), p: await fetchProfile(f.id) }; changed = true; }
      catch(e){ friendCache[f.id] = { ...(friendCache[f.id] || {}), at: Date.now(), err: e.message }; }
    }
  } finally { friendsBusy = false; }
  if (changed){ friendIndex = null; await friendCacheSave(); if (ui.view === 'home') render(); }
}
const friendName = f => f.nick || friendCache[f.id]?.p?.name || tl('friend');
// type + title → what each friend did with it
function friendsFor(type, title){
  if (!friendIndex){
    friendIndex = new Map();
    friendsList().forEach(f => (friendCache[f.id]?.p?.items || []).forEach(it => {
      const k = it.t + ':' + normTitle(it.title);
      (friendIndex.get(k) || friendIndex.set(k, []).get(k)).push({ f, it });
    }));
  }
  return friendIndex.get(type + ':' + normTitle(title)) || [];
}
const statusWord = (it) => it.s === 'active' ? tl(it.t === 'book' ? 'reading' : it.t === 'game' ? 'playing' : it.t === 'album' ? 'listening' : 'watching')
  : it.s === 'planned' ? tl(it.t === 'book' ? 'wants to read' : it.t === 'game' ? 'wants to play' : it.t === 'album' ? 'wants to listen' : 'wants to watch')
  : it.s === 'dropped' ? tl('dropped it') : tl('finished');
function friendChipsHTML(e){
  const list = friendsFor(e.type, e.title);
  if (!list.length) return '';
  return `<div class="dt-rate fr-rate"><span class="k">${tl('friends')}</span><span class="fr-chips">${list.map(x => `<button class="fr-chip" data-friend="${x.f.id}">
    <b>${esc(friendName(x.f))}</b>${x.it.r ? `<em>★ ${x.it.r}</em>` : `<em>${statusWord(x.it)}</em>`}</button>`).join('')}</span></div>
    ${list.filter(x => x.it.n).map(x => `<div class="fr-note"><b>${esc(friendName(x.f))}:</b> “${esc(x.it.n)}”</div>`).join('')}`;
}

/* ---- what friends loved that you don't have yet ---- */
function friendPicks(){
  const owned = new Set(db.media.map(e => e.type + ':' + normTitle(e.title)));
  const nope = new Set(aiState().nope || []);
  const best = new Map();
  friendsList().forEach(f => (friendCache[f.id]?.p?.items || []).forEach(it => {
    const k = it.t + ':' + normTitle(it.title);
    if (!TYPES[it.t] || it.r < 4.5 || owned.has(k) || nope.has(k)) return;
    const cur = best.get(k);
    if (!cur) best.set(k, { type: it.t, title: it.title, year: yearOf(it.y), cover: it.c || '', by: [{ name: friendName(f), r: it.r, n: it.n }], d: it.d });
    else cur.by.push({ name: friendName(f), r: it.r, n: it.n });
  }));
  return [...best.values()].sort((a, b) => b.by.length - a.by.length || (b.d || '').localeCompare(a.d || '')).slice(0, 12)
    .map(x => ({ ...x, why: x.by.map(b => `${b.name} ★${b.r}`).join(' · ') + (x.by[0].n ? ` — “${x.by[0].n}”` : '') }));
}
function friendFeed(){
  const out = [];
  friendsList().forEach(f => (friendCache[f.id]?.p?.items || []).filter(it => it.s !== 'planned').slice(0, 15).forEach(it => out.push({ f, it })));
  return out.filter(x => x.it.d).sort((a, b) => b.it.d.localeCompare(a.it.d)).slice(0, 6);
}
function friendsHomeHTML(){
  if (!friendsList().length) return '';
  const picks = friendPicks(), feed = friendFeed();
  if (!picks.length && !feed.length) return '';
  return `
    <section class="panel" data-sec="friends" data-sec-label="${tl('friends')}">
      <div class="dt-h"><span>${tl('friends')}</span><button class="dt-link" id="fr-open">${ICONS.users} ${tl('all')}</button></div>
      ${feed.map(x => `<button class="fr-feed" data-ffeed="${x.f.id}">
        <span class="fr-av">${esc(friendName(x.f).slice(0, 1).toUpperCase())}</span>
        <span class="ri-t"><b>${esc(friendName(x.f))} · ${statusWord(x.it)}</b><em>${esc(x.it.title)}${x.it.r ? ` · ★ ${x.it.r}` : ''} · ${fmtNice(x.it.d)}</em></span></button>`).join('')}
      ${picks.length ? `<div class="dt-h" style="margin-top:10px"><span>${tl('your friends loved')}</span></div>
        <div class="sg-row">${picks.map((s, i) => sugCardHTML(s, i, 'friends')).join('')}</div>` : ''}
    </section>`;
}
function wireFriendsHome(root){
  const picks = friendPicks();
  $$('[data-scope="friends"]', root).forEach(c => c.addEventListener('click', () => { const s = picks[+c.dataset.sg]; if (s) openSuggestion(s); }));
  $$('[data-ffeed]', root).forEach(b => b.addEventListener('click', () => openFriendProfile(b.dataset.ffeed)));
  $('#fr-open', root)?.addEventListener('click', () => openFriends());
  const undressed = picks.filter(s => !s.cover && !s.looked);
  if (undressed.length) dressSuggestions(undressed.slice(0, 6), () => {});
}

/* ---- a friend's page ---- */
function openFriendProfile(id, tab = 'top'){
  const f = friendsList().find(x => x.id === id); if (!f) return;
  if (tab === 'lib') return openFriendLibrary(id);
  const C = friendCache[id], items = C?.p?.items || [];
  const mine = it => db.media.find(e => e.type === it.t && normTitle(e.title) === normTitle(it.title));
  const row = (it, i) => { const m = mine(it); return `
    <button class="fr-row" data-fi="${i}">
      <span class="ri-cov">${it.c ? `<img src="${esc(it.c)}" alt="" loading="lazy" data-ph="${esc(TYPES[it.t]?.icon || '')}" onerror="imgFb(this)">` : TYPES[it.t]?.icon || ''}</span>
      <span class="ri-t"><b>${esc(it.title)}</b><em>${TYPES[it.t]?.label || ''}${it.y ? ' · ' + esc(it.y) : ''} · ${statusWord(it)}${it.r ? ' · ★ ' + it.r : ''}${m ? ` · <i class="mn-tag">${tl('you: {s}', { s: m.rating ? '★ ' + m.rating : STATUS[m.status].label })}</i>` : ''}</em>
      ${it.n ? `<em class="fr-n">“${esc(it.n)}”</em>` : ''}</span>
    </button>`; };
  const now = items.filter(it => it.s === 'active'), loved = items.filter(it => it.r >= 4.5), recent = items.filter(it => it.s === 'done').slice(0, 20);
  const groups = [[tl('into right now'), now], [tl('loved'), loved], [tl('recently finished'), recent]];
  const flat = [];
  openModal(`
    <div class="ig-head"><span class="fr-av big">${esc(friendName(f).slice(0, 1).toUpperCase())}</span><div><div class="sheet-title" style="margin:0">${esc(friendName(f))}</div>
      <div class="mono small muted">${C?.err ? esc(C.err) : C?.p ? tl('{n} titles · updated {t}', { n: items.length, t: C.p.updated ? fmtNice(C.p.updated.slice(0, 10)) : '—' }) : tl('loading…')}</div></div></div>
    ${frTabsHTML('top', items.length)}
    ${groups.filter(g => g[1].length).map(([label, list]) => `<div class="dt-h" style="margin-top:12px"><span>${label}</span><em>${list.length}</em></div>
      ${list.map(it => { flat.push(it); return row(it, flat.length - 1); }).join('')}`).join('') || `<div class="dt-empty">${tl('nothing shared yet')}</div>`}
    <div class="row" style="justify-content:space-between; margin-top:14px">
      <button class="btn ghost" id="fp-remove">${ICONS.trash} ${tl('remove friend')}</button>
      <button class="btn" id="fp-rename">${ICONS.edit} ${tl('nickname')}</button>
    </div>`);
  $$('[data-fi]').forEach(b => b.addEventListener('click', () => openFriendItem(f, flat[+b.dataset.fi])));
  wireFrTabs(id);
  $('#fp-remove').addEventListener('click', async () => {
    if (!await askConfirm(tl('Remove {name}?', { name: friendName(f) }), { detail: tl('you stop seeing their ratings. they can still see yours until you stop sharing.'), ok: tl('remove'), danger: true })) return;
    db.friends = friendsList().filter(x => x.id !== id); delete friendCache[id]; friendIndex = null; friendCacheSave(); save(); closeModal(); render();
  });
  $('#fp-rename').addEventListener('click', async () => {
    const n = await askText(tl('Nickname'), { value: f.nick || friendName(f), ok: tl('save') });
    if (n == null) return; f.nick = n.trim() || undefined; friendIndex = null; save(); openFriendProfile(id);
  });
}

const frMine = it => db.media.find(e => e.type === it.t && normTitle(e.title) === normTitle(it.title));
function openFriendItem(f, it){
  const m = frMine(it);
  if (m){ openDetail(m.id); return; }
  openSuggestion({ type: it.t, title: it.title, year: yearOf(it.y), cover: it.c || '', why: `${friendName(f)}${it.r ? ' ★' + it.r : ' · ' + statusWord(it)}${it.n ? ` — “${it.n}”` : ''}` });
}
const frTabsHTML = (on, n) => `<div class="lf-seg fr-tabs"><button class="${on === 'top' ? 'on' : ''}" data-frtab="top"><span>${tl('highlights')}</span></button>
  <button class="${on === 'lib' ? 'on' : ''}" data-frtab="lib"><span>${tl('whole library')} · ${n}</span></button></div>`;

/* everything a friend shared: search, type, status, "you both have", sort — like your own library */
const frLibState = {};
function openFriendLibrary(id){
  const f = friendsList().find(x => x.id === id); if (!f) return;
  const items = friendCache[id]?.p?.items || [];
  const st = frLibState[id] = frLibState[id] || { q: '', type: 'all', st: 'any', sort: 'recent', n: 60 };
  const types = Object.keys(TYPES).filter(t => items.some(it => it.t === t));
  openModal(`
    <div class="ig-head"><span class="fr-av big">${esc(friendName(f).slice(0, 1).toUpperCase())}</span><div><div class="sheet-title" style="margin:0">${esc(friendName(f))}</div>
      <div class="mono small muted">${tl('{n} titles', { n: items.length })}</div></div></div>
    ${frTabsHTML('lib', items.length)}
    <label class="lf-search fr-q">${ICONS.search}<input id="frl-q" placeholder="${tl('search their library…')}" value="${esc(st.q)}" autocomplete="off"></label>
    <div class="fr-types">
      <button class="${st.type === 'all' ? 'on' : ''}" data-frt="all">${tl('All')}</button>
      ${types.map(t => `<button class="${st.type === t ? 'on' : ''}" data-frt="${t}">${TYPES[t].icon}<span>${TYPES[t].plural}</span></button>`).join('')}
    </div>
    <div class="fr-sels">
      <select class="input" id="frl-st">${[['any', 'any status'], ['done', 'finished'], ['active', 'in progress'], ['planned', 'planned'], ['dropped', 'dropped'], ['rated', 'rated'], ['both', 'you both have'], ['new', "you don't have"]]
        .map(([k, l]) => `<option value="${k}" ${st.st === k ? 'selected' : ''}>${tl(l)}</option>`).join('')}</select>
      <select class="input" id="frl-sort">${[['recent', 'newest'], ['rating', 'their rating'], ['title', 'a → z'], ['year', 'release year']]
        .map(([k, l]) => `<option value="${k}" ${st.sort === k ? 'selected' : ''}>${tl(l)}</option>`).join('')}</select>
    </div>
    <div id="frl-list"></div>`);
  const draw = () => {
    const q = normTitle(st.q);
    let list = items.filter(it => TYPES[it.t] && (st.type === 'all' || it.t === st.type) && (!q || normTitle(it.title).includes(q)));
    if (['done', 'active', 'planned', 'dropped'].includes(st.st)) list = list.filter(it => it.s === st.st);
    if (st.st === 'rated') list = list.filter(it => it.r > 0);
    if (st.st === 'both') list = list.filter(it => frMine(it));
    if (st.st === 'new') list = list.filter(it => !frMine(it));
    list = list.slice().sort(st.sort === 'rating' ? (a, b) => (b.r || 0) - (a.r || 0) || (b.d || '').localeCompare(a.d || '')
      : st.sort === 'title' ? (a, b) => a.title.localeCompare(b.title, LANG)
      : st.sort === 'year' ? (a, b) => (+yearOf(b.y) || 0) - (+yearOf(a.y) || 0)
      : (a, b) => (b.d || '').localeCompare(a.d || ''));
    const shown = list.slice(0, st.n);
    $('#frl-list').innerHTML = `<div class="dt-h" style="margin-top:8px"><span>${tl('{n} titles', { n: list.length })}</span></div>`
      + (shown.map((it, i) => { const m = frMine(it); return `
        <button class="fr-row" data-fl="${i}">
          <span class="ri-cov">${it.c ? `<img src="${esc(it.c)}" alt="" loading="lazy" data-ph="${esc(TYPES[it.t].icon)}" onerror="imgFb(this)">` : TYPES[it.t].icon}</span>
          <span class="ri-t"><b>${esc(it.title)}</b><em>${TYPES[it.t].label}${it.y ? ' · ' + esc(it.y) : ''} · ${statusWord(it)}${it.r ? ' · ★ ' + it.r : ''}${m ? ` · <i class="mn-tag">${tl('you: {s}', { s: m.rating ? '★ ' + m.rating : STATUS[m.status].label })}</i>` : ''}</em>
          ${it.n ? `<em class="fr-n">“${esc(it.n)}”</em>` : ''}</span>
        </button>`; }).join('') || `<div class="dt-empty">${tl('nothing here')}</div>`)
      + (list.length > shown.length ? `<button class="btn" id="frl-more" style="width:100%; margin-top:10px">${tl('show {n} more', { n: Math.min(100, list.length - shown.length) })}</button>` : '');
    $$('[data-fl]').forEach(b => b.addEventListener('click', () => openFriendItem(f, shown[+b.dataset.fl])));
    $('#frl-more')?.addEventListener('click', () => { st.n += 100; draw(); });
  };
  let qt = 0;
  $('#frl-q').addEventListener('input', ev => { clearTimeout(qt); qt = setTimeout(() => { st.q = ev.target.value; st.n = 60; draw(); }, 150); });
  $$('[data-frt]').forEach(b => b.addEventListener('click', () => { st.type = b.dataset.frt; st.n = 60; $$('[data-frt]').forEach(x => x.classList.toggle('on', x === b)); draw(); }));
  $('#frl-st').addEventListener('change', ev => { st.st = ev.target.value; st.n = 60; draw(); });
  $('#frl-sort').addEventListener('change', ev => { st.sort = ev.target.value; draw(); });
  wireFrTabs(id);
  draw();
}

/* ============ what next? — swipe through your queue + picks until something clicks ============
   the pool: your queue, everything else you planned, gemini's picks and what friends loved —
   filtered by type / genre, then ranked:
     score = where it came from (queue position, planned, friend, ai)
           + taste fit (genres + creators you rated high or low)
           + time fit (fits the time you have) + mood fit (light / intense / something new)
           + small lifts (a recent release, long forgotten in planned) − recent skips + a little noise
   while you swipe it learns: nope on three horror films and horror sinks for the rest of the deck,
   yes on something lifts what's like it. the next card is never the same genre / creator as
   the last one, and about one in eight is a wildcard from further down. */
ICONS.cards = I('<rect x="7" y="3.5" width="12" height="16" rx="2" transform="rotate(8 13 11.5)"/><rect x="4" y="5" width="12" height="16" rx="2"/>');
ICONS.undo = I('<path d="M9 7 4.5 11.5 9 16"/><path d="M5 11.5h9.5a5 5 0 0 1 0 10H12"/>');

// genres from every source and both languages → one small set of buckets
const WN_BUCKETS = [
  ['action', /action|aksiyon|shooter|\bfps\b|nişancı|fighting|dövüş|hack and slash|beat ?'?em/i, -.4],

  folk: 'folk & acoustic', nonfiction: 'non-fiction' };
const wnBuckets = genres => [...new Set((genres || []).flatMap(g => WN_BUCKETS.filter(b => b[1].test(String(g))).map(b => b[0])))];

const wnState = () => { const A = aiState(); A.wn = A.wn && typeof A.wn === 'object' ? A.wn : {}; A.wn.f = A.wn.f || { type: 'any', genre: '', time: '', mood: '' };

/* ---- length: one sitting (S) and the whole thing (L), in minutes ---- */
function wnLength(c){
  const t = c.type;
  if (t === 'movie'){ const m = c.runtimeMin || 110; return { S: m, L: m }; }
  if (t === 'album'){ const m = c.runtimeMin || 45; return { S: m, L: m }; }
  if (t === 'tv'){ const ep = c.epMin || 45, left = c.e ? c.e.seasons.flatMap(s => s.episodes).filter(x => !x.watched).length : 0; return { S: ep, L: (left || 10) * ep }; }
  if (t === 'book') return { S: 45, L: (c.pagesTotal || 320) * 1.5 };
  if (t === 'game') return { S: 90, L: (c.playHours || 20) * 60 };
  return { S: 60, L: 120 };
}
const WN_TIMES = { quick: { label: 'under an hour' }, evening: { label: 'an evening' }, weekend: { label: 'a weekend+' } };
const WN_MOODS = { light: { label: 'light & easy' }, intense: { label: 'intense' }, fresh: { label: 'something new' } };
function wnTimeFit(c, time){
  if (!time) return 0;
  const { S, L } = wnLength(c);
  if (time === 'quick') return S > 75 ? null : L <= 75 ? 1.2 : .3;                       // null = doesn't fit at all
  if (time === 'evening') return S > 200 ? null : L >= 60 && L <= 200 ? 1.2 : L < 60 ? .4 : 0;
  if (time === 'weekend') return L >= 300 ? 1.2 : L >= 150 ? .5 : -.4;
  return 0;
}

/* ---- your taste: genre buckets + creators, from ratings and how things ended ---- */
function wnTaste(){
  const g = {}, cr = {}, seen = {};
  db.media.forEach(e => {
    const w = e.rating ? (e.rating - 3) / 2 : e.status === 'done' ? .3 : e.status === 'dropped' ? -.6 : e.status === 'active' ? .2 : 0;
    const bs = wnBuckets(e.genres);
    bs.forEach(b => { seen[b] = (seen[b] || 0) + 1; if (w) g[b] = (g[b] || 0) + w; });
    if (w && e.creator) { const k = normTitle(e.creator); cr[k] = (cr[k] || 0) + w; }
  });
  Object.keys(g).forEach(k => g[k] = Math.tanh(g[k] / 3));
  Object.keys(cr).forEach(k => cr[k] = Math.tanh(cr[k] / 2));
  const maxSeen = Math.max(1, ...Object.values(seen));
  return { g, cr, fam: b => (seen[b] || 0) / maxSeen };
}

/* ---- the pool ---- */
function wnPool(f){
  const W = wnState(), A = aiState(), out = [], keys = new Set();
  const owned = new Set(db.media.map(e => aiKey(e.type, e.title))), nope = new Set(A.nope || []);
  const add = c => {
    if (!TYPES[c.type] || keys.has(c.key)) return;
    if (f.type !== 'any' && c.type !== f.type) return;
    keys.add(c.key); out.push(c);
  };
  const qpos = new Map(db.queue.map((id, i) => [id, i]));
  db.media.filter(e => e.status === 'planned').forEach(e => add({
    key: aiKey(e.type, e.title), kind: qpos.has(e.id) ? 'queue' : 'planned', qpos: qpos.get(e.id), e, type: e.type, title: e.title, year: e.year, creator: e.creator,
    cover: e.cover, genres: e.genres || [], synopsis: e.synopsis || '', runtimeMin: e.runtimeMin, epMin: e.epMin, pagesTotal: e.pagesTotal, playHours: e.playHours, addedAt: e.addedAt }));
  const sug = (s, kind, why) => {
    const k = aiKey(s.type, s.title);
    if (owned.has(k) || nope.has(k)) return;
    const d = W.dress[k] || {};
    add({ key: k, kind, s, type: s.type, title: s.title, year: s.year || d.year, creator: s.creator || d.creator || '', cover: s.cover || d.cover || '',
      genres: (s.genres || []).length ? s.genres : d.genres || [], synopsis: s.synopsis || d.synopsis || '', runtimeMin: s.runtimeMin || d.runtimeMin, epMin: s.epMin || d.epMin,
      pagesTotal: s.pagesTotal || d.pagesTotal, playHours: s.playHours || d.playHours, why: why || s.why || '', fr: s.fr, frN: s.frN, askedGenre: s.askedGenre });
  };
  // friends: everything rated 4+ that you don't have
  const fr = new Map();
  friendsList().forEach(fd => (friendCache[fd.id]?.p?.items || []).forEach(it => {
    if (!TYPES[it.t] || !(it.r >= 4)) return;
    const k = aiKey(it.t, it.title), cur = fr.get(k);
    if (!cur) fr.set(k, { type: it.t, title: it.title, year: yearOf(it.y), cover: it.c || '', fr: it.r, frN: 1, why: `${friendName(fd)} ★${it.r}${it.n ? ` — “${it.n}”` : ''}` });
    else { cur.frN++; cur.fr = Math.max(cur.fr, it.r); cur.why += ` · ${friendName(fd)} ★${it.r}`; }
  }));
  fr.forEach(s => sug(s, 'friend'));
  [...(A.suggest?.items || []), ...Object.values(A.like || {}).flatMap(l => l.items || []), ...W.extra].forEach(s => sug(s, 'ai'));
  return out;
}
function wnFilter(pool, f){
  return pool.filter(c => {
    if (f.genre && !wnBuckets(c.genres).includes(f.genre) && c.askedGenre !== f.genre) return false;
    if (f.time && wnTimeFit(c, f.time) === null) return false;
    return true;
  });
}
function wnScore(c, f, T, sess){
  let s = c.kind === 'queue' ? 2 + 1.5 * (1 - c.qpos / Math.max(1, db.queue.length)) : c.kind === 'planned' ? 1.2
    : c.kind === 'friend' ? .8 + .4 * ((c.fr || 4) - 4) + .3 * ((c.frN || 1) - 1) : .9;
  const bs = wnBuckets(c.genres), ck = c.creator ? normTitle(c.creator) : '';
  if (bs.length) s += 2 * bs.reduce((t, b) => t + (T.g[b] || 0), 0) / bs.length;
  if (ck && T.cr[ck]) s += 1 * T.cr[ck];
  const tf = wnTimeFit(c, f.time); if (tf) s += tf;
  if (f.mood && bs.length){
    const tone = bs.reduce((t, b) => t + (WN_TONE[b] || 0), 0) / bs.length;
    if (f.mood === 'light') s += 1.8 * tone;
    if (f.mood === 'intense') s -= 1.8 * tone;
    if (f.mood === 'fresh') s += 1.5 * (1 - bs.reduce((t, b) => t + T.fam(b), 0) / bs.length) - (ck && T.cr[ck] ? .8 : 0);
  }
  if (f.mood === 'fresh' && !bs.length) s += .4;
  if (c.year && +c.year >= new Date().getFullYear() - 1) s += .3;
  if (c.addedAt){ const days = (Date.now() - new Date(c.addedAt)) / 864e5; s += days < 7 ? .4 : Math.min(.8, days / 180); }
  // skipped lately: each skip in the last two weeks weighs less as it ages
  (wnState().skips[c.key] || []).forEach(t => { const age = (Date.now() - t) / 864e5; if (age < 14) s -= .9 * (1 - age / 14); });

  bs.forEach(b => s += (sess.g[b] || 0) / bs.length);

}
// the next card: best score, but not the same genre or creator as the last one; now and then a wildcard
function wnPick(D){
  if (!D.left.length) return null;
  const ranked = D.left.map(c => ({ c, s: wnScore(c, D.f, D.T, D.sess) })).sort((a, b) => b.s - a.s);
  if (ranked.length > 6 && D.n > 1 && Math.random() < 1 / 8){
    const w = ranked[4 + Math.floor(Math.random() * (ranked.length - 4))].c; w.wild = 1; return w;
  }
  const prev = D.hist[D.hist.length - 1]?.c;
  if (prev){
    const pb = wnBuckets(prev.genres)[0], pc = prev.creator && normTitle(prev.creator);
    const alt = ranked.slice(0, 6).find(x => (!pb || wnBuckets(x.c.genres)[0] !== pb) && (!pc || normTitle(x.c.creator || '') !== pc));
    if (alt) return alt.c;
  }
  return ranked[0].c;
}

async function wnDress(list, ms){
  const W = wnState();
  const one = async c => {
    try {
      const m = bestMatch(c, await searchMedia(c.type, c.title, c.year));
      if (!m) return;
      const d = { cover: m.cover || '', genres: m.genres || [], synopsis: m.synopsis || '', year: m.year || '', creator: m.creator || '', runtimeMin: m.runtimeMin || 0,
        epMin: m.epMin || 0, pagesTotal: m.pagesTotal || 0, playHours: m.playHours || 0, ids: m.ids || {}, tvmazeId: m.tvmazeId || null };
      if (c.s){ ['cover', 'synopsis', 'runtimeMin', 'epMin', 'pagesTotal', 'playHours', 'ids', 'tvmazeId'].forEach(k => { if (emptyVal(c.s[k]) && !emptyVal(d[k])) c.s[k] = d[k]; });
        if (!(c.s.genres || []).length && d.genres.length) c.s.genres = d.genres; c.s.looked = 1; }
      W.dress[c.key] = d;
      Object.keys(W.dress).slice(0, -200).forEach(k => delete W.dress[k]);        // keep the newest 200
    } catch(_){}
  };
  await Promise.race([Promise.all(list.map(one)), new Promise(r => setTimeout(r, ms))]);
  save();
}

function wnNext(){

function wnDrag(card){
  let x0 = 0, y0 = 0, dx = 0, dy = 0, t0 = 0, on = false;
  const set = (x, y, anim) => {
    card.style.transition = anim ? 'transform .3s ease, opacity .3s' : 'none';
    card.style.transform = `translate(${x}px, ${y * .35}px) rotate(${x / 18}deg)`;
    const k = Math.min(1, Math.abs(x) / 110);
    card.querySelector('.wn-stamp.yes').style.opacity = x > 0 ? k : 0;
    card.querySelector('.wn-stamp.no').style.opacity = x < 0 ? k : 0;
    card.style.setProperty('--glow', x > 0 ? `rgba(70,150,90,${k * .55})` : x < 0 ? `rgba(190,60,50,${k * .55})` : 'transparent');
    $('#wn-yes')?.classList.toggle('hot', x > 60); $('#wn-no')?.classList.toggle('hot', x < -60);
  };
  card.addEventListener('pointerdown', ev => { if (ev.button > 0) return; on = true; x0 = ev.clientX; y0 = ev.clientY; dx = dy = 0; t0 = Date.now(); card.setPointerCapture(ev.pointerId); });
  card.addEventListener('pointermove', ev => { if (!on) return; dx = ev.clientX - x0; dy = ev.clientY - y0; set(dx, dy); });
  const up = () => {
    if (!on) return; on = false;
    const v = Math.abs(dx) / Math.max(1, Date.now() - t0);
    if (Math.abs(dx) > 110 || (Math.abs(dx) > 40 && v > .6)) wnFling(dx > 0 ? 1 : -1, dy);
    else set(0, 0, true);
  };
  card.addEventListener('pointerup', up); card.addEventListener('pointercancel', up);
  card._set = set;
}
function wnFling(dir, dy = 0){
  const D = WND; if (!D || !D.cur || D.flying) return;
  const card = $('#wn-card'); if (!card) return;
  D.flying = true;
  card._set?.(dir * 120, dy);
  requestAnimationFrame(() => {
    card.style.transition = 'transform .32s ease-in, opacity .32s';
    card.style.transform = `translate(${dir * innerWidth * 1.1}px, ${dy * .35 + 40}px) rotate(${dir * 28}deg)`;
    card.style.opacity = '0';
  });
  haptic(dir > 0 ? 'confirm' : 'tap');
  setTimeout(() => { D.flying = false; wnCommit(dir); }, 260);
}
function wnCommit(dir){
  const D = WND, c = D.cur; if (!c) return;
  D.n++;
  const bs = wnBuckets(c.genres), ck = c.creator ? normTitle(c.creator) : '';
  const dG = dir > 0 ? .4 : -.6, dC = dir > 0 ? .3 : -.8;
  bs.forEach(b => D.sess.g[b] = (D.sess.g[b] || 0) + dG);
  if (ck) D.sess.cr[ck] = (D.sess.cr[ck] || 0) + dC;
  D.left = D.left.filter(x => x !== c);
  const h = { c, dir, bs, ck, dG, dC };
  if (dir < 0){
    const W = wnState();
    W.skips[c.key] = [...(W.skips[c.key] || []).filter(t => Date.now() - t < 14 * 864e5), Date.now()];
    h.skipped = true;
    // the 3rd skip in two weeks of something you planned: keep it?
    if (c.e && W.skips[c.key].length >= 3) h.ask = true;
    save();
  } else D.yes.push(c);
  D.hist.push(h);
  wnBottom();
  if (h.ask) wnAskKeep(c);
  wnNext();
}
async function wnAskKeep(c){
  const W = wnState();
  const remove = await askConfirm(tl('Skipped {title} three times', { title: c.title }), { detail: tl('still want it on your list? removing it deletes the entry.'), ok: tl('remove from planned'), danger: true });
  if (!remove){ W.skips[c.key] = []; save(); return; }      // keeping it: the count starts over
  db.media = db.media.filter(x => x.id !== c.e.id); db.queue = db.queue.filter(x => x !== c.e.id); db.lists.forEach(l => l.items = l.items.filter(x => x !== c.e.id));
  delete W.skips[c.key]; save();
  toast(tl('{title} removed', { title: c.title }), { undo: () => { db.media.push(c.e); if (c.kind === 'queue') db.queue.splice(c.qpos, 0, c.e.id); save(); } });
}
function wnUndo(){
  const D = WND; if (!D || !D.hist.length || D.flying) return;
  const h = D.hist.pop();
  h.bs.forEach(b => D.sess.g[b] -= h.dG);
  if (h.ck) D.sess.cr[h.ck] -= h.dC;
  if (h.skipped){ const W = wnState(); (W.skips[h.c.key] || []).pop(); save(); }
  else D.yes = D.yes.filter(x => x !== h.c);
  if (D.cur) D.left.push(D.cur);
  D.left.push(h.c); D.n--;
  const stage = $('#wn-stage');
  D.cur = h.c;
  stage.innerHTML = `<div class="wn-under"></div><div class="wn-under two"></div>` + wnCardHTML(D.cur);
  const card = $('#wn-card'); wnDrag(card);
  card.style.transform = `translate(${h.dir * 260}px, 20px) rotate(${h.dir * 14}deg)`; card.style.opacity = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => { card.style.transition = 'transform .3s ease-out, opacity .3s'; card.style.transform = ''; card.style.opacity = ''; }));
  wnBottom();
}
function wnBottom(){

  $('#wn-picked').innerHTML = D.yes.slice(-6).map(c => `<span class="${c.type === 'album' ? 'sq' : ''}">${c.cover ? `<img src="${esc(c.cover)}" alt="">` : TYPES[c.type].icon}</span>`).join('')
    + (D.yes.length ? `<em>${tl(D.yes.length === 1 ? '1 yes' : '{n} yeses', { n: D.yes.length })}</em>` : `<em>${tl('swipe right on anything you could go for — keep going until you are done')}</em>`);

// running low → gemini adds cards that fit the filters (in the background; the deck keeps going)
async function wnMore(force){
  const D = WND; if (!D || D.asking || !aiOn()) return;
  if (!force && D.askedAt && Date.now() - D.askedAt < 60e3) return;
  D.asking = true; D.askedAt = Date.now();
  if (!D.cur) wnNext();
  try {
    const f = D.f, P = tasteProfile();
    const exclude = [...ownedAndNope(), ...D.hist.map(h => h.c.title), ...D.left.map(c => c.title)].slice(0, 260);
    const kind = f.type === 'any' ? 'films, TV series, books, video games or music albums' : TYPES[f.type].plural.toLowerCase();
    const j = await geminiJSON([{ text: `Suggest 10 ${kind} for one person to start next.
${P.loved.length ? `They loved:\n${P.loved.join('\n')}` : 'They have not rated much yet — suggest widely loved modern classics.'}
${P.meh.length ? `Not for them:\n${P.meh.join('\n')}` : ''}
${f.genre ? `Genre: ${WN_BUCKET_LABEL[f.genre]}.` : ''} ${f.time ? `Time they have: ${WN_TIMES[f.time].label}.` : ''} ${f.mood ? `Mood: ${WN_MOODS[f.mood].label}.` : ''}
${D.yes.length ? `This session they said yes to: ${D.yes.map(c => c.title).join('; ')}.` : ''}
${D.hist.filter(h => h.dir < 0).length ? `This session they skipped: ${D.hist.filter(h => h.dir < 0).map(h => h.c.title).slice(-15).join('; ')}.` : ''}
Never suggest: ${exclude.join('; ')}
Reply with ONLY this JSON: {"items":[{"type":"movie|tv|book|game|album","title":"original title","year":"YYYY","creator":"director / author / studio / artist","genres":["1-3 genres in English"],"minutes":0,"why":"one short sentence in ${AI_LANG()}"}]}
"minutes" = runtime for a film or album, minutes per episode for a series, total hours×60 to finish a game, 0 for a book.` }], { fast: true });
    const W = wnState(), have = new Set([...db.media.map(e => aiKey(e.type, e.title)), ...(aiState().nope || []), ...W.extra.map(s => aiKey(s.type, s.title))]);
    const items = (j?.items || []).filter(x => TYPES[x.type] && x.title && (f.type === 'any' || x.type === f.type) && !have.has(aiKey(x.type, x.title))).map(x => {
      const m = +x.minutes || 0;
      return { type: x.type, title: String(x.title).slice(0, 90), year: yearOf(x.year), creator: String(x.creator || '').slice(0, 60), why: String(x.why || '').slice(0, 200),
        genres: (Array.isArray(x.genres) ? x.genres : []).slice(0, 3).map(String), ...(x.type === 'game' ? { playHours: Math.round(m / 60) } : x.type === 'tv' ? { epMin: m } : x.type === 'book' ? {} : { runtimeMin: m }),
        ...(f.genre ? { askedGenre: f.genre } : {}) };
    });
    if (!WND) return;

    save();
    const cards = wnPool(D.f).filter(c => items.some(s => s === c.s)).map(c => ({ ...c, askedGenre: c.s.askedGenre, jit: (Math.random() - .5) * .5 }));
    await wnDress(cards, 5000);

    const fresh = wnFilter(cards, D.f).filter(c => !D.left.some(x => x.key === c.key) && !D.hist.some(h => h.c.key === c.key) && D.cur?.key !== c.key)
      .map(c => ({ ...c, cover: c.s.cover || wnState().dress[c.key]?.cover || c.cover, genres: (c.s.genres || []).length ? c.s.genres : c.genres }));
    D.left.push(...fresh);

// start now / top of queue / add to planned — for your own planned entries and for picks you don't have yet
function wnDo(c, act){
  let e = c.e || db.media.find(x => aiKey(x.type, x.title) === c.key);
  if (!e){
    const s = c.s || { type: c.type, title: c.title, year: c.year, creator: c.creator, cover: c.cover };
    if (!s.cover && c.cover) s.cover = c.cover;
    if (!(s.genres || []).length && c.genres.length) s.genres = c.genres;
    e = addSuggestion(s, 'planned');
    W_dropExtra(c.key);
  }
  c.e = e;
  if (act === 'start'){
    e.status = 'active'; e.startDate = e.startDate || todayStr(); logActivity(e, 'start'); syncQueueWithStatus(e);
    c.done = tl('started'); toast(tl('{title} — enjoy!', { title: e.title }) + ' ✓');

    if (e.status !== 'planned') e.status = 'planned';

  } else {
    db.queue = db.queue.filter(x => x !== e.id);

  }

}

// this or that: the winner so far meets the next one until one is left
function wnDuel(list){
  const stage = $('#wn-stage');
  let champ = list[0], i = 1;
  const lost = [];
  const show = () => {
    if (i >= list.length) return win();
    const a = champ, b = list[i];
    const side = (c, k) => `<button class="wn-duel-c" data-duel="${k}">
      <span class="wn-dcov ${c.type === 'album' ? 'sq' : ''}">${c.cover ? `<img src="${esc(c.cover)}" alt="" data-ph="${esc(TYPES[c.type].icon)}" onerror="imgFb(this)">` : `<span class="ph">${TYPES[c.type].icon}</span>`}</span>
      <b>${esc(c.title)}</b><em>${TYPES[c.type].label}${c.year ? ' · ' + esc(c.year) : ''}${wnLenLabel(c) ? ' · ' + esc(wnLenLabel(c)) : ''}</em></button>`;
    stage.innerHTML = `<div class="wn-duel">
      <div class="wn-dh">${tl('this or that?')}<em>${tl('{a} of {b}', { a: i, b: list.length - 1 })}</em></div>
      <div class="wn-dpair">${side(a, 'a')}<span class="wn-or">${tl('or')}</span>${side(b, 'b')}</div>
      <button class="btn ghost" id="wn-dback">${tl('← back to the list')}</button></div>`;
    $$('[data-duel]').forEach(x => x.addEventListener('click', () => {
      haptic('tap');
      if (x.dataset.duel === 'b'){ lost.push(champ); champ = b; } else lost.push(b);
      i++; show();
    }));
    $('#wn-dback').addEventListener('click', wnFinish);
  };
  const win = () => {
    const rest = lost.filter(c => !c.done);
    stage.innerHTML = `<div class="wn-end wn-win">
      <div class="dt-h"><span>${tl('the winner')}</span></div>
      <div class="wn-wcard">
        <span class="wn-dcov ${champ.type === 'album' ? 'sq' : ''}">${champ.cover ? `<img src="${esc(champ.cover)}" alt="" data-ph="${esc(TYPES[champ.type].icon)}" onerror="imgFb(this)">` : `<span class="ph">${TYPES[champ.type].icon}</span>`}</span>
        <b>${esc(champ.title)}</b><em>${TYPES[champ.type].label}${champ.year ? ' · ' + esc(champ.year) : ''}</em>
        <span class="wn-acts" data-wa="0">${wnActsHTML(champ)}</span>
      </div>
      ${rest.length ? `<div class="dt-h" style="margin-top:14px"><span>${tl('the others')}</span><em>${rest.length}</em></div>
        <div class="wn-rest">${rest.map(c => `<span class="${c.type === 'album' ? 'sq' : ''}" title="${esc(c.title)}">${c.cover ? `<img src="${esc(c.cover)}" alt="">` : TYPES[c.type].icon}</span>`).join('')}</div>
        <div class="wn-restacts" id="wn-restacts">
          <button class="btn" id="wn-rq">${ICONS.queue} ${tl('add them to my queue anyway')}</button>
          ${rest.some(c => !c.e) ? `<button class="btn ghost" id="wn-rp">${ICONS.plus} ${tl('just keep them planned')}</button>` : ''}
        </div>` : ''}
      <button class="btn wn-close2" id="wn-x2">${tl('close')}</button></div>`;
    wnWireActs([champ]);
    $('#wn-rq')?.addEventListener('click', () => {
      // after the winner, in the order you liked them
      rest.slice().reverse().forEach(c => wnDo(c, 'top'));
      if (champ.done === tl('top of your queue')) db.queue = [champ.e.id, ...db.queue.filter(x => x !== champ.e.id)];
      save(); $('#wn-restacts').innerHTML = `<i class="wn-ok">${ICONS.check} ${tl('{n} added to your queue', { n: rest.length })}</i>`;
    });
    $('#wn-rp')?.addEventListener('click', () => { rest.forEach(c => { if (!c.e) wnDo(c, 'plan'); }); $('#wn-restacts').innerHTML = `<i class="wn-ok">${ICONS.check} ${tl('kept as planned')}</i>`; });
    $('#wn-x2').addEventListener('click', closeWhatNext);
  };
  show();
}

          return `<button class="chip acc-chip ${(s.accent || 'ember') === a.id ? 'on' : ''} ${lk ? 'locked' : ''}" data-acc="${a.id}" ${lk ? `data-lvl="${a.lvl}"` : ''}><i style="background:${a.c}"></i>${lk ? ICONS.lock : ''}${tl(a.id)}</button>`; }).join('')}
      </div>
      <div class="mono small muted" style="margin:-4px 0 12px">${tl('locked ones open up as you level — you are level {n}', { n: game().level || 1 })}</div>
      <div class="section-label"><span class="tag">${tl('game')}</span> ${tl('celebrations')}</div>
      <div class="row" id="s-cele">
        ${[['calm', 'calm'], ['more', 'confetti + sound'], ['off', 'none (reduced motion)']].map(([k, l]) => `<button class="chip ${(s.celebrate || 'calm') === k ? 'on' : ''}" data-cele="${k}">${tl(l)}</button>`).join('')}
      </div>
    </div>

    <div class="set-block">
      <div class="section-label"><span class="tag">${tl('tabs')}</span> ${tl('navigation')}</div>
      <div class="row" style="margin-bottom:8px">
        <button class="chip ${s.navMode === 'scroll' ? 'on' : ''}" data-navm="scroll">${tl('scrollable bar')}</button>
        <button class="chip ${s.navMode === 'favs' ? 'on' : ''}" data-navm="favs">${tl('4 favorites + more')}</button>
      </div>
      ${s.navMode === 'favs' ? `<div class="mono small muted" style="margin-bottom:6px">${tl('starred tabs sit on the bar — the rest live behind "more"')}</div>` : ''}
      <div id="s-tabs">
        ${tabOrder().map((t, i, arr) => `
        <div class="tabrow">
          <span class="tki">${TAB_ICONS[t] || ''}</span>
          <span class="tn">${TABS[t].label}</span>
          <button class="ly-btn tab-mv" data-tmv="${t}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="${tl('move up')}">${ICONS.up}</button>
          <button class="ly-btn tab-mv" data-tmv="${t}" data-d="1" ${i === arr.length - 1 ? 'disabled' : ''} aria-label="${tl('move down')}">${ICONS.down}</button>
          ${s.navMode === 'favs' ? `<button class="fav ${s.favTabs.includes(t) ? 'on' : ''}" data-fav="${t}" ${s.tabs[t] === false ? 'disabled' : ''} aria-label="${tl('favorite')}">${ICONS.star}</button>` : ''}
          <span class="tgl ${s.tabs[t] !== false ? 'on' : ''}" data-tgl="${t}"></span>
        </div>`).join('')}
      </div>
    </div>

    <div class="set-block">
      <div class="section-label"><span class="tag">${tl('health')}</span> ${tl('goals')}</div>
      <div class="row"><input type="number" min="1000" step="500" class="input" id="s-goal" value="${s.stepGoal}" style="width:120px">
      <span class="mono small muted">${tl('steps / day')}</span>
      <input type="number" min="500" step="250" class="input" id="s-water" value="${s.waterGoal}" style="width:120px">
      <span class="mono small muted">${tl('ml water / day')}</span></div>
      <div class="tabrow" style="margin-top:6px"><span class="tn" style="font-size:13px">${tl('keep health controls minimal (sync only)')}</span><span class="tgl ${s.simpleHealth ? 'on' : ''}" id="s-simplehealth"></span></div>
    </div>

    <div class="set-block">
      <div class="section-label"><span class="tag">${tl('connections')}</span> ${tl('free keys that unlock more')}</div>
      <div class="cn-group">
        <div class="cn-h"><b>${tl('sync')}</b><em>${tl('the same journal on your phone and your pc')}</em></div>
        ${syncCardHTML()}
        ${friendsCardHTML()}
      </div>
      <div class="cn-group">
        <div class="cn-h"><b>${tl('AI')}</b><em>${tl('gemini goes first — when its free daily limit runs out, groq and openrouter take over')}</em></div>
        ${['gemini', 'groq', 'openrouter'].map(connCardHTML).join('')}
      </div>
      <div class="cn-group">
        <div class="cn-h"><b>${tl('covers & data')}</b><em>${tl('optional — films, shows, books and games work without them')}</em></div>
        ${['tmdb', 'gbooks', 'rawg', 'steam'].map(connCardHTML).join('')}
      </div>
      <button class="btn" id="s-covers" style="margin-top:10px">${ICONS.search} ${tl('repair library')}</button>
      <div class="mono small muted" style="margin-top:6px">${tl('finds missing covers, descriptions and genres for every entry')}</div>
    </div>

    <div class="set-block">
      <div class="section-label"><span class="tag">${tl('data')}</span> ${tl('local-first backup')}</div>
      <div class="row">
        <button class="btn" id="s-export">${ICONS.dl} ${tl('export json')}</button>
        <label class="btn filelabel">${ICONS.ul} ${tl('import json')}<input type="file" id="s-import" accept=".json,.txt,application/json,text/plain"></label>
        <button class="btn ghost" id="s-sample">${ICONS.dl} ${tl('load sample data')}</button>
      </div>
      ${NATIVE && MoodNative.listJournalBackups ? `<button class="btn ghost" id="s-snaps" style="margin-top:8px">${ICONS.undo} ${tl('automatic daily backups')}</button>` : ''}
      <div class="mono small muted" style="margin-top:8px">${tl(NATIVE ? 'saved three times on this phone (and a daily copy for 7 days) — only uninstalling erases it, so export a backup now and then.' : 'everything lives in this browser — export a backup now and then.')}</div>
    </div>

    <div class="set-block">
      <div class="section-label"><span class="tag" style="background:var(--bad)">${tl('danger')}</span> ${tl('irreversible')}</div>
      <button class="btn danger" id="s-wipe">${ICONS.trash} ${tl('erase everything')}</button>
    </div>

    <hr class="tear">
    <div class="row" style="justify-content:space-between">
      <span class="mono small muted">${tl('covers: tvmaze · open library · itunes · steam · wikipedia')}</span>
      <button class="btn primary" id="s-save">${ICONS.check} ${tl('save settings')}</button>
    </div>`);
  $('#s-export').addEventListener('click', exportJSON);
  $('#s-covers').addEventListener('click', () => { closeModal(); switchView('library'); repairLibrary(); });
  $('#s-import').addEventListener('change', ev => { const f = ev.target.files[0]; if (f) importJSON(f); });
  $('#s-simplehealth')?.addEventListener('click', () => {
    db.settings.simpleHealth = !db.settings.simpleHealth; save(); openSettings();
  });
  $$('#s-langs [data-lang]').forEach(c => c.addEventListener('click', () => {
    db.settings.lang = c.dataset.lang; setLang(db.settings.lang); save(); applyTabs(); render(); openSettings();
  }));
  $$('#s-themes [data-theme-set]').forEach(c => c.addEventListener('click', () => {
    db.settings.theme = c.dataset.themeSet; applyTheme(); save(); openSettings();
  }));
  $$('#s-patterns [data-pat]').forEach(c => c.addEventListener('click', () => {
    if (c.dataset.lvl){ toast(tl('unlocks at level {n}', { n: c.dataset.lvl })); return; }
    db.settings.pattern = c.dataset.pat; applyTheme(); save(); openSettings();
  }));
  $$('#s-accents [data-acc]').forEach(c => c.addEventListener('click', () => {
    if (c.dataset.lvl){ toast(tl('unlocks at level {n}', { n: c.dataset.lvl })); return; }
    db.settings.accent = c.dataset.acc; applyTheme(); save(); openSettings();
  }));
  $$('#s-cele [data-cele]').forEach(c => c.addEventListener('click', () => {
    db.settings.celebrate = c.dataset.cele; save(); openSettings();
    if (c.dataset.cele !== 'off') celebrate(tl('like this'), tl('celebrations'));
  }));
  $$('#modal-body [data-navm]').forEach(c => c.addEventListener('click', () => {
    db.settings.navMode = c.dataset.navm; applyTabs(); save(); openSettings();
  }));
  $$('#s-tabs [data-tmv]').forEach(b => b.addEventListener('click', () => {
    const order = tabOrder(), i = order.indexOf(b.dataset.tmv), j = i + +b.dataset.d;
    if (j < 0 || j >= order.length) return;
    [order[i], order[j]] = [order[j], order[i]];
    db.settings.tabOrder = order; applyTabs(); save(); openSettings();
    $('#s-tabs')?.scrollIntoView({ block: 'center' });
  }));
  $$('#s-tabs [data-tgl]').forEach(tg => tg.addEventListener('click', () => {
    const t = tg.dataset.tgl;
    if (db.settings.tabs[t] !== false && enabledTabs().length <= 1){ toast(tl('⚠ keep at least one tab on')); return; }
    db.settings.tabs[t] = db.settings.tabs[t] === false;
    db.settings.favTabs = db.settings.favTabs.filter(x => db.settings.tabs[x] !== false);
    applyTabs(); save(); openSettings();
  }));
  $$('#s-tabs [data-fav]').forEach(f => f.addEventListener('click', () => {
    const t = f.dataset.fav;
    if (db.settings.favTabs.includes(t)) db.settings.favTabs = db.settings.favTabs.filter(x => x !== t);
    else {
      if (db.settings.favTabs.length >= 4){ toast(tl('⚠ four favorites max — unstar one first')); return; }
      db.settings.favTabs.push(t);
    }
    applyTabs(); save(); openSettings();
  }));
  $('#s-sample').addEventListener('click', () => { loadSample(); });
  $('#s-snaps')?.addEventListener('click', () => {
    let list = []; try { list = JSON.parse(MoodNative.listJournalBackups() || '[]'); } catch(_){}
    if (!list.length){ toast(tl('no daily backups yet — the first one is made today')); return; }
    // each day keeps its last state; "-before" copies are what was there right before going back
    const label = x => { const d = x.name.slice(0, 10); return `${fmtNice(d)}${x.name.length > 10 ? ' · ' + tl('before going back') : ''} · ${Math.max(1, Math.round(x.size / 1024))} KB`; };
    openSheet(tl('Go back to a day'), list.map(x => ({ label: label(x), icon: ICONS.undo, fn: async () => {
      const d = x.name.slice(0, 10);
      if (!await askConfirm(tl('Go back to {date}?', { date: fmtNice(d) }), { detail: tl('everything changes back to how it was that day. today\'s state is kept as a backup too.'), ok: tl('go back') })) return;
      try {
        const parsed = JSON.parse(MoodNative.loadJournalBackup(x.name)); if (!Array.isArray(parsed.media)) throw 0;
        db.savedAt = Date.now(); try { MoodNative.saveJournalCopy(JSON.stringify(db), `${todayStr()}-before`); } catch(_){}
        db = hydrate(parsed); flushSave(); applyTheme(); applyTabs(); render();
        toast(tl('back to {date}', { date: fmtNice(d) }) + ' ✓');
      } catch(_){ toast('⚠ ' + tl('that backup could not be read')); }
    } })));
  });
  $('#s-guide').addEventListener('click', () => openGuide('basics'));
  $('#s-importhub').addEventListener('click', openImportHub);
  $('#s-stats').addEventListener('click', () => openStats());
  $('#s-wipe').addEventListener('click', async () => {
    if (!await askConfirm(tl('Erase everything?'), { detail:tl('All entries, lists, health data and settings. Export a backup first — there is no undo.'), ok:tl('erase all'), danger:true })) return;
    if (!await askConfirm(tl('Really erase everything?'), { detail:tl('Last chance — this cannot be undone.'), ok:tl('yes, erase'), danger:true })) return;
    db = hydrate({}); localStorage.removeItem(LS_KEY); flushSave();
    applyTheme(); closeModal(); render(); toast(tl('journal erased — fresh page'));
  });
  $$('[data-kguide]').forEach(b => b.addEventListener('click', () => openKeyGuide(b.dataset.kguide, openSettings)));
  $('#s-sync')?.addEventListener('click', () => openSyncSetup(openSettings));
  $('#s-friends')?.addEventListener('click', () => openFriends());
  $('#s-save').addEventListener('click', () => {
    db.settings.stepGoal = Math.max(500, +($('#s-goal').value || 8000));
    db.settings.waterGoal = Math.max(250, +($('#s-water').value || 2000));
    db.settings.name = $('#s-name')?.value.trim() ?? db.settings.name;
    save(); closeModal(); render(); toast(tl('settings saved ✕'));
  });
}

/* ============ sample data ============ */
async function loadSample(){
  if (db.media.length && !await askConfirm(tl('Add sample entries?'), { detail:tl('They go alongside your existing data.'), ok:tl('add samples') })) return;
  const t = new Date();
  const ago = n => dateStr(addDays(t, -n));
  const mk = (o) => ({ id:uid(), creator:'', year:'', cover:'', color:pickColor(), status:'planned',
    startDate:'', endDate:'', rating:0, notes:'', pagesTotal:0, pagesRead:0, seasons:[], tvmazeId:null,
    runtimeMin:0, epMin:0, playHours:0, addedAt:todayStr(), ...o });
  db.media.push(
    mk({ type:'book', title:'The Name of the Wind', creator:'Patrick Rothfuss', year:'2007',
      cover:'https://covers.openlibrary.org/b/isbn/9780756404741-L.jpg',
      status:'active', startDate:ago(18), pagesTotal:662, pagesRead:310,
      notes:'Kvothe is insufferable and I can\'t stop reading. The framing device works.\nInn scenes = cozy.' }),
    mk({ type:'tv', title:'Severance', year:'2022', status:'active', startDate:ago(12), epMin:50,
      notes:'The waffle party episode broke me.',
      seasons:[
        { n:1, episodes:Array.from({length:9},(_,i)=>({ n:i+1, name:'Episode '+(i+1), watched:true })) },
        { n:2, episodes:Array.from({length:10},(_,i)=>({ n:i+1, name:'Episode '+(i+1), watched:i<4 })) },
      ]}),
    mk({ type:'movie', title:'Blade Runner 2049', creator:'Denis Villeneuve', year:'2017',
      status:'done', startDate:ago(9), endDate:ago(9), rating:5,
      notes:'Rewatch. Still the best-looking film of the decade. Sea wall fight!!' }),
    mk({ type:'game', title:'Hades II', creator:'Supergiant Games', year:'2024',
      status:'done', startDate:ago(49), endDate:ago(12), rating:4,
      notes:'Melinoë > Zagreus, fight me. Fear system is a great twist on heat.' }),
    mk({ type:'movie', title:'Stalker', creator:'Andrei Tarkovsky', year:'1979', status:'planned', runtimeMin:162,
      notes:'Everyone keeps telling me. Fine. It\'s on the list.' }),
    mk({ type:'book', title:'Piranesi', creator:'Susanna Clarke', year:'2020',
      cover:'https://covers.openlibrary.org/b/isbn/9781635575637-L.jpg', status:'planned', pagesTotal:245 }),
    mk({ type:'game', title:'Outer Wilds', creator:'Mobius Digital', year:'2019', status:'planned', playHours:22,
      notes:'Apparently unspoilable. Going in blind.' }),
  );
  db.media.filter(x => x.status === 'planned' && !db.queue.includes(x.id)).forEach(x => db.queue.push(x.id));
  // sample spending: four months with dates, so insights and monthly charges have something to compare
  const mk2 = (d, a, c, day) => ({ id: uid(), desc: d, amt: a, cat: c, d: day, src: 'statement' });
  for (let back = 3; back >= 0; back--){
    const md = new Date(t.getFullYear(), t.getMonth() - back, 1), key = `${md.getFullYear()}-${pad2(md.getMonth() + 1)}`;
    if (db.spend[key]) continue;
    const day = n => `${key}-${pad2(Math.min(n, back ? 28 : Math.max(1, t.getDate())))}`;
    const w = 1 + ((back * 37) % 7) / 20;
    const tx = [
      mk2('MIGROS SANAL MARKET', Math.round(1240 * w), 'Groceries', day(3)), mk2('A101', Math.round(386 * w), 'Groceries', day(9)), mk2('CARREFOURSA', 512, 'Groceries', day(17)),
      mk2('YEMEKSEPETI', back ? 640 : 1420, 'Dining Out', day(6)), mk2('KAHVE DUNYASI', 185, 'Dining Out', day(12)),
      mk2('ISTANBULKART', 300, 'Transport', day(2)), mk2('BITAKSI', Math.round(220 * w), 'Transport', day(14)),
      mk2('SPOTIFY', 60, 'Subscriptions', day(5)), mk2('YOUTUBE PREMIUM', back >= 1 ? 80 : 95, 'Subscriptions', day(5)),
      mk2('TRENDYOL', Math.round(899 / w), 'Shopping', day(20)), mk2('ECZANE', 145, 'Health', day(11)),
      mk2('KIRA', 15000, 'Rent & Bills', day(1)), mk2('ENERJISA', Math.round(640 * w), 'Rent & Bills', day(8)),
    ];
    if (back <= 1) tx.push(mk2('NETFLIX', 230, 'Subscriptions', day(4)));
    db.spend[key] = { currency: '₺', importedAt: todayStr(), tx };
  }
  if (!db.savings.entries.length){
    const mAgo = n => { const d = new Date(t.getFullYear(), t.getMonth() - n, Math.min(t.getDate(), 28)); return dateStr(d); };
    db.savings.entries = [
      { date: mAgo(2), can: 30000, ila: 70000, canAdd: 0, ilaAdd: 0 },
      { date: mAgo(1), can: 40000, ila: 82000, canAdd: 7000, ilaAdd: 5000 },   // ~10% on 100k + top-ups
      { date: mAgo(0), can: 48600, ila: 94380, canAdd: 5000, ilaAdd: 5000 },   // ~9% on 122k + top-ups
    ];
  }
  const goal = db.settings.stepGoal || 8000;
  for (let i = 0; i < 45; i++){
    const ds = ago(i);
    if (db.health[ds]) continue;
    const seed = (i * 7919 + 137) % 9973;
    const steps = 3200 + (seed % 8800);
    const h = { steps, walkMin:0, walkKm:0 };
    if (seed % 4 === 0){ h.walkMin = 20 + (seed % 45); h.walkKm = Math.round(h.walkMin * 0.09 * 10) / 10; }
    db.health[ds] = h;
  }
  save(); closeModal(); render();
  toast(tl('sample journal loaded ✕ — erase anytime in settings'));
}

/* ============ init ============ */
function flushSave(){ writeJournal(true); }
window.addEventListener('beforeunload', flushSave);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });

$('#btn-settings').innerHTML = ICONS.gear;
$('#btn-layout').innerHTML = ICONS.layout;
$('#btn-search').innerHTML = ICONS.search;
$('#btn-search').addEventListener('click', openSearch);
$('#btn-layout').addEventListener('click', openLayoutEditor);
$('#modal-close').innerHTML = ICONS.x;
$('#btn-settings').addEventListener('click', openSettings);
const TAB_ICONS = {
  home:ICONS.home, library:ICONS.shelf, queue:ICONS.queue, calendar:ICONS.cal, health:ICONS.heart,
  habits:ICONS.chain, spend:ICONS.coin, projects:ICONS.clipboard, kitchen:ICONS.fork,
};
$$('.deck .key[data-view] .ki').forEach(s => { s.innerHTML = TAB_ICONS[s.parentElement.dataset.view] || ''; });
$('#btn-add .ki').innerHTML = ICONS.plus;
$('#btn-burger .ki').innerHTML = ICONS.burger;
setLang(db.settings.lang || ((navigator.language || '').toLowerCase().startsWith('tr') ? 'tr' : 'en'));
applyTheme();
applyTabs();
switchView(enabledTabs()[0] || 'home', true);
checkGame();
if (needsSetup()) openSetup(0);
storeReady.then(() => setTimeout(() => syncNow('start'), 800));
friendCacheLoad().then(() => { if (ui.view === 'home') render(); setTimeout(() => loadFriends(), 2500); });
// the installed pc app works offline (not for the android app — it carries its own files)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
setTimeout(() => refreshAirdates(), 4000);
// saved covers load quietly; anything not saved yet is saved a little later
loadCoverCache().then(() => { if (db.media.some(e => /^idb:/.test(e.cover || ''))) render(); setTimeout(cacheAllCovers, 6000); });
if (NATIVE) setTimeout(() => {
  try { MoodNative.autoSync(); } catch(_){}
  scheduleReminders();                                          // re-arm pill/water alarms
  try { if (MoodNative.consumeShare) MoodNative.consumeShare(); } catch(_){}  // shared text/images arrive via onNativeShare
}, 600);
</script>
