/* ---- shopping list: manual + from recipes, with lookalike merging ---- */
function normName(s){ return String(s).toLowerCase().replace(/i̇/g, 'i').trim(); }
function simNames(a, b){
  a = normName(a); b = normName(b);
  if (!a || !b) return false;
  if (a === b) return true;
  if (a.length >= 4 && b.length >= 4 && (a.includes(b) || b.includes(a))) return true;
  return a.split(/\s+/).some(w => w.length >= 5 && b.includes(w));
}
function addToShopping(name, qty, from, dedupe){
  name = String(name || '').trim();
  if (!name) return 'skip';
  if (dedupe){
    const ex = db.kitchen.shopping.find(x => !x.done && simNames(x.name, name));
    if (ex) return 'dupe';
  }
  db.kitchen.shopping.push({ id: uid(), name, qty: String(qty || '').trim(), from: String(from || '').trim(), done: false });
  return 'added';
}
async function mergeShopItems(ids){
  const items = ids.map(id => db.kitchen.shopping.find(x => x.id === id)).filter(Boolean);
  if (items.length < 2) return;
  const shortest = items.slice().sort((a, b) => a.name.length - b.name.length)[0].name;
  const name = (await askText(tl('Merged item name'), { value: shortest, ok:tl('merge') }) || '').trim();
  if (!name) return;
  const qty = items.map(x => x.qty).filter(Boolean).join(' + ');
  const from = [...new Set(items.map(x => x.from).filter(Boolean))].join(', ');
  const at = db.kitchen.shopping.indexOf(items[0]);
  db.kitchen.shopping = db.kitchen.shopping.filter(x => !ids.includes(x.id));
  db.kitchen.shopping.splice(at, 0, { id: uid(), name, qty, from, done: false });
  ui.shopSel = new Set();
  save(); renderKitchen();
  toast(tl('{n} items merged → {name}', { n: items.length, name }) + ' ✕');
}

const FOOD_INDEX = FOOD_DB.flatMap(([names, cat, days]) => names.map(n => ({ n: normName(n), cat, days }))).sort((a, b) => b.n.length - a.n.length);
function guessFood(name){

function fridgeHas(ing){
  const key = normName(ing.nameTr || ing.name || '');
  const key2 = normName(ing.name || '');
  return db.kitchen.fridge.some(f => {
    const fn = normName(f.name);
    return [key, key2].some(k => k && (k.includes(fn) || fn.includes(k.split(' ')[0]) || k.split(' ').some(w => w.length > 3 && fn.includes(w))));
  });
}
function fridgeExpiry(f){
  // manual expiry wins; otherwise a shelf-life estimate (built-in list or gemini) from the day it was added
  if (f.expiry) return { d: f.expiry, est: false };
  if (f.shelfDays){
    const base = parseDate(f.addedAt || f.estFrom || todayStr());
    return { d: dateStr(addDays(base, f.shelfDays)), est: true };
  }
  return null;
}
const daysUntil = d => Math.ceil((parseDate(d) - parseDate(todayStr())) / 86400000);
function expiryChip(f){
  const ex = fridgeExpiry(f);
  if (!ex) return `<span class="fe none">—</span>`;
  const n = daysUntil(ex.d);
  const cls = n < 0 ? 'over' : n <= 1 ? 'soon' : n <= 3 ? 'warn' : '';
  const txt = n < 0 ? tl('expired') : n === 0 ? tl('today') : n === 1 ? tl('tomorrow') : n <= 13 ? tl('{n} days', { n }) : n < 60 ? tl('{n} weeks', { n: Math.round(n / 7) }) : tl('months');
  return `<span class="fe ${cls}" title="${ex.est ? tl('estimate') : tl('expiry date')} · ${fmtNice(ex.d)}">${ex.est ? '≈ ' : ''}${txt}</span>`;
}
const recipeTitle = r => LANG === 'tr' ? (r.titleTr || r.title) : (r.title || r.titleTr);
const ingName = i => LANG === 'tr' ? (i.nameTr || i.name) : (i.name || i.nameTr);
const recipeSteps = r => LANG === 'tr' ? (r.stepsTr?.length ? r.stepsTr : r.steps || []) : (r.steps?.length ? r.steps : r.stepsTr || []);
const recipeMissing = r => r.ingredients.filter(i => !fridgeHas(i));
// "200 g" × 1.5 → "300 g"; amounts without a leading number stay as they are
function scaleAmount(a, k){
  if (!a || k === 1) return a || '';
  return String(a).replace(/^(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?/, (m, x, y) => {
    const f = v => { const r = Math.round(parseFloat(v.replace(',', '.')) * k * 10) / 10; return String(r).replace('.', LANG === 'tr' ? ',' : '.'); };
    return y ? `${f(x)}–${f(y)}` : f(x);
  });
}

// swipe a row left → callback (used for "used up"); taps still open the row
function wireRowSwipe(row, onLeft){
  let x0 = 0, y0 = 0, dx = 0, st = 'idle', pid = null;
  row.addEventListener('pointerdown', ev => { x0 = ev.clientX; y0 = ev.clientY; dx = 0; st = 'maybe'; pid = ev.pointerId; delete row.dataset.swiped; });
  row.addEventListener('pointermove', ev => {
    if (st === 'idle' || ev.pointerId !== pid) return;
    const mx = ev.clientX - x0, my = ev.clientY - y0;
    if (st === 'maybe'){ if (Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)){ st = 'idle'; return; } if (mx > -12) return; st = 'swipe'; row.setPointerCapture(pid); }
    dx = clamp(mx, -130, 0); row.style.transform = `translateX(${dx}px)`; row.classList.toggle('armed', dx < -80); row.dataset.swiped = '1';
  });
  const end = () => {
    if (st === 'swipe' && dx < -80){ haptic('confirm'); row.style.transition = 'transform .15s'; row.style.transform = 'translateX(-110%)'; setTimeout(onLeft, 150); }
    else { row.style.transition = 'transform .15s'; row.style.transform = ''; setTimeout(() => { row.style.transition = ''; row.classList.remove('armed'); }, 150); }
    st = 'idle'; setTimeout(() => delete row.dataset.swiped, 30);
  };
  row.addEventListener('pointerup', end);
  row.addEventListener('pointercancel', () => { row.style.transform = ''; st = 'idle'; });
}
function usedUp(id){
  const f = db.kitchen.fridge.find(x => x.id === id); if (!f) return;
  const before = db.kitchen.fridge.slice();
  db.kitchen.fridge = db.kitchen.fridge.filter(x => x.id !== id);
  (db.kitchen.wasteLog = db.kitchen.wasteLog || []).push({ d: todayStr(), name: f.name, used: true });
  save(); renderKitchen();
  toast(tl('{name} used up', { name: f.name }), {
    undo: () => { db.kitchen.fridge = before; save(); renderKitchen(); },
    action: { label: tl('add to market'), fn: () => { addToShopping(f.name, '', '', true); save(); renderKitchen(); toast(tl('added to the market list') + ' ✓'); } },
  });
}
function openFridgeItem(id){
  const f = id ? db.kitchen.fridge.find(x => x.id === id) : null;
  const ex = f ? fridgeExpiry(f) : null;
  openModal(`

      </div>
      <div class="field"><label>${tl('shelf')}</label>
        <div class="k-shelves">${FRIDGE_CATS.map(c => `<button class="k-shelf-pick ${c === (f?.cat || '') ? 'on' : ''}" data-cat="${c}">${SHELF_ICONS[c]}<span>${tl(c)}</span></button>`).join('')}</div>
      </div>
      <div class="field"><label>${tl('good until')}</label>
        <div class="k-exp">${[['auto', tl('auto')], [3, tl('{n} days', { n: 3 })], [7, tl('1 week')], [14, tl('2 weeks')], [30, tl('1 month')]].map(([v, l]) => `<button class="chip" data-exp="${v}">${l}</button>`).join('')}
          <input type="date" class="input" id="fi-date" value="${f?.expiry || ''}"></div>
        <div class="k-guess mono small muted" id="fi-guess"></div>
      </div>
      <div class="dlg-actions ${f ? 'three' : ''}">
        ${f ? `<button class="btn danger" id="fi-del">${ICONS.trash} ${tl('delete')}</button>` : ''}
        <button class="btn" id="fi-cancel">${tl('cancel')}</button>
        <button class="btn primary" id="fi-save">${ICONS.check} ${tl('save')}</button>
      </div>
    </div>`);
  $('#modal').classList.add('sheet'); $('#modal-overlay').classList.add('sheet-open');
  let cat = f?.cat || '', expMode = f?.expiry ? 'date' : (f?.shelfDays ? 'auto' : 'auto'), pickedDays = null, catTouched = !!f;
  const guessBox = $('#fi-guess');
  const refresh = () => {
    const g = guessFood($('#fi-name').value);
    if (g && !catTouched){ cat = g.cat; }
    $$('.k-shelf-pick').forEach(b => b.classList.toggle('on', b.dataset.cat === cat));
    $$('[data-exp]').forEach(b => b.classList.toggle('on', expMode === 'auto' ? b.dataset.exp === 'auto' : expMode === 'days' && +b.dataset.exp === pickedDays));
    const days = expMode === 'days' ? pickedDays : expMode === 'auto' ? (g?.days || f?.shelfDays || null) : null;
    guessBox.textContent = expMode === 'date' ? '' : days ? tl('≈ good until {date}', { date: fmtNice(dateStr(addDays(new Date(), days))) }) + (expMode === 'auto' && g ? ' · ' + tl('typical for {x}', { x: tl(g.cat) }) : '') : tl('no estimate — pick a time or a date');
  };
  $('#fi-name').addEventListener('input', refresh);
  $$('.k-shelf-pick').forEach(b => b.addEventListener('click', () => { cat = b.dataset.cat; catTouched = true; refresh(); }));
  $$('[data-exp]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.exp === 'auto'){ expMode = 'auto'; pickedDays = null; } else { expMode = 'days'; pickedDays = +b.dataset.exp; }
    $('#fi-date').value = ''; refresh();
  }));
  $('#fi-date').addEventListener('change', () => { expMode = $('#fi-date').value ? 'date' : 'auto'; refresh(); });
  refresh();
  if (!f) setTimeout(() => $('#fi-name').focus(), 50);
  $('#fi-cancel').addEventListener('click', closeModal);
  $('#fi-del')?.addEventListener('click', () => { db.kitchen.fridge = db.kitchen.fridge.filter(x => x.id !== f.id); save(); closeModal(); renderKitchen(); toast(tl('removed')); });
  $('#fi-save').addEventListener('click', () => {
    const name = $('#fi-name').value.trim(); if (!name){ toast('⚠ ' + tl('name it')); return; }
    const g = guessFood(name);
    const item = f || { id: uid(), addedAt: todayStr() };
    item.name = name; item.qty = $('#fi-qty').value.trim(); item.cat = cat || g?.cat || 'Diğer';
    if (expMode === 'date'){ item.expiry = $('#fi-date').value; delete item.shelfDays; }
    else {
      item.expiry = '';
      const days = expMode === 'days' ? pickedDays : (g?.days || item.shelfDays || 0);
      if (days){ item.shelfDays = days; item.estFrom = todayStr(); item.addedAt = expMode === 'days' ? todayStr() : item.addedAt; } else delete item.shelfDays;
    }
    if (!f) db.kitchen.fridge.push(item);
    save(); closeModal(); renderKitchen();
    toast(f ? tl('saved') + ' ✓' : tl('{name} added to the fridge', { name }) + ' ✓');
  });
}

/* ---- recipes: cards, detail with scaler, cook mode, "i cooked this" ---- */
function recipeThumb(r, cls = 'k-thumb'){
  return `<span class="${cls}">${r.photo ? `<img src="${r.photo}" alt="">` : `<span class="ph">${ICONS.fork}<b>${esc((recipeTitle(r) || '?')[0].toUpperCase())}</b></span>`}</span>`;
}
function renderRecipes(box){
  const list = db.kitchen.recipes.slice().sort((a, b) => recipeMissing(a).length - recipeMissing(b).length);
  box.innerHTML = `
    <div class="k-bar">
      <button class="btn primary" id="r-import">${ICONS.spark} ${tl('import with gemini')}</button>
      <button class="btn ghost" id="r-manual">${ICONS.edit} ${tl('write one')}</button>
    </div>
    <div class="k-recipes">${list.map(r => {
      const miss = recipeMissing(r).length;
      const ps = r.perServing;
      return `
      <button class="k-rcard" data-r="${r.id}">
        ${recipeThumb(r)}
        <span class="k-rinfo">
          <span class="k-rt">${esc(recipeTitle(r))}</span>
          <span class="k-rm">${[r.timeMin ? tl('{n} min', { n: r.timeMin }) : '', r.servings ? tl('serves {n}', { n: r.servings }) : '', ps?.kcal ? tl('{n} kcal', { n: Math.round(ps.kcal) }) : ''].filter(Boolean).join(' · ') || tl('{n} ingredients', { n: r.ingredients.length })}</span>
          <span class="k-badge ${miss ? '' : 'ok'}">${miss ? tl('missing {n}', { n: miss }) : ICONS.check + ' ' + tl('can cook')}</span>
        </span>
      </button>`;
    }).join('')}</div>
    ${list.length ? '' : `<div class="panel qpanel"><div class="qp-empty"><span class="hand">${tl('no recipes yet…')}</span><span class="mono">${tl('paste one, photograph one, or share one from your phone')}</span></div></div>`}`;
  $('#r-import').addEventListener('click', () => openRecipeImport());
  $('#r-manual').addEventListener('click', () => openRecipeManual(null));
  $$('.k-rcard', box).forEach(c => c.addEventListener('click', () => openRecipe(c.dataset.r)));
}
function openRecipe(id, servingsOverride){
  const r = db.kitchen.recipes.find(x => x.id === id); if (!r) return;
  const base = r.servings || 1;
  const serv = servingsOverride || base;
  const k = serv / base;
  const steps = recipeSteps(r);
  const miss = recipeMissing(r);
  const ps = r.perServing;
  openModal(`
    <div class="k-rhero">
      ${recipeThumb(r, 'k-rphoto')}
      <div class="k-rhead">
        <h2>${esc(recipeTitle(r))}</h2>
        <div class="k-rm">${[r.timeMin ? tl('{n} min', { n: r.timeMin }) : '', tl('{n} ingredients', { n: r.ingredients.length }), tl('{n} steps', { n: steps.length })].filter(Boolean).join(' · ')}</div>
        <div class="k-scaler"><button class="ly-btn" id="rs-minus" aria-label="${tl('fewer servings')}">−</button><b>${tl('serves {n}', { n: serv })}</b><button class="ly-btn" id="rs-plus" aria-label="${tl('more servings')}">+</button></div>
      </div>
    </div>
    ${ps?.kcal ? `<div class="k-macros">
      <div><b>${Math.round(ps.kcal)}</b><span>kcal</span></div><div><b>${Math.round(ps.protein || 0)} g</b><span>${tl('protein')}</span></div>
      <div><b>${Math.round(ps.carbs || 0)} g</b><span>${tl('carbs')}</span></div><div><b>${Math.round(ps.fat || 0)} g</b><span>${tl('fat')}</span></div>
      <em>${tl('per serving · estimate')}</em></div>`
      : aiOn() ? `<button class="dt-link" id="r-macros">${ICONS.spark} ${tl('estimate calories & macros')}</button>` : ''}
    <div class="dt-actions">
      <button class="btn primary" id="r-cook">${ICONS.stActive} ${tl('cook mode')}</button>
      <button class="btn" id="r-cooked">${ICONS.check} ${tl('I cooked this')}</button>
    </div>
    <section class="dt-sec">
      <div class="dt-h"><span>${tl('ingredients')}</span><em>${miss.length ? tl('missing {n}', { n: miss.length }) : tl('all at home')}</em></div>
      ${r.ingredients.map(i => `
      <div class="k-ing ${fridgeHas(i) ? 'have' : 'miss'}">
        <span class="k-dot"></span><span class="k-amt">${esc(scaleAmount(i.amount, k))}</span>
        <span class="k-iname">${esc(ingName(i))}${i.sub ? `<span class="sub">${tl('instead: {x}', { x: esc(i.sub) })}</span>` : ''}</span>
      </div>`).join('')}
      <div class="row" style="margin-top:10px">
        ${miss.length ? `<button class="btn" id="r-shop-miss">${ICONS.cart} ${tl('add missing to list ({n})', { n: miss.length })}</button>` : ''}
        <button class="btn ghost" id="r-shop-all">${tl('add all to the list')}</button>
      </div>
    </section>
    <section class="dt-sec">
      <div class="dt-h"><span>${tl('steps')}</span></div>
      ${steps.map((s, i) => `<div class="step-row"><span class="sn">${pad2(i+1)}</span><span>${esc(s)}</span></div>`).join('') || `<div class="dt-empty">${tl('no steps saved')}</div>`}
    </section>
    <div class="row" style="justify-content:flex-end; margin-top:14px"><button class="btn danger" id="r-del">${ICONS.trash} ${tl('delete')}</button></div>`);
  $('#rs-minus').addEventListener('click', () => openRecipe(id, Math.max(1, serv - 1)));
  $('#rs-plus').addEventListener('click', () => openRecipe(id, serv + 1));
  $('#r-cook').addEventListener('click', () => cookMode(r, k));
  $('#r-cooked').addEventListener('click', () => cookedIt(r, serv));
  $('#r-macros')?.addEventListener('click', () => geminiRecipeMacros(r));
  const shopFrom = ings => {
    let added = 0, dupes = 0;
    ings.forEach(i => { const res = addToShopping(ingName(i), scaleAmount(i.amount, k), recipeTitle(r), true); if (res === 'added') added++; else if (res === 'dupe') dupes++; });
    save();
    toast(tl('{n} added to the list', { n: added }) + (dupes ? ' · ' + tl('{n} were already there', { n: dupes }) : '') + ' ✕');
    closeModal(); ui.kitchenTab = 'shopping'; renderKitchen();
  };
  $('#r-shop-miss')?.addEventListener('click', () => shopFrom(miss));
  $('#r-shop-all').addEventListener('click', () => shopFrom(r.ingredients));
  $('#r-del').addEventListener('click', async () => {
    if (!await askConfirm(tl('Delete this recipe?'), { ok:tl('delete'), danger:true })) return;
    db.kitchen.recipes = db.kitchen.recipes.filter(x => x.id !== id);
    save(); closeModal(); renderKitchen();
  });
}
// cook mode: one big step at a time, screen kept awake
let wakeLock = null;
async function keepAwake(on){
  try { if (window.MoodNative?.keepAwake) MoodNative.keepAwake(!!on); } catch(_){}
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(_){}
}
function cookMode(r, k){
  const steps = recipeSteps(r);
  if (!steps.length){ toast('⚠ ' + tl('no steps saved')); return; }
  let i = 0, showIng = false;
  keepAwake(true);
  const draw = () => {
    openModal(`
      <div class="cook">
        <div class="cook-top"><span>${esc(recipeTitle(r))}</span><b>${tl('step {i} of {n}', { i: i + 1, n: steps.length })}</b></div>
        <div class="cook-bar"><i style="width:${Math.round((i + 1) / steps.length * 100)}%"></i></div>
        ${showIng ? `<div class="cook-ings">${r.ingredients.map(x => `<div><b>${esc(scaleAmount(x.amount, k))}</b> ${esc(ingName(x))}</div>`).join('')}</div>`
          : `<div class="cook-step">${esc(steps[i])}</div>`}
        <div class="cook-nav">
          <button class="btn" id="ck-prev" ${i === 0 ? 'disabled' : ''}>${ICONS.left} ${tl('back')}</button>
          <button class="btn ghost" id="ck-ing">${showIng ? tl('steps') : tl('ingredients')}</button>
          ${i < steps.length - 1 ? `<button class="btn primary" id="ck-next">${tl('next')} ${ICONS.right}</button>` : `<button class="btn primary" id="ck-done">${ICONS.check} ${tl('done')}</button>`}
        </div>
      </div>`);
    $('#modal').classList.add('cooking');
    $('#ck-prev').addEventListener('click', () => { i = Math.max(0, i - 1); showIng = false; draw(); });
    $('#ck-next')?.addEventListener('click', () => { i++; showIng = false; draw(); });
    $('#ck-ing').addEventListener('click', () => { showIng = !showIng; draw(); });
    $('#ck-done')?.addEventListener('click', () => { keepAwake(false); $('#modal').classList.remove('cooking'); cookedIt(r, Math.round((r.servings || 1) * k)); });
  };
  draw();
}

/* "i cooked this": take the ingredients out of the fridge, log the meal for the Body tab */
function cookedIt(r, serv){
  const used = db.kitchen.fridge.filter(f => r.ingredients.some(i => {
    const fn = normName(f.name);
    return [i.nameTr, i.name].some(n => n && (normName(n).includes(fn) || fn.includes(normName(n).split(' ')[0])));
  }));
  const ps = r.perServing;
  openModal(`
    <div class="sheet-title">${tl('Cooked {name}', { name: esc(recipeTitle(r)) })}</div>
    <div class="k-form">
      <div class="field"><label>${tl('how many servings did you eat?')}</label>
        <div class="k-scaler"><button class="ly-btn" id="ci-minus">−</button><b id="ci-n">1</b><button class="ly-btn" id="ci-plus">+</button>
          ${ps?.kcal ? `<span class="mono small muted" id="ci-kcal"></span>` : ''}</div>
      </div>
      ${used.length ? `<div class="field"><label>${tl('used up from the fridge')}</label>
        ${used.map(f => `<label class="k-check"><input type="checkbox" data-used="${f.id}" checked> <span>${esc(f.name)}</span> <em>${esc(f.qty || '')}</em></label>`).join('')}
        <div class="mono small muted">${tl('untick anything that\'s still left')}</div></div>` : ''}
      <div class="dlg-actions"><button class="btn" id="ci-cancel">${tl('cancel')}</button><button class="btn primary" id="ci-ok">${ICONS.check} ${tl('log it')}</button></div>
    </div>`);
  $('#modal').classList.add('sheet'); $('#modal-overlay').classList.add('sheet-open');
  let n = 1;
  const upd = () => { $('#ci-n').textContent = n; if ($('#ci-kcal')) $('#ci-kcal').textContent = '≈ ' + tl('{n} kcal', { n: Math.round(ps.kcal * n) }); };
  $('#ci-minus').addEventListener('click', () => { n = Math.max(0.5, n - 0.5); upd(); });
  $('#ci-plus').addEventListener('click', () => { n += 0.5; upd(); });
  upd();
  $('#ci-cancel').addEventListener('click', closeModal);
  $('#ci-ok').addEventListener('click', () => {
    const gone = $$('[data-used]').filter(c => c.checked).map(c => c.dataset.used);
    db.kitchen.fridge = db.kitchen.fridge.filter(f => !gone.includes(f.id));
    // meal log — read by the Body tab (calories / macros) and the habit layer (cooked at home)
    const h = new Date().getHours();
    (db.mealLog = db.mealLog || []).push({
      id: uid(), d: todayStr(), t: `${pad2(h)}:${pad2(new Date().getMinutes())}`,
      slot: h < 11 ? 'breakfast' : h < 16 ? 'lunch' : h < 22 ? 'dinner' : 'snack',
      kind: 'recipe', recipeId: r.id, name: recipeTitle(r), servings: n,
      kcal: ps?.kcal ? Math.round(ps.kcal * n) : null, protein: ps?.protein ? Math.round(ps.protein * n) : null,
      carbs: ps?.carbs ? Math.round(ps.carbs * n) : null, fat: ps?.fat ? Math.round(ps.fat * n) : null,
    });
    r.cookedCount = (r.cookedCount || 0) + 1; r.lastCooked = todayStr();
    save(); closeModal(); renderKitchen();
    toast(tl('cooked & logged') + ' ✓' + (gone.length ? ' · ' + tl('{n} items out of the fridge', { n: gone.length }) : ''));
  });
}

/* ---- market: grouped by aisle, bought → fridge, share ---- */
function renderShopping(box){
  const list = db.kitchen.shopping;
  if (!ui.shopSel) ui.shopSel = new Set();
  const sel = ui.shopSel;
  const doneN = list.filter(x => x.done).length;
  const aisleOf = it => it.aisle || guessFood(it.name)?.cat || 'Diğer';
  const open = list.filter(x => !x.done), bought = list.filter(x => x.done);
  const groups = FRIDGE_CATS.map(c => ({ c, list: open.filter(it => aisleOf(it) === c) })).filter(g => g.list.length);
  const row = it => {
    const simEarlier = !it.done && open.slice(0, open.indexOf(it)).find(x => simNames(x.name, it.name));
    return `
    <div class="k-srow ${it.done ? 'done' : ''}" data-sid="${it.id}">
      <button class="k-box ${it.done ? 'on' : ''}" data-stgl="${it.id}" aria-label="${tl('bought')}">${it.done ? ICONS.check : ''}</button>
      <span class="k-sname" data-stgl="${it.id}"><b>${esc(it.name)}</b>${it.qty ? `<span class="k-qty">${esc(it.qty)}</span>` : ''}${it.from ? `<span class="k-from">${esc(it.from)}</span>` : ''}</span>
      ${it.done ? `<button class="k-tofridge" data-tofridge="${it.id}">${ICONS.fridge} ${tl('to fridge')}</button>`
        : `<button class="sdot ${sel.has(it.id) ? 'on' : ''}" data-ssel="${it.id}" title="${tl('select to merge')}">${sel.has(it.id) ? ICONS.check : ''}</button>`}
      <button class="tx-del" data-sdel="${it.id}" aria-label="${tl('remove')}">${ICONS.x}</button>
      ${simEarlier ? `<button class="merge-chip" data-smerge="${it.id}|${simEarlier.id}">≈ ${tl('merge with "{name}"', { name: esc(simEarlier.name) })}</button>` : ''}
    </div>`;
  };
  box.innerHTML = `
    <div class="k-addbar">
      <input class="input" id="sh-name" placeholder="${tl('add to the list…')}" autocomplete="off">
      <input class="input" id="sh-qty" placeholder="${tl('amount')}">
      <button class="btn primary" id="sh-add" aria-label="${tl('add')}">${ICONS.plus}</button>
    </div>
    ${list.length ? `<div class="k-bar">
      <button class="btn ghost" id="sh-share">${ICONS.ul} ${tl('share list')}</button>
      ${doneN ? `<button class="btn" id="sh-tofridge">${ICONS.fridge} ${tl('all bought → fridge')}</button>` : ''}
    </div>` : ''}
    ${groups.map(g => `
      <section class="panel k-shelf">
        <header class="k-shelf-h"><span class="k-ico">${SHELF_ICONS[g.c]}</span><span>${tl(g.c)}</span><em>${g.list.length}</em></header>
        <div class="k-rows">${g.list.map(row).join('')}</div>
      </section>`).join('')}
    ${bought.length ? `
      <section class="panel k-shelf k-bought">
        <header class="k-shelf-h"><span class="k-ico">${ICONS.cart}</span><span>${tl('in the basket')}</span><em>${bought.length}</em>
          <button class="dt-link" id="sh-clear">${tl('clear')}</button></header>
        <div class="k-rows">${bought.map(row).join('')}</div>
      </section>` : ''}
    ${list.length ? '' : `<div class="panel qpanel"><div class="qp-empty"><span class="hand">${tl('the list is empty…')}</span><span class="mono">${tl('add by hand, or tap "add missing to list" on a recipe')}</span></div></div>`}
    ${sel.size >= 2 ? `
    <div class="merge-bar">
      <span class="mono">${tl('{n} selected', { n: sel.size })}</span><div class="spacer"></div>
      <button class="btn primary" id="sh-merge">${tl('merge')}</button><button class="btn" id="sh-selclear">${tl('cancel')}</button>
    </div>` : ''}`;
  const add = () => {
    const n = $('#sh-name').value.trim(); if (!n){ toast('⚠ ' + tl('item name')); return; }
    addToShopping(n, $('#sh-qty').value, '', false);
    save(); renderKitchen(); setTimeout(() => $('#sh-name')?.focus(), 30);
  };
  $('#sh-add').addEventListener('click', add);
  $('#sh-name').addEventListener('keydown', ev => { if (ev.key === 'Enter') add(); });
  $$('[data-stgl]', box).forEach(el => el.addEventListener('click', () => {
    const it = list.find(x => x.id === el.dataset.stgl); if (it){ it.done = !it.done; save(); renderKitchen(); }
  }));
  $$('[data-tofridge]', box).forEach(b => b.addEventListener('click', () => {
    const it = list.find(x => x.id === b.dataset.tofridge); if (!it) return;
    moveToFridge([it]); toast(tl('{name} added to the fridge', { name: it.name }) + ' ✓');
  }));
  $$('[data-sdel]', box).forEach(b => b.addEventListener('click', () => {
    db.kitchen.shopping = list.filter(x => x.id !== b.dataset.sdel); sel.delete(b.dataset.sdel); save(); renderKitchen();
  }));
  $$('[data-ssel]', box).forEach(d => d.addEventListener('click', () => { const id = d.dataset.ssel; sel.has(id) ? sel.delete(id) : sel.add(id); renderKitchen(); }));
  $$('[data-smerge]', box).forEach(c => c.addEventListener('click', () => mergeShopItems(c.dataset.smerge.split('|'))));
  $('#sh-merge')?.addEventListener('click', () => mergeShopItems([...sel]));
  $('#sh-selclear')?.addEventListener('click', () => { ui.shopSel = new Set(); renderKitchen(); });
  $('#sh-clear')?.addEventListener('click', () => { db.kitchen.shopping = list.filter(x => !x.done); save(); renderKitchen(); });
  $('#sh-tofridge')?.addEventListener('click', () => { const b2 = list.filter(x => x.done); moveToFridge(b2); toast(tl('{n} items moved to the fridge', { n: b2.length }) + ' ✕'); });
  $('#sh-share')?.addEventListener('click', shareShopping);
}
// bought items walk into the fridge with their shelf and shelf life guessed
function moveToFridge(items){
  items.forEach(x => {
    const g = guessFood(x.name);
    db.kitchen.fridge.push({ id: uid(), name: x.name, qty: x.qty, cat: g?.cat || 'Diğer', expiry: '', addedAt: todayStr(), ...(g?.days ? { shelfDays: g.days, estFrom: todayStr() } : {}) });
  });
  const ids = items.map(x => x.id);
  db.kitchen.shopping = db.kitchen.shopping.filter(x => !ids.includes(x.id));
  save(); renderKitchen();
}
function shareShopping(){
  const open = db.kitchen.shopping.filter(x => !x.done);
  const text = `${tl('market list')} — ${fmtNice(todayStr())}\n` + open.map(x => `☐ ${x.name}${x.qty ? ' (' + x.qty + ')' : ''}`).join('\n');
  try { if (window.MoodNative?.shareText){ MoodNative.shareText(text); return; } } catch(_){}
  if (navigator.share){ navigator.share({ text }).catch(() => {}); return; }
  copyText(text);
}

/* gemini: shelf life (days) + one turkish storage tip per fridge item */
async function geminiFridge(){
  const key = aiOn();
  if (!key){ toast(tl('⚠ add a gemini api key in settings first')); return; }
  const items = db.kitchen.fridge; if (!items.length) return;
  toast(tl('⌁ gemini raf ömürlerini hesaplıyor…'));
  const q = `For each fridge item below, estimate the typical refrigerated shelf life in days (integer, counted from purchase, standard home fridge at 4°C — for pantry items give their usual room-storage life) and give ONE short tip for optimal preservation (max 8 words).
Items: ${items.map(f => f.name).join(', ')}
Write the tip in ${LANG === 'tr' ? 'Turkish' : 'English'}.
Reply with ONLY this JSON array, names matching the input EXACTLY:
[{"name":"yumurta","days":21,"tip":"kapalı kutuda, orta rafta saklayın"}]`;
  try {
    const arr = looseJSON(await geminiCall([{ text: q }], { temperature: 0.1 }));
    let hit = 0;
    (Array.isArray(arr) ? arr : []).forEach(r => {
      const f = items.find(x => x.name.toLowerCase() === String(r.name || '').toLowerCase());
      if (f && +r.days > 0){ f.shelfDays = Math.round(+r.days); f.tip = String(r.tip || '').slice(0, 90); f.estFrom = f.addedAt || todayStr(); hit++; }
    });
    save(); renderKitchen();
    toast(hit ? tl('shelf life set for {n} items', { n: hit }) + ' ✕' : '⚠ ' + tl('no matching items found'));
  } catch(e){ toast('⚠ ' + e.message); }
}
/* gemini: calories + macros per serving for a saved recipe */
async function geminiRecipeMacros(r){
  const key = aiOn();
  if (!key){ toast(tl('⚠ add a gemini api key in settings first')); return; }
  toast('⌁ ' + tl('estimating calories & macros…'));
  const q = `Estimate the nutrition of ONE serving of this recipe (it makes ${r.servings || 1} servings).
Ingredients: ${r.ingredients.map(i => `${i.amount || ''} ${i.name || i.nameTr}`.trim()).join('; ')}
Reply with ONLY this JSON: {"kcal":0,"protein":0,"carbs":0,"fat":0,"timeMin":0} — grams for macros, timeMin = total prep + cook minutes.`;
  try {
    const j = looseJSON(await geminiCall([{ text: q }], { temperature: 0.1 }));
    if (+j.kcal > 0){
      r.perServing = { kcal: +j.kcal, protein: +j.protein || 0, carbs: +j.carbs || 0, fat: +j.fat || 0 };
      if (!r.timeMin && +j.timeMin > 0) r.timeMin = Math.round(+j.timeMin);
      save(); openRecipe(r.id); toast(tl('{n} kcal per serving', { n: Math.round(+j.kcal) }) + ' ✓'); return;
    }
  } catch(e){ toast('⚠ ' + e.message); return; }
  toast('⚠ ' + tl('no estimate — try again later'));
}

function syncQueueWithStatus(e){ if (e.status !== 'planned') db.queue = db.queue.filter(id => id !== e.id); }

/* time-to-finish estimates (remaining, in minutes; null = unknown) */
function estimateMin(e){
  const left = 1 - (typeof e.progressPct === 'number' ? clamp(e.progressPct / 100, 0, 1) : 0);
  if (e.type === 'movie') return e.status === 'done' ? 0 : (e.runtimeMin || 120) * left;
  if (e.type === 'album') return e.status === 'done' ? 0 : (e.runtimeMin || 45) * left;
  if (e.type === 'tv'){
    const all = e.seasons.flatMap(s => s.episodes);
    if (!all.length) return null;
    return all.filter(x => !x.watched).length * (e.epMin || 40);
  }
  if (e.type === 'book'){
    if (!e.pagesTotal) return null;
    return Math.max(0, e.pagesTotal - (e.pagesRead || 0)) * 1.5;   // ~40 pages/hour
  }
  if (e.type === 'game') return e.playHours ? e.playHours * 60 * left : null;
  return null;
}
function fmtDur(min){
  if (min === null) return null;
  if (min < 55) return tl('{n}m', { n: Math.max(1, Math.round(min / 5) * 5) });
  const h = min / 60;
  return tl('{n}h', { n: h < 10 ? (Math.round(h * 2) / 2).toString().replace('.0','') : Math.round(h) });
}
function etaHTML(e){
  const f = fmtDur(estimateMin(e));
  return f ? ` <span class="eta">· ≈${f}${e.status === 'active' ? ' left' : ''}</span>` : '';
}
function sumEta(list){
  let tot = 0, unknown = 0;
  list.forEach(e => { const m = estimateMin(e); if (m === null) unknown++; else tot += m; });
  if (!tot && unknown) return null;
  return fmtDur(tot) + (unknown ? '+' : '');
}

  const queueHTML = `

    <div data-sec="progress" data-sec-label="in progress">
    <section class="panel qpanel ql-card ${col.progress ? '' : 'open'}">
      ${head('progress', tl('In progress'), metaLine(active.length, tl('going'), sumEta(active), tl('left')))}
      ${col.progress ? strip(active) : `<div class="q-rail to-next">${active.map(e => qItemHTML(e, null, 'progress')).join('')}</div>`}
    </section>

    <div data-sec="next" data-sec-label="up next">
    <section class="panel qpanel ql-card ${col.next ? '' : 'open'}">
      ${head('next', tl('Up next'), metaLine(queued.length, tl('queued'), sumEta(queued), tl('total')))}
      ${col.next && queued.length ? strip(queued) : queued.length
        ? `<div class="q-rail ${active.length && !col.progress ? 'from-prev' : ''}" id="q-thread">${queued.map((e,i) => qItemHTML(e, i, 'queue')).join('')}</div>
           ${queued.length > 1 ? `<div class="qp-hint">${tl('hold a number and drag to reorder')}</div>` : ''}`
        : `<div class="qp-empty"><span class="hand">${ft === 'all' ? 'the queue is empty…' : 'nothing of this type queued…'}</span><span class="mono">${tl('log something as planned and it lines up here')}</span></div>`}
    </section></div>
    </div>`;

  const listsHTML = `

    ${listsShown.length ? '' : `<div class="panel qpanel"><div class="qp-empty"><span class="hand">${db.lists.length ? 'no lists with this type…' : 'no lists yet…'}</span><span class="mono">${tl('reading orders, marathons, backlogs — make one above')}</span></div></div>`}
    <div data-layout="lists" data-layout-label="Lists">
    ${listsShown.map(l => {
      const les = l.items.map(id => db.media.find(m => m.id === id)).filter(Boolean);
      const done = les.filter(e => e.status === 'done').length;

          <button class="q-more qp-more" data-lmore="${l.id}" aria-label="${tl('list options')}">${ICONS.more}</button>
        </header>

          ? (les.length
            ? `<div class="q-rail" data-listthread="${l.id}">${les.map((e,i) => qItemHTML(e, i, 'list', l.id)).join('')}</div>`
            : `<div class="qp-empty"><span class="mono">${tl('empty — open any entry → lists')}</span></div>`)
          : `<div class="ql-sum" data-lopen="${l.id}">
              <div class="ql-covers">${les.slice(0, 6).map(e => `<span class="${e.status === 'done' ? 'done' : ''}">${e.cover ? `<img src="${esc(e.cover)}" loading="lazy" data-ph="${esc(TYPES[e.type].icon)}" onerror="imgFb(this)">` : `<i>${TYPES[e.type].icon}</i>`}</span>`).join('')}${les.length > 6 ? `<b>+${les.length - 6}</b>` : ''}</div>
              <div class="ql-bar"><i style="width:${les.length ? Math.round(done / les.length * 100) : 0}%"></i></div>
            </div>`}

  const filterBar = `
    <div class="lf-seg q-filter" role="tablist">
      <button class="${ft === 'all' ? 'on' : ''}" data-qft="all">${ICONS.shelf}<span>${tl('All')}</span></button>
      ${Object.entries(TYPES).map(([k, t]) => `<button class="${ft === k ? 'on' : ''}" data-qft="${k}">${t.icon}<span>${k === 'tv' ? 'TV' : t.plural}</span></button>`).join('')}
    </div>`;
  const plannedN = items.filter(e => e.status === 'planned').length;
  const nextBtn = tab === 'queue' && plannedN >= 2 ? `<button class="wn-btn" id="q-next">${ICONS.spark}<span><b>${tl('what should I start next?')}</b><em>${tl(aiOn() ? 'gemini picks 3 from your queue' : 'needs a free gemini key')}</em></span>${ICONS.right}</button>` : '';
  v.innerHTML = tabs + filterBar + (tab === 'queue' ? nextBtn + queueHTML : listsHTML);
  $('#q-next')?.addEventListener('click', whatNext);
  $$('[data-qft]', v).forEach(b => b.addEventListener('click', () => { ui.qFilter = b.dataset.qft; renderQueue(); }));
  $$('[data-qtab]', v).forEach(b => b.addEventListener('click', () => { ui.qTab = b.dataset.qtab; renderQueue(); window.scrollTo(0, 0); }));
  $$('[data-qsec]', v).forEach(el => el.addEventListener('click', () => {
    col[el.dataset.qsec] = !col[el.dataset.qsec]; save(); renderQueue();
  }));
  $$('[data-qsec-sum]', v).forEach(el => el.addEventListener('click', () => {

  }));
  $$('[data-lopen]', v).forEach(el => el.addEventListener('click', ev => {
    if (ev.target.closest('.q-more')) return;
    ui.qOpenList = ui.qOpenList === el.dataset.lopen ? null : el.dataset.lopen; renderQueue();
  }));

  $$('.q-cover, .q-info .t', v).forEach(el =>
    el.addEventListener('click', () => openDetail(el.closest('.q-item').dataset.id)));

  const act = (e, what, listId) => {
    if (what === 'start'){ e.status = 'active'; e.startDate = e.startDate || todayStr(); logActivity(e, 'start'); syncQueueWithStatus(e); toast(tl('▶ started')); }
    if (what === 'done'){ e.status = 'done'; e.endDate = e.endDate || todayStr(); if (!e.startDate) e.startDate = e.endDate; logActivity(e, 'finish'); syncQueueWithStatus(e); toast(tl('✓ finished')); }
    if (what === 'undone'){ e.status = 'active'; e.endDate = ''; toast(tl('back in progress')); }
    if (what === 'progress'){ openProgress(e); return; }
    if (what === 'top'){ db.queue = [e.id, ...db.queue.filter(x => x !== e.id)]; toast(tl('moved to the top')); }
    if (what === 'bottom'){ db.queue = [...db.queue.filter(x => x !== e.id), e.id]; toast(tl('moved to the bottom')); }
    if (what === 'pause'){ e.status = 'planned'; db.queue = [e.id, ...db.queue.filter(x => x !== e.id)]; toast(tl('paused — back at the top of up next')); }
    if (what === 'drop'){ e.status = 'dropped'; e.endDate = e.endDate || todayStr(); logActivity(e, 'drop'); syncQueueWithStatus(e); toast(tl('dropped')); }
    if (what === 'rm'){
      if (listId){ const l = db.lists.find(x => x.id === listId); if (l) l.items = l.items.filter(x => x !== e.id); }

        ]) },
    ]);
  }));

  $('#q-newlist')?.addEventListener('click', async () => {
    const n = await askText(tl('New list'), { placeholder:'e.g. Cosmere reading order', ok:tl('create') });
    if (!n) return;
    db.lists.push({ id: uid(), name: n, items: [] });

  });

  // dragged order covers only what's on screen — slot it back into the full order so hidden items keep their places
  const mergeOrder = (full, ids) => { const shown = new Set(ids); let k = 0; return full.map(id => shown.has(id) ? ids[k++] : id); };
  wireSwipes(v, act);
  wireThreadDrag($('#q-thread'), ids => { db.queue = mergeOrder(db.queue, ids); save(); renderQueue(); });
  db.lists.forEach(l => wireThreadDrag($(`[data-listthread="${l.id}"]`, v), ids => { l.items = mergeOrder(l.items, ids); save(); renderQueue(); }));
}

/* ---- update-progress sheet: episodes for shows, pages for books, a percentage for the rest ---- */
function finishIfComplete(e){
  if (progressOf(e) >= 1 && e.status !== 'done'){
    e.status = 'done'; e.endDate = e.endDate || todayStr(); if (!e.startDate) e.startDate = e.endDate;
    logActivity(e, 'finish'); syncQueueWithStatus(e); toast(`finished ${e.title} ✓`); return true;
  }
  return false;
}
function openProgress(e, back){

  const close = () => { closeModal(); after(); if (back) back(); };

  const code = x => `S${pad2(x.s)}E${pad2(x.ep.n)}`;

  if (eps.length){
    const next = eps.find(x => !x.ep.watched);

    body = `
      <div class="pg-big"><b id="pg-pct-v">${pct}</b><span>% ${e.type === 'game' ? 'through the game' : e.type === 'movie' ? 'watched' : e.type === 'album' ? 'listened' : 'done'}</span></div>

      <button class="btn primary pg-wide" id="pg-save">${ICONS.stDone} ${tl('save progress')}</button>`;

    <div class="pg-foot">
      <button class="sheet-btn" id="pg-done">${ICONS.stDone}<span>${tl('finished')}</span></button>
      <button class="sheet-btn" id="pg-pause">${ICONS.stPlanned}<span>${tl('pause')}</span></button>
      <button class="sheet-btn" id="pg-drop">${ICONS.stDropped}<span>${tl('drop')}</span></button>
    </div>
    <button class="sheet-btn sheet-cancel" id="pg-close">${tl('close')}</button>`);
  $('#modal').classList.add('sheet'); $('#modal-overlay').classList.add('sheet-open');

  // shows — each tap commits right away and redraws the sheet
  $('#pg-ep-next')?.addEventListener('click', () => {
    const n = eps.find(x => !x.ep.watched); if (!n) return;
    n.ep.watched = true; logActivity(e, 'eps', 1); toast(`✓ ${code(n)}`);
    if (!finishIfComplete(e)){ after(); openProgress(e, back); } else close();
  });
  $('#pg-ep-undo')?.addEventListener('click', () => {
    const l = [...eps].reverse().find(x => x.ep.watched); if (!l) return;
    l.ep.watched = false; logActivity(e, 'eps', -1); after(); openProgress(e, back);
  });
  $('#pg-ep-upto')?.addEventListener('change', ev => {
    if (ev.target.value === '') return;
    const k = +ev.target.value;
    const before = eps.filter(x => x.ep.watched).length;
    eps.forEach((x, i) => { x.ep.watched = i <= k; });
    logActivity(e, 'eps', eps.filter(x => x.ep.watched).length - before);
    toast(tl('caught up to {ep}', { ep: code(eps[k]) }));
    if (!finishIfComplete(e)){ after(); openProgress(e, back); } else close();
  });

  // books — steppers and slider move the number; save commits
  const page = $('#pg-page'), range = $('#pg-range');
  if (e.type === 'book' && !eps.length){
    const maxP = () => e.pagesTotal || +($('#pg-total')?.value || 0) || 99999;
    const setP = v => { v = clamp(Math.round(v), 0, maxP()); page.value = v; if (range) range.value = v; };
    range?.addEventListener('input', () => setP(+range.value));
    page.addEventListener('input', () => { if (range) range.value = page.value; });
    $$('#modal-body [data-step]').forEach(b => b.addEventListener('click', () => setP(+(page.value || 0) + +b.dataset.step)));
    $('#pg-save').addEventListener('click', () => {
      const tot = $('#pg-total') ? +($('#pg-total').value || 0) : 0;
      if (tot) e.pagesTotal = tot;
      const was = e.pagesRead || 0;
      e.pagesRead = clamp(+(page.value || 0), 0, e.pagesTotal || 99999);
      logActivity(e, 'pages', e.pagesRead - was);
      if (!finishIfComplete(e)) toast(tl('page {n} saved', { n: fmtNum(e.pagesRead) }));
      close();
    });
  }
  // everything else — a percentage
  if (!eps.length && e.type !== 'book'){
    const setV = v => { range.value = v; $('#pg-pct-v').textContent = v; };
    range.addEventListener('input', () => setV(+range.value));
    $$('#modal-body [data-pct]').forEach(b => b.addEventListener('click', () => setV(+b.dataset.pct)));
    $('#pg-save').addEventListener('click', () => {
      const was = typeof e.progressPct === 'number' ? e.progressPct : 0;
      e.progressPct = +range.value;
      logActivity(e, 'pct', e.progressPct - was);
      if (!finishIfComplete(e)) toast(tl('{n}% saved', { n: e.progressPct }));
      close();
    });
  }

  $('#pg-done').addEventListener('click', () => { e.status = 'done'; e.endDate = e.endDate || todayStr(); if (!e.startDate) e.startDate = e.endDate; logActivity(e, 'finish'); syncQueueWithStatus(e); toast(`finished ${e.title} ✓`); close(); });
  $('#pg-pause').addEventListener('click', () => { e.status = 'planned'; db.queue = [e.id, ...db.queue.filter(x => x !== e.id)]; toast(tl('paused — back at the top of up next')); close(); });
  $('#pg-drop').addEventListener('click', () => { e.status = 'dropped'; e.endDate = e.endDate || todayStr(); logActivity(e, 'drop'); syncQueueWithStatus(e); toast(tl('dropped')); close(); });
  $('#pg-close').addEventListener('click', () => { closeModal(); if (back) back(); });
}

/* swipe a queue row: right = its main action (start / finish), left = put it away (remove / pause).
   vertical scrolling is untouched — a swipe only starts once the finger clearly moves sideways. */
function wireSwipes(root, act){
  const SW = {
    queue:    { r: ['start', 'start', 'go'],   l: ['rm', 'remove', 'bad'] },
    progress: { r: ['done', 'finish', 'ok'],   l: ['pause', 'pause', 'mute'] },
    list:     { r: ['done', 'done', 'ok'],     l: ['rm', 'remove', 'bad'] },
  };
  $$('.q-item', root).forEach(item => {
    const mode = item.dataset.mode, map = SW[mode]; if (!map) return;
    let x0 = 0, y0 = 0, dx = 0, state = 'idle', bg = null, pid = null;
    const reset = () => {
      item.style.transition = 'transform .18s'; item.style.transform = '';
      setTimeout(() => { item.style.transition = ''; bg?.remove(); bg = null; }, 180);
      state = 'idle';
    };
    item.addEventListener('pointerdown', ev => {
      if (ev.target.closest('button, .q-handle, .q-node') || ev.button > 0) return;
      x0 = ev.clientX; y0 = ev.clientY; dx = 0; state = 'maybe'; pid = ev.pointerId;
    });
    item.addEventListener('pointermove', ev => {
      if (state === 'idle' || ev.pointerId !== pid) return;
      const mx = ev.clientX - x0, my = ev.clientY - y0;
      if (state === 'maybe'){
        if (Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)){ state = 'idle'; return; }   // it's a scroll
        if (Math.abs(mx) < 12) return;
        state = 'swipe'; item.setPointerCapture(pid);
        bg = document.createElement('div'); bg.className = 'sw-bg';
        bg.style.top = item.offsetTop + 'px'; bg.style.height = item.offsetHeight + 'px';
        item.parentElement.insertBefore(bg, item);
      }
      dx = clamp(mx, -140, 140);
      item.style.transform = `translateX(${dx}px)`;
      const side = dx > 0 ? map.r : map.l, armed = Math.abs(dx) > 84;
      bg.className = `sw-bg ${dx > 0 ? 'r' : 'l'} ${side[2]} ${armed ? 'armed' : ''}`;
      bg.innerHTML = `<span>${{ start: ICONS.stActive, done: ICONS.check, rm: ICONS.x, pause: ICONS.stPlanned }[side[0]]}${side[1]}</span>`;
      ev.preventDefault();
    });
    const end = ev => {
      if (state !== 'swipe'){ state = 'idle'; return; }
      const side = dx > 84 ? map.r : dx < -84 ? map.l : null;
      if (!side){ reset(); return; }
      haptic('confirm');
      const e = db.media.find(m => m.id === item.dataset.id), listId = item.dataset.list;
      item.style.transition = 'transform .16s'; item.style.transform = `translateX(${dx > 0 ? 110 : -110}%)`;
      setTimeout(() => {
        if (!e) return reset();
        if (side[0] === 'rm'){
          // removing is the one swipe that loses something — offer undo
          const list = listId ? db.lists.find(x => x.id === listId) : null;
          const before = list ? list.items.slice() : db.queue.slice();
          act(e, 'rm', listId);
          toast(tl('removed {title}', { title: e.title }), { undo: () => { if (list) list.items = before; else db.queue = before; save(); renderQueue(); } });
        } else if (side[0] === 'done' && e.status === 'done') act(e, 'undone', listId);
        else act(e, side[0], listId);
      }, 160);
      state = 'idle';
    };
    item.addEventListener('pointerup', end);
    item.addEventListener('pointercancel', () => { if (state === 'swipe') reset(); state = 'idle'; });
  });
}

// the thread node: a progress ring for things underway, a numbered stop for what's next
// (queue/list nodes double as the drag handle)
function qNodeHTML(e, i, mode, p){
  if (mode === 'progress'){
    const pct = p !== null ? Math.round(p * 100) : 0;
    return `<div class="q-node ring" style="--pct:${pct}" title="${p !== null ? pct + '%' : 'underway'}"><span>${ICONS.stActive}</span></div>`;
  }
  if (e.status === 'done') return `<div class="q-node q-handle done" title="${tl('drag to reorder')}">${ICONS.stDone}</div>`;
  return `<div class="q-node q-handle ${i === 0 && mode === 'queue' ? 'next' : ''}" title="${tl('drag to reorder')}">${pad2(i+1)}</div>`;
}

// labelled progress: "ep 4/9", "p. 210/480", else a percentage

function wireThreadDrag(container, onDrop){
  if (!container) return;
  let dragEl = null;
  $$('.q-handle', container).forEach(h => {
    h.addEventListener('pointerdown', ev => {
      dragEl = h.closest('.q-item');
      dragEl.classList.add('dragging');
      h.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });
    h.addEventListener('pointermove', ev => {
      if (!dragEl) return;
      const others = $$('.q-item:not(.dragging)', container);
      const next = others.find(it => { const r = it.getBoundingClientRect(); return ev.clientY < r.top + r.height/2; });
      if (next) container.insertBefore(dragEl, next); else container.appendChild(dragEl);
    });
    const drop = () => {
      if (!dragEl) return;
      dragEl.classList.remove('dragging'); dragEl = null;
      onDrop($$('.q-item', container).map(x => x.dataset.id));
    };
    h.addEventListener('pointerup', drop);
    h.addEventListener('pointercancel', drop);
  });
}

/* ============ money — overview · savings · spending · plan ============
   savings are accounts: each holds an amount in its own unit (₺, $, grams of gold, fund
   units, or a time deposit) and a list of dated events — deposit, withdraw, balance check.
   everything else (who owns what, returns, monthly rate) is worked out from those events,
   so nothing is typed twice and fixing one event fixes every number after it. */
ICONS.bank = I('<path d="M3.5 9.5 12 4.5l8.5 5"/><path d="M5.5 10v7M10 10v7M14 10v7M18.5 10v7"/><path d="M3.5 20h17"/>');
ICONS.jar = I('<path d="M8 3.5h8M8.5 3.5v2.2c-2 .9-3 2.6-3 4.8v7.5A2.5 2.5 0 0 0 8 20.5h8a2.5 2.5 0 0 0 2.5-2.5v-7.5c0-2.2-1-3.9-3-4.8V3.5"/><path d="M5.5 13h13"/>');
ICONS.gold = I('<path d="M3.5 18.5 6 12.5h6l2.5 6z"/><path d="M9.5 12.5 12 6.5h6l2.5 6"/><path d="M14.5 18.5h6l-1-2.5"/>');
ICONS.globe = I('<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.4 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.4-3.5-8.5s1-5.9 3.5-8.5z"/>');
ICONS.chart = I('<path d="M4 4v16h16"/><path d="m7.5 14.5 3.5-4 3 2.5 5-6"/>');
ICONS.lockclock = I('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4"/><path d="M12 12.5v3l2 1.2"/>');
ICONS.share = I('<circle cx="17.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="12" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="m8.7 10.8 6.6-4M8.7 13.2l6.6 4"/>');
ICONS.minus = I('<path d="M5 12h14"/>');
ICONS.pie = I('<path d="M12 3.5v8.5h8.5A8.5 8.5 0 1 1 12 3.5z"/><path d="M15 3.8A8.5 8.5 0 0 1 20.2 9H15z"/>');

const money = () => {
  const m = db.money = db.money && typeof db.money === 'object' ? db.money : {};
  if (!Array.isArray(m.accounts)) m.accounts = [];
  if (!m.prices || typeof m.prices !== 'object') m.prices = {};
  if (!m.plan || typeof m.plan !== 'object') m.plan = {};
  const p = m.plan;
  if (!Array.isArray(p.income)) p.income = [];
  if (!p.pct) p.pct = { needs: 50, wants: 30, save: 20 };
  if (!p.catBucket) p.catBucket = {};
  if (!p.limits) p.limits = {};
  return m;
};
const fmtTL = n => (n < 0 ? '−' : '') + '₺' + Math.round(Math.abs(n)).toLocaleString(LOCALE());
const fmtPct = (r, d = 1) => (r * 100).toLocaleString(LOCALE(), { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const FX = { USD: '$', EUR: '€', GBP: '£' };
const ASSETS = {
  try:     { label: 'Turkish lira',     icon: () => ICONS.coin },
  fx:      { label: 'foreign currency', icon: () => ICONS.globe },
  gold:    { label: 'gold',             icon: () => ICONS.gold },
  fund:    { label: 'fund',             icon: () => ICONS.chart },
  deposit: { label: 'time deposit',     icon: () => ICONS.lockclock },
};
const KINDS = { personal: 'personal', shared: 'shared', goal: 'goal jar' };
const unitOf = a => a.asset === 'fx' ? FX[a.cur] || a.cur : a.asset === 'gold' ? 'g' : a.asset === 'fund' ? tl('units') : '₺';
function fmtQty(a, n){
  if (a.asset === 'try' || a.asset === 'deposit') return fmtTL(n);
  if (a.asset === 'fx') return (FX[a.cur] || '') + (+n).toLocaleString(LOCALE(), { maximumFractionDigits: 2 });
  if (a.asset === 'gold') return (+n).toLocaleString(LOCALE(), { maximumFractionDigits: 2 }) + ' g';
  return (+n).toLocaleString(LOCALE(), { maximumFractionDigits: 4 }) + ' ' + tl('units');
}
// ₺ per one unit of the account
function priceOf(a){
  const P = money().prices;
  if (a.asset === 'fx') return P[a.cur] || null;
  if (a.asset === 'gold') return P.XAUg || null;
  if (a.asset === 'fund'){ const k = fundCur(a) === 'TRY' ? 1 : P[fundCur(a)]; return a.price && k ? a.price * k : null; }
  return 1;
}
// the currency a fund is priced in: ₺ for turkish funds, $ for something like VOO
const fundCur = a => a.asset === 'fund' ? (a.cur || 'TRY') : null;
const curSym = c => c === 'TRY' ? '₺' : FX[c] || c;
const fmtCur = (n, c) => c === 'TRY' ? fmtTL2(n) : curSym(c) + (+n).toLocaleString(LOCALE(), { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const memberName = (a, id) => (a.members || []).find(m => m.id === id)?.name || '';
const meOf = a => (a.members || []).find(m => m.me) || null;

/* walk the events in date order → amount held, each member's part, money put in (₺), returns */
function accState(a){
  const ev = (a.events || []).slice().sort((x, y) => x.d.localeCompare(y.d) || (x.at || 0) - (y.at || 0));
  const mem = Object.fromEntries((a.members || []).map(m => [m.id, 0]));
  const ids = Object.keys(mem);
  let qty = 0, cost = 0, costF = 0, lastD = null;
  const foreign = fundCur(a) && fundCur(a) !== 'TRY';
  const rows = [];
  const spread = delta => { const tot = ids.reduce((s, k) => s + Math.max(0, mem[k]), 0);
    ids.forEach(k => { mem[k] += tot > 0 ? delta * Math.max(0, mem[k]) / tot : delta / (ids.length || 1); }); };
  ev.forEach(e => {
    let ret = null, rate = null;
    const px = e.px || priceOf(a) || 0;
    if (e.type === 'deposit'){
      qty += e.amt; cost += e.amt * px;
      if (foreign) costF += e.amt * (e.upx || a.price || 0);
      if (ids.length) { if (mem[e.who] != null) mem[e.who] += e.amt; else spread(e.amt); }
      if (!lastD) lastD = e.d;
    } else if (e.type === 'withdraw'){
      const f = qty > 0 ? Math.min(1, e.amt / qty) : 0;
      cost -= cost * f; costF -= costF * f; qty -= e.amt;
      if (ids.length) { if (mem[e.who] != null) mem[e.who] -= e.amt; else spread(-e.amt); }
    } else if (e.type === 'balance'){
      ret = e.amt - qty;
      if (a.asset === 'fx' || a.asset === 'gold') cost += ret * px;   // a fix to the amount, not a gain
      const days = lastD ? Math.max(1, (parseDate(e.d) - parseDate(lastD)) / 864e5) : 30;
      rate = qty > 0 && days >= 7 ? ret / qty / days * 30 : null;   // per month, so different gaps compare; short gaps are noise
      if (e.split && ids.length) ids.forEach(k => { if (e.split[k] != null) mem[k] = +e.split[k]; });
      else if (ids.length) spread(ret);
      qty = e.amt; lastD = e.d;
    }
    rows.push({ ...e, ret, rate, qty, mem: { ...mem } });
  });
  const px = priceOf(a);
  let value = px != null ? qty * px : null;
  // time deposits: show what has built up so far (after tax), not just the principal
  let accrued = 0, dep = null;
  if (a.asset === 'deposit' && a.dep && qty > 0){
    dep = depositInfo(a, qty);
    accrued = dep.net * clamp(dep.elapsed / dep.days, 0, 1);
    value = qty + accrued;
  }
  const rates = rows.filter(r => r.rate != null && isFinite(r.rate)).slice(-6).map(r => r.rate);
  const avgRate = rates.length ? rates.reduce((s, r) => s + r, 0) / rates.length : null;
  // dollar funds: how much came from the fund's own price, how much from the dollar getting dearer
  let split = null;
  if (foreign && value != null && costF > 0){
    const k = money().prices[fundCur(a)];
    split = { price: (qty * a.price - costF) * k, fx: costF * k - cost };
  }
  return { rows, qty, mem, cost, value, gain: value != null ? value - cost : null, avgRate, dep, accrued, split };
}
function depositInfo(a, principal){
  const d = a.dep, start = parseDate(d.start);
  const end = addDays(start, +d.days || 0);
  const gross = principal * (+d.rate || 0) / 100 * (+d.days || 0) / 365;
  const net = gross * (1 - (+d.tax || 0) / 100);
  const elapsed = Math.max(0, (parseDate(todayStr()) - start) / 864e5);
  return { end: dateStr(end), gross, net, days: +d.days || 1, elapsed, matured: todayStr() >= dateStr(end) };
}
function totals(){
  let all = 0, mine = 0, missing = 0;
  money().accounts.filter(a => !a.closed).forEach(a => {
    const s = accState(a); if (s.value == null){ missing++; return; }
    all += s.value;
    const me = meOf(a);
    mine += a.kind === 'shared' && me && s.qty > 0 ? s.value * Math.max(0, s.mem[me.id] || 0) / s.qty : (a.kind === 'shared' ? 0 : s.value);
  });
  return { all, mine, missing };
}

/* ---- prices: currencies + gram gold fetched (≈ market), funds typed by hand ---- */
let pricesBusy = false;
async function refreshPrices(force){
  const m = money(), P = m.prices;
  const need = m.accounts.some(a => !a.closed && (a.asset === 'fx' || a.asset === 'gold' || (fundCur(a) && fundCur(a) !== 'TRY')));
  if (pricesBusy || (!force && (!need || (P.at && Date.now() - P.at < 3 * 3600e3)))) return;
  pricesBusy = true;
  let ok = false;
  try {
    const j = await (await fetch('https://open.er-api.com/v6/latest/TRY')).json();
    Object.keys(FX).forEach(c => { if (j.rates?.[c]) { P[c] = 1 / j.rates[c]; ok = true; } });
  } catch(_){}
  try {
    const g = await (await fetch('https://api.gold-api.com/price/XAU')).json();
    if (g.price && P.USD) { P.XAUg = g.price / 31.1035 * P.USD; ok = true; }
  } catch(_){}
  // funds / ETFs priced in another currency (VOO): only the android app can read the quote
  for (const a of m.accounts.filter(a => !a.closed && a.asset === 'fund' && a.fund && fundCur(a) !== 'TRY')){
    const t = await nativeGet(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(a.fund)}?range=1d&interval=1d`);
    try { const px = JSON.parse(t).chart.result[0].meta.regularMarketPrice; if (px > 0){ a.price = px; a.priceAt = todayStr(); a.priceAuto = 1; ok = true; } } catch(_){}
  }
  pricesBusy = false;
  if (ok){ P.at = Date.now(); save(); if (ui.view === 'spend' || ui.view === 'home') render(); }
  else if (force) toast('⚠ ' + tl('prices could not be fetched — check the connection'));
}
async function histPrices(d){
  const H = money().hist = money().hist || {};
  if (H[d]) return H[d];
  for (const url of [`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${d}/v1/currencies/try.json`, `https://${d}.currency-api.pages.dev/v1/currencies/try.json`]){
    try {
      const r = (await (await fetch(url)).json()).try;
      if (!r?.usd) continue;
      const out = { USD: 1 / r.usd, EUR: r.eur ? 1 / r.eur : null, GBP: r.gbp ? 1 / r.gbp : null, XAUg: r.xau ? 1 / r.xau / 31.1035 : null };
      H[d] = out; save();
      return out;
    } catch(_){}
  }
  histMiss.add(d);

}
/* the market price of the purchase day is the default for every gold / currency entry —
   only a price you typed yourself (pxManual) is left alone. runs in the background. */
const histMiss = new Set();
let autoBusy = false;
async function autoPrices(){
  if (autoBusy) return; autoBusy = true;
  let changed = false;
  try {
    for (const a of money().accounts){
      const key = a.asset === 'gold' ? 'XAUg' : a.asset === 'fx' ? a.cur : fundCur(a) && fundCur(a) !== 'TRY' ? fundCur(a) : null;
      if (!key) continue;
      for (const e of a.events || []){
        if (e.type === 'balance' || e.pxManual || e.pxAt === e.d || e.d >= todayStr() || histMiss.has(e.d)) continue;
        const v = (await histPrices(e.d))?.[key];
        if (!v) continue;
        if (key === fundCur(a)){ e.fx = v; e.px = (e.upx || a.price || 0) * v; } else e.px = v;
        e.pxAt = e.d; changed = true;
      }
    }
  } finally { autoBusy = false; }
  if (changed){ save(); if (ui.view === 'spend') renderSpend(); }
}
function agoLabel(ms){
  const min = Math.round((Date.now() - ms) / 60000);
  return min < 2 ? tl('just now') : min < 60 ? tl('{n} min ago', { n: min }) : min < 48 * 60 ? tl('{n} h ago', { n: Math.round(min / 60) }) : tl('{n} days ago', { n: Math.round(min / 1440) });
}

/* ---- migration: the old two-person table becomes a shared account ---- */
function migrateSavings(){
  const m = money();
  const old = db.savings?.entries || [];
  if (m.migrated || !old.length || m.accounts.length){ if (old.length) m.migrated = 1; return; }
  const S = old.slice().sort((a, b) => a.date.localeCompare(b.date));
  const keys = ['can', 'ila'].filter(k => S.some(e => e[k]));
  const names = { can: 'can', ila: 'ilayda' };      // the names that were in the old table — editable from now on
  const members = keys.map((k, i) => ({ id: k, name: names[k], color: [PALETTE[3], PALETTE[0]][i % 2], me: i === 0 }));
  const events = [];
  S.forEach((e, i) => {
    if (i === 0) keys.forEach(k => e[k] && events.push({ id: uid(), d: e.date, type: 'deposit', who: k, amt: e[k], at: 1 }));
    else {
      keys.forEach(k => e[k + 'Add'] && events.push({ id: uid(), d: e.date, type: 'deposit', who: k, amt: e[k + 'Add'], at: 1 }));
      events.push({ id: uid(), d: e.date, type: 'balance', amt: keys.reduce((s, k) => s + (e[k] || 0), 0), split: Object.fromEntries(keys.map(k => [k, e[k] || 0])), at: 2 });
    }
  });
  m.accounts.push({ id: uid(), name: tl('Joint savings'), kind: 'shared', asset: 'try', color: PALETTE[2], members, events, created: S[0].date });
  m.migrated = 1;
  save();
}

function accChartSVG(a, s){
  const pts = [];
  s.rows.forEach(r => { const last = pts[pts.length - 1]; if (last && last.d === r.d) last.v = r.qty; else pts.push({ d: r.d, v: r.qty, mem: r.mem }); pts[pts.length - 1].mem = r.mem; });
  if (pts.length < 2) return '';
  // forecast: 3 months at the average rate plus the usual monthly top-up
  const months = Math.max(1, (parseDate(pts[pts.length - 1].d) - parseDate(pts[0].d)) / (30.4 * 864e5));
  const topUp = s.rows.filter((r, i) => r.type === 'deposit' && i > 0 && r.d !== pts[0].d).reduce((t, r) => t + r.amt, 0) / months;
  const pred = [];
  if (s.avgRate != null && a.asset === 'try'){
    let v = pts[pts.length - 1].v, d = parseDate(pts[pts.length - 1].d);
    for (let i = 0; i < 3; i++){ v = v * (1 + s.avgRate) + topUp; d = new Date(d.getFullYear(), d.getMonth() + 1, Math.min(d.getDate(), 28)); pred.push({ d: dateStr(d), v }); }
  }
  const all = [...pts, ...pred];
  const W = 340, H = 170, L = 44, R = 8, T = 10, B = 22;
  const t0 = parseDate(all[0].d).getTime(), t1 = parseDate(all[all.length - 1].d).getTime() || t0 + 1;
  const max = Math.max(...all.map(p => p.v)) * 1.08 || 1;
  const X = d => L + (parseDate(d).getTime() - t0) / Math.max(1, t1 - t0) * (W - L - R);
  const Y = v => T + (H - T - B) * (1 - v / max);
  const short = v => v >= 1e6 ? (v / 1e6).toFixed(1).replace('.0', '') + 'M' : Math.round(v / 1000) + 'k';
  const line = (list, get, col, dash) => `<polyline fill="none" stroke="${col}" stroke-width="${dash ? 1.6 : 2.2}" ${dash ? 'stroke-dasharray="5 4" opacity=".6"' : ''} stroke-linejoin="round" stroke-linecap="round" points="${list.map(p => `${X(p.d).toFixed(1)},${Y(get(p)).toFixed(1)}`).join(' ')}"/>`;
  const mem = a.kind === 'shared' ? a.members || [] : [];
  return `<svg class="mn-chart" viewBox="0 0 ${W} ${H}">
    ${[0.5, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${Y(max * f / 1.08)}" y2="${Y(max * f / 1.08)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L - 6}" y="${Y(max * f / 1.08) + 3}" text-anchor="end" font-size="9" font-family="Space Mono,monospace" fill="var(--ink-3)">₺${short(max * f / 1.08)}</text>`).join('')}
    ${mem.map(m => line(pts, p => Math.max(0, p.mem[m.id] || 0), m.color)).join('')}
    ${line(pts, p => p.v, 'var(--ink)')}
    ${pred.length ? line([pts[pts.length - 1], ...pred], p => p.v, 'var(--ink)', true) : ''}
    ${pts.map(p => `<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="2.8" fill="var(--ink)"/>`).join('')}
    <text x="${L}" y="${H - 6}" font-size="9" font-family="Space Mono,monospace" fill="var(--ink-3)">${fmtNice(all[0].d)}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="9" font-family="Space Mono,monospace" fill="var(--ink-3)">${pred.length ? tl('forecast') + ' ' : ''}${fmtNice(all[all.length - 1].d)}</text>
  </svg>`;
}

/* ---- put in / take out / balance check ---- */
function openAccAction(a, type, edit){
  const s = accState(a), px = priceOf(a);
  const shared = a.kind === 'shared' && (a.members || []).length;
  let who = edit?.who || meOf(a)?.id || a.members?.[0]?.id || '';
  const market = a.asset === 'fx' || a.asset === 'gold' || a.asset === 'fund';
  const title = { deposit: tl(market ? 'Bought' : 'Put in'), withdraw: tl(market ? 'Sold' : 'Take out'), balance: tl(a.asset === 'fund' ? 'Update price' : 'Update balance') }[type];
  const fundPrice = type === 'balance' && a.asset === 'fund';
  const foreignFund = fundCur(a) && fundCur(a) !== 'TRY', P0 = money().prices;
  sheet(`
    <div class="sheet-title">${title} · ${esc(a.name)}</div>
    <div class="k-form">
      ${fundPrice ? `<div class="field"><label>${tl('price of one unit today ({c})', { c: curSym(fundCur(a)) })}</label><input class="input mn-amt" id="aa-px" type="number" inputmode="decimal" step="any" value="${a.price || ''}" placeholder="0"></div>
        <div class="mn-fine">${fundCur(a) === 'TRY' ? tl('you\'ll find it on your bank app or tefas.gov.tr') : tl('your broker app shows it (e.g. midas) — the ₺ value follows the live dollar rate')}</div>`
      : `<div class="field"><label>${type === 'balance' ? tl('what your bank shows now ({u})', { u: unitOf(a) }) : tl('amount ({u})', { u: unitOf(a) })}</label>
        <input class="input mn-amt" id="aa-amt" type="number" inputmode="decimal" step="any" value="${edit ? edit.amt : ''}" placeholder="${type === 'balance' && s.qty ? Math.round(s.qty) : '0'}"></div>
      ${type === 'balance' ? `<div class="mn-fine" style="margin:-4px 0 6px">${tl('use this when interest comes in: type the balance your bank shows, the difference is your return')}</div><div class="mn-preview" id="aa-prev">${tl('the difference from {x} counts as return', { x: fmtQty(a, s.qty) })}</div>` : ''}`}
      ${shared && type !== 'balance' ? `<div class="field"><label>${tl('whose money?')}</label><div class="row">${a.members.map(m => `<button class="chip ${who === m.id ? 'on' : ''}" data-who="${m.id}"><i class="mn-dot" style="background:${m.color}"></i>${esc(m.name)}</button>`).join('')}</div></div>` : ''}
      ${shared && type === 'balance' && !fundPrice ? `<label class="k-check"><input type="checkbox" id="aa-splitc" ${edit?.split ? 'checked' : ''}> <span>${tl('my bank shows each person separately')}</span></label>
        <div id="aa-split" class="${edit?.split ? '' : 'hidden'}">${a.members.map(m => `<div class="field"><label>${esc(m.name)}</label><input class="input" type="number" inputmode="decimal" step="any" data-split="${m.id}" value="${edit?.split?.[m.id] ?? ''}"></div>`).join('')}</div>` : ''}
      ${foreignFund && type !== 'balance' ? `<div class="grid2"><div class="field"><label>${tl('price per unit then ({c})', { c: curSym(fundCur(a)) })}</label><input class="input" id="aa-upx" type="number" inputmode="decimal" step="any" value="${edit?.upx || a.price || ''}"></div>
        <div class="field"><label>${tl('{c} rate then (₺)', { c: curSym(fundCur(a)) })}</label><input class="input" id="aa-fx" type="number" inputmode="decimal" step="any" value="${edit?.fx || (P0[fundCur(a)] ? Math.round(P0[fundCur(a)] * 100) / 100 : '')}"></div></div>
        <div class="mn-fine" style="margin:-4px 0 6px">${tl('both are filled with today\'s numbers — change them if you bought on another day')}</div>` : ''}
      ${market && !foreignFund && type !== 'balance' ? `<div class="field"><label>${tl('price per {u} then (₺)', { u: unitOf(a) })}</label><input class="input" id="aa-px" type="number" inputmode="decimal" step="any" value="${edit?.px || (px ? Math.round(px * 100) / 100 : '')}"><div class="mn-fine">${tl('automatic: that day\'s market price · type to use your own')}</div></div>` : ''}
      <div class="mn-fine" id="aa-hist" style="margin:-4px 0 6px"></div>
      <div class="grid2">
        <div class="field"><label>${tl('date')}</label><input class="input" id="aa-d" type="date" max="${todayStr()}" value="${edit?.d || todayStr()}"></div>
        <div class="field"><label>${tl('note')}</label><input class="input" id="aa-note" value="${esc(edit?.note || '')}" placeholder="${tl('optional')}"></div>
      </div>
      <div class="dlg-actions"><button class="btn" id="aa-cancel">${tl('cancel')}</button><button class="btn primary" id="aa-ok">${ICONS.check} ${tl('save')}</button></div>
    </div>`);
  $$('[data-who]').forEach(b => b.addEventListener('click', () => { who = b.dataset.who; $$('[data-who]').forEach(x => x.classList.toggle('on', x === b)); }));
  // pick a past date → that day's gold / currency price is filled in (unless you typed your own)
  const histKey = type === 'balance' ? null : a.asset === 'gold' ? 'XAUg' : a.asset === 'fx' ? a.cur : foreignFund ? fundCur(a) : null;
  const histField = foreignFund ? $('#aa-fx') : $('#aa-px');
  if (histKey && histField){
    if (edit?.pxManual) histField.dataset.dirty = 1;
    histField.addEventListener('input', () => { histField.dataset.dirty = 1; });
    // a new entry takes that day's price straight away; a saved one (or a price you typed) only gets a "use it" offer
    const fill = async () => {
      const d = $('#aa-d').value, note = $('#aa-hist');
      if (!d) return;
      const keep = !!histField.dataset.dirty;          // only a price you typed is kept
      const what = a.asset === 'gold' ? tl('gram gold') : curSym(histKey) + ' ' + tl('rate');
      let v = null;
      if (d >= todayStr()) v = money().prices[histKey] || null;
      else {
        note.textContent = tl('looking up {what} on {date}…', { what, date: fmtNice(d) });
        v = (await histPrices(d))?.[histKey] || null;
        if ($('#aa-d')?.value !== d) return;
      }
      if (!v){ note.textContent = d < todayStr() ? tl('no price found for {date} — type it in', { date: fmtNice(d) }) : ''; return; }
      const r = Math.round(v * 100) / 100, cur = +histField.value;
      if (!keep || !cur){ histField.value = r; note.textContent = d < todayStr() ? tl('{what} on {date}: {x} (market average — your bank\'s price may differ a little)', { what, date: fmtNice(d), x: fmtTL2(v) }) : ''; return; }
      if (Math.abs(cur - r) / r < 0.01){ note.textContent = ''; return; }
      note.innerHTML = `${esc(tl('market {what} on {date} was {x}', { what, date: fmtNice(d), x: fmtTL2(v) }))} <button class="dt-link" id="aa-usehist">${tl('use it')}</button>`;
      $('#aa-usehist').addEventListener('click', () => { histField.value = r; delete histField.dataset.dirty; note.textContent = tl('{what} on {date}: {x} (market average — your bank\'s price may differ a little)', { what, date: fmtNice(d), x: fmtTL2(v) }); });
    };
    $('#aa-d').addEventListener('change', fill);
    if (edit) fill();                                   // opening a saved purchase checks its price against that day's
  }
  $('#aa-splitc')?.addEventListener('change', ev => {
    $('#aa-split').classList.toggle('hidden', !ev.target.checked);
    $('#aa-amt').disabled = ev.target.checked;
  });
  if (edit?.split && $('#aa-amt')) $('#aa-amt').disabled = true;
  const splitSum = () => $$('[data-split]').reduce((t, i) => t + (+i.value || 0), 0);
  const upd = () => {
    if (!$('#aa-prev')) return;
    const v = $('#aa-splitc')?.checked ? splitSum() : +$('#aa-amt').value;
    if (!v){ $('#aa-prev').innerHTML = tl('the difference from {x} counts as return', { x: fmtQty(a, s.qty) }); return; }
    const before = edit ? (s.rows[s.rows.findIndex(r => r.id === edit.id) - 1]?.qty ?? 0) : s.qty;
    const ret = v - before;
    $('#aa-prev').innerHTML = `<b class="${ret >= 0 ? 'mn-up' : 'mn-down'}">${tl(ret >= 0 ? 'return +{x}' : 'drop {x}', { x: fmtQty(a, Math.abs(ret)) })}</b>${before > 0 ? ' · ' + tl('{r} on {x}', { r: fmtPct(ret / before), x: fmtQty(a, before) }) : ''}`;
  };
  $('#aa-amt')?.addEventListener('input', upd); $$('[data-split]').forEach(i => i.addEventListener('input', upd)); upd();
  $('#aa-cancel').addEventListener('click', closeModal);
  $('#aa-ok').addEventListener('click', () => {
    if (fundPrice){
      const p = +$('#aa-px').value; if (!(p > 0)){ toast('⚠ ' + tl('enter a price')); return; }
      a.price = p; a.priceAt = todayStr(); save(); closeModal(); renderSpend(); toast(tl('price updated')); return;
    }
    const useSplit = $('#aa-splitc')?.checked;
    const split = useSplit ? Object.fromEntries($$('[data-split]').map(i => [i.dataset.split, +i.value || 0])) : null;
    const amt = useSplit ? splitSum() : +$('#aa-amt').value;
    if (!(amt > 0) && !(type === 'balance' && amt === 0 && $('#aa-amt').value !== '')){ toast('⚠ ' + tl('enter an amount')); return; }
    if (type === 'withdraw' && !edit && amt > s.qty + 0.001){ toast('⚠ ' + tl('that\'s more than the account holds')); return; }
    const e = edit || { id: uid(), at: Date.now() };
    Object.assign(e, { d: $('#aa-d').value || todayStr(), type, amt, note: $('#aa-note').value.trim() || undefined });
    if (shared && type !== 'balance') e.who = who; else delete e.who;
    if (split) e.split = split; else delete e.split;
    const pxv = +($('#aa-px')?.value || 0); if (market && type !== 'balance' && pxv > 0) e.px = pxv;
    if (foreignFund && type !== 'balance'){
      const upx = +($('#aa-upx').value || 0), fx = +($('#aa-fx').value || 0);
      if (!(upx > 0) || !(fx > 0)){ toast('⚠ ' + tl('enter the price and the rate')); return; }
      Object.assign(e, { upx, fx, px: upx * fx });
      if (!edit && e.d >= (a.priceAt || '')){ a.price = upx; a.priceAt = e.d; }
    }
    if (histKey){
      if (histField.dataset.dirty) e.pxManual = 1;
      else { delete e.pxManual; if (e.pxAt !== e.d) delete e.pxAt; }   // automatic → the background pass keeps it on that day's price
    }
    if (!edit) (a.events = a.events || []).push(e);
    save(); closeModal(); renderSpend();
    if (!edit) toast(type === 'deposit' ? tl('saved — {x} in', { x: fmtQty(a, amt) }) : type === 'withdraw' ? tl('saved — {x} out', { x: fmtQty(a, amt) }) : tl('balance updated'));
  });
  setTimeout(() => ($('#aa-amt') || $('#aa-px'))?.focus(), 60);
}

/* ---- time deposits: roll over or move out at maturity ---- */
async function rollDeposit(a){
  const s = accState(a);
  const rate = await askText(tl('New yearly rate (%)'), { value: a.dep.rate, numeric: true, ok: tl('roll over'), detail: tl('{p} + {net} interest go back in for another {d} days', { p: fmtTL(s.qty), net: fmtTL(s.dep.net), d: a.dep.days }) });
  if (rate == null) return;
  a.events.push({ id: uid(), d: s.dep.end, type: 'balance', amt: Math.round((s.qty + s.dep.net) * 100) / 100, note: tl('interest added at maturity'), at: Date.now() });
  a.dep = { ...a.dep, start: s.dep.end, rate: +rate || a.dep.rate };
  save(); renderSpend(); celebrate(tl('rolled over'), tl('+{x} interest', { x: fmtTL(s.dep.net) }));
}
function moveDeposit(a){
  const s = accState(a);
  const total = Math.round((s.qty + s.dep.net) * 100) / 100;
  const targets = money().accounts.filter(x => x !== a && !x.closed && (x.asset === 'try' || x.asset === 'deposit'));
  const done = target => {
    a.events.push({ id: uid(), d: s.dep.end, type: 'balance', amt: total, note: tl('interest added at maturity'), at: Date.now() });
    a.events.push({ id: uid(), d: s.dep.end, type: 'withdraw', amt: total, note: target ? tl('moved to {name}', { name: target.name }) : '', xfer: target ? 1 : undefined, at: Date.now() + 1 });
    if (target) target.events.push({ id: uid(), d: s.dep.end, type: 'deposit', amt: total, who: meOf(target)?.id, note: tl('from {name}', { name: a.name }), xfer: 1, at: Date.now() });
    a.closed = s.dep.end; ui.moneyAcc = target ? target.id : null; save(); renderSpend();
  };
  openSheet(tl('Move {x} to…', { x: fmtTL(total) }), [...targets.map(t => ({ label: t.name, icon: ICONS.bank, fn: () => done(t) })), { label: tl('nowhere — I spent / moved it myself'), icon: ICONS.x, fn: () => done(null) }]);
}

      ${st.asset === 'deposit' ? `<div class="grid2">
          ${a ? '' : `<div class="field"><label>${tl('principal (₺)')}</label><input class="input" id="ae-prin" type="number" inputmode="decimal" step="any"></div>`}
          <div class="field"><label>${tl('yearly rate (%)')}</label><input class="input" id="ae-rate" type="number" inputmode="decimal" step="any" value="${a?.dep?.rate ?? ''}"></div>

        <div class="field"><label>${tl('by (optional)')}</label><input class="input" id="ae-gdate" type="date" value="${a?.goal?.date || ''}"></div></div>` : ''}

          <button class="chip ${m.me ? 'on' : ''}" data-me="${i}">${tl('you')}</button>${st.members.length > 2 ? `<button class="ly-btn" data-mdel="${i}">${ICONS.x}</button>` : ''}</div>`).join('')}
        <button class="dt-link" id="ae-addm">${ICONS.plus} ${tl('add a person')}</button></div>` : ''}
      <div class="dlg-actions"><button class="btn" id="ae-cancel">${tl('cancel')}</button><button class="btn primary" id="ae-save">${ICONS.check} ${tl('save')}</button></div>
    </div>`);
    const keepNames = () => $$('[data-mname]').forEach(i => { st.members[+i.dataset.mname].name = i.value; });
    $$('[data-kind]').forEach(b => b.addEventListener('click', () => { keepNames(); st.kind = b.dataset.kind; draw(); }));
    $$('[data-asset]').forEach(b => b.addEventListener('click', () => { keepNames(); st.asset = b.dataset.asset; draw(); }));
    $$('[data-fcur]').forEach(b => b.addEventListener('click', () => { keepNames(); st.fcur = b.dataset.fcur; draw(); }));
    $$('[data-cur]').forEach(b => b.addEventListener('click', () => { st.cur = b.dataset.cur; $$('[data-cur]').forEach(x => x.classList.toggle('on', x === b)); }));
