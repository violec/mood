@media (max-width:920px){ .spend-grid{grid-template-columns:1fr} .donut-wrap{max-width:340px; margin:0 auto} }

/* savings (joint interest) */
.sav-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.sav-title{display:flex; align-items:baseline; gap:10px}
.sav-title .m{font-size:clamp(22px,3.4vw,32px); font-weight:700; letter-spacing:.5px; text-transform:uppercase}
.sav-title .y{font-family:'Caveat',cursive; font-size:clamp(20px,2.6vw,26px); color:var(--accent); transform:rotate(-3deg)}
.sav-chart{padding:14px 8px 6px}
.sav-chart svg{display:block; width:100%; height:auto}
.sav-legend{display:flex; gap:16px; flex-wrap:wrap; padding:4px 10px 10px}
.sav-legend .lg{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1px; display:flex; align-items:center; gap:6px; color:var(--ink-2)}
.sav-legend .lg i{width:16px; height:3px; border-radius:2px; display:inline-block}
.sav-legend .lg i.dash{background:repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 8px); height:3px}
.sav-rows{margin-top:14px}
.sav-row{display:flex; gap:10px; align-items:center; padding:8px 6px; border-bottom:1px dashed var(--line); font-family:'Space Mono',monospace; font-size:11px; cursor:pointer; flex-wrap:wrap}
.sav-row:hover{background:var(--bg-hi)}
.sav-row .dt{font-weight:700; width:86px; flex:none}
.sav-row .who{color:var(--ink-2)}
.sav-row .who b{color:var(--ink)}
.sav-row .add{color:var(--ok); font-size:10px}
.sav-row .tot{margin-left:auto; font-weight:700}
.sav-row .rate{width:52px; text-align:right; color:var(--accent); font-size:10px}

/* queue: sections + lists */

/* ================= health ================= */
.health-top{display:grid; grid-template-columns:minmax(230px,300px) 1fr; gap:16px; margin-bottom:18px}
.pedometer{padding:16px; display:flex; flex-direction:column; gap:10px}
.pedometer .lcd{padding:14px 16px}
.pedometer .lcd .label{font-size:9px; letter-spacing:3px; text-transform:uppercase}
.pedometer .lcd .val{font-size:38px; font-weight:700; letter-spacing:1px; line-height:1.1}
.pedometer .lcd .goal{font-size:10px; letter-spacing:1px; margin-top:2px}
.pedometer .lcd .bar{height:8px; margin-top:8px; background:rgba(0,0,0,.35); border-radius:2px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.pedometer .lcd .bar i{display:block;height:100%;background:var(--lcd-fg); box-shadow:0 0 6px var(--lcd-fg)}
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px}
.stat{padding:10px 8px; text-align:center}
.stat .v{font-family:'Space Mono',monospace; font-size:17px; font-weight:700}
.stat .k{font-family:'Space Mono',monospace; font-size:8.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--ink-3); margin-top:3px}
.dotgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.dotgrid .dh{font-family:'Space Mono',monospace; font-size:9px; font-weight:700; letter-spacing:1px; text-align:center; color:var(--ink-3); text-transform:uppercase; padding-bottom:2px}
.dotcell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative}
.dotcell .c{
  width:78%; aspect-ratio:1; border-radius:50%;
  border:1.6px solid var(--sepia-2); background:transparent;
  transition:transform .1s; position:relative; display:flex; align-items:center; justify-content:center;
}
.dotcell:hover .c{transform:scale(1.12)}
.dotcell.blank .c{border-style:dotted; opacity:.55}
.dotcell.out{visibility:hidden}
.dotcell .n{position:absolute; font-family:'Space Mono',monospace; font-size:8px; color:var(--ink-3); top:-2px; right:2px}
.dotcell.today .c{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.dotcell .pct{position:absolute; inset:3px; border-radius:50%}
.dotcell.hit .c{border-color:var(--ok)}
.dotcell.hit .pct{background:var(--ok) !important}
.dotcell.hit .c::after{content:''; position:relative; z-index:2; display:block; width:11px; height:11px; background:#F6EFDD; -webkit-mask:var(--check-mask) center/100% no-repeat; mask:var(--check-mask) center/100% no-repeat}
.health-cols{display:grid; grid-template-columns:1fr 1fr; gap:26px; align-items:start}
.stepchart{display:flex; align-items:flex-end; gap:2.5px; height:190px; padding:10px 10px 4px}
.stepchart .col{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; cursor:pointer; min-width:0}
.stepchart .bar{
  width:100%; border-radius:2px 2px 0 0; background:var(--hl);
  box-shadow:inset -2px 0 0 var(--hl-2); min-height:2px;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.14) 0 3px, transparent 3px 7px);
}
.stepchart .col.goalhit .bar{background:var(--ok); box-shadow:inset -2px 0 0 rgba(0,0,0,.18)}
.stepchart .col .d{font-family:'Space Mono',monospace; font-size:7.5px; color:var(--ink-3)}
.stepchart .col:hover .bar{filter:brightness(1.1)}
.goal-line{position:relative}
.walk-list{margin-top:14px}
.walk-item{display:flex; justify-content:space-between; gap:10px; padding:7px 4px; border-bottom:1px dashed var(--line); font-size:13px}
.walk-item .mono{font-size:10.5px; color:var(--ink-3)}

/* ================= add flow / detail ================= */
.type-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px}
.type-tile{
  padding:16px 8px 13px; border-radius:8px; border:1px solid var(--ink); text-align:center;
  background:linear-gradient(180deg, var(--bg-hi), var(--bg));
  box-shadow:0 3px 0 var(--ink-2), inset 0 1px 0 var(--bev-hi);
  display:flex; flex-direction:column; align-items:center; gap:8px;
}
.type-tile svg{width:26px;height:26px}
.type-tile span{font-family:'Space Mono',monospace; font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase}
.type-tile:active{transform:translateY(3px); box-shadow:none}
.type-tile:hover{color:var(--accent)}
.result-list{display:flex; flex-direction:column; gap:8px; max-height:380px; overflow-y:auto; padding:2px}
.result-item{
  display:flex; gap:12px; align-items:center; padding:8px; border-radius:8px; cursor:pointer;
  border:1px dashed var(--sepia-2); background:var(--card);
}
.result-item.owned{opacity:.8}
.owned-tag{display:inline-flex; align-items:center; gap:4px; margin-top:4px; font-family:'Space Mono',monospace; font-size:9.5px; font-weight:700; color:var(--ok)}
.owned-tag svg{width:11px; height:11px}
.dlg-actions.three{grid-template-columns:1fr 1fr 1fr}
.result-item:hover{border-style:solid; border-color:var(--accent); background:var(--bg-hi)}
.result-item img, .result-item .ph{width:44px; height:62px; object-fit:cover; border-radius:3px; border:1px solid var(--ink-2); background:var(--bg-lo); flex:none; display:flex;align-items:center;justify-content:center; color:var(--sepia)}
.result-item .t{font-weight:700; font-size:14px; line-height:1.25}
.result-item .s{font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-3); margin-top:2px; letter-spacing:.5px}
.detail-head{display:flex; gap:18px}
.detail-head .cover{width:128px; flex:none; aspect-ratio:2/3; border-radius:4px; overflow:hidden; border:1px solid var(--ink-2); box-shadow:4px 5px 0 var(--shadow-soft); background:var(--bg-lo); position:relative}
.detail-head .cover img{width:100%;height:100%;object-fit:cover; filter:sepia(.14) contrast(1.03) saturate(.92)}
.detail-head .cover .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--sepia)}
.detail-head .cover .ph svg{width:34px;height:34px}
.detail-info{flex:1; min-width:0}
.detail-info h2{font-size:24px; line-height:1.1; margin-bottom:2px}
.detail-info .byline{font-family:'Caveat',cursive; font-size:20px; color:var(--sepia); margin-bottom:8px}
.detail-info .mono-row{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-3); display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px}
/* half-star ratings (letterboxd style) */
.stars{display:inline-flex; gap:2px}
.stars .st{position:relative; width:var(--ss,20px); height:var(--ss,20px); display:inline-block}
.stars .st > svg{width:100%; height:100%; display:block; color:var(--sepia-2)}
.stars .st .st-f{position:absolute; inset:0; overflow:hidden; pointer-events:none}
.stars .st .st-f svg{color:var(--accent); width:var(--ss,20px); height:var(--ss,20px); display:block}
.stars.ia .st{cursor:pointer; transition:transform .1s}
.stars.ia .st:hover{transform:scale(1.18)}
.score-row{display:flex; align-items:center; gap:10px; margin:5px 0}
.score-row .sl{font-family:'Space Mono',monospace; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-3); width:64px; flex:none}
.score-row .sv{font-family:'Space Mono',monospace; font-size:11px; font-weight:700; color:var(--ink-2)}
.score-row .btn{padding:4px 8px; font-size:9px}
.mini-stars{margin-top:3px}
.gauge{height:16px; border-radius:8px; background:var(--bg-lo); box-shadow:inset 0 2px 4px var(--shadow); overflow:hidden; position:relative}
.gauge i{display:block; height:100%; background:linear-gradient(180deg, var(--accent), var(--accent-2)); border-radius:8px; box-shadow:inset 0 1px 0 rgba(255,240,220,.4); transition:width .3s}
.gauge span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-size:9px; font-weight:700; letter-spacing:1px; color:var(--ink)}
.season{border:1px solid var(--line); border-radius:8px; margin-bottom:8px; overflow:hidden; background:var(--card)}
.season-head{
  display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer; user-select:none;
  font-family:'Space Mono',monospace; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
}
.season-head .mini-gauge{flex:1; height:6px; border-radius:3px; background:var(--bg-lo); overflow:hidden; box-shadow:inset 0 1px 2px var(--shadow-soft)}
.season-head .mini-gauge i{display:block;height:100%;background:var(--accent)}
.season-head .cnt{color:var(--ink-3); font-size:10px}
.season-head .caret{transition:transform .15s; font-size:10px}
.season.open .caret{transform:rotate(90deg)}
.season-eps{display:none; padding:4px 12px 10px; border-top:1px dashed var(--line)}
.season.open .season-eps{display:block}
.ep{display:flex; align-items:center; gap:9px; padding:4px 0; font-size:13px; cursor:pointer; user-select:none}
.ep .box{
  width:15px; height:15px; flex:none; border:1.6px solid var(--ink-2); border-radius:2px; position:relative;
  background:var(--bg-hi);
}
.ep.watched .box::after{
  content:''; position:absolute; inset:1px; background:var(--accent);
  -webkit-mask:var(--check-mask) center/90% no-repeat; mask:var(--check-mask) center/90% no-repeat;
}
.ep.watched .name{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--sepia-2)}
.ep .num{font-family:'Space Mono',monospace; font-size:9.5px; color:var(--ink-3); width:34px; flex:none}
.season-actions{padding:2px 0 6px; display:flex; gap:8px}
/* notebook page: ruled every 30px, red margin rule, handwriting sits on the lines, at least 4 lines tall */
.notes-view{
  display:block; width:100%; text-align:left; cursor:pointer; position:relative;
  font-family:'Caveat',cursive; font-size:21px; line-height:30px; white-space:pre-wrap; color:var(--ink);
  min-height:calc(30px * 4 + 8px); padding:8px 12px 0 46px; border-radius:6px;
  border:1px solid var(--line); box-shadow:inset 0 1px 0 var(--bev-hi), 0 2px 6px var(--shadow-soft);
  background-color:var(--bg-hi);
  background-image:
    linear-gradient(90deg, transparent 33px, rgba(200,80,60,.45) 33px, rgba(200,80,60,.45) 34.5px, transparent 34.5px),
    repeating-linear-gradient(180deg, transparent 0 29px, var(--line) 29px 30px);
  background-position:0 0, 0 8px;
  background-attachment:local;
}
.notes-view.empty{color:var(--ink-3); font-size:19px}
.cover-edit{display:flex; gap:10px; align-items:flex-start}
.cover-edit .cover-prev{width:74px; aspect-ratio:2/3; border-radius:4px; border:1px solid var(--ink-2); object-fit:cover; background:var(--bg-lo)}

/* entry detail — hero, fact strip, action grid, then evenly spaced sections */
.dt{display:flex; flex-direction:column; gap:14px}
.dt-hero{display:grid; grid-template-columns:112px minmax(0,1fr); gap:16px; align-items:start}
.dt-cover{width:100%; align-self:start; aspect-ratio:2/3; border-radius:6px; overflow:hidden; border:1px solid var(--ink-2); box-shadow:4px 5px 0 var(--shadow-soft);
  background:repeating-linear-gradient(45deg, var(--bg-lo) 0 10px, var(--bg) 10px 20px)}
.dt-cover img{width:100%; height:100%; object-fit:cover; display:block; filter:sepia(.14) contrast(1.03) saturate(.92)}
.dt-cover .ph{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--sepia)}
.dt-cover .ph svg{width:32px; height:32px}
/* text column stacks from the cover's top edge down */
.dt-id{min-width:0; padding:2px 34px 2px 0; display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start; gap:8px}
.dt-name{display:flex; flex-direction:column; gap:5px}
.dt-kicker{display:flex; align-items:center; gap:7px; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-3)}
.dt-kicker svg{width:16px; height:16px}
.modal .dt-id h2{font-size:31px; line-height:1.08; letter-spacing:-.4px; margin:0; padding:0; overflow-wrap:anywhere; hyphens:auto}
.modal .dt-id h2.long{font-size:23px}
.dt-by{font-family:'Caveat',cursive; font-size:24px; color:var(--sepia); line-height:1}
.dt-id .st-pill{font-family:'Space Mono',monospace; font-size:12px; letter-spacing:1px; text-transform:uppercase; padding:4px 11px 4px 9px; border-radius:14px}
.dt-id .st-pill svg{width:13px; height:13px}
.dt-facts{display:grid; grid-template-columns:repeat(3,1fr); border-radius:10px; overflow:hidden;
  background:var(--bg-lo); border:1px solid var(--bev-lo); box-shadow:inset 0 2px 4px var(--shadow-soft)}
.dt-facts > div{display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px}
.dt-facts > div + div{border-left:1px dashed var(--sepia-2)}
.dt-facts .k{font-family:'Space Mono',monospace; font-size:8.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-3)}
.dt-facts b{font-family:'Space Mono',monospace; font-size:13px}
.dt-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.dt-actions.one{grid-template-columns:1fr}
.dt-actions.three{grid-template-columns:repeat(3,1fr); margin-top:-6px}
.dt-actions .btn{justify-content:center; padding:11px 6px; min-width:0}
.dt-actions .btn.ghost{padding:9px 4px}
.dt-sec{border-top:1px dashed var(--line); padding-top:12px}
.dt-h{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:10px;
  font-family:'Space Mono',monospace; font-size:10px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:var(--ink-2)}
.dt-h em{font-style:normal; font-weight:400; letter-spacing:.5px; color:var(--accent-2)}
.dt-prog{display:block; width:100%; border:none; background:none; padding:0; text-align:left; color:inherit; cursor:pointer}
.dt-prog .bar{height:10px; border-radius:5px; background:var(--bg-lo); box-shadow:inset 0 1px 3px var(--shadow-soft); overflow:hidden}
.dt-prog .bar i{display:block; height:100%; border-radius:5px; background:linear-gradient(180deg, var(--accent), var(--accent-2))}
.dt-prog-row{display:flex; justify-content:space-between; margin-top:6px; font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-3)}
.dt-prog-row b{color:var(--ink)}
.dt-prog + #d-seasons{margin-top:14px}
.dt-wide{width:100%; justify-content:center; margin-top:4px}
.dt-rate{display:grid; grid-template-columns:84px auto 1fr; align-items:center; gap:10px; padding:4px 0}
.dt-rate .k{font-family:'Space Mono',monospace; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-3)}
.dt-rate b{font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-2)}
.dt-link{display:inline-flex; align-items:center; gap:6px; border:none; background:none; padding:4px 0; color:var(--accent-2);
  font-family:'Space Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:.5px; text-align:left; cursor:pointer}
.dt-link svg{width:12px; height:12px}
.dt-rate .dt-link{grid-column:2 / -1}
.dt-log{display:flex; flex-direction:column}
.dt-log-row{display:grid; grid-template-columns:64px 10px 1fr; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); font-family:'Space Mono',monospace; font-size:11px}
.dt-log-row:last-child{border-bottom:none}
.dt-log-row .d{color:var(--ink-3)}
.dt-log-row .dot{width:8px; height:8px; border-radius:50%}
.dt-log-row .w{font-weight:700; color:var(--ink)}
.dt-log-more, .dt-empty{font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-3); padding:4px 0}
.dt-empty.dt-link{color:var(--ink-3); font-weight:400}
@media (max-width:720px){ .dt-hero{grid-template-columns:104px minmax(0,1fr)} .modal .dt-id h2{font-size:27px} .modal .dt-id h2.long{font-size:21px} }

/* settings */
.set-block{margin-bottom:18px}
.keyrow{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:end}
.filelabel input{display:none}

/* responsive — mobile / apk */
@media (max-width:720px){
  .app{padding:10px 12px calc(104px + env(safe-area-inset-bottom))}
  /* grid masthead: two columns, vertically centered — nothing can wrap or
     sink through the border line at any width */
  .masthead{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; padding:6px 2px 10px; margin-bottom:16px}
  .masthead .stamp{display:none}
  .mast-actions{gap:8px; padding-bottom:0; justify-self:end}
  .mast-actions .key{padding:8px 10px; min-height:0}
  .brand{overflow:hidden}
  .brand h1{font-size:38px}
  .brand-meta .jp{letter-spacing:4px; font-size:10px}

  /* deck becomes a fixed bottom hardware bar */
  .deck{
    position:fixed; bottom:0; left:0; right:0; z-index:900; margin:0;
    border-radius:14px 14px 0 0; border-bottom:none;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    gap:6px; flex-wrap:nowrap; align-items:stretch;
    box-shadow:0 -6px 18px var(--shadow);
  }
  .deck .spacer{display:none}
  .deck-tabs{flex:1; min-width:0; gap:6px}
  /* tall icon-tab styling applies ONLY to the bottom deck — masthead and
     month-nav keys stay compact so they never outgrow their rows */
  .deck .key{
    flex-direction:column; gap:4px; justify-content:center;
    padding:9px 4px 8px; font-size:8px; letter-spacing:.4px; min-height:52px;
  }
  .deck[data-nav="scroll"] .deck-tabs .key[data-view]{flex:0 0 auto; min-width:58px}
  /* scrolling tab strip: soft fade at the edge instead of a key sliced in half against the log button */
  .deck[data-nav="scroll"] .deck-tabs{
    -webkit-mask-image:linear-gradient(90deg, #000 calc(100% - 26px), transparent);
            mask-image:linear-gradient(90deg, #000 calc(100% - 26px), transparent);
    padding-right:26px;
  }
  .deck[data-nav="scroll"] .deck-tabs.at-end{-webkit-mask-image:none; mask-image:none}
  .deck[data-nav="favs"] .deck-tabs .key[data-view]{flex:1; min-width:0}
  #btn-burger{flex:0 0 auto; min-width:52px}
  .deck .key .led{display:none}
  .deck .key .ki svg{width:19px; height:19px}
  .deck .key .kl{white-space:nowrap}
  .deck .key.on .ki{color:var(--accent)}
  #btn-add{flex:0 0 62px}
  /* content never starts flush against the masthead rule */
  .view > :first-child{margin-top:2px}
  .month-head{margin-top:4px}

  /* masthead actions (switch + settings live up top on mobile) */
  .switch span{display:none}
  .switch .track{width:46px}
  [data-theme="ink"] .switch .thumb{left:16px}
  #btn-settings{padding:8px 10px}

  /* library */
  .lib-grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:28px 10px}
  .media-card .meta .t{font-size:12px}
  .media-card .tape{width:36px; height:10px; top:-5px}
  .lib-tools{gap:6px}
  .lib-tools .search{order:-1; flex-basis:100%; min-width:100%}

  /* queue + spend */
  .spend-grid{grid-template-columns:1fr}
  .sp-row .nt{display:none}

  /* calendar */
  .month-title .m{font-size:clamp(17px, 5.4vw, 24px); letter-spacing:.5px}
  .month-title .y{font-size:20px}
  .nav-keys{gap:6px}
  .nav-keys .key{padding:8px 10px; font-size:10px; letter-spacing:1px}
  .nav-keys .key.icon-only{padding:8px 9px}
  .cal{min-width:560px}
  .cal-day{padding:3px 4px}
  .cal-day .n{font-size:10px}
  .cal-bar{height:15px; font-size:8px; padding:0 4px}
  .cal-bar svg{width:9px;height:9px;margin-right:3px}

  /* health */
  .health-top{grid-template-columns:1fr}
  .health-cols{grid-template-columns:1fr; gap:18px}
  .vitals{grid-template-columns:1fr}
  .pill-grid{grid-template-columns:minmax(84px,1.2fr) repeat(7,1fr); gap:4px}
  .pill-name .pd{display:none}
  .stepchart{height:140px; gap:1.5px}
  .pedometer .lcd .val{font-size:32px}
  .stat .v{font-size:15px}

  /* modals become full sheets — flex-start (NOT stretch: stretch pins the
     panel to exactly screen height, so longer content spills past the paper) */
  .modal-overlay{padding:0; align-items:flex-start}
  .modal{width:100%; min-height:100dvh; height:auto; border-radius:0; padding:18px 14px calc(28px + env(safe-area-inset-bottom)); animation:none}
  .modal-close{top:14px; right:14px; width:34px; height:34px}
  .grid2{grid-template-columns:1fr}
  .type-tiles{grid-template-columns:1fr 1fr}
  .detail-head{gap:14px}
  .detail-head .cover{width:96px}
  .detail-info h2{font-size:20px}
  .input, select.input{font-size:16px}
  .result-list{max-height:none}

  /* toast rides above the deck */
  #toast{bottom:calc(96px + env(safe-area-inset-bottom))}
}
/* very narrow phones: month title + buttons still on one line */
@media (max-width:370px){
  .month-title .m{font-size:clamp(14px, 4.9vw, 19px); letter-spacing:0}
  .month-title .y{font-size:17px}
  .nav-keys{gap:5px}
  .nav-keys .key{padding:7px 8px; font-size:9px; letter-spacing:.5px}
  .nav-keys .key.icon-only{padding:7px 7px}
}
@media (max-width:390px){
  .brand h1{font-size:34px}
  .brand-meta .sub{display:none}
  .lib-grid{grid-template-columns:repeat(3,1fr)}
}

/* ================= ink (dark) theme — component overrides =================
   paper relies on bevels and ink-coloured key edges; on dark those turn into
   bright outlines, so here: flat lighter surfaces, hairline edges, dark key lips */
[data-theme="ink"] .panel, [data-theme="ink"] .lib-filter, [data-theme="ink"] .deck,
[data-theme="ink"] .qpanel{background:var(--surface); border-color:var(--edge); box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 6px 18px rgba(0,0,0,.35)}
[data-theme="ink"] .panel.screws::before{opacity:.5}

[data-theme="ink"] .modal.sheet{border-top:1px solid var(--edge)}
[data-theme="ink"] .masthead{border-bottom-color:var(--edge)}
[data-theme="ink"] .key, [data-theme="ink"] .btn, [data-theme="ink"] .q-pill, [data-theme="ink"] .modal-close, [data-theme="ink"] .q-main{
  background:linear-gradient(180deg, #2C2926, #232120); border-color:var(--edge); color:var(--ink);
  box-shadow:0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,.06);
}
[data-theme="ink"] .key.on{background:#191716; box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
[data-theme="ink"] .btn.ghost{background:transparent; border-color:var(--edge); box-shadow:none; color:var(--ink-2)}
[data-theme="ink"] .btn.primary, [data-theme="ink"] .key.accent, [data-theme="ink"] .q-pill.go, [data-theme="ink"] .q-main.go{
  background:linear-gradient(180deg, var(--btn-acc), var(--btn-acc-2)); border-color:var(--btn-acc-2); color:#FFF6EE;
  box-shadow:0 2px 0 #5E220C, inset 0 1px 0 rgba(255,255,255,.18);
}
[data-theme="ink"] .q-pill.ok, [data-theme="ink"] .q-main.ok{background:#4E6B3E; border-color:#4E6B3E; color:#F1F7EC}
[data-theme="ink"] .btn.danger{color:var(--bad); border-color:var(--bad); box-shadow:0 2px 0 #000}
[data-theme="ink"] .btn.danger-solid{background:#B9472E; border-color:#B9472E; color:#FFF2EE}
[data-theme="ink"] .chip{border-color:var(--edge); color:var(--ink-2)}
[data-theme="ink"] .chip.on{background:var(--ink); color:#151311; border-color:var(--ink)}
[data-theme="ink"] .section-label .tag{background:#2E2B28; color:var(--ink)}
[data-theme="ink"] .input, [data-theme="ink"] .lf-search, [data-theme="ink"] .lf-sel, [data-theme="ink"] .lf-seg, [data-theme="ink"] .inset, [data-theme="ink"] .dt-facts{
  background:#121110; border-color:var(--edge); box-shadow:inset 0 1px 3px rgba(0,0,0,.5)
}
[data-theme="ink"] .lf-seg button.on{background:#2A2724; box-shadow:0 1px 2px rgba(0,0,0,.5); color:var(--ink)}
[data-theme="ink"] .media-card .cover, [data-theme="ink"] .q-cover, [data-theme="ink"] .dt-cover, [data-theme="ink"] .ag-cover{border-color:#000; box-shadow:0 4px 10px rgba(0,0,0,.45)}
[data-theme="ink"] .media-card .cover img, [data-theme="ink"] .q-cover img, [data-theme="ink"] .dt-cover img{filter:none}
[data-theme="ink"] .media-card .sig-badge{background:#232120; border-color:var(--edge); box-shadow:0 1px 3px rgba(0,0,0,.5)}
[data-theme="ink"] .media-card .sig-badge.active{background:var(--btn-acc); border-color:var(--btn-acc-2); color:#FFF6EE}

[data-theme="ink"] .media-card .tape{background:#4A433A; opacity:.6}
[data-theme="ink"] .q-node{background:var(--surface); border-color:var(--ink-2); color:var(--ink)}
[data-theme="ink"] .q-node.next{background:var(--btn-acc); border-color:var(--btn-acc-2); color:#FFF6EE}

  }));
}
async function idbGetJournal(){
  const d = await journalStore(); if (!d) return null;
  return new Promise(res => { try { const q = d.transaction('kv').objectStore('kv').get('journal'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch(_){ res(null); } });
}
async function idbPutJournal(json){

  return new Promise(res => { try { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(json, 'journal'); tx.oncomplete = () => res(true); tx.onerror = () => res(false); tx.onabort = () => res(false); } catch(_){ res(false); } });

function toast(msg, opts = {}){

  // the mark becomes a drawn icon + colour, and never shows up as a text symbol
  msg = String(msg);
  const kind = /^\s*⚠/.test(msg) ? 'warn' : /[✓✕▶]|finished|saved|logged|deleted|created|started/.test(msg) ? 'ok' : /⌁/.test(msg) ? 'ai' : 'info';
  const text = msg.replace(/[✓✕⚠⌁▸↧▶✎★]/g, '').replace(/\s{2,}/g, ' ').replace(/\s+([—·])\s*$/, '').trim();
  haptic(kind === 'warn' ? 'reject' : kind === 'ok' ? 'confirm' : 'tap');
  const el = $('#toast');
  el.className = 'mono t-' + kind;
  el.innerHTML = `<span class="t-ico">${{ warn: ICONS.warn, ok: ICONS.check, ai: ICONS.spark, info: ICONS.info }[kind]}</span><span>${esc(text)}</span>`;

    const b = document.createElement('button'); b.className = 't-undo'; b.textContent = opts.action.label;
    b.addEventListener('click', ev => { ev.stopPropagation(); clearTimeout(toastT); el.classList.remove('show'); opts.action.fn(); });

    const b = document.createElement('button'); b.className = 't-undo'; b.textContent = tl('undo');

}

/* ============ layouts — rearrange / hide sections on any tab ============
   a view marks a container with data-layout="key" (+ data-layout-label) and its
   movable children with data-sec="id" (+ data-sec-label). settings.layout[key]
   keeps {order, hidden}; an observer re-applies it whenever a view re-renders. */
function layoutConf(k){
  db.settings.layout = db.settings.layout || {};
  return db.settings.layout[k] = db.settings.layout[k] || { order: [], hidden: [] };
}
const secHidden = (layoutKey, id) => (db.settings.layout?.[layoutKey]?.hidden || []).includes(id);
function applyLayouts(root){
  $$('[data-layout]', root).forEach(c => {
    const conf = layoutConf(c.dataset.layout);
    const kids = [...c.children].filter(x => x.dataset.sec);
    const rank = el => { const i = conf.order.indexOf(el.dataset.sec); return i < 0 ? 1000 + kids.indexOf(el) : i; };
    const sorted = kids.slice().sort((a, b) => rank(a) - rank(b));
    if (sorted.some((el, i) => el !== kids[i])){
      // swap through placeholders so non-movable children (buttons, connectors) keep their spots
      const holes = kids.map(el => { const h = document.createComment(''); c.insertBefore(h, el); return h; });
      sorted.forEach((el, i) => holes[i].replaceWith(el));
    }
    kids.forEach(el => el.classList.toggle('sec-hidden', conf.hidden.includes(el.dataset.sec)));
  });
}
const layoutObserver = new MutationObserver(recs => {
  const roots = new Set(recs.map(r => r.target.closest?.('.view')).filter(Boolean));
  roots.forEach(applyLayouts);
});
$$('.view').forEach(v => layoutObserver.observe(v, { childList: true, subtree: true }));

function openLayoutEditor(){
  const view = $(`#view-${ui.view}`);
  const groups = $$('[data-layout]', view);
  if (!groups.length){ toast(tl('nothing to arrange on this tab')); return; }
  const body = groups.map(c => {
    const key = c.dataset.layout, conf = layoutConf(key);
    const kids = [...c.children].filter(x => x.dataset.sec);
    return `
    <div class="ly-group">
      <div class="ly-title">${esc(c.dataset.layoutLabel || key)}</div>
      ${kids.map((el, i) => {
        const id = el.dataset.sec, hid = conf.hidden.includes(id);
        return `<div class="ly-row ${hid ? 'off' : ''}">
          <span class="ly-name">${esc(el.dataset.secLabel || id)}</span>
          <button class="ly-btn" data-ly="${key}" data-id="${id}" data-mv="-1" ${i === 0 ? 'disabled' : ''} aria-label="${tl('move up')}">${ICONS.up}</button>
          <button class="ly-btn" data-ly="${key}" data-id="${id}" data-mv="1" ${i === kids.length - 1 ? 'disabled' : ''} aria-label="${tl('move down')}">${ICONS.down}</button>
          <button class="ly-btn ly-eye" data-ly="${key}" data-id="${id}" data-hide aria-label="${hid ? 'show' : 'hide'}">${hid ? ICONS.eyeOff : ICONS.eye}</button>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
  openModal(`<div class="sheet-title">${tl('Arrange {tab}', { tab: esc(TABS[ui.view]?.label || '') })}</div>
    <div class="ly-hint">${tl('move sections up or down · the eye hides what you don\'t use')}</div>
    ${body}
    <div class="ly-foot"><button class="sheet-btn" id="ly-reset">${ICONS.undo}<span>${tl('reset to default')}</span></button>
      <button class="sheet-btn sheet-cancel" id="ly-close">${tl('done')}</button></div>`);
  $('#modal').classList.add('sheet'); $('#modal-overlay').classList.add('sheet-open');
  const currentOrder = key => [...$(`[data-layout="${key}"]`, view).children].filter(x => x.dataset.sec).map(x => x.dataset.sec);
  $$('#modal-body [data-mv]').forEach(b => b.addEventListener('click', () => {
    const key = b.dataset.ly, conf = layoutConf(key), order = currentOrder(key);
    const i = order.indexOf(b.dataset.id), j = i + +b.dataset.mv;
    if (j < 0 || j >= order.length) return;
    [order[i], order[j]] = [order[j], order[i]];
    conf.order = order; save(); render(); openLayoutEditor();
  }));
  $$('#modal-body [data-hide]').forEach(b => b.addEventListener('click', () => {
    const key = b.dataset.ly, conf = layoutConf(key), id = b.dataset.id;
    if (conf.hidden.includes(id)) conf.hidden = conf.hidden.filter(x => x !== id);
    else {
      if (currentOrder(key).length - conf.hidden.length <= 1){ toast(tl('⚠ keep at least one section visible')); return; }
      conf.hidden.push(id);
    }
    save(); render(); openLayoutEditor();
  }));
  $('#ly-reset').addEventListener('click', () => { groups.forEach(c => delete db.settings.layout[c.dataset.layout]); save(); render(); openLayoutEditor(); });
  $('#ly-close').addEventListener('click', closeModal);
}

async function fetchJSON(url, ms=9000){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(t); }
}
const yearOf = s => (s && String(s).match(/\d{4}/)) ? String(s).match(/\d{4}/)[0] : '';
/* ============ title info — several sources at once, merged and ranked ============
   every search asks all the sources for that kind of media in parallel, folds the same
   title from different places into one result (more covers to pick from, more fields),
   and ranks by how well the title matches. after saving, enrich() fills synopsis, genres,
   platforms, runtime from wikipedia + wikidata — only fields that are still empty. */
const SRC = { dz: 'Deezer', mb: 'MusicBrainz', gbooks: 'Google Books', tmdb: 'TMDB', itunes: 'iTunes', tvmaze: 'TVmaze', ol: 'Open Library', wp: 'Wikipedia', wd: 'Wikidata', cs: 'CheapShark', rawg: 'RAWG', steam: 'Steam', ai: 'Gemini' };
const stripHTML = s => String(s || '').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/\s+/g, ' ').trim();

/* the apk can fetch what a web page may not read (steam search, fund prices) */
const nativeWait = new Map(); let nativeSeq = 0;
window.onNativeHttp = (id, text) => { const f = nativeWait.get(id); if (f){ nativeWait.delete(id); f(text); } };
function nativeGet(url, ms = 10000){
  if (typeof MoodNative === 'undefined' || !MoodNative.httpGet) return Promise.resolve(null);
  return new Promise(res => {
    const id = 'h' + (++nativeSeq); nativeWait.set(id, res);
    setTimeout(() => { if (nativeWait.has(id)){ nativeWait.delete(id); res(null); } }, ms);
    try { MoodNative.httpGet(id, url); } catch(_){ nativeWait.delete(id); res(null); }
  });
}

// load an image off-screen → its size, or null if it fails / takes too long
function probeImg(url, ms = 5000){
  return new Promise(res => {
    const img = new Image(); let done = false;
    const fin = v => { if (!done){ done = true; res(v); } };
    img.onload = () => fin({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => fin(null);
    setTimeout(() => fin(null), ms);
    img.src = url;
  });
}
// the largest candidate that loads as a portrait cover; a big landscape image only as a last resort — never a tiny strip
async function pickCover(urls){
  const list = [...new Set((urls || []).filter(Boolean))];
  const sizes = await Promise.all(list.map(u => probeImg(u, /coverartarchive/.test(u) ? 9000 : 5000)));
  const ok = list.map((u, i) => ({ u, s: sizes[i] })).filter(x => x.s);
  const portrait = ok.filter(x => x.s.h >= x.s.w * 1.15 && x.s.w >= 150).sort((a, b) => b.s.w * b.s.h - a.s.w * a.s.h);
  if (portrait.length) return portrait[0].u;
  const wide = ok.filter(x => x.s.w >= 400).sort((a, b) => b.s.w - a.s.w);
  return wide.length ? wide[0].u : '';
}

/* ---- sources: each returns [{title, year, sub, covers[], src, ids{}, …fields}] ---- */
const WP_KIND = {
  movie: { hint: 'film', ok: /\bfilm\b/i, no: /actor|actress|director|character|soundtrack|series|franchise|novel|company|festival/i },
  tv:    { hint: 'TV series', ok: /series|sitcom|anime|miniseries|television show|tv show|drama/i, no: /actor|actress|character|episode|\bfilm\b|novel|company|franchise|channel|network/i },
  book:  { hint: 'novel', ok: /novel|book|memoir|novella|non-?fiction|manga|comic|essay|poem|collection/i, no: /\bfilm\b|series of films|character|author|writer|award|company|tv |television/i },
  album: { hint: 'album', ok: /\balbum\b|\bEP\b|mixtape/i, no: /\bsong\b|\bsingle\b|discography|\btour\b|\bband\b|singer|rapper|musician|\bfilm\b|video game/i },
  game:  { hint: 'video game', ok: /\bgame\b/i, no: /award|ceremony|character|company|developer|publisher|series|franchise|designer|artist|composer|writer|director|producer|programmer|player|streamer|engine|console|convention/i },
};
async function srcWiki(type, q){
  const K = WP_KIND[type];
  const d = await fetchJSON(`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q + ' ' + K.hint)}&gsrlimit=8&prop=pageimages%7Cpageterms&piprop=thumbnail&pithumbsize=600&pilicense=any&format=json&origin=*`);
  return Object.values(d?.query?.pages || {}).sort((a, b) => (a.index || 0) - (b.index || 0)).flatMap(p => {
    const desc = p.terms?.description?.[0] || '';
    if (!K.ok.test(desc) || K.no.test(desc)) return [];
    const title = (p.title || '').replace(/\s*\([^)]*\)\s*$/, '').trim();
    const by = type === 'album' ? (desc.match(/\bby (.+)$/i) || [])[1] || '' : '';
    return title ? [{ title, year: yearOf(desc), sub: desc, covers: p.thumbnail?.source ? [p.thumbnail.source] : [], src: 'wp', ids: { wp: p.title }, ...(by ? { creator: by, mk: artistKey(by) } : {}) }] : [];
  });
}

// deezer allows no cross-site reads, so the apk asks natively and a browser uses deezer's jsonp
function jsonp(url, ms = 8000){
  return new Promise((res, rej) => {
    const cb = '_jp' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const sc = document.createElement('script');
    let t = 0;
    const done = v => { clearTimeout(t); delete window[cb]; sc.remove(); v instanceof Error ? rej(v) : res(v); };
    t = setTimeout(() => done(new Error('timeout')), ms);
    window[cb] = d => done(d || {});
    sc.onerror = () => done(new Error('offline'));
    sc.src = url + (url.includes('?') ? '&' : '?') + 'output=jsonp&callback=' + cb;
    document.head.appendChild(sc);
  });
}

    platforms: Object.entries(x.platforms || {}).filter(([, v]) => v).map(([k]) => PL[k] || k), src: 'steam', ids: { steam: x.id },
  }));
}
const SOURCES = {
  movie: [q => srcTmdb('movie', q), srcItunes, q => srcWiki('movie', q)],
  tv:    [srcTvmaze, q => srcTmdb('tv', q), q => srcWiki('tv', q)],
  book:  [srcOpenLib, q => srcWiki('book', q), q => srcGBooks(q)],
  game:  [srcRawg, q => srcWiki('game', q), srcCheapShark, srcSteam],
  album: [srcItunesAlbum, srcDeezer, srcMusicBrainz, q => srcWiki('album', q)],
};
// albumoftheyear.org has no api (and blocks apps), so it's a link: their search for this album
const aotyUrl = e => `https://www.albumoftheyear.org/search/?q=${encodeURIComponent([e.creator, e.title].filter(Boolean).join(' '))}`;

/* ---- merging + ranking ---- */
const mergeKey = t => normTitle(String(t).replace(/\b(digital |ultimate |gold |game of the year |goty |complete |definitive |standard |deluxe )*edition\b/ig, '').replace(/\s*[:(]\s*a novel\)?\s*$/i, ''));
function titleScore(t, q){
  const a = normTitle(t), b = normTitle(q);
  if (!a || !b) return 0;
  if (a === b) return 10;
  if (a.startsWith(b) || b.startsWith(a)) return 6;
  if (a.includes(b) || b.includes(a)) return 4;
  const A = new Set(a.split(' ')), B = b.split(' ');
  return B.filter(w => A.has(w)).length / Math.max(A.size, B.length) * 4;
}
function mergeResults(lists, q, yearHint){
  const out = [];
  lists.flat().forEach(r => {
    if (!r?.title) return;
    const k = mergeKey(r.title);
    const hit = out.find(x => x._k === k && (!x.year || !r.year || Math.abs(+x.year - +r.year) <= 1) && (!x.mk || !r.mk || x.mk === r.mk));
    if (!hit){ out.push({ ...r, _k: k, covers: [...(r.covers || [])], sources: [r.src], ids: { ...(r.ids || {}) } }); return; }
    hit.covers.push(...(r.covers || []));
    if (!hit.sources.includes(r.src)) hit.sources.push(r.src);
    ['year', 'creator', 'mk', 'synopsis', 'runtimeMin', 'epMin', 'pagesTotal', 'playHours', 'tvmazeId', 'tracks'].forEach(f => { if (!hit[f] && r[f]) hit[f] = r[f]; });
    ['genres', 'platforms'].forEach(f => { if (!(hit[f] || []).length && (r[f] || []).length) hit[f] = r[f]; });
    if ((!hit.sub || hit.sub === 'pc' || hit.sub === 'Steam') && r.sub) hit.sub = r.sub;
    Object.entries(r.ids || {}).forEach(([key, v]) => { if (!hit.ids[key]) hit.ids[key] = v; });
  });
  const qy = yearHint ? String(yearHint) : '', qt = q;
  const tScore = r => r.mk && r.creator ? Math.max(titleScore(r.title, qt), titleScore(r.creator + ' ' + r.title, qt), titleScore(r.title + ' ' + r.creator, qt)) : titleScore(r.title, qt);
  const score = r => tScore(r) + (qy && r.year === qy ? 3 : 0) + Math.min(3, r.sources.length - 1) * 1.5 + (r.covers.length ? 1 : 0);
  out.forEach(r => r._s = score(r));
  return out.sort((a, b) => b._s - a._s);
}
async function searchMedia(type, q, yearHint){
  q = q.trim(); if (!q) return [];
  const got = await Promise.allSettled((SOURCES[type] || []).map(f => f(q)));
  if (got.every(g => g.status === 'rejected')) throw got[0]?.reason || new Error('offline');
  const merged = mergeResults(got.filter(g => g.status === 'fulfilled').map(g => g.value), q, yearHint).slice(0, 12);
  await Promise.all(merged.map(async r => { r.cover = await pickCover(r.covers); }));
  return merged.sort((a, b) => (b._s - (b.cover ? 0 : 2)) - (a._s - (a.cover ? 0 : 2)));      // no cover that loads → lower
}
const srcBadges = list => (list || []).length ? `<span class="src-badges">${list.map(s => `<i>${SRC[s] || esc(s)}</i>`).join('')}</span>` : '';

/* ---- details after saving: wikipedia summary + wikidata facts, gemini last ---- */
async function wikidataInfo(qid, type){
  const d = await fetchJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${qid}&props=claims%7Csitelinks&sitefilter=trwiki&format=json&origin=*`);
  const ent = d?.entities?.[qid]; if (!ent) return null;
  const c = ent.claims || {};
  const ids = p => (c[p] || []).map(x => x.mainsnak?.datavalue?.value?.id).filter(Boolean);
  const amount = p => { const v = c[p]?.[0]?.mainsnak?.datavalue?.value; return v ? { n: Math.round(Math.abs(parseFloat(v.amount))), unit: String(v.unit || '') } : null; };
  const genreIds = ids('P136').slice(0, 4), platIds = ids('P400').slice(0, 6);
  const creatorIds = ids({ game: 'P178', movie: 'P57', book: 'P50', tv: 'P170', album: 'P175' }[type] || 'P170').slice(0, 1);
  const all = [...genreIds, ...platIds, ...creatorIds];
  let label = {};
  if (all.length){
    const L = await fetchJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${all.join('|')}&props=labels&languages=${LANG === 'tr' ? 'tr|en' : 'en'}&format=json&origin=*`);
    Object.entries(L?.entities || {}).forEach(([k, v]) => { label[k] = (LANG === 'tr' && v.labels?.tr?.value) || v.labels?.en?.value || ''; });
  }
  const dur = amount('P2047'), pages = amount('P1104');
  const date = c.P577?.[0]?.mainsnak?.datavalue?.value?.time || '';
  return {
    // "science fiction film" → "science fiction"; wikidata also files characters under genre — those go
    genres: [...new Set(genreIds.map(k => label[k]).filter(g => g && !/character|karakter|lgbt/i.test(g))
      .map(g => g.replace(/\s+(filmi|film|video oyunu|video game|television series|tv series|dizisi|romanı|novel)$/i, '').trim()))].slice(0, 3),
    platforms: platIds.map(k => label[k]).filter(Boolean),
    creator: creatorIds.map(k => label[k]).filter(Boolean)[0] || '', year: yearOf(date),
    duration: dur && /Q7727$/.test(dur.unit) ? dur.n : dur && /Q11574$/.test(dur.unit) ? Math.round(dur.n / 60) : 0,
    pages: pages?.n || 0, trwiki: ent.sitelinks?.trwiki?.title || '',
  };
}
async function findWikiPage(e){
  const found = await srcWiki(e.type, e.title + (e.year ? ' ' + e.year : '')).catch(() => []);
  const want = mergeKey(e.title);
  return (found.find(r => mergeKey(r.title) === want && (!e.year || !r.year || Math.abs(+r.year - +e.year) <= 1))
    || found.find(r => titleScore(r.title, e.title) >= 6))?.ids.wp || '';
}
const emptyVal = v => v == null || v === '' || v === 0 || (Array.isArray(v) && !v.length);
async function enrich(e, { gemini = true } = {}){
  let changed = false;
  const fill = (k, v, src) => {
    if (emptyVal(v) || !emptyVal(e[k])) return;
    e[k] = typeof v === 'string' ? v.trim() : v; changed = true;
    if (e.ai) delete e.ai[k];
    if (src && !(e.src || []).includes(src)) e.src = [...(e.src || []), src];
  };
  if (e.type === 'tv' && e.tvmazeId){
    try { const s = await fetchJSON(`https://api.tvmaze.com/shows/${e.tvmazeId}`);
      fill('genres', s.genres, 'tvmaze'); fill('synopsis', stripHTML(s.summary), 'tvmaze'); fill('epMin', s.averageRuntime); fill('year', yearOf(s.premiered));
    } catch(_){}
  }
  if (e.type === 'album' && e.ids?.deezer && (!e.runtimeMin || !e.year || emptyVal(e.genres))){
    try { const a = await deezer(`/album/${e.ids.deezer}`);
      fill('year', yearOf(a.release_date), 'dz'); fill('tracks', a.nb_tracks, 'dz'); fill('runtimeMin', a.duration ? Math.round(a.duration / 60) : 0, 'dz');
      fill('genres', (a.genres?.data || []).map(g => g.name).slice(0, 3), 'dz');
    } catch(_){}
  }
  if (e.type === 'album' && e.ids?.itunes && (!e.runtimeMin || !e.tracks)){
    try { const d = await fetchJSON(`https://itunes.apple.com/lookup?id=${e.ids.itunes}&entity=song&limit=200`);
      const songs = (d.results || []).filter(x => x.wrapperType === 'track');
      if (songs.length){ fill('tracks', songs.length, 'itunes'); fill('runtimeMin', Math.round(songs.reduce((t, x) => t + (x.trackTimeMillis || 0), 0) / 60000), 'itunes'); }
    } catch(_){}
  }
  try {
    const page = e.ids?.wp || await findWikiPage(e);
    if (page){
      e.ids = { ...(e.ids || {}), wp: page };
      const sum = await fetchJSON(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(page.replace(/ /g, '_'))}`).catch(() => null);
      const wd = sum?.wikibase_item ? await wikidataInfo(sum.wikibase_item, e.type).catch(() => null) : null;
      // the synopsis in the app's language when that wikipedia has the article
      let syn = sum?.extract || '';
      if (LANG === 'tr' && wd?.trwiki){
        const t = await fetchJSON(`https://tr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wd.trwiki.replace(/ /g, '_'))}`).catch(() => null);
        if (t?.extract) syn = t.extract;
      }
      if (syn.length > 700) syn = syn.slice(0, 700).replace(/\s+\S*$/, '') + '…';
      fill('synopsis', syn, 'wp');
      if (wd){
        fill('genres', wd.genres, 'wd'); fill('platforms', e.type === 'game' ? wd.platforms : [], 'wd'); fill('creator', wd.creator, 'wd'); fill('year', wd.year, 'wd');
        if (e.type === 'movie' || e.type === 'album') fill('runtimeMin', wd.duration, 'wd');
        if (e.type === 'book') fill('pagesTotal', wd.pages, 'wd');
      }
      if (!e.cover && sum?.thumbnail?.source){ const c = await pickCover([sum.originalimage?.source, sum.thumbnail.source]); fill('cover', c, 'wp'); }
    }
  } catch(_){}
  // gemini only for what is still empty — and says so
  if (gemini && aiOn() && (emptyVal(e.synopsis) || emptyVal(e.genres))){
    const role = { book: 'author', game: 'developer', movie: 'director', tv: 'creator', album: 'artist' }[e.type];
    const lang = LANG === 'tr' ? 'Turkish' : 'English';
    const j = await geminiJSON([{ text: `Facts about the ${TYPES[e.type].label.toLowerCase()} "${e.title}"${e.year ? ` (${e.year})` : ''}${e.creator ? ` by ${e.creator}` : ''}.
Reply with ONLY this JSON: {"synopsis":"two sentences, no spoilers, in ${lang}","genres":["up to 3 genres in ${lang}"],"year":"YYYY","${role}":"name"}.
If you don't recognise this exact title, use empty values — never guess.` }]).catch(() => null);
    if (j){
      const before = { synopsis: e.synopsis, genres: e.genres, year: e.year, creator: e.creator };
      fill('synopsis', j.synopsis); fill('genres', Array.isArray(j.genres) ? j.genres.slice(0, 3) : []); fill('year', yearOf(j.year)); fill('creator', j[role]);
      Object.keys(before).forEach(k => { if (emptyVal(before[k]) && !emptyVal(e[k])) (e.ai = e.ai || {})[k] = 1; });
    }
  }
  e.metaAt = todayStr();
  save();
  if (e.cover) cacheCover(e.cover);
  return changed;
}

/* ---- every cover the sources have for this title (other editions, pressings, posters) → pick one ---- */
// beyond the search results, each kind has a place with many covers for one title:
// albums → every pressing in the cover art archive · books → every edition on open library ·
// shows → tvmaze posters · films/shows → tmdb posters (with a key) · games → steam's art
async function moreCovers(e, same){
  const id = k => e.ids?.[k] || (same.find(r => r.ids?.[k] && e.year && r.year === String(e.year)) || same.find(r => r.ids?.[k]))?.ids[k];   // the right "dune": same year first
  const out = [];
  const tries = [];
  if (e.type === 'album') tries.push((async () => {
    const wait = () => new Promise(r => setTimeout(r, 1100));      // musicbrainz allows one request a second
    // the exact album by this artist — a loose search can put a tribute album first
    const lucene = v => '"' + String(v).replace(/["\\]/g, ' ') + '"';
    await wait();
    const g = await fetchJSON(`https://musicbrainz.org/ws/2/release-group/?query=${encodeURIComponent('releasegroup:' + lucene(e.title) + (e.creator ? ' AND artist:' + lucene(e.creator) : ''))}&limit=3&fmt=json`).catch(() => null);
    const rg = (g?.['release-groups'] || []).find(r => r.score >= 90)?.id || id('mb');
    if (!rg) return;
    await wait();
    const d = await fetchJSON(`https://musicbrainz.org/ws/2/release?release-group=${rg}&fmt=json&limit=25`);
    (d.releases || []).filter(r => r['cover-art-archive']?.front).slice(0, 10)
      .forEach(r => out.push({ u: `https://coverartarchive.org/release/${r.id}/front-500`, l: [r.country, yearOf(r.date), r.disambiguation].filter(Boolean).join(' · ') || r.title }));
  })());
  if (e.type === 'book' && /^\/works\//.test(id('ol') || '')) tries.push((async () => {
    const d = await fetchJSON(`https://openlibrary.org${id('ol')}/editions.json?limit=60`);
    const seen = new Set();
    (d.entries || []).forEach(x => (x.covers || []).slice(0, 1).forEach(c => { if (c > 0 && !seen.has(c) && seen.size < 16){ seen.add(c);
      out.push({ u: `https://covers.openlibrary.org/b/id/${c}-L.jpg?default=false`, l: [x.publishers?.[0], yearOf(x.publish_date), (x.languages?.[0]?.key || '').split('/').pop()].filter(Boolean).join(' · ') }); } }));
  })());
  const tvm = e.type === 'tv' && (e.tvmazeId || id('tvmaze'));
  if (tvm) tries.push((async () => {
    const d = await fetchJSON(`https://api.tvmaze.com/shows/${tvm}/images`);
    (d || []).filter(x => x.type === 'poster').slice(0, 16).forEach(x => out.push({ u: x.resolutions?.original?.url || x.resolutions?.medium?.url, l: 'TVmaze' }));
  })());
  if ((e.type === 'movie' || e.type === 'tv') && db.settings.tmdbKey && id('tmdb')) tries.push((async () => {
    const d = await fetchJSON(`https://api.themoviedb.org/3/${e.type}/${id('tmdb')}/images?api_key=${encodeURIComponent(db.settings.tmdbKey)}&include_image_language=${LANG === 'tr' ? 'tr,' : ''}en,null`);
    (d.posters || []).slice(0, 20).forEach(x => out.push({ u: `https://image.tmdb.org/t/p/w500${x.file_path}`, l: ['TMDB', x.iso_639_1].filter(Boolean).join(' · ') }));
  })());
  if (e.type === 'game' && id('steam')) {
    const a = id('steam'), c = 'https://cdn.cloudflare.steamstatic.com/steam/apps/' + a;
    [['library_600x900_2x.jpg', 'Steam'], ['library_600x900.jpg', 'Steam'], ['header.jpg', 'Steam · wide'], ['capsule_616x353.jpg', 'Steam · wide']].forEach(([f, l]) => out.push({ u: `${c}/${f}`, l }));
  }
  await Promise.allSettled(tries);
  return out.filter(x => x.u);
}

/* ---- repair library: covers + details for everything that lacks them ---- */
const normTitle = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ı/g, 'i').replace(/^the\s+/, '').replace(/[^a-z0-9]+/g, ' ').trim();
function bestMatch(e, results){
  const score = r => titleScore(r.title, e.title) + (e.year && r.year === String(e.year) ? 3 : 0) + (r.cover ? 1 : 0);
  const ranked = results.slice().sort((a, b) => score(b) - score(a));
  return ranked.length && titleScore(ranked[0].title, e.title) >= 6 ? ranked[0] : null;   // must clearly be the same title
}
let repairBusy = false;
async function repairLibrary(){
  if (repairBusy){ toast(tl('already repairing — hang on')); return; }
  const todo = db.media.filter(e => !e.cover || !e.metaAt);
  if (!todo.length){ toast(tl('every entry has its cover and details ✓')); return; }
  repairBusy = true;
  let covers = 0, details = 0, i = 0;
  for (const e of todo){
    toast(tl('repairing library… {i}/{n}', { i: ++i, n: todo.length }));
    try {
      const hadCover = !!e.cover, hadSyn = !!e.synopsis;
      if (!e.cover || !e.ids?.wp){
        const m = bestMatch(e, await searchMedia(e.type, e.title, e.year));
        if (m){
          if (!e.cover && m.cover) e.cover = m.cover;
          e.ids = { ...m.ids, ...(e.ids || {}) };
          e.src = [...new Set([...(e.src || []), ...m.sources])];
          ['year', 'creator', 'synopsis', 'runtimeMin', 'epMin', 'pagesTotal', 'playHours', 'tvmazeId'].forEach(k => { if (emptyVal(e[k]) && m[k]) e[k] = m[k]; });
          ['genres', 'platforms'].forEach(k => { if (emptyVal(e[k]) && (m[k] || []).length) e[k] = m[k]; });
        }
      }
      await enrich(e);
      if (!hadCover && e.cover) covers++;
      if (!hadSyn && e.synopsis) details++;
      render();
    } catch(_){ /* that source is down — next */ }
  }
  repairBusy = false;
  toast(tl('library repaired — {c} covers, {d} descriptions added', { c: covers, d: details }) + ' ✓');
}

/* ---- covers kept inside the app (indexeddb): shown when the original link fails or you're offline ---- */
let coverDB = null;
const coverURLs = new Map();
function coverStore(){
  return coverDB || (coverDB = new Promise(res => {
    try { const r = indexedDB.open('mood-covers', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('c');
      r.onsuccess = () => res(r.result); r.onerror = () => res(null);
    } catch(_){ res(null); }
  }));
}
async function loadCoverCache(){
  const d = await coverStore(); if (!d) return;
  await new Promise(res => {
    try { const rq = d.transaction('c').objectStore('c').openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c){ coverURLs.set(c.key, URL.createObjectURL(c.value)); c.continue(); } else res(); };
      rq.onerror = () => res();
    } catch(_){ res(); }
  });
}
async function fetchImageBlob(url){
  for (const opt of [{ mode: 'cors' }, { mode: 'cors', cache: 'reload' }]){
    try { const r = await fetch(url, opt); if (r.ok){ const b = await r.blob(); if (b.type.startsWith('image/')) return b; } } catch(_){}
  }
  return null;
}
async function cacheCover(url){
  if (!url || /^(data|blob|idb):/.test(url) || coverURLs.has(url)) return false;
  try {
    const b = await fetchImageBlob(url); if (!b) return false; if (!b.type.startsWith('image/') || b.size < 1500) return false;
    const d = await coverStore(); if (!d) return false;
    await new Promise((res, rej) => { const tx = d.transaction('c', 'readwrite'); tx.objectStore('c').put(b, url); tx.oncomplete = res; tx.onerror = rej; });
    coverURLs.set(url, URL.createObjectURL(b));
    return true;
  } catch(_){ return false; }   // that host doesn't allow saving — the link still works online
}
async function cacheAllCovers(){ for (const e of db.media) if (e.cover) await cacheCover(e.cover); }

/* duplicates — same type + same title (ignoring case, punctuation and a leading "the") */
function findDuplicate(type, title, exceptId){
  const k = normTitle(title);
  return k ? db.media.find(m => m.type === type && m.id !== exceptId && normTitle(m.title) === k) : null;
}
// → 'open' (go to the existing entry), 'add' (add a second copy anyway) or null (cancel)
function askDuplicate(existing){

async function fetchSeasons(tvmazeId){
  const eps = await fetchJSON(`https://api.tvmaze.com/shows/${tvmazeId}/episodes`);
  const bySeason = {};
  (eps||[]).forEach(e => {
    (bySeason[e.season] = bySeason[e.season] || []).push({ n:e.number, name:e.name || ('Episode ' + e.number), watched:false, air:e.airdate || '' });
  });
  return Object.keys(bySeason).sort((a,b)=>a-b).map(s => ({ n:+s, episodes:bySeason[s] }));
}

function resizeImage(file, cb){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const w = Math.min(500, img.width), h = Math.round(img.height * w / img.width);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', .82));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

    }
  });

/* ============ library ============ */
function progressOf(e){
  if (e.type === 'book' && e.pagesTotal > 0) return clamp(e.pagesRead / e.pagesTotal, 0, 1);
  if (e.type === 'tv' && e.seasons.length){
    const all = e.seasons.flatMap(s => s.episodes);
    if (!all.length) return null;
    return all.filter(x => x.watched).length / all.length;
  }
  // movies, games (and shows/books without episode/page data) — a manual percentage from the progress sheet
  if (typeof e.progressPct === 'number') return clamp(e.progressPct / 100, 0, 1);
  return null;
}
/* activity log — the "piggy bank": each progress update is a dated deposit, so the calendar
   only marks days something actually happened. e.log = [{d:'YYYY-MM-DD', kind, n}] */
const LOG_KINDS = {
  start:  { label: () => tl('started it') },
  finish: { label: () => tl('finished') },
  drop:   { label: () => tl('dropped') },
  pages:  { label: n => tl(n === 1 ? '+{n} page' : '+{n} pages', { n: fmtNum(n) }) },
  eps:    { label: n => tl(n === 1 ? '+{n} episode' : '+{n} episodes', { n }) },
  pct:    { label: n => `+${n}%` },
};
function logActivity(e, kind, n = 1){
  if (!n) return;
  e.log = Array.isArray(e.log) ? e.log : [];
  const d = todayStr();
  if (kind === 'start' || kind === 'finish' || kind === 'drop'){
    e.log = e.log.filter(x => !(x.kind === kind && x.d === d));
    e.log.push({ d, kind });
    return;
  }
  const cur = e.log.find(x => x.d === d && x.kind === kind);
  if (cur){ cur.n += n; if (cur.n <= 0) e.log = e.log.filter(x => x !== cur); }
  else if (n > 0) e.log.push({ d, kind, n });   // undoing an earlier day's deposit just lowers progress
}
// everything that happened to an entry, by day — logged deposits plus its start / end dates
function activityOf(e){
  const out = {};
  const add = (d, kind, n) => { if (d) (out[d] = out[d] || []).push({ kind, n }); };
  (e.log || []).forEach(x => add(x.d, x.kind, x.n));
  if (e.startDate && !(out[e.startDate] || []).some(x => x.kind === 'start')) add(e.startDate, 'start');
  if (e.endDate && !(out[e.endDate] || []).some(x => x.kind === 'finish' || x.kind === 'drop')) add(e.endDate, e.status === 'dropped' ? 'drop' : 'finish');
  return out;
}
const activityLabel = list => list.map(x => LOG_KINDS[x.kind] ? LOG_KINDS[x.kind].label(x.n) : x.kind).join(' · ');

function epCount(e){
  const all = e.seasons.flatMap(s => s.episodes);
  return [all.filter(x => x.watched).length, all.length];
}
